# Zhaozhou CI (plan W1 / P1 findings 5).
#
# Lanes:
#   build (push/PR)  : oss-cad-suite (pinned + SHA256 + cached) -> cmake
#                      windows-ci preset -> ctest -L fast
#                      (since review M1 the fast label also carries the
#                      formal_lane smoke and the SKIP-if-absent format /
#                      cppcheck shims; sby --version costs < 1 s, well inside
#                      the 60-min timeout)
#   format (push/PR) : charter-27 tiers — clang-format --dry-run --Werror
#                      (pinned npm clang-format = LLVM 15) + cppcheck
#                      --enable=warning over the tracked C/C++ set
#   npm (push/PR)    : npm ci -> ledger:check -> abi:check -> hardware-tooling
#                      tests (Nanquan language/compiler CI is external)
#   nightly (sched)  : ctest -L nightly (fuzz + formal lane)
#
# Hardware synthesis lanes are BLOCKED-on-hardware (ZH-002..006): no Quartus,
# no board; gate on lint/diff/units only until that changes.
#
# NOTE (W1): oss-cad-suite is downloaded as the release asset
# "oss-cad-suite-windows-x64-20260814.exe" which is actually a gzip tar
# (verified locally); extract with tar -xzf. The suite ships no g++, so the
# compiler comes from the runner image (MinGW on PATH or C:\msys64\mingw64).
# The suite's current clang-format is not the project-pinned major and its
# cppcheck.exe lacks the cfg/ payload. That gap is why the authoritative format
# tier lives in its own ubuntu job; the Windows CTest shims below install and
# receive exact paths to complete pinned tools as well.

name: ci

on:
  push:
    # G0 (2026-09-05): main ALONE was wrong. Every hardware campaign lands on an
    # integration branch -- the texture-island work, the fit harness fixes and
    # the D19 docket all sit on `zixxtrixx-v8-closeout`, which never triggered
    # this workflow. A green `main` badge said nothing about the branch the work
    # was actually on, which is the same failure as a gate that cannot fire:
    # it reassures without checking.
    branches:
      - main
      - zixxtrixx-v8-closeout   # the current hardware integration branch
      - 'hw/**'                 # future hardware lanes, by convention
  pull_request:
  schedule:
    - cron: '0 3 * * *'  # nightly (UTC): full nightly label
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned toolchain (charter 29: pins before products).
  # W6 fix (2026-08-15): the release tag is the dashed date form (2026-08-14)
  # and the windows asset ships as .tgz — the W1 pin used the no-dash tag with
  # a .exe suffix, which 404'd on the first GitHub run (asset 31839033681).
  # SHA256 verified against the release asset digest AND the local .tools
  # copy (byte-identical).
  ZHAO_SUITE_VERSION: '20260814'
  ZHAO_SUITE_SHA256: '4A3891A642681AB087FD9F6324519247B4C3761AFDC74DC1683067A2DAABD663'
  ZHAO_SUITE_URL: 'https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-08-14/oss-cad-suite-windows-x64-20260814.tgz'

jobs:
  build:
    name: cmake + ctest (fast)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # W6 fix: the CTest fast lane includes npm-workspace shims
      # (ledger_check, tables_check, abi_staleness — plan R11), which need
      # devDependencies on PATH. The first green-path run (31862504573)
      # failed here with 'tsc is not recognized'.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: npm ci (CTest npm shims)
        shell: pwsh
        run: npm ci

      # The suite currently exposes a clang-format newer than the project law
      # and a cppcheck.exe without its cfg/ directory. Do not let CMake
      # accidentally discover either incomplete tool: install known-complete,
      # pinned lint tools and pass their exact paths to the CTest wrappers.
      - name: Install pinned CTest lint tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lintRoot = Join-Path $env:RUNNER_TEMP 'zhao-lint'
          npm install --prefix $lintRoot --no-save --no-package-lock clang-format@1.8.0
          $clangFormat = Join-Path $lintRoot 'node_modules\clang-format\bin\win32\clang-format.exe'
          choco install cppcheck --version=2.19.0 --no-progress --yes
          $cppcheck = Join-Path $env:SystemDrive 'Program Files\Cppcheck\cppcheck.exe'
          if (-not (Test-Path $clangFormat)) { throw "missing pinned clang-format: $clangFormat" }
          if (-not (Test-Path $cppcheck)) { throw "missing pinned cppcheck: $cppcheck" }
          & $clangFormat --version
          & $cppcheck --version
          Add-Content $env:GITHUB_ENV "ZHAO_CLANG_FORMAT_BIN=$clangFormat"
          Add-Content $env:GITHUB_ENV "ZHAO_CPPCHECK_BIN=$cppcheck"

      - name: Restore oss-cad-suite cache
        id: suite-cache
        uses: actions/cache@v4
        with:
          path: oss-cad-suite
          key: oss-cad-suite-windows-x64-${{ env.ZHAO_SUITE_VERSION }}-${{ env.ZHAO_SUITE_SHA256 }}

      - name: Download + verify oss-cad-suite
        if: steps.suite-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri $env:ZHAO_SUITE_URL -OutFile suite-download.tgz
          $actual = (Get-FileHash suite-download.tgz -Algorithm SHA256).Hash
          if ($actual -ne $env:ZHAO_SUITE_SHA256) {
            throw "oss-cad-suite SHA256 mismatch: got $actual want $env:ZHAO_SUITE_SHA256"
          }
          Write-Host "SHA256 OK ($actual)"
          # The asset is a gzip tar (the local .tools copy is named .exe but
          # is the same bytes — SHA256 above is the cross-check).
          tar -xzf suite-download.tgz
          if (-not (Test-Path 'oss-cad-suite/share/verilator/verilator-config.cmake')) {
            throw 'unexpected suite layout: share/verilator/verilator-config.cmake missing'
          }

      - name: Put suite on PATH (VERILATOR_ROOT, bin, lib)
        shell: pwsh
        run: |
          $suite = Join-Path $env:GITHUB_WORKSPACE 'oss-cad-suite'
          Add-Content $env:GITHUB_ENV "VERILATOR_ROOT=$(Join-Path $suite 'share/verilator')"
          Add-Content $env:GITHUB_PATH "$suite/bin"
          Add-Content $env:GITHUB_PATH "$suite/lib"

      - name: Locate a g++ (the suite ships none)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gpp = Get-Command g++.exe -ErrorAction SilentlyContinue
          if (-not $gpp) {
            foreach ($cand in 'C:\msys64\mingw64\bin', 'C:\mingw64\bin') {
              if (Test-Path (Join-Path $cand 'g++.exe')) {
                Add-Content $env:GITHUB_PATH $cand
                Write-Host "g++ from $cand"
                return
              }
            }
            throw 'no g++ found on the runner (PATH, C:\msys64\mingw64\bin, C:\mingw64\bin)'
          }
          & g++.exe --version | Select-Object -First 1

      - name: Show tool versions
        shell: pwsh
        run: |
          cmake --version | Select-Object -First 1
          ninja --version
          g++ --version | Select-Object -First 1
          verilator_bin.exe --version

      - name: Configure + build + test (fast)
        shell: pwsh
        run: |
          cmake --preset windows-ci `
            -DZHAO_CLANG_FORMAT_BIN="$env:ZHAO_CLANG_FORMAT_BIN" `
            -DZHAO_CPPCHECK_BIN="$env:ZHAO_CPPCHECK_BIN"
          cmake --build build
          ctest --test-dir build -L fast --output-on-failure

  format:
    name: format + static analysis (charter 27)
    runs-on: ubuntu-latest
    # 45, not 30: cppcheck is the long pole and a timeout burns the
    # whole budget before reporting anything. Still tight enough that
    # a real regression surfaces as a failure, not a slow green.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # M1 (review RUN-20260814-1912): the every-commit "format" tier. The
      # npm clang-format package is PINNED so local checks (npx -y
      # clang-format@1.8.0 = LLVM 15) and CI agree bit-for-bit; ubuntu's
      # distro clang-format drifts across LLVM majors.
      - name: clang-format --dry-run --Werror (pinned LLVM 15)
        shell: bash
        run: |
          npx -y clang-format@1.8.0 --version
          # tracked C/C++ under reference/ tests/ tools/capture, EXCEPT
          # generated (fixgen-owned reference/include/zref/generated;
          # abi-gen-owned runtime/include/zhao_abi.h is outside the sweep)
          files=$(git ls-files reference tests tools/capture \
            | grep -E '\.(cpp|hpp|h)$' | grep -v generated)
          echo "$files" | wc -l
          npx -y clang-format@1.8.0 --dry-run --Werror $files
      # M1: the "static analysis" tier. tsc already gates every TS change in
      # the npm job; cppcheck covers the C++ side. The runner's distro version
      # may differ from local cppcheck; the source must pass this exact gate
      # under both.
      - name: cppcheck --enable=warning
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck
          cppcheck --version
          files=$(git ls-files reference tests tools/capture \
            | grep -E '\.(cpp|hpp|h)$' | grep -v generated)
          # -j: the sweep re-analyses the generated zhao_abi.h once per
          # translation unit, so its cost grew with the ABI and ran this job
          # past its budget single-threaded. Parallelism is the fix; the
          # checks and their results are unchanged (measured identical,
          # zero findings, 2.4x faster).
          cppcheck -j "$(nproc)" --enable=warning --std=c++17 --inline-suppr \
            --suppress=missingIncludeSystem --error-exitcode=2 \
            -I reference/include -I runtime/include -I tests/harness \
            --platform=unix64 $files

  npm:
    name: npm tooling (ledger/fixgen/abi)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: npm ci + gates
        shell: pwsh
        run: |
          npm ci
          # Nanquan owns language/compiler CI externally. The root npm test
          # script intentionally runs only Zhaozhou-owned tooling workspaces.
          npm run ledger:check
          npm run abi:check
          # The production manifest gate. It was LOCAL-ONLY until 2026-09-05,
          # and on the day it was first run in anger it found two real
          # divergences -- a block instantiated by the generated production top
          # but missing from that fit's source list, which would have died at
          # elaboration, and a new top neither counted nor declared absent.
          # A gate that only ever runs on one laptop is how weeks of drift hide.
          npm run manifest:check
          # THE RTL CONTRACT GATES, and they were LOCAL-ONLY until 2026-09-06 --
          # the same fault the manifest gate had, in the same file, four lines
          # up. Both encode a bug that was found once and would otherwise be
          # free to come back:
          #   check_ingress_capture  -- no block reads a live ingress pin after
          #     its capture point (the island lost 39 of 64 fragments to this
          #     while every activity counter looked healthy)
          #   check_guard_verdict    -- no MEM.GUARD client tests ready and ok
          #     in one cycle, which zhao_mem_guard cannot produce. Three clients
          #     had it wrong; two read every PASS as a denial and the third
          #     reads every DENIAL as a pass.
          #   check_v3_banks         -- the texture island V3 transaction file is
          #     physically what section 6 of its architecture declares: the right
          #     depth x width, synchronous, one writer and one reader, and no
          #     logic between an array read and its first register. Section 0's
          #     last paragraph says why it is machine-checked rather than
          #     written down: "the next agent cannot implement another large
          #     asynchronous table, call it a transaction file, and declare the
          #     architecture complete." It runs its own 19 deliberately-wrong
          #     fixtures before it will report on the tree, so a clean run is
          #     evidence rather than a comfortable zero.
          # All three GATE (non-zero on violation) rather than report, which is
          # why they are here and design:report as a whole is not.
          npm run rtl:gates
          npm test

  nightly:
    name: ctest (nightly + formal)
    runs-on: windows-latest
    timeout-minutes: 120
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      # W6 fix: the nightly label carries the npm shims too (abi_staleness is
      # fast+nightly); same node_modules requirement as the build job.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: npm ci (CTest npm shims)
        shell: pwsh
        run: npm ci

      - name: Restore oss-cad-suite cache
        id: suite-cache
        uses: actions/cache@v4
        with:
          path: oss-cad-suite
          key: oss-cad-suite-windows-x64-${{ env.ZHAO_SUITE_VERSION }}-${{ env.ZHAO_SUITE_SHA256 }}

      - name: Download + verify oss-cad-suite
        if: steps.suite-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri $env:ZHAO_SUITE_URL -OutFile suite-download.tgz
          $actual = (Get-FileHash suite-download.tgz -Algorithm SHA256).Hash
          if ($actual -ne $env:ZHAO_SUITE_SHA256) {
            throw "oss-cad-suite SHA256 mismatch: got $actual want $env:ZHAO_SUITE_SHA256"
          }
          tar -xzf suite-download.tgz

      - name: Put suite on PATH (VERILATOR_ROOT, bin, lib)
        shell: pwsh
        run: |
          $suite = Join-Path $env:GITHUB_WORKSPACE 'oss-cad-suite'
          Add-Content $env:GITHUB_ENV "VERILATOR_ROOT=$(Join-Path $suite 'share/verilator')"
          Add-Content $env:GITHUB_PATH "$suite/bin"
          Add-Content $env:GITHUB_PATH "$suite/lib"

      - name: Locate a g++ (the suite ships none)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gpp = Get-Command g++.exe -ErrorAction SilentlyContinue
          if (-not $gpp) {
            foreach ($cand in 'C:\msys64\mingw64\bin', 'C:\mingw64\bin') {
              if (Test-Path (Join-Path $cand 'g++.exe')) {
                Add-Content $env:GITHUB_PATH $cand
                return
              }
            }
            throw 'no g++ found on the runner'
          }

      - name: Configure + build + nightly tests
        shell: pwsh
        run: |
          cmake --preset windows-ci
          cmake --build build
          ctest --test-dir build -L nightly --output-on-failure
