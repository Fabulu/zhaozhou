# Zhaozhou Effects Library Catalogue
# Version 1 - Single source of truth for all renderable effects
# Owner charter: "Make sure these become a readily available library."
#
# LEGIBILITY RULE (2026-08-16 owner mandate):
# A reel subject must be legible at gallery scale, not merely correct.
# A catalogue entry is not complete until its screen communicates its
# subject to someone who does not know what they are looking at.
# Terrain subjects work because deformation reads from any distance.
# A 4-pixel strobe does not. When in doubt, ask whether a stranger
# could name what the loop is showing. If not, re-shoot or cut it.

version: 2
last_updated: "2026-08-16"

# CRC DISCIPLINE (2026-08-16, v2): crc_pin is the sequence CRC-32C of the
# artifact AT render_path, byte-verified by the encode pipeline (togif.py
# decodes the gif back and compares every frame). Two eras exist on this
# page: the kBandRows 8->16 sky fix (dcb32ff) landed after the four terrain
# gifs were shot; those four are kept as shipped by owner instruction and
# carry crc_note with the CURRENT renderer's CRC (what zhao-reel --check
# pins). Every other entry was rendered from commit 6cb4e54 and re-derives
# byte-identically. frames/gif_bytes state the shipped artifact.

