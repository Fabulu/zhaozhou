# =============================================================================
# Zhaozhou Design Ledger — design/ops.yml
# Language-visible Field IR operations, the frozen five profiles, sinks and
# stamp blend modes (charter §4). Q-format fields are POINTERS into
# spec/qformats.md (ZH-012): this file never freezes numeric behaviour ahead
# of the fixed-point spec (W3).
#
# Counts: 40 entries = 28 ALU (P2 §2 list, with FIELD.SMOOTH.D implemented as
# DCURVE per plan 1.D) + FIELD.RCP (plan A3e, table class) + 6 profile sinks
# + 5 stamp modes.
#
# field_ir_opcode: numeric where the plan froze it (NOISE2 0x1C, DCURVE 0x1D);
# symbolic mnemonic elsewhere — pinned to a number by the ISA v1 table in
# spec/form/field-ir.md (W5) and then back-filled here. field_ir_macro marks
# composed (macro-expansion) ops. Every entry carries one or the other (A3e).
# =============================================================================

schema_version: 1

profiles:
  E:
    name: earth
    description: Earth8 patch fields — terrain height/material/nav/hazard (charter §11.3).
    sequencer: FIELD.SEQ.EARTH
  W:
    name: warp
    description: Warp8 vertex deformation fields (deferred, cut-order 5).
    sequencer: FIELD.SEQ.WARP
  F:
    name: flow
    description: Particle/force fields driving Myriad.
    sequencer: FIELD.SEQ.FLOW
  M:
    name: formation
    description: Transform-generation fields feeding the Transform Loom.
    sequencer: FIELD.SEQ.FORMATION
  S:
    name: stamp
    description: Scar Scribe sheet fields.
    sequencer: FIELD.SEQ.STAMP

ops:

  # ------------------------- shared ALU ops (28) ----------------------------

  - id: FIELD.MOV
    name: Move
    class: alu
    profiles: [E, W, F, M, S]
    semantics: Copy a Q16.16 lane (or an immediate into a lane); identity on values, saturating never triggers.
    operand_q: [spec/qformats.md §Q16.16]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zref::fieldir::op_mov
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION, FIELD.SEQ.STAMP]
    cost_units: 1
    field_ir_opcode: MOV
    differential_tests: tests/differential/field_alu_ops.cpp
    notes: null

  - id: FIELD.ADD
    name: Saturating add
    class: alu
    profiles: [E, W, F, M, S]
    semantics: a + b in Q16.16, round-half-up, saturating; sticky SAT on clamp.
    operand_q: [spec/qformats.md §Q16.16]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zref::fieldir::op_add
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION, FIELD.SEQ.STAMP]
    cost_units: 1
    field_ir_opcode: ADD
    differential_tests: tests/differential/field_alu_ops.cpp
    notes: null

  - id: FIELD.SUB
    name: Saturating subtract
    class: alu
    profiles: [E, W, F, M, S]
    semantics: a - b in Q16.16, round-half-up, saturating; sticky SAT on clamp.
    operand_q: [spec/qformats.md §Q16.16]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zref::fieldir::op_sub
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION, FIELD.SEQ.STAMP]
    cost_units: 1
    field_ir_opcode: SUB
    differential_tests: tests/differential/field_alu_ops.cpp
    notes: null

  - id: FIELD.MUL
    name: Single-rounding multiply
    class: alu
    profiles: [E, W, F, M, S]
    semantics: Exact s64 product (int64)a*b then ONE rescale(.,16) round-half-up, saturating (plan A3b — double rounding is rejected).
    operand_q: [spec/qformats.md §Q16.16, spec/qformats.md §rescale]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zref::fieldir::op_mul
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION, FIELD.SEQ.STAMP]
    cost_units: 1
    field_ir_opcode: MUL
    differential_tests: tests/differential/field_mul.cpp
    notes: Single-rounding law (A3b) applies machine-wide.

  - id: FIELD.MAD
    name: Fused multiply-accumulate
    class: alu
    profiles: [E, W, F, M, S]
    semantics: Exact s64 (int64)a*b + (s64)c<<16, then ONE rescale(.,16) round-half-up, saturating; less bias in mad-chains than mul-then-add (A3b).
    operand_q: [spec/qformats.md §Q16.16, spec/qformats.md §rescale]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zref::fieldir::op_mad
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION, FIELD.SEQ.STAMP]
    cost_units: 1
    field_ir_opcode: MAD
    differential_tests: tests/differential/field_mad.cpp
    notes: The DSP MAC primitive; every lerp/blend composes from it.

  - id: FIELD.MIN
    name: Minimum
    class: alu
    profiles: [E, W, F, M, S]
    semantics: min(a, b) lane-wise; no rounding.
    operand_q: [spec/qformats.md §Q16.16]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zref::fieldir::op_min
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION, FIELD.SEQ.STAMP]
    cost_units: 1
    field_ir_opcode: MIN
    differential_tests: tests/differential/field_min.cpp
    notes: null

  - id: FIELD.MAX
    name: Maximum
    class: alu
    profiles: [E, W, F, M, S]
    semantics: max(a, b) lane-wise; no rounding.
    operand_q: [spec/qformats.md §Q16.16]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zref::fieldir::op_max
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION, FIELD.SEQ.STAMP]
    cost_units: 1
    field_ir_opcode: MAX
    differential_tests: tests/differential/field_max.cpp
    notes: null

  - id: FIELD.ABS
    name: Absolute value
    class: alu
    profiles: [E, W, F, M, S]
    semantics: "|a|; -MIN saturates (MIN maps to MAX), sticky SAT."
    operand_q: [spec/qformats.md §Q16.16]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zref::fieldir::op_abs
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION, FIELD.SEQ.STAMP]
    cost_units: 1
    field_ir_opcode: ABS
    differential_tests: tests/differential/field_abs.cpp
    notes: null

  - id: FIELD.CLAMP
    name: Clamp
    class: alu
    profiles: [E, W, F, M, S]
    semantics: clamp(a, lo, hi) with lo <= hi enforced at validation time.
    operand_q: [spec/qformats.md §Q16.16]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zref::fieldir::op_clamp
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION, FIELD.SEQ.STAMP]
    cost_units: 1
    field_ir_opcode: CLAMP
    differential_tests: tests/differential/field_clamp.cpp
    notes: null

  - id: FIELD.SELECT
    name: Branchless select
    class: alu
    profiles: [E, W, F, M, S]
    semantics: "predicate ? a : b, branchless (unit8 predicate from CMP); both operands always evaluated."
    operand_q: [spec/qformats.md §Q16.16, spec/qformats.md §unit8]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zref::fieldir::op_select
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION, FIELD.SEQ.STAMP]
    cost_units: 1
    field_ir_opcode: SELECT
    differential_tests: tests/differential/field_select.cpp
    notes: No control flow in Field IR — selection is data movement (P4 §12-1).

  - id: FIELD.CMP
    name: Compare
    class: alu
    profiles: [E, W, F, M, S]
    semantics: Three-way compare producing a unit8 predicate (0 / 0x10000 boolean convention per P4 §12-10).
    operand_q: [spec/qformats.md §Q16.16]
    result_q: spec/qformats.md §unit8
    rounding: saturating
    reference_function: zref::fieldir::op_cmp
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION, FIELD.SEQ.STAMP]
    cost_units: 1
    field_ir_opcode: CMP
    differential_tests: tests/differential/field_cmp.cpp
    notes: Booleans are 0 / 0x10000 exactly.

  - id: FIELD.DOT2
    name: 2-D dot product
    class: alu
    profiles: [E, W, F, M]
    semantics: a.x*b.x + a.y*b.y via the single-rounding MAD path; adjacent-register pair convention (P4 §12-2).
    operand_q: [spec/qformats.md §Q16.16]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zref::fieldir::op_dot2
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION]
    cost_units: 2
    field_ir_opcode: DOT2
    differential_tests: tests/differential/field_dot2.cpp
    notes: Adjacent-register convention — one instruction, two lanes.

  - id: FIELD.DOT3
    name: 3-D dot product
    class: alu
    profiles: [W, F, M]
    semantics: a.x*b.x + a.y*b.y + a.z*b.z via the single-rounding MAD path; adjacent-register triple.
    operand_q: [spec/qformats.md §Q16.16]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zref::fieldir::op_dot3
    implementation_blocks: [FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION]
    cost_units: 2
    field_ir_opcode: DOT3
    differential_tests: tests/differential/field_dot3.cpp
    notes: null

  - id: FIELD.NORM.APPROX
    name: Approximate normalize
    class: alu
    profiles: [W, F, M]
    semantics: Table-based reciprocal-sqrt normalize; APPROX by law — an exact rsqrt is forbidden (never silently "improved").
    operand_q: [spec/qformats.md §Q16.16, spec/qformats.md §isqrt]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zref::fieldir::op_norm_approx
    implementation_blocks: [FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION]
    cost_units: 3
    field_ir_opcode: NORMALIZE2
    differential_tests: tests/differential/field_norm_approx.cpp
    notes: Vector-width variants share one table (spec/qformats.md §isqrt).

  - id: FIELD.SIN
    name: Sine
    class: alu
    profiles: [E, W, F, M]
    semantics: sin(angle16) from the 257-entry Q1.16 quarter-wave table with linear interpolation, error <= ~1.3 LSB (plan A2).
    operand_q: [spec/qformats.md §angle16, spec/qformats.md §sin-cos-table]
    result_q: spec/qformats.md §Q1.16
    rounding: saturating
    reference_function: zref::fieldir::op_sin
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION]
    cost_units: 2
    field_ir_opcode: SIN
    differential_tests: tests/differential/field_sin.cpp
    notes: Table generated byte-identically in three languages (W3 fixgen).

  - id: FIELD.COS
    name: Cosine
    class: alu
    profiles: [W, F, M]
    semantics: cos(angle16) from the same quarter-wave table (phase-shifted angle reduction).
    operand_q: [spec/qformats.md §angle16, spec/qformats.md §sin-cos-table]
    result_q: spec/qformats.md §Q1.16
    rounding: saturating
    reference_function: zref::fieldir::op_cos
    implementation_blocks: [FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION]
    cost_units: 2
    field_ir_opcode: COS
    differential_tests: tests/differential/field_cos.cpp
    notes: Exhaustively testable over all 2^16 angles (A2).

  - id: FIELD.CURVE
    name: Curve sample
    class: alu
    profiles: [E, F, M]
    semantics: Sample a compiled {x,y} table at phase A; clamped endpoints, pinned binary search (P4 §12-10).
    operand_q: [spec/qformats.md §Q16.16, spec/qformats.md §curve-tables]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zfield::interpret
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION]
    cost_units: 1
    field_ir_opcode: CURVE
    differential_tests: tests/differential/field_curve_directed.cpp
    notes: "Totality — every input yields a defined output (P4 §12-10). There is no per-op reference function: the ONE interpreter's OP_CURVE case is the law (field-ir.md §1), and the RTL is zhao_field_curve.sv."

  - id: FIELD.NOISE2
    name: Two-lane lattice noise
    class: alu
    profiles: [E, F, S]
    semantics: PCG RXS-M-XS hash (plan A1 constants frozen in qformats.md §7) producing TWO decorrelated unit lanes (h0>>16, h1>>16) at a lattice point.
    operand_q: [spec/qformats.md §Q16.16, spec/qformats.md §noise2]
    result_q: spec/qformats.md §unit-pair
    rounding: saturating
    reference_function: zfield::interpret
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.FLOW, FIELD.SEQ.STAMP]
    cost_units: 2
    field_ir_opcode: "0x1C"
    differential_tests: tests/differential/field_noise_directed.cpp
    notes: "Opcode 0x1C frozen (plan 1.B-4). Bilinear smooth value noise is a MACRO over this op (A1b), documented in field-ir.md, not a separate opcode. RTL: zhao_field_noise.sv. The lattice index is an ARITHMETIC shift of a signed register reinterpreted as unsigned, so a logical shift agrees for every non-negative coordinate and disagrees for every negative one."

  - id: FIELD.LEN.APPROX
    name: Approximate length
    class: alu
    profiles: [E, W, F, M]
    semantics: Table-based approximate vector length (isqrt path); APPROX by law.
    operand_q: [spec/qformats.md §Q16.16, spec/qformats.md §isqrt]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zref::fieldir::op_len_approx
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION]
    cost_units: 2
    field_ir_opcode: LEN2
    differential_tests: tests/differential/field_len_approx.cpp
    notes: Vector-width variants (LEN2/LEN3) share the mnemonic family.

  - id: FIELD.DIST.APPROX
    name: Approximate distance
    class: alu
    profiles: [E, W, F, M]
    semantics: Table-based approximate distance between two points (sub then LEN.APPROX path).
    operand_q: [spec/qformats.md §Q16.16, spec/qformats.md §isqrt]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zref::fieldir::op_dist_approx
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION]
    cost_units: 2
    field_ir_opcode: DIST2
    differential_tests: tests/differential/field_dist_approx.cpp
    notes: Earth8's "approx distance" maps here (charter §11.3).

  - id: FIELD.SMOOTHSTEP
    name: Smoothstep
    class: alu
    profiles: [E, W, F, M, S]
    semantics: Hermite smoothstep a' = 3t^2-2t^3 composed from MUL/MAD single-rounding primitives; weights per spec/qformats.md §smoothstep.
    operand_q: [spec/qformats.md §Q16.16, spec/qformats.md §smoothstep]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zref::fieldir::op_smoothstep
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION, FIELD.SEQ.STAMP]
    cost_units: 2
    field_ir_macro: [FIELD.MUL, FIELD.MAD]
    differential_tests: tests/differential/field_smoothstep.cpp
    notes: Implemented as a mandated macro-expansion of MUL/MAD (one rounding law, A3b).

  - id: FIELD.RING
    name: Ring falloff
    class: alu
    profiles: [E, S]
    semantics: Annular distance falloff ring(d, r0, r1) with hard zero outside r1; composed from ABS/SUB/DIV-free ramp arithmetic.
    operand_q: [spec/qformats.md §Q16.16]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zfield::interpret
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.STAMP]
    cost_units: 2
    field_ir_opcode: RING
    differential_tests: tests/differential/field_ring_directed.cpp
    notes: The crater_ring demo's core shape (P4 §10).

  - id: FIELD.RIDGE
    name: Ridge noise shaping
    class: alu
    profiles: [E]
    semantics: "Ridged transform: u = noise2_hash(a>>16, b>>16, imm, lane 0) >> 16, then 1 - |2u - 1| with saturating add/sub and abs. Shares the hash with NOISE2 but reads reg[a] and reg[b] rather than an adjacent pair."
    operand_q: [spec/qformats.md §Q16.16]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zfield::interpret
    implementation_blocks: [FIELD.SEQ.EARTH]
    cost_units: 2
    field_ir_opcode: RIDGE
    differential_tests: tests/differential/field_noise_directed.cpp
    notes: "RTL: zhao_field_noise.sv, shared with NOISE2. The hash's closing xor-shift cannot reach bit 16 and both ops keep only bits [31:16], so two mutations of that line are provably unobservable and are recorded as equivalent mutants rather than left looking like test holes."

  - id: FIELD.SAMPLE.SPLINE
    name: Spline distance sample
    class: alu
    profiles: [E, M]
    semantics: Distance-to-spline via the pinned Catmull-Rom parametrization (P4 §12-10); exact integer semantics, no runtime division.
    operand_q: [spec/qformats.md §Q16.16, spec/qformats.md §spline-tables]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zfield::interpret
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.FORMATION]
    cost_units: 2
    field_ir_opcode: SPLINE
    differential_tests: tests/differential/field_curve_directed.cpp
    notes: "The closing term is rescale_s32(v, 1) — the one-half of Catmull-Rom — not v << 16, which is a fixed defect (review C1, RUN-20260814-1912 wave-1). RTL: zhao_field_curve.sv."

  - id: FIELD.SAMPLE.CURVE
    name: Envelope curve sample
    class: alu
    profiles: [E, F, M]
    semantics: Sample an envelope/phase curve table (CURVE semantics at a declared table id).
    operand_q: [spec/qformats.md §Q16.16, spec/qformats.md §curve-tables]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zfield::interpret
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION]
    cost_units: 1
    field_ir_opcode: CURVE
    differential_tests: tests/differential/field_curve_directed.cpp
    notes: Shares the CURVE opcode with an immediate table id, so it shares the RTL and the test.

  - id: FIELD.ROT2
    name: 2-D rotation
    class: alu
    profiles: [F, M, S]
    semantics: Rotate a 2-D vector by angle16 using SIN/COS + single-rounding MAD; adjacent-register pair.
    operand_q: [spec/qformats.md §Q16.16, spec/qformats.md §angle16]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zfield::interpret
    implementation_blocks: [FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION, FIELD.SEQ.STAMP]
    cost_units: 2
    field_ir_opcode: ROT2
    differential_tests: tests/differential/field_rot_directed.cpp
    notes: "RTL: zhao_field_rot.sv, shared with ROT3 (ROT2 is the Z case on two lanes). EACH PRODUCT IS ROUNDED SEPARATELY -- fx_sub(fx_mul(c,p), fx_mul(s,q)) rounds twice and then saturates, which is the OPPOSITE of the A3b single-rounding rule used everywhere else in this design. An implementation improved into the house style is wrong."


  - id: FIELD.ROT3
    name: 3-D rotation
    class: alu
    profiles: [W, M]
    semantics: Rotate a 3-D vector by angle16 about a declared axis; adjacent-register triple.
    operand_q: [spec/qformats.md §Q16.16, spec/qformats.md §angle16]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zfield::interpret
    implementation_blocks: [FIELD.SEQ.WARP, FIELD.SEQ.FORMATION]
    cost_units: 3
    field_ir_opcode: ROT3
    differential_tests: tests/differential/field_rot_directed.cpp
    notes: "RTL: zhao_field_rot.sv. The axis lane is COPIED bit for bit, not multiplied by a unit cosine, and the angle is reg[b] & 0xFFFF with the upper half ignored rather than rejected."


  - id: FIELD.DCURVE
    name: Curve derivative
    class: alu
    profiles: [E, W, F, M]
    semantics: DCURVE(A, imm=tid) returns the slope of the segment of table tid containing A; slopes precomputed offline per segment as slope_i = round_half_up((y[i+1]-y[i])<<16 / (x[i+1]-x[i])) with exact 128-bit division, stored as {x,y,dy} triples (plan 1.D).
    operand_q: [spec/qformats.md §Q16.16, spec/qformats.md §curve-tables]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zfield::interpret
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION]
    cost_units: 1
    field_ir_opcode: "0x1D"
    differential_tests: tests/differential/field_curve_directed.cpp
    notes: Opcode 0x1D frozen (plan 1.B-4, fills the gap after NOISE2 0x1C). This IS P2's proposed FIELD.SMOOTH.D, ratified under the new name; fills Earth8's velocity-output gap with zero runtime division.

  # ------------------------- table-class op (+1, A3e) ----------------------

  - id: FIELD.RCP
    name: Field reciprocal
    class: table
    profiles: [E, W, F, M]
    semantics: field_rcp via the 256-entry Q16.16 table with pinned linear correction; rcp(0) = 0x7FFF_FFFF with sticky RCP0 flag (plan A3a/P4 §12-10).
    operand_q: [spec/qformats.md §Q16.16, spec/qformats.md §field_rcp]
    result_q: spec/qformats.md §Q16.16
    rounding: saturating
    reference_function: zref::fieldir::op_rcp
    implementation_blocks: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION]
    cost_units: 2
    field_ir_opcode: RCP
    differential_tests: tests/differential/field_rcp.cpp
    notes: Added by plan A3e (P2's 28-op list omitted it). Distinct from rcp_u24 (raster depth path) — different consumers, different names, never conflated.

  # ------------------------- profile sinks (6) ------------------------------

  - id: FIELD.OUT.HEIGHT
    name: Earth height output
    class: sink
    profiles: [E]
    semantics: Route the earth program's height lane to the terrain patch intake (profile output map — no dedicated opcode).
    operand_q: [spec/qformats.md §height16]
    result_q: spec/qformats.md §height16
