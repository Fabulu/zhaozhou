      lease at that same edge, every byte issued AND retired, a passing CRC and
      no recorded failure; a release implies the transaction had actually
      ACQUIRED that lease and that every accepted write had retired first;
      publish and release are never both true; a guard request implies a live
      matching lease and an ABSOLUTE address inside the leased slot; write data
      is held while the consumer stalls; a lost lease admits no NEW HPS request,
      no NEW write beat and no publication; reset leaves nothing half-done.
      Eight covers, ALL reached -- c_publish at k = 18, c_crc_fail at k = 21 --
      which is what makes the implications non-vacuous. Reachable ONLY because
      of the FORMAL-ONLY FORMAL_CANVAS_BYTES = 64 DUT parameter: the smallest
      lawful canvas is 184,320 bytes (2,880 chunks, 46,000+ cycles), so at the
      real size no bounded model publishes and every publish property would be
      green while proving nothing -- the same shape that made CMD.DMA's
      assertion (b) and MEM.GUARD's whole lane vacuous. Two findings while
      writing it: a_pub_nofail failed at k = 2 until the model was made to start
      from a REAL reset (unconstrained registers let it publish out of a
      fabricated state, which says nothing about the design), and the
      state-level abort check in B_GUARD_REQUEST is redundant given the
      combinational gate on guard_req_o.valid.
  - property: tests/formal/video_slotmgr_invariants.sby
    status: green
    date: "2026-08-21"
    commit: "ea50d3b"
    lane: formal_video_slotmgr_invariants
    tasks: [bmc, cover]
    covers: true
    notes: >-
      VIDEO.SLOTMGR ownership invariants (integration-corrections section 9),
      depth 24, btormc. Proven: at most one slot DISPLAYED and the displayed
      bookkeeping agreeing with the states; a lease grant implies the slot was
      FREE the instant before; a grant moves that slot's generation by exactly
      one and NOTHING else moves it; a live lease always points at a WRITING
      slot; publication and release move state ONLY on a matching generation; a
      stale event changes nothing and is counted; slot_ready means READY
      exactly. Eight covers, ALL reached by k = 6. Two of the review's eight
      properties -- never WRITING and DISPLAYED at once, never READY and WRITING
      at once -- are true by the two-bit encoding and are NAMED in the RTL
      rather than asserted, because asserting them proves a property of
      `logic [1:0]` and not of the design. THE LANE FOUND A REAL DEFECT: a
      publication and a release in the same cycle raced, and the later state
      write silently won, so a slot could go FREE on the very edge it was told
      to become READY. The pair is now refused and counted once. Two further
      findings were in the properties rather than the design: nested
      `$past(state[$past(slot)])` is ambiguous about when the index is sampled
      (every such property now uses explicit shadow registers), and those
      shadows needed the DUT's own reset or they recorded events that arrived
      while reset was asserted.
