    commit: 186546e
    lane: formal_texture_bilerp
    tasks: [bmc, cover]
    covers: true
    notes: >-
      The bilinear channel of TEXTURE.TMU, proved on zhao_texture_bilerp —
      the module zhao_texture_tmu instantiates 4× per filtered sample, once
      per channel (R, G, B, A) — so the proof and the silicon are the same
      bytes rather than a restatement. THE LAW IT PROVES IS DERIVED, NOT
      CITED: no spec in this repository defines bilinear weights or their
      rounding (searched: spec/qformats.md, spec/sky_and_beams.md §2,
      spec/stars_and_flares.md §1, spec/terrain_rules.md §6.2, charter §15
      and §20.1 — all name bilinear without stating it), and the derivation
      from qformats §2 (unit8 = raw/256, so the complement 256−f REACHES
      256), §3 (the single-rounding law, which REFUSES the textbook
      two-lerps-then-a-lerp form) and §4 (rescale_u, round-half-up) is
      written out in the RTL header and in design/contracts/TEXTURE.TMU.md.
      FOUR laws: a_exact (the output IS (Σ t·w + 32768) >> 16 computed in a
      32-bit lane — which catches all three named one-LSB traps at once, a
      truncated rounding, swapped weights, and a /255 scale, and which —
      because that wide law is compared against an EIGHT-BIT output — also
      proves the weighted sum can never leave the field); a_wsum (PARTITION
      OF UNITY, Σw = 65,536 exactly, true only because the unit8 complement
      reaches 256 — a filter whose weights summed to 65,025, the /255
      mistake, fails it immediately, and together with a_exact it gives the
      flat-footprint theorem by arithmetic); a_corner (fu = fv = 0 is the
      EXACT identity on t00, which is what lets FILTER_NEAREST force both
      fractions to zero and take THE SAME datapath rather than a parallel
      one — if this failed, every nearest sample in the machine would be
      wrong); and a_in_field (no clamp anywhere in the module). TOTAL, not
      bounded: the harness is combinational with unconstrained inputs, and
      free (t00,t10,t01,t11,fu,fv) is EVERY input the block can be handed —
      the four texel bytes are u8 because every charter §15 format decodes
      to charter §8's 8-bit channel lanes, and the two fractions are u8
      because they ARE unit8s — so all 2^48 inputs are covered with no
      reachability gap. Recorded as an explicit "# SCOPE-TOTAL:" waiver
      (V19) because there is no horizon for a scope guard to assert. SEVEN
      covers, all reached: the load-bearing c_tie_up (an EXACT rounding tie
      firing — without it a_exact also holds for a TRUNCATING filter on
      every non-tie input, which is almost all of them) and its neighbour
      c_tie_below; c_strictly_between (the filter lands strictly INSIDE its
      own footprint, without which a_exact would also hold for a filter that
      never left tap 0); both far corners; the 128/128 centre; and
      c_unity_flat (a flat footprint at a non-trivial fraction filtering to
      itself). MEASURED COST, recorded because it drove the property set:
      bmc closes in 741 s standalone on this kit (boolector, depth 2) and the
      whole lane in 1,264 s under CTest — which is why it carries TIMEOUT
      3600 and not the 2100 the other formal lanes use. TWO REAL PROPERTIES
      WERE WRITTEN, RUN AND REMOVED because they do not close here, and the
      omission is named rather than assumed away: CONVEXITY (min(t) ≤ out ≤
      max(t)) is genuinely nonlinear — the solver would need t_i·w_i ≤
      max·w_i, which bit-blasting does not get cheaply — and MONOTONICITY in
      fu needs a second DUT instance that doubles the multipliers; with
      convexity added the task ran past 25 minutes twice without an answer.
      NOT proved here: the address generation, the three wrap folds, the mip
      selection and its base-4-repunit offset, the five format decodes, the
      palette pass, the cache handshake, the mode-error rules and the state
      machine; those are covered by the differential lanes against zref::Tmu
      (texture_tmu_directed's 73 checks and texture_tmu_random's three
      lanes) and by the nine-way mutation table in
      design/contracts/TEXTURE.TMU.md.

  - property: tests/formal/texture_mod255.sby
    status: green
    date: "2026-08-19"
    commit: 24d8d21
    lane: formal_texture_mod255
    tasks: [bmc, cover]
    covers: true
    notes: >-
      The `h mod 255` residue network of TEXTURE.MOSAIC (ZH-030), proved on
      zhao_texture_mod255 — the module zhao_texture_mosaic instantiates, and
      the only instance of it — so the proof and the silicon are the same
      bytes. The residue was factored OUT of the mosaic pipeline for exactly
      the reason the surface blend was: inside it, reaching the arithmetic
      needs a packet, two pipeline stages and a handshake, none of which is
      arithmetic anybody can state a theorem about. SCOPE-TOTAL, not bounded:
      the harness is one always_comb and its free `h` is 32 bits, which IS the
      port width and IS the width of spec/terrain_rules.md §6.2's uint32_t
      hash, so all 4,294,967,296 inputs are covered and depth 2 is the full
      reachable set. Recorded as an explicit "# SCOPE-TOTAL:" waiver (V19)
      because there is no horizon for a scope guard to assert. THREE laws,
      and the first is the interesting one: a_is_the_residue states that the
      output IS h mod 255 WITHOUT putting a divider in the property — a free
      25-bit q and 8-bit r witness h = 255*q + r, r < 255 is assumed, and the
      block's answer must equal r. Because that decomposition is unique the
      assumption pins r to exactly h % 255, and the property contains only
      multiply, add and compare, so it is not a second implementation of the
      fold it is checking. a_in_range states UNCONDITIONALLY that p <= 254,
      which is the fact zref::terrain::mosaic_pick's "weight 255 = always
      matA" rests on — an 8-bit port makes p <= 255 a tautology about a
      declaration, while p <= 254 is a theorem about the conditional
      subtract. a_zero anchors h = 0. SIX covers, all reached, and they are
      load-bearing rather than decorative because a_is_the_residue is guarded
      by an assumption and could otherwise pass on an unsatisfiable
      antecedent: r = 0 with a NON-ZERO h (the single input the conditional
      subtract exists for, and the one a random sweep meets once in 255
      draws), r = 254, r = 1, h = 0xFFFFFFFF (255 x 16,843,009, where the
      byte sum reaches the 255 rail), and both ends of q's range. NOT VACUOUS,
      demonstrated: mutating the final compare from `s2 >= 255` to `s2 > 255`
      makes bmc FAIL in 4 s (and also fails both differential lanes and the
      directed constructed-residue case; binary hash a38c01a6 -> b8d3cd97,
      relink proven). Measured cost: 110.5 s under CTest on this kit
      (boolector, depth 2) — it carries the standard TIMEOUT 2100. NOT proved
      here: the two frozen multiplier constants (73,856,093 and 19,349,663),
      the XOR, the arithmetic shift to the world texel index, the mirrored
      fold, the `p < weight` compare, the rigid two-stage pipeline, the
      ready/valid handshake and the texture_samples counter; those are
      covered by the two differential lanes against
      zref::terrain::mosaic_pick / mirror_texel (tests/texture/) and by the
      three-way mutation table in design/contracts/TEXTURE.MOSAIC.md.

  - property: tests/formal/surface_blend.sby
    status: green
    date: "2026-08-19"
    commit: 8bd35d2
    lane: formal_surface_blend
    tasks: [bmc, cover]
    covers: true
    notes: >-
      The surface-sheet blend of SURFACE.STAMP (ZH-052), proved on
      zhao_surface_blend — the module zhao_surface_stamp instantiates, and the
      only instance of it — so the proof and the silicon are the same bytes
      rather than a restatement. The blend was factored OUT of the stamp
      pipeline for exactly this reason: inside it, reaching the arithmetic
      needs a command, a residency grant and two pipeline stages, and none of
      that is arithmetic anybody can state a theorem about. SCOPE-TOTAL, not
      bounded: the harness is one always_comb and its 22 free input bits
      (mode 3, dst 8, src 8, age_shift 3) ARE the module's whole input space —
      dst is u8 because layer F's strength IS one byte (charter §12,
      spec/terrain_rules.md §2), src is u8 because it IS `strength >> 8` of
      the ABI's u16 field, mode is 3 bits because the blend field is, and the
      shift is 0..7 — so all 4,194,304 inputs are covered and depth 2 is the
      full reachable set. Recorded as an explicit "# SCOPE-TOTAL:" waiver
      (V19) because there is no horizon for a scope guard to assert. NINE
      laws, each written against the arithmetic in wide lanes rather than
      against the RTL's case arms: a_replace; a_max_exact (exactly
      max(dst,src) — the blend EVERY ABI operation byte other than 1 selects,
      including the reference's `else`, and the one tests/render/
      render_golden.cpp's crack ring pins); a_decay_exact (exactly
      min(255,(dst>>1)+src), zref::render::stamp_surface's own expression for
      ABI operation 1); a_add_exact and a_sub_exact (exactly min(255,dst+src)
      and max(0,dst-src), both two-sided so the WRAP and the early clamp die
      together — a subtract that wrapped would turn an erase into the
      brightest scar on the sheet); a_age_exact; a_sub_darkens (SUB and AGE
      can never brighten); a_add_brightens (ADD and MAX can never darken —
      with DECAY_ACC DELIBERATELY EXCLUDED, because (dst>>1)+0 halves, so
      asserting monotonicity there would assert something FALSE about the
      ratified blend); and a_age_terminates (a non-zero shift strictly
      decreases a non-zero destination), which is the theorem that justifies
      choosing a shift over the rejected qformats §2 unit_mul form — rate
      255/256 has a fixed point at 1, so an aged scar would never reach zero.
      NINE covers, all reached: both saturation rails ACTUALLY firing (without
      them a_add_exact/a_sub_exact's min and max also hold for a blend that
      never reaches a rail), the decay rail, DECAY_ACC actually halving (the
      non-monotone case a_add_brightens excludes), MAX taking each of its two
      branches, the ABI STAMP code taking src, AGE driving a non-zero
      destination to zero, and REPLACE actually lowering. NOT VACUOUS,
      demonstrated: removing SUB's saturation makes bmc FAIL (and also fails
      both differential lanes; binary hash F1F8DE20 -> E20EB1E5, relink
      proven). Measured cost: 2.7 s under CTest on this kit (boolector,
      depth 2) — it carries the standard TIMEOUT 2100. Deliberately NOT
      asserted: "the result never leaves the 8-bit field", because out_o IS
      eight bits wide and that is a tautology about a port declaration rather
      than a theorem — unlike zhao_raster_blend, whose internal lane is wider
      than its output. NOT proved here: the coverage geometry (texel centres,
      the annulus, the truncating divide and its stated ±4,096 m domain), the
      ABI operation -> blend mapping, the residency handshake with
      SURFACE.SHEET, the two-stage pipeline, the counters and the
      stamp_results stream; those are covered by the differential lanes
      against zref::render::stamp_surface (tests/surface/) and by the
      nine-way mutation table in design/contracts/SURFACE.STAMP.md.
