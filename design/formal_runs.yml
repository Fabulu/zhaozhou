  - property: tests/formal/cmd_dma_crc_gate.sby
    status: green
    date: "2026-08-16"
    commit: bb13352
    lane: formal_cmd_dma_crc_gate
    tasks: [bmc, cover]
    covers: true
    notes: >-
      CMD.DMA CRC gates: no verified-packet byte before header+payload CRC,
      no VRAM write before the blit CRC, clean reset. Written pre-V16 with
      NO cover — and assertion (b) WAS VACUOUS as shipped: the blit-length
      law (byte_len == canvas_bytes >= 153,600 B) could never pass the
      64-B harness buffer, so the blit gate never opened in the cone while
      the harness header claimed it did. Fixed with the FORMAL-ONLY
      FORMAL_BLIT_LEN DUT parameter (absent outside `ifdef FORMAL); seven
      covers (pkt_valid_o, both gates, guard_req_o.valid, header-CRC fail,
      blit OK/bad-CRC) all reached at k = 9..14 of depth 24 (btormc).
      Scope guard a_scope_header_only_window added (V19, commit bc707dd,
      re-run green 2026-08-16): pins depth 24 to the 40/64-B staging
      shrink it depends on. Observed RED at depth 32 with the CEX at
      k = 25 — exactly one step past the proven bound.
      RE-RUN at bb13352 (W2.7 write-data seam fix, state M_BLIT_DATA in
      the cone): bmc + cover green via formal_cmd_dma_crc_gate, 7/7 cover
      traces produced at depth 24 — the beat stream fits the window
      because the shrunk FORMAL_BLIT_LEN=64 blit streams its 8 beats
      inside the same commit episode the old single-cycle advance used.

