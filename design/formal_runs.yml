      the harness is combinational with unconstrained inputs, and free
      (v, B) with v a u8 and B in [0,15] is EVERY input the block can be
      handed — the working colour channel is a u8 and the 4×4 Bayer matrix's
      entries are exactly 0..15 — so all 4,096 inputs per parameter set are
      covered with no reachability gap. Recorded as an explicit
      "# SCOPE-TOTAL:" waiver (V19) because there is no horizon for a scope
      guard to assert. Eight covers, all reached: both ends of both
      channels' ranges, full white landing on the rail in both, the 5-bit
      channels' top-of-range (documenting that their clamp is
      belt-and-braces — their numerator maxes at 8,153 < 32·255 = 8,160),
