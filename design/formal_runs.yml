# design/formal_runs.yml — the formal-lane run registry.
#
# WHY THIS FILE EXISTS
# Twice in wave 2 a block's maturity rested on a formal property that had
# NEVER BEEN ELABORATED. MEM.GUARD's ledger entry said "Formally proven."
# while the proof failed and its assertions were vacuous; MEM.VRAM.ARBITER
# carried RTL_VERIFIED citing a liveness bound that FAILS when actually run.
# Both survived because the lane could not tell "skipped because the tool is
# absent" from "never ran at all" — a `.sby` that had never parsed produced a
# green SKIP, indistinguishable from a healthy machine without oss-cad-suite.
#
# So: a `.sby` existing is not evidence. A block may cite `tests.formal:` as
# maturity evidence only if THIS file records a green run for it. Rule V16 in
# tools/ledger enforces that (npm run ledger:check / CTest ledger_check), and
# it also fails when a `.sby` appears on disk with no entry here at all —
# adding a property without running it is now a build failure, not a SKIP.
#
# status:
#   green     — the lane ran it and every task reached its `expect`, INCLUDING
#               a cover task (assertions proven reachable, not vacuous).
#               Only `green` may back a maturity claim.
#   banked    — deliberately excluded from the automated lane, with measured
#               reasons recorded. May NOT back a maturity claim; the citing
#               block must be SPECIFIED (typically blocked_on: hardware).
#   never_ran — the property exists but has never successfully elaborated.
#               HARD FAILURE the moment anything cites it. Never a SKIP.
#
# `tasks` lists the sby tasks that were run; `covers: true` asserts at least
# one of them is a cover task. `commit` pins the evidence, like maturity_log.
#
# SCOPE GUARDS (ledger rule V19). A bounded (mode bmc) proof states its laws
# only up to its depth, and the depth's MEANING rests on structural facts of
# the harness (refresh-free horizon, frame-constant map, shrunk buffers, an
# abstract raster period). Every `.sby` with a bmc task must therefore carry
# a SELF-ASSERTING scope guard — an `a_scope_*` / `a_horizon_*` assertion in
# the proof's own cone that states that structural fact and FIRES if anyone
# raises the depth past what was actually proven (the pattern that worked:
# the arbiter's a_horizon_is_refresh_free, the linebuf's
# a_scope_four_sessions) — or an explicit `# SCOPE-TOTAL: <reason>` waiver
# in the .sby asserting the bound covers the full reachable state space.
# Unbounded (mode prove) tasks are exempt. Enforced by `npm run
# ledger:check` (rule V19; V17 = citation coherence, V18 is reserved for
# the sim-lane run registry).

