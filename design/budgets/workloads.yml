# design/budgets/workloads.yml -- executable demand, per block.
#
# WHY THIS FILE EXISTS
# ====================
# `docs/OWNER_DOCKET.md` (2026-08-23): "Capacity is generated, not asserted."
#
#     capacity = min(measured_fmax, target_clock) x frame_seconds / measured_II
#
# Every DSP reduction landed so far came from one calculation -- sustained
# demand per frame against the frame budget -- and every block that was
# over-provisioned was over-provisioned because nobody had done it. A block
# with no row here gets the debt flag `NO_WORKLOAD` in
# `reports/BUDGET_HEATMAP.md`, which is the honest state, not an omission.
#
# THE FRAME BUDGET, AND THE NUMBER THAT IS NOT IT
# ===============================================
# `design/budgets/latency.md` lines 63-78:
#
#   compute budget                       1,666,667 clocks/frame (100 MHz, 60 Hz)
#   frame_gpu_cycles, Z60                  251,520 -- the VIDEO/DEADLINE period,
#                                                     2 x h_total x v_total
#
# Summing per-block cost against 251,520 is wrong by 6.6x. That mistake is
# recorded in latency.md because it was made.
#
# EVERY NUMBER BELOW IS TRANSCRIBED, NOT INVENTED
# ===============================================
# Each row carries `source`. The three figures marked `derived` come from the
# owner's read-only survey of `sacengine` and the retail Sacrifice install, are
# recorded in full in `docs/OWNER_DOCKET.md`, and the docket says of them:
# "They are derived, not ruled -- overturn on sight."

schemaVersion: 1

frame:
  targetClockHz: 100000000
  frameRateHz: 60
  # 100e6 / 60, rounded down. THE COMPUTE BUDGET.
  computeClocksPerFrame: 1666667
  # 2 x h_total x v_total for Z60. THE VIDEO DEADLINE. Not a compute budget.
  videoClocksPerFrameZ60: 251520
  note: >-
    Cost a block against computeClocksPerFrame. videoClocksPerFrameZ60 is the
    scanout period and answers a different question.

blocks:

  zhao_texture_tmu:
    unit: samples
    # ------------------------------------------------------------------------
    # 850,000 WAS DERIVED WRONG, AND IS KEPT ONLY AS A SYNTHETIC STRESS PROFILE.
    # ------------------------------------------------------------------------
    # The old figure was 92,160 px x 3.0 overdraw x THREE TEXTURE LAYERS, and
    # the third multiplier came from docs/OWNER_DOCKET.md quoting Sacrifice's
    # layered map format (`sacmap.d:136-174`, tile + detail + lightmap).
    # Zhaozhou does not do that: charter 26 rules ONE primary detail sample,
    # reference/src/zrender/rast.cpp says "ONE primary sample" in the shipping
    # terrain branch, and zhao_raster_fragment has exactly one texel port.
    #
    # But 276,480 -- terrain alone -- is NOT the console's demand either. The
    # sampler also serves the sky backdrop, the stars and the cloud sheet, and
    # then creatures, giants, objects and beams on 8 km maps.
    #
    # A SINGLE `itemsPerFrame` AND A SINGLE `requiredII` CANNOT DESCRIBE THIS
    # BLOCK. It does heterogeneous work over independent resources: a CLUT8
    # nearest sample uses the cache port and the palette RAM and no multiplier
    # at all, while an ARGB4444 bilinear sample uses four cache lanes and four
    # filter channel jobs. The floor is the resource that REFUSES, not the sum
    # of the work -- which is the lesson the Field engine paid six sweep rounds
    # to learn. So the model below is a vector, and the derived floor is a max
    # over resources rather than a division of one total.
    profiles:
      ratified_known_z60:
        confidence: derived
        source: >-
          spec sky_and_beams 1.1 (full-canvas backdrop, ~45,000 cloud
          fragments), spec stars 1 (up to 128,000 star fragments at Z60),
          terrain at 384x240 x 3.0 overdraw x ONE primary sample.
          EXCLUDES creatures, giants, objects, beams and cache misses.
        clut8_nearest:
          terrain: 276480
          sky_backdrop: 92160
          stars: 128000
          subtotal: 496640
        argb4444_bilinear:
          clouds: 45000
        total_samples: 541640
      synthetic_850k_mixed:
        confidence: synthetic
        source: >-
          The old ruled figure, RETAINED DELIBERATELY as a whole-frame
          robustness target with a deliberately filter-heavy mode mix. It is
          NOT terrain demand and must never again be quoted as one.
        total_samples: 850000
      trace_derived:
        confidence: unmeasured
        source: >-
          To be produced by instrumenting ZRef after Early-Z and serialising
          the actual primary-TMU request stream: terrain+sky, maximum stars,
          creature army, giant near camera, beams/storm, Duo, adversarial
          cache thrash. Until these exist the mode mix is an estimate.
    # Per-frame resource demand, derived from a profile's mode counts:
    #   cache_accesses      = every sample (one access each)
    #   palette_reads       = every CLUT8 sample
    #   filter_channel_jobs = 3 * RGB565_bilinear + 4 * ARGB4444_bilinear
    #   output_samples      = every sample
    # Hit-path floor = max(cache_accesses, palette_reads,
    #                      ceil(filter_channel_jobs / FILTER_LANES),
    #                      output_samples)
    # then plus MEASURED fill stalls, queue pressure, ordering bubbles and
    # pipeline drain. On ratified_known_z60 with FILTER_LANES=1 that is
    # max(541,640, 496,640, 180,000, 541,640) = 541,640 -- the cache port and
    # the output port, and NOT the filter.
    resourceModel:
      cacheAccessesPerFrame: 541640
      paletteReadsPerFrame: 496640
      filterChannelJobsPerFrame: 180000
      outputSamplesPerFrame: 541640
      hitPathFloorClocks: 541640
      budgetClocks: 1666667
      reserveTargetClocks: 1333333   # 20% reserve; the gate, not the budget
    measuredII:
      clut8_nearest: 5
      direct_nearest: 5
      direct_bilinear: 5
    measuredIISource: >-
      texture_tmu_directed after commit 9059eeb (resident palette): CLUT fell
      from 6 clocks a sample to 5 because the second, dependent texture-cache
      access for the palette entry is gone. All three paths are still limited
      by the one-request-at-a-time FSM, which accepts only in ST_IDLE.
    requiredII:
      clut8_nearest: 1
      direct_nearest: 1
      filter_channel_per_lane: 1
      cache_hit_access: 1
      ordered_output: 1
    requiredIISource: >-
      TEXTURE.TMU v2 respec, 2026-08-30. The dominant nearest path takes one
      request per clock because the cache already supports it and pipelining is
      required for 100 MHz regardless; the much smaller bilinear workload gets a
      separately sized filter lane. A universal all-bilinear 850,000 machine is
      explicitly NOT required.
    reserve: 0.20

  zhao_surface_stamp:
    unit: texels
    itemsPerFrame: 20000
    confidence: derived
    source: >-
      docs/OWNER_DOCKET.md 2026-08-23: heavy-barrage measurement is ~6,000
      texels/frame; 20,000 is 3x that as the ruled demand.
    measuredII: null
    requiredII: 1
    reserve: 0.20

  zhao_terrain_normals:
    unit: normals
    itemsPerFrame: 2000
    confidence: derived
    source: >-
      docs/OWNER_DOCKET.md 2026-08-23: 10 deform events/s x 25 vertices is 4.2
      normals/frame; rebuilding the entire 65,536-vertex field once per second
      is 1,092. 2,000 is the ruled demand, generous against both.
    measuredII: 7
    # 833, not 1. The contract asks for "1 normal per vertex per clock", which
    # is a one-clock PLACEHOLDER of the kind that produced a 327-DSP design --
    # it says nothing about how many normals a frame needs. Derived instead:
    # 1,666,667 clocks / 2,000 normals = 833 clocks available per normal. At the
    # measured II of 7 this block has 119x headroom.
    #
    # NOTE: nothing in tools/ reads `requiredII` -- it is a dead field in all
    # seven entries, exactly as `verticesPerItem` was before it was removed.
    # Corrected here rather than deleted, because `requiredII: 1` sitting beside
    # `measuredII: 7` reads as a violation to a human even though no tool checks
    # it. The other six entries should be audited when someone owns that field.
    requiredII: 833
    reserve: 0.20

  zhao_terrain_project:
    # CORRECTED 2026-08-24. This entry previously read `unit: patches,
    # itemsPerFrame: 270, confidence: ruled`, and every part of that was wrong
    # in the same way: 270 was DERIVED IN TERRAIN.PROJECT.md:198 AS A CAPACITY,
    # by dividing the 1,666,667-clock frame by the 6,144-clock cost of a patch.
    # It was a capacity filed as a demand.
    #
    # The tool computes capacity in PROJECTIONS and divided it by a demand in
    # PATCHES, so it compared the block against itself and reported roughly
    # 6,173x over-provisioned -- ranking the most saturated block in the design
    # as the most wasteful one. The true ratio is about 1.0.
    #
    # `verticesPerItem: 3` was also read by nothing, and wrong: a 33x33 patch
    # is 2,048 triangles x 3 corners = 6,144 projections, not 3.
    #
    # The real demand comes from the visible-patch budget instead:
    # spec/terrain_rules.md:322 -- "256 live/visible patches".
    #   256 patches x 6,144 projections = 1,572,864 projections/frame
    #                                   = 94.4% of the compute frame.
    # The block is SATURATED, not over-provisioned. Nothing in the terrain path
    # has headroom until the projected-vertex cache lands, which takes a patch
    # from 6,144 projections to its 1,089 unique lattice vertices:
    #   256 x 1,089 = 278,784 = 16.7% of a frame, a 5.6x reduction.
    unit: projections
    itemsPerFrame: 1572864
    confidence: derived
    source: >-
      spec/terrain_rules.md:322 gives 256 live/visible patches; each 33x33 patch
      projects triangle CORNERS, so 2,048 triangles x 3 = 6,144 projections
      (TERRAIN.PROJECT.md:198). 256 x 6,144 = 1,572,864 projections/frame,
      94.4% of the 1,666,667-clock compute budget. NOT a ruled figure and NOT a
      capacity: it is the visible-patch budget times the measured per-patch cost.
    measuredII: null
    requiredII: 1
    reserve: 0.20

  zhao_geom_cull:
    unit: evaluations
    # One evaluation per five clocks against the compute budget.
    itemsPerFrame: 333333
    confidence: ruled
    source: >-
      docs/OWNER_DOCKET.md 2026-08-23: "one evaluation per five clocks".
      1,666,667 / 5 = 333,333.
    measuredII: null
    requiredII: 5
    reserve: 0.20

  zhao_geom_skin:
    unit: vertices
    itemsPerFrame: 120000
    confidence: ruled
    source: >-
      The 120,000 weighted vertices/frame ruling, independently corroborated in
      docs/OWNER_DOCKET.md 2026-08-23 across 93 retail creature models (median
      2,951 vertices; a defensible scene is 40-60 skinned characters, so
      40 x 2,951 = 118,040).
    measuredII: null
    requiredII: 1
    reserve: 0.20

  zhao_geom_project:
    unit: vertices
    itemsPerFrame: 120000
    confidence: inherited
    source: >-
      Same population as zhao_geom_skin -- this is the projector the skinned
      and warped vertices reach the screen through, per its own header. NOT a
      separately derived figure, and it is the number that makes the duplication
      with zhao_terrain_project expensive: 120,000 vertices at one per clock is
      7.2% of the frame, so a SHARED projector is affordable and two are not
      justified by rate.
    measuredII: null
    requiredII: 1
    reserve: 0.20

# ---------------------------------------------------------------------------
# NO DEMAND FIGURE. Listed rather than omitted, because a missing row and an
# unanswered question look identical in a generated report otherwise.
# ---------------------------------------------------------------------------
unruled:
  - module: zhao_geom_binner
    note: >-
      docs/OWNER_DOCKET.md records "per-triangle costs plus hard caps
      (TRI_CAP 128, CHUNKS 256)" but no items/frame. The caps bound the arena,
      not the rate.
  - module: zhao_geom_pose_decode
    note: >-
      The pose path has no derived invocation count. It is the block the docket
      predicts hides 14-18 DSPs, so this is the demand figure most worth
      deriving next.
  - module: zhao_field_seq
    note: >-
      Needs DISTRIBUTIONS, not a scalar -- opcode mix per profile across Earth,
      Warp, Flow, Formation and Stamp, summed against 1,666,667. The docket's
      worked example (120,000 warped vertices x 8 instructions x 8 clocks =
      7,680,000 clocks, i.e. 4.6x the whole frame) is why one scalar cannot
      express it.
  - module: zhao_terrain_tess
  - module: zhao_terrain_patch
  - module: zhao_terrain_velocity
  - module: zhao_terrain_bake
  - module: zhao_raster_edgewalk
  - module: zhao_raster_fragment
  - module: zhao_raster_tile_pipe
  - module: zhao_geom_bin_pipe
  - module: zhao_forge_cliff
