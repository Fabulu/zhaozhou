# THE CONSOLE INVENTORY -- what is allowed to be in zhao_console_core.
#
# Owner, 2026-09-19: "we need a big inventory about what actually gets to be
# in the console and a hard gate to exclude the stuff that doesn't go in."
#
# THIS FILE HOLDS ONLY WHAT CANNOT BE DERIVED. Membership itself is computed:
# a module REACHABLE from zhao_console_core by instantiation is in the console
# and needs no entry here. This file says why everything ELSE is out.
#
# Enforced by tools/quartus/check_console_inventory.py. A new .sv with no
# disposition FAILS the gate, so nothing drifts in unclassified.
#
# GENERATED FIRST PASS 2026-09-19 by deriving each disposition from the tree;
# every `why` states the EVIDENCE used, not a guess dressed as a fact. Where a
# derivation is wrong, correct the entry -- that is what it is for.
#
# pending_compose is A WORK LIST, not an excuse: it means the block belongs in
# the console and is not wired yet.

modules:
  zhao_console_board:
    disposition: top
    why: "THE SECOND ROOT. Not composed into the console because it CONTAINS the console: since 2026-09-19 it instantiates zhao_console_core and drives it from zhao_sys_pll and zhao_sys_reset, so it is the top that could be programmed onto hardware. check_console_inventory.py walks it as a root in its own right, and this entry is what ties that walk to a decision somebody wrote down -- the gate fails if this line stops saying `top`, and fails differently if the module stops instantiating the core."
  zhao_measure_starve:
    disposition: pending_compose
    why: "MEASURE.GOVERNOR's starvation verdict: the latch zhao_console_core.sv's I18 entry names in so many words -- 'TOKENS' den_* is a one-cycle REGISTERED denial while the governor wants a per-frame per-view verdict: the latch between them is state, and state belongs in a file with a contract and a test'. Its PRODUCER is real and composed (zhao_measure_tokens, zhao_console_core.sv:11788) and its reason classification is lifted from that block's own REASON_LOW_PRIORITY/REASON_EXHAUSTED/REASON_RELOAD encoding rather than chosen. 70 checks in measure_starve_directed; the STARVE_REASON_MASK elaboration guard is fired by measure_starve_mask_guard with its own wrapper negative control. It is NOT composed because its CONSUMER, zhao_measure_governor, cannot be composed: the governor's OUTPUT side has no composed consumer (cam*_scale_o wants TERRAIN.LOD and cam*_thresh_q8_o wants zhao_geom_lodstate, both uncomposed), so wiring the governor in would close one register entry by opening another. See FINDINGS-post3.md."
  zhao_view_projq88:
    disposition: pending_compose
    why: "The per-camera projection scale in Q12.8 (20 bits, owner rulings R83/R98 -- it was Q8.8 in 16 until 2026-09-20, which saturated below 90 deg hfov single-view and below 53.13 deg on Duo) for MEASURE.GOVERNOR's proj0/1_i, DERIVED under owner ruling R73 (proj_Q8.8 = rhu(kx_raw * viewport_w / 512)) rather than added to the ABI. Its inputs are zhao_view_projscale's kx*_o/vw*_o; it is not a second implementation of zhao_geom_projradius, which computes kx*R*vw/(2w) -- a projected radius with the bound radius and perspective w inside it -- and never emits the camera factor alone. Verified against design/contracts/MEASURE.GOVERNOR.md line 75's hand-worked Duo camera (221.70 px, Q8.8 raw 56755) to within the LSB its text truncated. 24 checks in view_projq88_directed (it was 19 before the R83 widening). Not composed for the same reason as zhao_measure_starve, and it additionally depends on I14's still-open half: the viewport rect at projector cfg address 17 has no CMD producer. The Q8.8 port width FINDINGS-post3.md raised as a decision was ruled (R83) and landed 2026-09-20 in BOTH ports plus a third site R98 did not name, zref::measure::GovernorCamera::proj, which was a uint16_t and would have TRUNCATED a 20-bit stimulus rather than saturating it. 24 checks in view_projq88_directed, including a positive control that still fires the saturation counter on an extreme kx."
  zhao_terrain_devstore:
    disposition: pending_compose
    why: "TERRAIN.LOD's per-page deviation and history store (owner rulings R24 and R59), built and tested by terrain_lodpath_directed. It is not composed because its CONSUMER, zhao_terrain_lod, cannot be composed: TERRAIN.LOD's cam0/cam1 eye positions are x16 world units (design/contracts/TERRAIN.LOD.md line 64) and NO RATIFIED COMMAND CARRIES A CAMERA POSITION -- spec/commands.zidl's SetView 0x0010 carries view_projection, pixel_error and token counts and nothing else. Composing the store alone would add 160 M10K with no reader. See FINDINGS-terrain4.md, owner decision D1."

  zhao_view_eye:
    disposition: pending_compose
    why: "the two views' CAMERA POSITIONS (owner ruling R63), which is the producer half of the blocker the two entries above cite. SetView 0x0010 now carries fx16 eye[3] and zhao_cmd_exec commits it as steps 17/18/19 of the view walk onto projector configuration addresses 19/20/21; this block registers those three words per view and hands them out as the six fx16 wires zhao_terrain_lod's cam0_x_i..cam1_z_i want. It SNOOPS the bus rather than living inside zhao_project_core, because that leaf has seven instantiation sites and a committed mutant copy and not one of its readers wants an eye. Tested by cmd_exec_directed cases 22-24 (order, per-view routing, idempotence, and no write for a refused view_id) and by view_eye_directed. It is not composed because its consumer zhao_terrain_lod is not (core entry I21)."
