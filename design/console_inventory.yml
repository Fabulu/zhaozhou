  zhao_forge_cliff:
    disposition: superseded
    superseded_by: zhao_forge_cliff_ram
    why: "THE RIVALRY IS DECIDED AND THIS IS THE LOSING SIDE. Owner ruling R109 named the defect these two rows used to carry -- `zhao_forge_cliff_ram` is not a child of this module but a RIVAL implementation of one contract, and giving both the identical boilerplate `pending_compose` was 'not recording a decision, it is hiding that none was taken'. R109 said neither may compose until the deciding gate ran; it has now run twice on the target part `5CSEBA6U23I7`, same tool and same stage both times. F-CLIFF1 fitted the candidate at 976 ALM (18 Sep, owner ruling R117); F-CLIFF-GOLDEN fitted THIS module at 6,674 ALM (20 Sep, owner ruling R142). Fit minus fit: 6,674 / 4,025 registers against 976 / 939 -- 5,698 ALM and 3,086 registers saved for one extra RAM block and ~1.2k memory bits, DSP unchanged. That is 13.6% of the 41,910-ALM device, the largest single measured ALM lever the campaign has found. R117's two named adoption blockers are AMENDED AWAY by R142 because this module carries both in identical quantity -- four `Warning (276020)` RAM pass-through insertions and one inferred latch on `triangles_submitted_o` -- so neither is a cost of the swap; they are costs of the design in either implementation. THE ADOPTION IS EXECUTED HERE by the forge4 packet on 2026-09-20: R142 ruled it and nobody had performed it, which is CLAUDE.md's uncashed-cheque shape exactly (plan right, prerequisite built, measurement taken, last step never done). This file must never be composed. It is retained on disk for one reason and it is the same reason `zhao_terrain_bake` and `zhao_raster_attrdiv` are retained: it is the executable RTL side of tests/forge/forge_cliff_ram_differential.cpp, which drives oracle (zref::forge::rim_plan), golden and candidate in ONE process and compares all three ways -- bit-identical on 752 pages with every coverage counter nonzero -- plus its own directed and random suites, its standalone fit target and its receipts. SUPERSEDED IN PART, 2026-09-25 (CLIFFPROD). The paragraph that stood here said 'FORGE.CLIFF is still a gap. Neither implementation can be composed, because the capability has no producer for any of its three inputs -- no lattice-walking page ISSUER, no 34x34 solid-bit window and no vdist read master. Adoption decides WHICH module the console will compose when those exist; it does not compose one.' EVERY MEASUREMENT IN IT WAS RE-TAKEN AT THE CLIFFPROD BASE AND WAS STILL TRUE, and it UNDERCOUNTED BY ONE: there was no rim-edge CONSUMER either (`edge_ci_i`, `edge_side_i`, `rim_edge` -- zero hits as ports across fpga/rtl), which design/contracts/FORGE.CLIFF.md records as 'THE EMISSION STAGE IS NOT WRITTEN'. So three producers and one consumer were built -- zhao_forge_cliff_srvshare (one parameterised sharer, instantiated twice), zhao_forge_cliff_feed and zhao_forge_cliff_emit -- and zhao_forge_cliff_ram IS COMPOSED into zhao_console_core as u_forge_cliff, which is why its row has left this file. The completion register moved 11 -> 10 on it. The occupancy comes from layer D through the compose cache's own cell-state service and the wall vertices from its lattice service, so the ratified placement law is consumed rather than implemented twice; the emitted quads reach zhao_forge_assemble through a SECOND zhao_forge_jobarb instance, cascaded so that 'CLIENT A IS FORGE.PRIM AND IT WINS' is preserved exactly and the cliff sits below both. The ONE input still not produced is vdist, and that is recorded as a decision rather than a tie-off: CLIFF_VDIST_EN is 0, which is the reference's own null-vdist mode (terrain_rules 5: 'priority 0 everywhere', i.e. keep scan order), and the evaluator is MEASURED never to assert vd_en_o in it (forge_cliff_chain lane 6). THIS FILE'S ROW ABOUT THE GOLDEN IS OTHERWISE UNCHANGED: it is still the losing side of a decided rivalry and is still retained on disk as the executable RTL side of tests/forge/forge_cliff_ram_differential.cpp."
  zhao_forge_cliff_chain_fit_top:
    disposition: top
    why: "a top in its own right; not composed into the console. FORGE.CLIFF's composed subsystem shaped for ONE fit -- the two service sharers, the window feed, the adopted evaluator and the emission stage, wired exactly as zhao_console_core wires them, with the two compose-cache read services and the assembler-facing streams at the boundary and everything the console keeps internal internal here too. It exists to answer owner vacation directive 2026-09-23 section 6 -- recheck the timing in the APPLICABLE COMPOSED CONTEXT -- because a leaf fit turns every port into a virtual pin with a full I/O budget and therefore cannot see that CLIFF_VDIST_EN is 0, vd_addr_o has no load and vd_data_i is a constant. Hand written despite living in generated/, which is where this tree keeps fit wrappers; no .manifest.json because nothing generates it. NEVER A PRODUCTION ROOT."
