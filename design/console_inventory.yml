  # ---- SECONDARY MODULES INSIDE MULTI-MODULE FILES -----------------------
  # Five files in fpga/rtl declare more than one module, and that is exactly
  # what broke the first version of the gate: it took a module's name to be its
  # filename, so `zhao_raster_quant_fin` (the second module in
  # zhao_raster_quant.sv) read as a dead file, I removed it on the gate's say-so
  # and then added a source line for a .sv that does not exist. These entries
  # exist because modules are now scanned rather than inferred.
  shell_v2_top:
    disposition: instrument
    why: "generated shell-fit wrapper in fpga/rtl/generated; characterization only, never production"
  shell_v2_stimulus:
    disposition: instrument
    why: "the shell-fit instrument's stimulus bank; invents legal traffic, ships nothing"
  shell_v2_gpu_sink:
    disposition: instrument
    why: "gpu-domain capture bank of the shell-fit instrument"
  shell_v2_video_sink:
    disposition: instrument
    why: "video-domain capture bank of the shell-fit instrument"
  shell_v2_audio_sink:
    disposition: instrument
