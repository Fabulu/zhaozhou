# THE CONSOLE INVENTORY -- what is allowed to be in zhao_console_core.
#
# Owner, 2026-09-19: "we need a big inventory about what actually gets to be
# in the console and a hard gate to exclude the stuff that doesn't go in."
#
# THIS FILE HOLDS ONLY WHAT CANNOT BE DERIVED. Membership itself is computed:
# a module REACHABLE from zhao_console_core by instantiation is in the console
# and needs no entry here. This file says why everything ELSE is out.
#
# Enforced by tools/quartus/check_console_inventory.py. A new .sv with no
# disposition FAILS the gate, so nothing drifts in unclassified.
#
# GENERATED FIRST PASS 2026-09-19 by deriving each disposition from the tree;
# every `why` states the EVIDENCE used, not a guess dressed as a fact. Where a
# derivation is wrong, correct the entry -- that is what it is for.
#
# pending_compose is A WORK LIST, not an excuse: it means the block belongs in
# the console and is not wired yet.

modules:
  zhao_console_board:
    disposition: top
    why: "THE SECOND ROOT. Not composed into the console because it CONTAINS the console: since 2026-09-19 it instantiates zhao_console_core and drives it from zhao_sys_pll and zhao_sys_reset, so it is the top that could be programmed onto hardware. check_console_inventory.py walks it as a root in its own right, and this entry is what ties that walk to a decision somebody wrote down -- the gate fails if this line stops saying `top`, and fails differently if the module stops instantiating the core."
  zhao_measure_starve:
    disposition: pending_compose
    why: "MEASURE.GOVERNOR's starvation verdict: the latch zhao_console_core.sv's I18 entry names in so many words -- 'TOKENS' den_* is a one-cycle REGISTERED denial while the governor wants a per-frame per-view verdict: the latch between them is state, and state belongs in a file with a contract and a test'. Its PRODUCER is real and composed (zhao_measure_tokens, zhao_console_core.sv:11788) and its reason classification is lifted from that block's own REASON_LOW_PRIORITY/REASON_EXHAUSTED/REASON_RELOAD encoding rather than chosen. 70 checks in measure_starve_directed; the STARVE_REASON_MASK elaboration guard is fired by measure_starve_mask_guard with its own wrapper negative control. It is NOT composed because its CONSUMER, zhao_measure_governor, cannot be composed: the governor's OUTPUT side has no composed consumer (cam*_scale_o wants TERRAIN.LOD and cam*_thresh_q8_o wants zhao_geom_lodstate, both uncomposed), so wiring the governor in would close one register entry by opening another. See FINDINGS-post3.md."
  zhao_geom_bonesrc:
    disposition: pending_compose
    why: "GEOM.POSE's BONE SOURCE -- entry I29's producer, and owner decision D-GEOMSEAM-A's priced arrangement. It answers zhao_geom_pose_decode's COMBINATIONAL source fetch out of two SYNCHRONOUS stores behind a 2-deep prefetch, which is the whole point: owner ruling R90's amendment priced the obvious reading of that contract -- a ~17.6 kbit ASYNCHRONOUS-READ store -- and made the ALM number a precondition of building. MEASURED with quartus_map 17.0.2 on the TARGET device 5CSEBA6U23I7, standalone leaf, three SRC_STYLE arrangements from one source: the async-flat arrangement R90 described costs 14,056 ALM (33.5% of 41,910) with ZERO block memory and no MLAB inference, and the arrangement built costs 829 ALM (2.0%) with 10,240 block memory bits. 17.0x, and the rows attribute it -- deriving inv_rest is worth 7,616 ALM and making the read synchronous a further 5,611. R90's BIT COUNT WAS RIGHT (17,665 registers against its 17,568 plus 97 of control); what was unpriced is that a 32-deep multiplexer over 549 bits costs MORE than the storage. The decoder DID NOT CHANGE -- not one port -- so R90's fallback of moving its combinational contract is not needed. EVIDENCE: 6 cases in geom_bonesrc_directed, which holds the REAL zhao_geom_pose_decode rather than a stub because the claim is about the join, and every palette element equals zref::creature::decode_pose; bone_prefetch_late_o is unreachable by legal stimulus and fires under the committed mutant (4 events, 53 palette elements wrong), with cases 3 and 4 as its negative control. It is NOT composed because R90's item 3 is only half done. CORRECTED 2026-09-21 (POSEREAD), because this sentence said the page reader 'does not exist yet' and that is no longer true: zhao_geom_clipread is built, differenced against zref::creature_page::body and zref::clip_page over 443 checks, and asserts the very late-fetch law this block's committed mutant states. What is still missing is the sixth u_geom_mem_adapter requester (an in-core edit, zhao_mem_share_n N=5 -> 6) and a CORRECT source for the pose REQUEST -- form -> clip bank is unruled, and at the single-resident tier wiring the draw straight through would assert 'the resident bank is this draw's bank', which is the wrong-creature-with-every-counter-green failure this tree refuses hardest. DELETE THIS ENTRY when that ruling lands and the core composes the pair."
  zhao_geom_clipread:
    disposition: pending_compose
    why: "GEOM.POSE's kind-8 BODY and kind-9 CLIP FRAME page reader -- entry I29's CONSUMER, the thing that FILLS zhao_geom_bonesrc. Packet POSECMD stopped short of it on the grounds that ZHAOZHOU_ANIMATION_HPS_RESIDENCY_ARCHITECTURE.md 4.2's resident-handle layer had no ruling; MEASURED 2026-09-21 and it has one, sixteen days newer than that document. spec/memory_rules.md 5f.1 freezes {index:24} -> {slot:8, base:32, extent:32, kind:8} plus MEM.UPLOAD's own 16-bit generation for every resource published under a handle32, and FOUR blocks already carry that shape: zhao_mem_upload's publish_* is the producer and IS COMPOSED, zhao_geom_drawjob's dir_* is a consumer and IS COMPOSED and is driven from exactly those ports, and zhao_material_resolve's dir_* and zhao_geom_ladderbank's pub_* are consumers that are BUILT AND NOT COMPOSED. One composed producer, one composed consumer; this block is the fifth instance of one rule. The EPOCH is deliberately not on the port: zhao_mem_upload consumes it at publication (req_epoch_i != cfg_epoch_i -> V_EPOCH_STALE) and a refusal never reaches publish_valid_o, so a row with a dead epoch cannot exist to be read -- which is why 5f.1's field list has none. EVIDENCE: 443 checks in geom_clipread_directed, every page built by the REFERENCE so the RTL reads bytes no RTL wrote; the exact read count asserted, because re-reading a line is invisible to any content check; both committed goldens read by the RTL and their bone counts asserted to AGREE; bone_mismatch_o fired by a 6-bone skeleton under an 8-bone page with the matched pair as its negative control (R95); and the FILL-WHOLE-THEN-ASK law asserted directly -- zero reads and zero fills after src_req_o, with the handover asserted separately so neither is vacuous. The CLIP_ROWS elaboration guard is fired by geom_clipread_elab_guard at -GCLIP_ROWS=65 under WILL_FAIL, because --lint-only does not run initial blocks. NOT COMPOSED, and for a NAMED reason rather than the one POSECMD gave: the pose REQUEST has no correct source. form -> clip bank is unruled -- zref::creature_page::Record keys each kind-8 ladder row by form_index, but zref::clip_page's header is {magic, version, bone_count, clip_count, dir_off, frames_off} and carries no form index, no creature-type key and no handle at all. At the single-resident tier the draw could be wired straight through, and that would silently assert 'the resident bank is this draw's bank' -- a well-formed palette for the wrong animal with every counter green. Composing the pair is also a SUBSYSTEM boundary (bonesrc's 830 ALM + 10,240 M10K, a sixth mem-adapter requester, and ~15 core boundary ports retired) and therefore owes a fit. See FINDINGS-poseread.md."
  zhao_view_projq88:
    disposition: pending_compose
    why: "The per-camera projection scale in Q12.8 (20 bits, owner rulings R83/R98 -- it was Q8.8 in 16 until 2026-09-20, which saturated below 90 deg hfov single-view and below 53.13 deg on Duo) for MEASURE.GOVERNOR's proj0/1_i, DERIVED under owner ruling R73 (proj_Q8.8 = rhu(kx_raw * viewport_w / 512)) rather than added to the ABI. Its inputs are zhao_view_projscale's kx*_o/vw*_o; it is not a second implementation of zhao_geom_projradius, which computes kx*R*vw/(2w) -- a projected radius with the bound radius and perspective w inside it -- and never emits the camera factor alone. Verified against design/contracts/MEASURE.GOVERNOR.md line 75's hand-worked Duo camera (221.70 px, Q8.8 raw 56755) to within the LSB its text truncated. 24 checks in view_projq88_directed (it was 19 before the R83 widening). Not composed for the same reason as zhao_measure_starve, and it additionally depends on I14's still-open half: the viewport rect at projector cfg address 17 has no CMD producer. The Q8.8 port width FINDINGS-post3.md raised as a decision was ruled (R83) and landed 2026-09-20 in BOTH ports plus a third site R98 did not name, zref::measure::GovernorCamera::proj, which was a uint16_t and would have TRUNCATED a 20-bit stimulus rather than saturating it. 24 checks in view_projq88_directed, including a positive control that still fires the saturation counter on an extreme kx."
  zhao_terrain_field_walk:
    disposition: pending_compose
    why: "THE EARTH LATTICE WALKER, promoted 2026-09-20 by packet E1 from fpga/rtl/synth/zhao_probe_walk_earth.sv under owner ruling R44 ('promote zhao_probe_walk_earth/zhao_probe_patch_acc out of fpga/rtl/synth/ to production names and homes, as FIELD v3 was, rather than rebuilding them') and the owner directive's FH18/sections 13.1-13.4. NO LOGIC CHANGED IN THE PROMOTION COMMIT -- module name, header and home only -- so the diff against the probe's final revision is itself the evidence that behaviour is unchanged, and tests/differential/field_walk_earth_directed.cpp is the SAME test against the SAME expectations. EVIDENCE: 23 checks in field_walk_earth_directed on the default path, plus field_walk_earth_random; 17 mutants caught and 1 proven equivalent by tools/sweep_field_walk_earth_mutants.py. WHY THIS ENTRY EXISTS AT ALL: its previous disposition was `instrument` ('synthesis probe under fpga/rtl/synth; measures, never ships'), and `instrument` is a SETTLED disposition, so tools/budget/uncashed_cheques.py could never flag it -- the inventory was suppressing the exact cheque R44 wrote, which is why a finished, differentially tested, mutation-swept engine sat unseen while the owner's 2,655-line directive commissioned 'the field-major scheduler' as new work without naming the file once (`probe_walk` and `walk_earth` are both ZERO hits in it). It is NOT composed because the console boundary is packet C1's serialised act: closing I34 needs velocity/material/nav channels that zhao_terrain_patch.sv:154-156 does not have, and section 20.8 forbids closing it by wiring only height. DELETE THIS ENTRY when C1 composes the Earth datapath."
