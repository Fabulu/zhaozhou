  zhao_surface_sheetshare:
    disposition: pending_compose
    why: "zhao_surface_sheet's two-client request share, built 2026-09-21. zhao_console_core.sv entry I32 says a second requester on that single req_* port needs a scheduler and that a mux written inline in a composer is an arbiter nobody can point at; this is that file. Round robin, one last_q flip-flop, adopted from zhao_terrain_psmux rather than re-decided, with both priority orders rejected in the header WITH their numbers. It is NOT composed for the same reason zhao_terrain_sheetseam is not: its second client is the bake reader, and TERRAIN.BAKE is not in the console. It is NOT a second owner of a capability and has no design/blocks.yml row of its own -- psmux's precedent exactly. DELETE THIS ENTRY when TERRAIN.BAKE composes."
  zhao_terrain_sheetseam:
    disposition: pending_compose
    why: "the layer-F read path for TERRAIN.BAKE's per-vertex depth mode, built 2026-09-21 against design/contracts/TERRAIN.SHEETSEAM.md and owner rulings R194 and R221. It prefetches the 1,089 texels the 33x33 lattice can address into one M10K and answers bake's sheet_strength_i from it, and on ST_MISS it drops cmd_depth_sheet_i so the record digs the RATIFIED parametric disc and counts the fallback (R221). EVIDENCE: 81 checks in sheetseam_rtl_directed against the REAL zhao_surface_sheet, with all nine counters asserted silent on the clean path and then fired by stimulus, and the R221 checks themselves fired by a scratchpad mutant that ignores pg_status_i -- 12 failures across three independent cases while the happy path still passed, which is the shape of the defect. It is NOT composed because its consumer zhao_terrain_bake_v2 is not composed and bake's cmd_* record port still has no producer; job_handle_i has no producer for the same reason. Wiring it alone would connect a port to a block nothing drives. DELETE THIS ENTRY when TERRAIN.BAKE composes."
  zhao_terrain_pageio:
    disposition: pending_compose
    why: "TERRAIN.BAKE's page window, built 2026-09-21 against design/contracts/TERRAIN.PAGEIO.md and owner ruling R210. It serves the FOUR zhao_terrain_bake_v2 page ports nothing in the machine served: the layer-D reads behind vtx_nobake_i and cell_state_i (layer D at page offset 6,598 had ZERO readers anywhere under fpga/) and the layer-B and layer-D writebacks on sc_* and cs_* (no writer at all). EVIDENCE: 79 checks in pageio_rtl_directed, including layers A, C and E asserted BYTE-IDENTICAL after a bake -- the acceptance test for the read-modify-write the guard's be_ok forces -- and nb_o checked against zref::terrain::nobake_corner_shadow on all 1,089 vertices. All five fault counters are asserted silent on the clean bake and then FIRED by stimulus. The A/C/E detector was itself fired by a scratchpad mutant that skips the two layer-B edge reads: it reported exactly 2 bytes of A and 60 of C, the counts the layout predicts. It is NOT composed because its CONSUMER, zhao_terrain_bake_v2, is not composed, and bake cannot be composed by this packet: its cmd_* record port has no producer (zhao_terrain_cmd emits a patch-DIRECTORY record, not a bake record) and its sheet_texel_o/sheet_strength_i need an arbiter between SURFACE.STAMP and the bake reader on zhao_surface_sheet's single request port -- which is a POLICY DECISION, not a wire, and is refused here rather than taken quietly. Wiring this block alone would close one register entry by opening nothing. DELETE THIS ENTRY when TERRAIN.BAKE composes."
  zhao_terrain_tapshare:
    disposition: pending_compose
    why: "THE ARBITER FOR zhao_terrain_heighttap'S ONE REQUESTER PORT, built 2026-09-21 (SHADOWSUB) because design/contracts/FORGE.SHADOW.md marked that port group the ONE genuinely clear thing in the FORGE.SHADOW subsystem and it is not. The tap has EXACTLY ONE requester group -- req_valid_i/req_ready_o/req_x_i/req_z_i/req_surface_i -- and in zhao_console_core.sv every wire of it is already driven by u_part_terrain_tap. The contract had read a claim about port SHAPE ('mirrors these ports signal for signal') as a claim about port AVAILABILITY, which is owner ruling R180 in a different coat. This is the same shape zhao_terrain_pageio's entry records for zhao_surface_sheet's single request port. THE HARD PART IS THAT THE RESPONSE CARRIES NO TAG AND NO RIDER: rsp_valid_o and eighteen data outputs arrive with nothing saying whose request they answer, so unlike every other shared service here the routing cannot be by rider and this block holds the owner itself. That is ONE register, not a queue, and the licence is measured rather than assumed -- zhao_terrain_heighttap's `assign req_ready_o = (st_q == S_IDLE)` makes it strictly single-in-flight. SINGLE_FLIGHT_ONLY is a parameter that records the premise and $fatal-guards it. The response DATA is broadcast rather than muxed N ways (18 x 32 bits x N of multiplexer for a value only one client can want), so a client must not latch the bus on a cycle its own r_rsp_valid_o bit is low -- stated here because it is a contract, not an implementation detail. EVIDENCE: 97 checks in terrain_tapshare_directed, whose discriminating case is client 0 outstanding across a SIX-CYCLE walk WHILE CLIENT 1 IS ASSERTING VALID -- an arbiter routing by 'who is asking now' answers the wrong client and every other check still passes. grants and contended are asserted moved (20 contended rounds, grants alternating exactly, the N-1 bound exercised rather than claimed); stray_rsp_o is the NEGATIVE control at zero and its positive control is the committed copy tests/mutants/zhao_terrain_tapshare_mutant.sv, which clears the owner one cycle after the grant and makes the answer reach nobody. THE DIRECTED TEST FOUND A REAL DEFECT IN THE FIRST VERSION OF THIS BLOCK: it could not grant on the cycle an owner retired, so every tap cost a dead cycle -- about 8% of the tap's thirteen-state walk, paid on every height tap the console ever makes. Nothing but that check would have seen it. It is NOT composed because its second client, zhao_forge_shadow, is not composed, and composing this block alone would put an arbiter in front of a port that has one user -- a cost with no capability. DELETE THIS ENTRY when FORGE.SHADOW composes."
