    why: "THE RIVALRY IS DECIDED AND THIS IS THE LOSING SIDE. Owner ruling R109 named the defect these two rows used to carry -- `zhao_forge_cliff_ram` is not a child of this module but a RIVAL implementation of one contract, and giving both the identical boilerplate `pending_compose` was 'not recording a decision, it is hiding that none was taken'. R109 said neither may compose until the deciding gate ran; it has now run twice on the target part `5CSEBA6U23I7`, same tool and same stage both times. F-CLIFF1 fitted the candidate at 976 ALM (18 Sep, owner ruling R117); F-CLIFF-GOLDEN fitted THIS module at 6,674 ALM (20 Sep, owner ruling R142). Fit minus fit: 6,674 / 4,025 registers against 976 / 939 -- 5,698 ALM and 3,086 registers saved for one extra RAM block and ~1.2k memory bits, DSP unchanged. That is 13.6% of the 41,910-ALM device, the largest single measured ALM lever the campaign has found. R117's two named adoption blockers are AMENDED AWAY by R142 because this module carries both in identical quantity -- four `Warning (276020)` RAM pass-through insertions and one inferred latch on `triangles_submitted_o` -- so neither is a cost of the swap; they are costs of the design in either implementation. THE ADOPTION IS EXECUTED HERE by the forge4 packet on 2026-09-20: R142 ruled it and nobody had performed it, which is CLAUDE.md's uncashed-cheque shape exactly (plan right, prerequisite built, measurement taken, last step never done). This file must never be composed. It is retained on disk for one reason and it is the same reason `zhao_terrain_bake` and `zhao_raster_attrdiv` are retained: it is the executable RTL side of tests/forge/forge_cliff_ram_differential.cpp, which drives oracle (zref::forge::rim_plan), golden and candidate in ONE process and compares all three ways -- bit-identical on 752 pages with every coverage counter nonzero -- plus its own directed and random suites, its standalone fit target and its receipts. NOTE WHAT THIS DOES NOT DO: FORGE.CLIFF is still a gap. Neither implementation can be composed, because the capability has no producer for any of its three inputs -- no lattice-walking page ISSUER, no 34x34 solid-bit window (`solid\\w*_o` as an output port across every subdirectory of fpga/rtl including synth/ and the probes: ZERO hits, re-measured 2026-09-20 by forge4) and no vdist read master (`vdist` occurs in four files and all four are the wrong end). Adoption decides WHICH module the console will compose when those exist; it does not compose one."
