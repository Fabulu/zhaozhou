# THE CONSOLE INVENTORY -- what is allowed to be in zhao_console_core.
#
# Owner, 2026-09-19: "we need a big inventory about what actually gets to be
# in the console and a hard gate to exclude the stuff that doesn't go in."
#
# THIS FILE HOLDS ONLY WHAT CANNOT BE DERIVED. Membership itself is computed:
# a module REACHABLE from zhao_console_core by instantiation is in the console
# and needs no entry here. This file says why everything ELSE is out.
#
# Enforced by tools/quartus/check_console_inventory.py. A new .sv with no
# disposition FAILS the gate, so nothing drifts in unclassified.
#
# GENERATED FIRST PASS 2026-09-19 by deriving each disposition from the tree;
# every `why` states the EVIDENCE used, not a guess dressed as a fact. Where a
# derivation is wrong, correct the entry -- that is what it is for.
#
# pending_compose is A WORK LIST, not an excuse: it means the block belongs in
# the console and is not wired yet.

