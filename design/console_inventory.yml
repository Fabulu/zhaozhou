# NO VERSION EXCEPTIONS. The console elaborates the latest version of every
# module it composes, which is the owner's ruling in his own words: "YOU ONLY
# GET TO FIT THE LATEST VERSION. IF IT IS BROKEN YOU FIX IT."
#
# THIS FILE CARRIED EXACTLY ONE EXCEPTION AND IT IS GONE. It named
# zhao_field_host, superseded by zhao_field_host_v2, and it was written by
# packet H1 as a WORK ITEM WITH A DELETION CONDITION rather than as a
# settlement -- "WHAT REMOVES THIS ENTRY: C1 composing zhao_field_host_v2 and
# regenerating gen_prod_top.py and gen_console_board.py ... if this entry is
# still here after C1 has landed, the composition did not happen and this file
# is the only thing that will say so."
#
# Packet C1 composed it on 2026-09-20. `zhao_console_core.sv` now instantiates
# zhao_field_host_v2 and nothing instantiates zhao_field_host outside tests/,
# where it is RETAINED as the named oracle (FH02) exactly as intended. The
# deletion of these lines is the evidence, and `completion_register.py`'s
# superseded check reading 0 is the measurement.
#
# IF YOU ADD ONE BACK, keep H1's shape: the reason on the SAME LINE as the
# name. The parser at check_console_inventory.py:153 matches
# `^  (\S+):\s*(.+)$` for this section while the modules section above wants a
# nested block, so a nested entry here registers as NOTHING -- silently, and
# the gate then goes on failing while the file looks as though it carries an
# exception. Owner ruling R147.