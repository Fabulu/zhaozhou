    why: "The W profile's STREAM ADAPTER, built 2026-09-20 as GEOM.WARP prerequisite P2. `pending_compose` is the honest word and it is chosen deliberately over `instrument`: the block BELONGS in the console and is not wired yet, which is what this disposition means, and `instrument` would be a SETTLED disposition that silences `uncashed_cheques.py` about a cheque that is genuinely outstanding -- the C5 defect FIELD-REPAIR-PLAN-20260920.md found in this very file for the two Earth probes. It is not composed because it CANNOT yet be: `zhao_console_core` composed the shared client port at `.IN_LANES(13)` and the W profile is FIFTEEN lanes (spec/form/field-ir.md 7.1 line 523, decision W01), so the adapter's own elaboration guard refuses the narrow pair rather than silently dropping p3 -- exactly the failure field-ir.md:536-545 records, where a dropped lane 'does not read as absent, it reads as whatever the host's register clear left in R14'. PACKET C1 DID THE FIRST HALF ON 2026-09-20: the three composition sites are at 15 (`zhao_console_core.sv`, the host and both adapters, plus the regenerated `zhao_prod_top`), so this adapter's elaboration guard now passes and P1 is CLOSED. P2 -- CLIENTS 2 to 3 -- is NOT done and was refused deliberately: a third client port with nothing driving it is a tie-off, and `zhao_geom_warp.sv` does not exist yet. The CLIENTS edit belongs in the same act that composes this adapter, which is one line in `zhao_console_core.sv` once W1's block lands. Directed test: tests/field/field_warp_adapter_directed.cpp."
