  zhao_terrain_shademod:
    disposition: pending_compose
    why: "THE PALETTE LADDER AND THE ONE ROUNDING, NEW 2026-09-26 (SHADELADDER), built because zhao_console_core.sv entry I13 item 1 says no RTL anywhere does it and that was TRUE. It is `mod_of` (reference/src/zrender/terrain.cpp:633-637) bit-exact: shade_q = (shade + 8191) >> 14 -- the oracle's own comment calls it 'the palette ladder (0..4)' -- then ONE round-half-up over the s128 product shade_q x tint x sheet. THE LAW WAS NEVER UNSETTLED, only unbuilt: CELLCARRY's refusal said 'two ARITHMETIC LAWS ARE UNSETTLED' and the arithmetic is frozen capture-exact in the oracle with a comment naming it. 0 DSP by zhao_terrain_shade.sv's own stated precedent for this subsystem ('the DSP budget stands at 171% committed; this block spends the abundant resource instead') -- a shift-add over sheet's 17 bits on one 38-bit adder, 17 clocks, 6.5% of the compute frame at 2,000 triangles x 3 channels. The law's floor((P*2^14 + 2^31)/2^32) reduces EXACTLY to floor((P + 2^17)/2^18) and the test proves that reduction against a SEPARATE transcription of the s128 form before any RTL is in the room. IT CORRECTS ENTRY I13, which said shade_q 'takes FOUR values': ambient() applies only to walls (terrain.cpp:670) and undersides (:795) and both pass a unity tint and a unity sheet, while the one path carrying a REAL tint and sheet -- the textured top surface, terrain.cpp:731 -- uses raw shade_tri clamped to [0, 65536] by shade_flat_tri (:137). FIVE rungs, and RUNG ZERO IS BLACK AND REACHABLE; a 2-bit ladder could not express a top-surface triangle turned from the sun. Boundaries LOCATED BY SEARCH at 0/8193/24577/40961/57345, not asserted. EVIDENCE: terrain_shademod_directed, 360,653 checks / 0 failures over nine sections, with shademod_break_oracle registered as its positive control (RC 1). Both counters FIRED with legal stimulus and are READ by the test, so no committed mutant is owed: issued_o counted 25 of 25 accepts and shade_domain_o fired at 65537 and 131071 while staying at zero across the whole legal domain. The ladder is shown to MOVE THE PIXEL (1,044 of 1,048 triples differ from the unquantised shade) and the law's pixel differs from the composed two-8-bit-rounding path on 599 of 1,248 triples, WORST 32 LSB of 255. verilator --lint-only -Wall: 0 diagnostics. R212: NOT through quartus_map; check_quartus17_syntax is green and that settles a different question. IT IS NOT COMPOSED, and the reason is entry I13 itself: the consumer is a terrain triangle arriving at a raster, and composing a gain producer with no fragment to gain is the prefix-of-a-broken-chain that three packets correctly refused. DELETE THIS ENTRY when I13's carriage lands and a terrain fragment reads this gain."
  zhao_geom_overw_sat:
    disposition: pending_compose
    why: "THE S8.24 SATURATE, NEW 2026-09-26 (SHADELADDER), built because zhao_console_core.sv entry I13 item 2 says 'THERE IS NO SATURATE AND NO CLAMP ANYWHERE ON THAT MULTIPLY' and that was TRUE. The law was NOT open: spec/qformats.md:75 fixes it in the type table's bounds column -- `u/v_over_w | s32 | S 8.24 | saturate | round-half-up` -- and section 4 makes rescale_s 'round-half-up ... followed by saturation to the destination width'. This block is rescale_s(uv * invw24, 16) with that saturation, on a s32 coordinate, which is what zhao_terrain_uvlane's terr_uv_* is (Q16.16 in TILE units). IT DOES NOT CORRECT zhao_geom_vattr: that block's header claim that 'NO saturation case exists' is TRUE on its signed [15:0] coordinate and is now PROVEN rather than quoted -- 983,040 s16 x invw24 pairs, exact, ZERO saturations, which is this suite's negative control and the reason GEOM.VATTR is untouched. zref::geom_over_w_wide was added beside the ratified zref::geom_over_w as the executable law and is proven a STRICT EXTENSION of it over all 65,536 s16 coordinates before either is quoted, so it cannot drift into being a rival statement of ratified arithmetic -- the failure design/contracts/GEOM.LIGHT.md names and TERRAIN.SHADE's header records shipping once. sat_o is a DECLARATION and not a difference: a result that lands exactly ON a rail is not reported as a saturation, the same distinction zhao_texture_sheetmod's applied_o draws. The block is combinational and holds no state, so it carries no counter and THE COMPOSER COUNTS sat_o, exactly as the composer counts applied_o; the test reads it in five sections. EVIDENCE: geom_overw_sat_directed, 3,349,510 checks / 0 failures over seven sections, with geom_overw_sat_break_oracle registered as its positive control (RC 1). The saturate fires in BOTH directions; the edge is LOCATED BY BINARY SEARCH on the RTL at uv = 2^24 for invw24 = 2^23 with the oracle agreeing there and one LSB below; and a patch 300 tiles out at w = 2 (value 150, past the bound of 128, a plausible island rather than a contrived rail) rails to 2147483647 where a 32-bit truncation gives -1778384896 -- the SIGN FLIP that would have sampled the far side of the atlas with every gate passing. verilator --lint-only -Wall: 0 diagnostics. R212: NOT through quartus_map. ONE UNMEASURED CLAIM, stated rather than hidden: it costs a 32x24 multiplier, and the named question for the fit that composes it is whether the wide former closes on ALMs at terrain's vertex rate or must be sequentialised the way zhao_terrain_shademod was. IT IS NOT COMPOSED: its consumer is the pack_attr analogue that fills a terrain triangle's slots 1 and 2 (zhao_forge_assemble.sv:674-687 is the template and writes 32'd0 into both under R197 because the forge path is declared-untextured), and that is I13's carriage. DELETE THIS ENTRY when that carriage lands."
