    why: "THE FOUR-BANK PATCH ACCUMULATOR, promoted 2026-09-20 by packet E1 from fpga/rtl/synth/zhao_probe_patch_acc.sv under owner ruling R44 and the directive's section 13.4 ('Promote/factor its numerical implementation, give it an explicit phase owner, and add a drain skid/credit adapter or ready/valid handling so actual cache backpressure cannot lose a group'). It holds the four exact reducers the Earth contract ratifies -- height/velocity/nav as saturating fx_add chains, material as last-covering-writer wholesale -- with a one-deep same-address RMW bypass, over four vertex-residue banks indexed by vertex mod 4. EVIDENCE: field_patch_acc_directed plus field_patch_acc_random; tools/sweep_field_patch_acc_mutants.py. KNOWN OPEN, recorded rather than hidden: the block has NO ready/valid and NO backpressure on any of its three phases, and its INIT/ACCUM/DRAIN exclusivity plus the 'two idle cycles between phase changes' are CALLER OBLIGATIONS its own header states and its RTL does not enforce (the single structural guard is `d1_valid <= dr_valid_i && !up_valid_i`). Section 13.4 commissions exactly that repair; it is deliberately NOT folded into the promotion commit, so that the rename stays a provable no-op. Its INIT/DRAIN phases walk the flat aligned 273 groups; only the UPDATE walk costs 297 (design/contracts/FIELD.SEQ.EARTH.md:137-154). Not composed for the same C1 reason as zhao_terrain_field_walk above. DELETE THIS ENTRY when C1 composes the Earth datapath."
