# THE CONSOLE INVENTORY -- what is allowed to be in zhao_console_core.
#
# Owner, 2026-09-19: "we need a big inventory about what actually gets to be
# in the console and a hard gate to exclude the stuff that doesn't go in."
#
# THIS FILE HOLDS ONLY WHAT CANNOT BE DERIVED. Membership itself is computed:
# a module REACHABLE from zhao_console_core by instantiation is in the console
# and needs no entry here. This file says why everything ELSE is out.
#
# Enforced by tools/quartus/check_console_inventory.py. A new .sv with no
# disposition FAILS the gate, so nothing drifts in unclassified.
#
# GENERATED FIRST PASS 2026-09-19 by deriving each disposition from the tree;
# every `why` states the EVIDENCE used, not a guess dressed as a fact. Where a
# derivation is wrong, correct the entry -- that is what it is for.
#
# pending_compose is A WORK LIST, not an excuse: it means the block belongs in
# the console and is not wired yet.

modules:
  zhao_console_board:
    disposition: top
    why: "THE SECOND ROOT. Not composed into the console because it CONTAINS the console: since 2026-09-19 it instantiates zhao_console_core and drives it from zhao_sys_pll and zhao_sys_reset, so it is the top that could be programmed onto hardware. check_console_inventory.py walks it as a root in its own right, and this entry is what ties that walk to a decision somebody wrote down -- the gate fails if this line stops saying `top`, and fails differently if the module stops instantiating the core."
  zhao_measure_starve:
    disposition: pending_compose
    why: "MEASURE.GOVERNOR's starvation verdict: the latch zhao_console_core.sv's I18 entry names in so many words -- 'TOKENS' den_* is a one-cycle REGISTERED denial while the governor wants a per-frame per-view verdict: the latch between them is state, and state belongs in a file with a contract and a test'. Its PRODUCER is real and composed (zhao_measure_tokens, zhao_console_core.sv:11788) and its reason classification is lifted from that block's own REASON_LOW_PRIORITY/REASON_EXHAUSTED/REASON_RELOAD encoding rather than chosen. 70 checks in measure_starve_directed; the STARVE_REASON_MASK elaboration guard is fired by measure_starve_mask_guard with its own wrapper negative control. It is NOT composed because its CONSUMER, zhao_measure_governor, cannot be composed: the governor's OUTPUT side has no composed consumer (cam*_scale_o wants TERRAIN.LOD and cam*_thresh_q8_o wants zhao_geom_lodstate, both uncomposed), so wiring the governor in would close one register entry by opening another. See FINDINGS-post3.md."
  zhao_view_projq88:
    disposition: pending_compose
    why: "The per-camera projection scale in Q12.8 (20 bits, owner rulings R83/R98 -- it was Q8.8 in 16 until 2026-09-20, which saturated below 90 deg hfov single-view and below 53.13 deg on Duo) for MEASURE.GOVERNOR's proj0/1_i, DERIVED under owner ruling R73 (proj_Q8.8 = rhu(kx_raw * viewport_w / 512)) rather than added to the ABI. Its inputs are zhao_view_projscale's kx*_o/vw*_o; it is not a second implementation of zhao_geom_projradius, which computes kx*R*vw/(2w) -- a projected radius with the bound radius and perspective w inside it -- and never emits the camera factor alone. Verified against design/contracts/MEASURE.GOVERNOR.md line 75's hand-worked Duo camera (221.70 px, Q8.8 raw 56755) to within the LSB its text truncated. 24 checks in view_projq88_directed (it was 19 before the R83 widening). Not composed for the same reason as zhao_measure_starve. THE SECOND CLAUSE OF THAT REFUSAL IS GONE, 2026-09-22 (gz/projclose), and it had been wrong for two days in this file alone: it read 'and it additionally depends on I14's still-open half: the viewport rect at projector cfg address 17 has no CMD producer'. Address 17 gained its CMD producer on 2026-09-20 (projbound) -- zhao_cmd_exec lowers SetView.viewport_id through video_rules 3.2 as steps 20/21 of the view walk -- and ENTRY I14 IS NOW CLOSED AND DELETED ALTOGETHER. The prod_manifest.yml row for THIS SAME BLOCK was corrected on 2026-09-21 by gz/cfgarm and this one was not, which is the partially-cashed-cheque shape: two registries describe one block, one was repaired, and the stale one goes on reading as the more conservative of the two. The refusal that remains is a RULING and not an absence -- R223 item 4 parks MEASURE.GOVERNOR's OUTPUT side transitively behind R133's FORGE.SHADOW, which R234 D2 has since commissioned as its own packet. The Q8.8 port width FINDINGS-post3.md raised as a decision was ruled (R83) and landed 2026-09-20 in BOTH ports plus a third site R98 did not name, zref::measure::GovernorCamera::proj, which was a uint16_t and would have TRUNCATED a 20-bit stimulus rather than saturating it. 24 checks in view_projq88_directed, including a positive control that still fires the saturation counter on an extreme kx."
  zhao_terrain_field_walk:
    disposition: pending_compose
    why: "THE EARTH LATTICE WALKER, promoted 2026-09-20 by packet E1 from fpga/rtl/synth/zhao_probe_walk_earth.sv under owner ruling R44 ('promote zhao_probe_walk_earth/zhao_probe_patch_acc out of fpga/rtl/synth/ to production names and homes, as FIELD v3 was, rather than rebuilding them') and the owner directive's FH18/sections 13.1-13.4. NO LOGIC CHANGED IN THE PROMOTION COMMIT -- module name, header and home only -- so the diff against the probe's final revision is itself the evidence that behaviour is unchanged, and tests/differential/field_walk_earth_directed.cpp is the SAME test against the SAME expectations. EVIDENCE: 23 checks in field_walk_earth_directed on the default path, plus field_walk_earth_random; 17 mutants caught and 1 proven equivalent by tools/sweep_field_walk_earth_mutants.py. WHY THIS ENTRY EXISTS AT ALL: its previous disposition was `instrument` ('synthesis probe under fpga/rtl/synth; measures, never ships'), and `instrument` is a SETTLED disposition, so tools/budget/uncashed_cheques.py could never flag it -- the inventory was suppressing the exact cheque R44 wrote, which is why a finished, differentially tested, mutation-swept engine sat unseen while the owner's 2,655-line directive commissioned 'the field-major scheduler' as new work without naming the file once (`probe_walk` and `walk_earth` are both ZERO hits in it). It is NOT composed because the console boundary is packet C1's serialised act: closing I34 needs velocity/material/nav channels that zhao_terrain_patch.sv:154-156 does not have, and section 20.8 forbids closing it by wiring only height. AND THE EARTH DATAPATH IS NOW PARTLY COMPOSED WITHOUT IT, 2026-09-23 (EARTHADAPT), so the deletion condition below needs reading carefully rather than triggering on the word Earth. zhao_field_earth_adapter answers zhao_terrain_patch's per-vertex field lane from the one field engine, which is the VERTEX-MAJOR arrangement this console composes. THIS WALKER IS THE FIELD-MAJOR ONE -- four-wide groups against FAB_GROUP_PTS=1, generating a lattice point the composed consumer already hands over -- so composing it here would be a SECOND producer of a coordinate, which is exactly the analysis core entry I34 records under its point (1). It remains the front of directive 13.2's zhao_terrain_patch_v2 and its adoption is still that packet's. DELETE THIS ENTRY when the FIELD-MAJOR patch machine composes, not when the height lane closes. AND ITS COMMISSION IS NOW A MEASURED NUMBER, 2026-09-26 (PATCHV2). This walker's adoption condition used to rest on an argument in a header -- 'order 80-100 clocks per covered vertex' -- and the number that decides it, fld_earth_stall_cycles_o, was exported on 2026-09-23 and read by nothing until now. composepub_acceptance case 11 reads it through the four composed production blocks: the vertex-major association costs clocks(L) = 4,431 + 1,089*L, i.e. 91,551 clocks at the real engine's price, against design/contracts/FIELD.SEQ.EARTH.md:167's active <=6,000-clock per-association contract -- a 15.3x miss, and over the contract even with an idealised 3-clock engine (7,698). The budget buys an engine latency of 1.44 clocks and the engine costs ~80. THE FIELD-MAJOR MACHINE IS THEREFORE COMMISSIONED BY EVIDENCE rather than by arithmetic, and its packet is a PERFORMANCE packet with a baseline rather than an architecture packet with an open decision. Note the allowance: the 10,416 figure core entry I34 and zhao_field_earth_adapter.sv:308 quote is RETIRED by the owner directive sections 2.10 and 18.2; neither allowance is reachable, so the verdict does not turn on it. AND IT IS NOW BENCHED, 2026-09-26 (FIELDMAJOR), which is the first time this block and zhao_terrain_patch_acc have been ELABORATED TOGETHER -- each differential test does the other block's job in C++, so the COMPOSED cost had never been measured. tests/terrain/tb_terrain_fieldmajor.sv instantiates both and tests/terrain/fieldmajor_census.cpp drives them: 240 checks, 0 failures, all 1,089 vertices x 6 lanes against the ratified vertex-major oracle zref::terrain::compose_vertex, so the stream-order transpose is shown not to change the answer. THE COST: clocks(L) = 851 + (297/depth)*L against the vertex-major 4,431 + 1,089*L. The intercept is the same at EVERY depth (asserted), so depth buys slope and never the floor, and at depth 1 the slope is 297 and not 1,089 (asserted) because the walk pays one round trip per GROUP OF FOUR rather than per vertex. BUT 851 IS A CEILING AND THE TWO CAVEATS ARE THE FINDING: (a) this block's partner assumes 'a plain one-group-per-clock sink' and zhao_terrain_compcache_front.sv:414 is one vertex per TWO clocks, so against the cache that exists the intercept is 2,762 (46% of 6,000) rather than 851 (14%) -- still below the vertex-major 4,431 (74%), and widening that write port is worth 1,911 clocks per association; and (b) the console composes u_field_host with .FAB_LANES(1) and PROGS 8, i.e. TWO four-point groups in flight, which costs 12,623 clocks at L=80 and STILL MISSES the contract by 2.10x, while the engine's own gated configuration (-GCTX=32 -GLANES=4, lint_field_v3_engine_shipped) is 32 groups in flight and costs 1,372 -- 0.23x the contract. SO COMPOSING THIS BLOCK WITHOUT WIDENING THE EXECUTOR AND THE CACHE WRITE PORT DOES NOT CLOSE THE CONTRACT. Full record: reports/DECISION-20260926-I34-FIELDMAJOR-BENCHED.md."
  zhao_terrain_patch_acc:
    disposition: pending_compose
    why: "THE FOUR-BANK PATCH ACCUMULATOR, promoted 2026-09-20 by packet E1 from fpga/rtl/synth/zhao_probe_patch_acc.sv under owner ruling R44 and the directive's section 13.4 ('Promote/factor its numerical implementation, give it an explicit phase owner, and add a drain skid/credit adapter or ready/valid handling so actual cache backpressure cannot lose a group'). It holds the four exact reducers the Earth contract ratifies -- height/velocity/nav as saturating fx_add chains, material as last-covering-writer wholesale -- with a one-deep same-address RMW bypass, over four vertex-residue banks indexed by vertex mod 4. EVIDENCE: field_patch_acc_directed plus field_patch_acc_random; tools/sweep_field_patch_acc_mutants.py. KNOWN OPEN, recorded rather than hidden: the block has NO ready/valid and NO backpressure on any of its three phases, and its INIT/ACCUM/DRAIN exclusivity plus the 'two idle cycles between phase changes' are CALLER OBLIGATIONS its own header states and its RTL does not enforce (the single structural guard is `d1_valid <= dr_valid_i && !up_valid_i`). Section 13.4 commissions exactly that repair; it is deliberately NOT folded into the promotion commit, so that the rename stays a provable no-op. Its INIT/DRAIN phases walk the flat aligned 273 groups; only the UPDATE walk costs 297 (design/contracts/FIELD.SEQ.EARTH.md:137-154). Not composed for the same C1 reason as zhao_terrain_field_walk above, AND FOR A SHARPER ONE SINCE 2026-09-23 (EARTHADAPT): this block is not a feeder of zhao_terrain_patch's field lane, it is a REPLACEMENT for the reducer behind it -- it holds its own height/velocity/material/nav reducers and has no fld_height lane at all. The Earth height lane now has a producer (zhao_field_earth_adapter) feeding the COMPOSED vertex-major reducer, so what this block is waiting for is not a producer but the owner's field-major rearchitecture. DELETE THIS ENTRY when directive 13.2's zhao_terrain_patch_v2 composes, not when the height lane closes. AND ITS NAV LANES ARE NOW CLASSIFIED, 2026-09-26 (PATCHV2), which is reports/OWNER-DECISION-20260926-I34-NAV.md section 4 carried out: 'Explicitly retire or classify unnecessary nav-specific hardware staging/output paths under this new ownership decision.' out_nav_0..3_o and the W_N write-mask lane are KEPT and NOT retired -- the block is uncomposed, so they cost no silicon today, and field-ir 7.1's earth out record is four ordinals whose ordinal 3 the decision's 'preserving existing program/ABI compatibility' clause forbids removing. What changes is the REASON they exist: they are no longer waiting for an FPGA consumer, because navigation truth belongs to SW.CPUCOLL / zref::nav::Service and has no FPGA consumer BY DESIGN. A future composer must not read this row as a commission to route them. AND THE FOUR-CHANNEL SENTENCE ABOVE IS RETIRED with it: reports/DECISION-20260926-I34-PATCH-V2-CHANNELS.md measures that height and velocity already have real owners that are NOT a patch_v2 (velocity's, zhao_terrain_veljoin, was composed by TERRVEL on 2026-09-26 and rides the VERTEX-MAJOR lane stream plus zhao_terrain_patch's fld_covers_o, so composing a field-major v2 now also owes re-homing it), nav is ruled out, and material cannot be routed by any block until a u32 <-> {matA,matB,weight} law exists, which it does not anywhere in this tree. So this block's remaining commission is the CLOCK CONTRACT and not the channel count: composepub_acceptance case 11 measures the composed vertex-major association at 91,551 clocks against design/contracts/FIELD.SEQ.EARTH.md:167's active <=6,000, a 15.3x miss, and that is what this accumulator is for. AND IT IS NOW BENCHED, 2026-09-26 (FIELDMAJOR), which is the first time this block and zhao_terrain_patch_acc have been ELABORATED TOGETHER -- each differential test does the other block's job in C++, so the COMPOSED cost had never been measured. tests/terrain/tb_terrain_fieldmajor.sv instantiates both and tests/terrain/fieldmajor_census.cpp drives them: 240 checks, 0 failures, all 1,089 vertices x 6 lanes against the ratified vertex-major oracle zref::terrain::compose_vertex, so the stream-order transpose is shown not to change the answer. THE COST: clocks(L) = 851 + (297/depth)*L against the vertex-major 4,431 + 1,089*L. The intercept is the same at EVERY depth (asserted), so depth buys slope and never the floor, and at depth 1 the slope is 297 and not 1,089 (asserted) because the walk pays one round trip per GROUP OF FOUR rather than per vertex. BUT 851 IS A CEILING AND THE TWO CAVEATS ARE THE FINDING: (a) this block's partner assumes 'a plain one-group-per-clock sink' and zhao_terrain_compcache_front.sv:414 is one vertex per TWO clocks, so against the cache that exists the intercept is 2,762 (46% of 6,000) rather than 851 (14%) -- still below the vertex-major 4,431 (74%), and widening that write port is worth 1,911 clocks per association; and (b) the console composes u_field_host with .FAB_LANES(1) and PROGS 8, i.e. TWO four-point groups in flight, which costs 12,623 clocks at L=80 and STILL MISSES the contract by 2.10x, while the engine's own gated configuration (-GCTX=32 -GLANES=4, lint_field_v3_engine_shipped) is 32 groups in flight and costs 1,372 -- 0.23x the contract. SO COMPOSING THIS BLOCK WITHOUT WIDENING THE EXECUTOR AND THE CACHE WRITE PORT DOES NOT CLOSE THE CONTRACT. Full record: reports/DECISION-20260926-I34-FIELDMAJOR-BENCHED.md."
  zhao_terrain_edgerecon:
    disposition: pending_compose
    why: "TERRAIN.EDGERECON -- the NEIGHBOUR-EDGE LEVEL PRODUCER, NEW 2026-09-22 (EDGERECON), commissioned by owner ruling 2026-09-22 item 6 ('authorize implementing the real neighbor-edge level producer ... bounded prepare/reconcile/emit sequencing over the admitted terrain set for the frame'). It is the producer for the four edge_* inputs zhao_console_core.sv entry I21 has driven from the literal 8'h00 since it was written. THE STRUCTURAL FACT THAT MAKES ONE PASS SUFFICE was measured in zhao_terrain_lod.sv, not assumed: edge_* reaches out_lvl_nz/pz/nx/px and NOTHING else -- out_level_o is the ladder's answer from sp_* and the governor alone -- so a patch's own sixteen levels do not depend on its neighbours and the reconciliation has no fixpoint to iterate. AND THE FACT THAT KILLS THE CHEAP BUILD: zhao_terrain_tess computes a shared edge at max(neighbour, own), which is symmetric, so two patches agree on a seam iff each is given the other's true level OR both are given the same wrong one. A serve-order streaming producer gives the first-served patch the fallback and the second the truth, so one side emits level-1 density and the other level-2 on the same seam -- a crack, with every counter balancing; and making the second side fall back too degenerates to the constant it replaced. There is no partial answer, which is why the ruling's prepare-then-emit sequencing is required rather than merely permitted. THE SYMMETRY LAW is the theorem it is built on: ok(X) == valid AND tag==X AND NOT poison AND mask==FFFF, and an edge is answered from a decision iff ok(P) AND ok(N) -- a predicate symmetric in the two patches, evaluated against a bank FROZEN for the whole emit phase, so the two sides cannot disagree. ok(P) guards P's own four edges as well as every query naming P as a neighbour, which closes the one asymmetry a direct-mapped bank can produce: a collision POISONS the entry and a poisoned entry fails ok for its owner and for every querier alike, costing triangles on four seams and a crack on none. NO PREVIOUS-FRAME SHORTCUT, enforced structurally rather than promised: frame_begin_i sweeps every valid bit before PREPARE opens, so every record a query can read was filed in that query's own frame. AND IT CORRECTS ENTRY I21 ON THE RETAINED CONSTANT. I21 says 8'h00 gives 'more triangles, and NO CRACK'. max(0, own) == own, so a neighbour reported as 0 selects the patch's own level and the seam is not stitched at all: the constant is conservative in TRIANGLES, not in CRACKS, and it is crack-free only where adjacent patches happen to agree. terrain_edgerecon_directed case 2's positive control measures the gap -- 24 of 48 x-seam lanes disagree over a 3x3 block. The ruling's instruction to RETAIN 8'h00 stands unchanged; it is the least bad constant, not a safe one, and that is the argument for this block. EVIDENCE: 1,041 checks in terrain_edgerecon_directed, eleven cases including the symmetry theorem by exhaustion over a 3x3 block, four file orders x two query orders byte-identical, the sweep, phase gating both ways, and the answer held for 900 clocks (longer than TERRAIN.LOD's ~784-clock patch job). All nine counters fired from the block's own boundary with legal stimulus, each with a control beside it, so no committed mutant is owed (R95). No multiplier; one 256 x 82-bit bank, ~3 M10K and ~400-550 ALM, COUNTED BY HAND in the unflattering direction and NOT fitted (the campaign instruction is not to fit). R212: it has not been through quartus_map; check_quartus17_syntax is green on it and that settles a different question. IT IS NOT COMPOSED, and the reason is MEASURED rather than inherited: this block owns the store, the law and the sequencing gate, and the ADMITTED-SET PREPARE WALKER that drives it does not exist. design/contracts/TERRAIN.EDGERECON.md names it in four numbered steps -- enumerate the admitted set (zhao_terrain_visible exists and is NOT composed), assemble sp_* from zhao_terrain_devstore and zhao_terrain_place (both composed) keyed by page slot, which needs a slot->(ix,iz) direction zhao_terrain_residency_v2 has no port for; run zhao_terrain_lod over them with its output routed HERE and out_hold_o discarded so the prepare pass does not advance the history the emit pass reads; pulse prepare_done_i. Composing this block alone would dangle f_* and the two phase pulses at the core boundary and put the register UP by one while changing nothing a frame can see -- the trade R75 endorses refusing. THE CONSOLE THEREFORE REMAINS IN CONSERVATIVE EDGE MODE and u_terrain_lod's edge_* still read the literal 8'h00. DELETE THIS ENTRY when the walker lands and the core queries this block."
  zhao_terrain_prepwalk:
    disposition: pending_compose
    why: "TERRAIN.EDGERECON's ADMITTED-SET PREPARE WALKER (packet P2), NEW 2026-09-25 (EDGEPREP), commissioned by owner directive 2026-09-23 section 2: 'Complete a replayable sealed-list PREPARE reader independent of compose-cache backpressure, time-share the existing LOD machinery, then reconcile and EMIT. Do not resurrect a second terrain engine or duplicate the world store.' THE DEADLOCK IT EXISTS TO AVOID IS REAL AND WAS MEASURED BY EDGERECON2: a PREPARE pass teed off u_terrain_seq's issue port CANNOT TERMINATE, because that stream is one-shot with no replay and its ready IS the compose cache's (tis_ready = thr_j_ready && tce_can_start, tce_can_start = !tcc_fill_busy) against a front holding exactly two lattices -- so holding tessellation back until the last patch is issued stalls the compose, stalls the issue, and the walk never reaches the last patch. THE ANSWER WAS ALREADY IN THE TREE: zhao_terrain_cmd ALREADY READS THE SEALED LIST TWICE EVERY FRAME by design ('pass one folds the CRC and emits nothing; pass two emits and folds nothing'), because ruling T5 makes the list CAPTURE DATA at a known address with a known length and CRC -- which is the definition of replayable. This block is a THIRD reader of the same bytes whose ready is its OWN consumer's, so the compose spine is nowhere in its loop. It is a separate FILE and not a third pass inside zhao_terrain_cmd precisely because that block is COMPOSED: new outputs on it would dangle at zhao_console_core's boundary until P4 wired them and put the completion register UP, the trade R75 endorses refusing. WHAT IT DOES: re-reads the list, folds the CRC again, looks up residency WITHOUT claiming, pinning, loading or evicting anything (PREPARE may not change one bit of the state EMIT reads), reads deviations and history from zhao_terrain_devstore, computes each subpatch centre through zhao_terrain_place_law_pkg -- the SAME functions zhao_terrain_place calls, so PREPARE and EMIT are bit-identical BY CONSTRUCTION rather than by two implementations agreeing -- and emits sixteen descriptors per admitted patch on zhao_terrain_lod's own sp_* port, field for field. IT IS NOT A DUPLICATE WORLD STORE: it holds ONE record at a time and the list stays in HPS memory, which is the whole point of re-reading it. Cost: +8 KiB/frame on the HPS-DDR BRIDGE, a DIFFERENT SOCKET from the devstore SDRAM reads, budgeted separately in tools/budget/sdram_bandwidth.py and deliberately NOT added to that ledger's total. EIGHTEEN COUNTERS, ALL FIRED from this block's own boundary with legal stimulus and each with a control beside it, so NO committed mutant is owed and that is a measured claim rather than an omission (R95). store_wait_clocks_o is the instrument spec/memory_rules.md:396-402 already named and is what P2 was told to budget INSTEAD of bursts -- and terrain_lodpath_directed case 8's 660 clocks must NOT be quoted as the cost of anything, being 12 clocks per 64-byte burst on a played fabric at 2-cycle read latency where a real request is four SDRAM bursts at 12-18. TWO DEFECTS THIS BLOCK WAS AUTHORED WITH, both caught here rather than in a console: the first version staged devstore's record and presented the STAGED copy while sp_valid_o tracked the LIVE r_valid_i, so the descriptor on the wire belonged to the previous beat while its handshake belonged to this one -- every subpatch's deviations banked one lane late with every counter balancing, and there is now no payload register in the block at all; and prep_begin_o was a LEVEL, where zhao_terrain_edgerecon documents frame_begin_i as a PULSE that RESTARTS an in-flight sweep, so a level would have restarted the 257-clock sweep every cycle and the two blocks would have held each other still for ever with every counter reading zero. EVIDENCE: terrain_prepwalk_directed, 85 checks / 0 failures over twelve cases. verilator --lint-only -Wall: 0 diagnostics. R212: NOT through quartus_map. IT IS NOT COMPOSED, and the reason is the directive's own staging: 'Close I21 and the disconnected EDGERECON entry only when the same complete production path satisfies both.' P4 composes this block, zhao_terrain_lodshare and zhao_terrain_edgerecon TOGETHER and spends the plan's one fit; composing any one alone dangles ports and puts the register UP. DELETE THIS ENTRY when P4 lands."
  zhao_terrain_lodshare:
    disposition: pending_compose
    why: "TERRAIN.EDGERECON's LOD TIME-SHARE, FRAME-SCOPED GOVERNOR FREEZE and HISTORY GATE (packet P3), NEW 2026-09-25 (EDGEPREP), commissioned by owner directive 2026-09-23 section 2: 'time-share the existing LOD machinery', 'Freeze the admitted set, its epoch, relevant camera/governor inputs and the referenced deviation/history version across PREPARE and EMIT', and 'PREPARE must not commit hysteresis history or advance the state EMIT treats as last frame.' IT IS A NAMED BLOCK BECAUSE ENTRY I21 REQUIRES ONE: zhao_terrain_lod has no mode, bypass or phase input, so PREPARE-vs-EMIT selection across eleven sp_* inputs and thirteen out_* outputs would otherwise be a hidden adapter spread through a 28,000-line composer, which is the failure that entry already refused once. (The entry says twelve and fourteen; counted off the port list it is eleven and thirteen, both counts having included a port of the opposite direction. Corrected rather than propagated.) THREE THINGS IT OWNS. (1) THE FREEZE: thirteen governor and camera targets captured on frame_i, ONE enable. The console re-latches them under an 'else if (tld_idle)' arm -- PER PATCH, ~256 times a frame -- and entry I21 calls that harmless today because MEASURE.GOVERNOR decides on frame_i. THAT IS TRUE OF THE SEVEN mgv_* VALUES AND FALSE OF THE SIX EYE VALUES: veye0_*/veye1_* come from zhao_view_eye, whose registers update on cfg_we_i, 'a pulse the executor owns, and a write lands the cycle it is' (:43, :123). They are HOST-WRITE-SCOPED, not frame-scoped, so the SINGLE pass is already sampling a moving camera between patches and nothing was watching; freeze_drift_o is the instrument that was missing. (2) THE HISTORY GATE: EMIT reads history at R_HREQ BEFORE its own ladder runs, so a PREPARE-phase write is read next as 'the previous frame's' level -- a hysteresis corruption with every counter balancing. The suppression is STRUCTURAL and needs no devstore change: that block enters R_HWR on (h_any_q || h_valid_i) with h_any_q set ONLY inside if (h_valid_i), and h_valid's producer zhao_terrain_jobissue is STARVED during PREPARE because this block routes the ladder's output to the reconciler instead. The explicit gate is kept anyway, because a correctness property that holds through somebody else's wiring is the kind an innocent edit breaks in silence, and because it gives hist_leak_o somewhere to live. (3) THE IDENTITY QUEUE: zhao_terrain_lod carries src_id and NO patch coordinate anywhere in its port list, while TERRAIN.EDGERECON's file port needs one -- so the coordinate rides in a queue pushed by the sp handshake and popped by the ladder's answer, with the popped src_id CHECKED against the returned one. Two values loaded by two DIFFERENT enables, which is exactly the property CLAUDE.md's metadata-bank defect lacked and the reason its counter could never fire. On a mismatch the FILE IS REFUSED and the ladder is still drained, so a counted fault is not a hung frame. TWELVE COUNTERS. Eleven fire from this block's own boundary with legal stimulus, each with a control. The twelfth, idq_overflow_o, counts a push into a FULL queue and is UNREACHABLE BY CONSTRUCTION -- p_sp_fire_c requires lod_sp_valid_o, which carries !idq_full_c -- so it owns the committed mutant tests/mutants/zhao_terrain_lodshare_idqoverflow_mutant.sv, driven with INVERTED polarity by terrain_lodshare_mutant, which PASSES ONLY WHEN THE COUNTER FIRES and did, twelve times, with its positive control idq_full_stalls_o at 12 and 24 descriptors forced into a 4-deep queue. THAT COUNTER'S FIRST VERSION WAS WRONG: it counted valid && full && ready, which is the guard CORRECTLY REFUSING rather than an overflow, and a counter named for a fault that fires on correct behaviour trains its reader to ignore it. EVIDENCE: terrain_lodshare_directed, 96 checks / 0 failures over nine cases. verilator --lint-only -Wall: 0 diagnostics. R212: NOT through quartus_map. IT IS NOT COMPOSED: P4 composes it with zhao_terrain_prepwalk and zhao_terrain_edgerecon together. DELETE THIS ENTRY when P4 lands."
  zhao_terrain_jobissue:
    disposition: pending_compose
    why: "TERRAIN.JOBISSUE -- the SUBPATCH JOB ISSUER, the block zhao_console_core.sv entry I21 says does not exist, NEW 2026-09-21 (JOBISSUE). It joins zhao_terrain_lod's lod_target stream to the patch's own DRAW CONTEXT and drives zhao_terrain_group_seq's job port, plus zhao_terrain_compcache_front's serve_release -- both halves of I21, which assigns both to the same absent owner. THIRTEEN fields, not sixteen: owner ruling R13 rules job_mat_a/_b/_weight the WRONG CARRIER ('the job port is not widened to carry a subpatch-uniform value that is not true'), so this block has no material ports at all and their honest closure remains REMOVAL once a per-triangle layer-E path exists inside TESS. It ANSWERS rather than sidesteps I21's objection that driving the view mask from the compose door 'joins two things that move independently': the context {src_id, view_mask, sparse_fill} is captured AT the door, queued, popped for the patch the cache actually serves, and its src_id differenced against the serve port's own -- two operands written by different enables and arriving through different ports, so the detector CAN fire, which is CLAUDE.md's metadata-swap law applied on the way in. EVIDENCE: 138 checks in terrain_jobissue_directed; all five fault counters reachable from the block's own boundary with legal stimulus and each FIRED with a negative control beside it, so no committed mutant is owed (R95). No multiplier, no memory; ~400 flops counted by hand, NOT fitted (the owner's instruction for this campaign is not to fit). IT IS NOT COMPOSED, and the reason is MEASURED in this packet rather than inherited: composing it alone would dangle its lod_* input at the core boundary and put the register UP by one, which is the trade R75 endorses refusing, and composing the TERRAIN group needs TERRAIN.LOD, whose sp_* input has NO ASSEMBLER -- sp_cx_i/sp_cz_i have no producer (zhao_terrain_devstore stores only w_cy_i; zhao_terrain_lodfeed.sv:125 names TERRAIN.PLACE's placed column/row stream as the source and nothing reads it), zhao_terrain_devstore carries no src_id column at all, and the devstore read is keyed by page SLOT while the compose cache serves by src_id with no map between them. That is a SECOND build, deliberately excluded from this block's scope and named in its header rather than adapted around. DELETE THIS ENTRY when the sp_* assembler lands and the core composes the group. The lane's full findings are the gz/jobissue packet's own commit message -- the harness refuses a lane report file at that path, and a commit message that IS the document is this campaign's established pattern (the same refusal produced gz/viewmask's findings)."
  zhao_terrain_spdesc:
    disposition: pending_compose
    why: "TERRAIN.SPDESC -- the SUBPATCH DESCRIPTOR ASSEMBLER, NEW 2026-09-21 (TERRASSEM). It is the other half of zhao_console_core.sv entry I21 and the block gz/jobissue named that morning as the last piece between a BUILT TERRAIN group and a COMPOSED one: it builds zhao_terrain_lod-s sp_* patch_state input, which had no producer at all. THE THREE ABSENCES I21 LISTED WERE ATTEMPTED BEFORE THEY WERE BELIEVED (R237) and two were smaller than stated. (1) sp_cx_i/sp_cz_i DO have a producer and zhao_terrain_lodfeed-s own w_cy_o port comment already named it -- TERRAIN.PLACE-s placed column/row stream, written into zhao_terrain_compcache_front on pos_* and served back on lat_wx_o/lat_wz_o; this block reads that port rather than recomputing placement from an origin and a pitch, which would be a second implementation of TERRAIN.PLACE-s law. (2) zhao_terrain_devstore has no src_id column and does not need one: the store is read with a slot this block already holds and sp_src_id_o is the id popped beside that slot, so lodfeed-s w_src_id_o keeps its R70 reader untouched. (3) THE SLOT-VERSUS-SRC_ID GAP IS REAL and is why the block exists -- the answer is not a map (a src_id to slot map is a 1,024-entry CAM, because a page stays resident across frames) but the COMPOSE DOOR, where zhao_terrain_pagestream emits v_slot_o and v_src_id_o ON THE SAME VERTEX BEAT; the pair is captured there, queued, and popped for the patch the cache serves, which is zhao_terrain_jobissue-s draw-context queue exactly, with its serve_seen_q arming law COPIED rather than re-derived. door_src_mismatch_o differences the popped id against serve_src_id_i and CAN fire: the two operands are written by different enables and arrive through different ports. IT NEVER DELAYS THE LATTICE PORT-S EXISTING CLIENT -- lat_req_i has no ready, so a request not forwarded on the cycle it is made is DESTROYED rather than delayed, and zhao_terrain_heighttap-s upstream-first law is copied; losing that race is a DURATION (lat_wait_clocks_o), not a fault. EVIDENCE: 1,035 checks in terrain_spdesc_directed, which FOUND A ONE-CYCLE JOIN FAULT IN THIS BLOCK -- patches_unfresh_o was sampled on the r_start_o cycle, where zhao_terrain_devstore-s r_fresh_o still carries the PREVIOUS patch-s answer, and case 8 proves the PLANT (the start cycle really did carry the other patch-s flag) before quoting the fire. All five fault counters fire from the block-s own boundary with legal stimulus, each with a negative control, so no committed mutant is owed (R95). No multiplier, no memory; ~250 flops counted by hand, NOT fitted (the owner-s instruction for this campaign is not to fit). IT IS NOT COMPOSED: see the gz/terrassem findings for exactly what still stops the TERRAIN group. DELETE THIS ENTRY when the core composes the group."
  zhao_terrain_devstore:
    disposition: pending_compose
    why: "TERRAIN.LOD-s per-page deviation and history store (owner rulings R24 and R59), built and tested by terrain_lodpath_directed. CITATION CORRECTED 2026-09-21 (gz/terrassem): this entry used to refuse on -NO RATIFIED COMMAND CARRIES A CAMERA POSITION -- SetView 0x0010 carries view_projection, pixel_error and token counts and nothing else-. THAT EXPIRED WHEN OWNER RULING R63 LANDED fx16 eye[3] ON THAT EXACT COMMAND, and zhao_view_eye implements it -- which the zhao_view_eye entry a few lines below in THIS FILE already says, in as many words. Two entries in one file describing two different trees, one of which stopped existing; kept as a correction rather than quietly refreshed, because a refusal that keeps a dead reason is how a live blocker gets re-quoted (R165). THE LIVE REASON IS COMPOSITION ORDER, NOT THE ABI: the store-s only reader is zhao_terrain_lod, whose sp_* patch_state input now HAS an assembler (zhao_terrain_spdesc, TERRAIN.SPDESC, built 2026-09-21) but which still needs MEASURE.GOVERNOR-s cam targets and the four contract-refused edge_* neighbour levels. The store-s real price is 185 M10K of 553 (33 percent) -- R59-s ~77 was computed with a 16-bit deviation where DEVW is 24 and counted no history at all. Composing it alone would add 185 M10K with no reader, which is the BUILT-INSTALLED-NOWHERE shape. See FINDINGS-terrain4.md, owner decision D1, and the gz/terrassem findings. THE M10K HALF OF THAT REFUSAL EXPIRED 2026-09-22 under OWNER RULING R242 -- -Move deviation store to SDRAM, ignore stale info- -- and the block now infers NO MEMORY AT ALL: the records live in a 320 KiB guarded region in local SDRAM bank 2 (ZHAO_TERRAIN_DEVSTORE_BASE, spec/memory_rules.md 5b). The sentences above are kept rather than rewritten because they are what the refusal WAS, and because R59-s ~77 being 2.4x wrong is the lesson, not the number. What remains of the refusal is the OTHER half and it is unchanged: composing this block into zhao_prod_top alone still has no reader there, because TERRAIN.LOD-s sp_* input needs MEASURE.GOVERNOR-s cam targets and the four contract-refused edge_* neighbour levels. It IS composed in zhao_console_core, where those exist. The price is now +1,552 flops hand-counted (1,024 of them the hist_valid repair, 256 the eight new counters, 272 the memory engine net) and -185 M10K; nothing here has been fitted."

  zhao_geom_clipdoor:
    disposition: pending_compose
    why: "GEOM.CLIP's INPUT DOOR -- the N-producer arbiter owner ruling R187 named ('the honest door is at GEOM.CLIP's INPUT, not GEOM.SETUP's'), and which zhao_console_core's own R197 block already describes as the thing that will present a second producer's untex bit 'to THIS gate, not to a second copy of it downstream'. It carries the MATERIAL half (into zhao_material_window) and the TRIANGLE half (into zhao_geom_clip) of ONE beat, which is sound because the window is a pure combinational gate between them -- `assign t_valid_o = t_valid_i && pass_c` -- so no tag and no shadow FIFO is needed and splitting the two halves across two arbiters would be the metadata-swap shape. Its arbitration law is RUN-LENGTH FAIR rather than beat fair, and that is forced rather than chosen: zhao_material_window DRAINS the whole GEOM.CLIP..door span before changing what it publishes, so a beat-fair round robin between two producers of different materials would issue a drain and a resolve between every pair of triangles, at the drain rate rather than the triangle rate, with every counter reading healthy. EVIDENCE: 175 checks in geom_clipdoor_directed, including the run-length check a beat-fair arbiter fails (twenty contended beats, ZERO switches) and the stalled-sink hold check with the other client asserting valid throughout; err_hold_broken_o is unreachable by legal stimulus and FIRES under the committed mutant tests/mutants/zhao_geom_clipdoor_mutant.sv (err_hold_broken=1, polarity inverted), with the directed test as its negative control. IT IS NOT COMPOSED, and the reason is NOT the seven-slot attribute packet that five passes over the FORGE cluster believed was the wall -- owner ruling R197 discharged that on the day it was written and it is silicon at this commit (zhao_geom_clip.tri_untex_i, zhao_geom_attrpack.tri_untex_i which is the only reader of the u/w and v/w slots in the tree, cl_in_refuse_c and geom_untex_refused_o, and the committed untex_decl mutant). What remains is two named items in design/contracts/GEOM.CLIPDOOR.md: (1) PART.EXPAND emits Q16.16 1/w while slot 0 of GEOM.CLIP's packet is canonical invw24 and owner ruling D-4 forbids a consumer converting -- `w` exists at zhao_part_project's a_w_i and is DROPPED at the ladder queue, so the arm owes a w lane plus a depthquant/rcp pair; and (2) a particle has no material identity and zhao_material_window publishes one material per span, which is R197's unruled sibling and an OWNER decision. DELETE THIS ENTRY when the core composes the second arm."
