  zhao_surface_sheetshare:
    disposition: pending_compose
    why: "zhao_surface_sheet's two-client request share, built 2026-09-21. zhao_console_core.sv entry I32 says a second requester on that single req_* port needs a scheduler and that a mux written inline in a composer is an arbiter nobody can point at; this is that file. Round robin, one last_q flip-flop, adopted from zhao_terrain_psmux rather than re-decided, with both priority orders rejected in the header WITH their numbers. It is NOT composed for the same reason zhao_terrain_sheetseam is not: its second client is the bake reader, and TERRAIN.BAKE is not in the console. It is NOT a second owner of a capability and has no design/blocks.yml row of its own -- psmux's precedent exactly. DELETE THIS ENTRY when TERRAIN.BAKE composes."
  zhao_terrain_sheetseam:
    disposition: pending_compose
    why: "the layer-F read path for TERRAIN.BAKE's per-vertex depth mode, built 2026-09-21 against design/contracts/TERRAIN.SHEETSEAM.md and owner rulings R194 and R221. It prefetches the 1,089 texels the 33x33 lattice can address into one M10K and answers bake's sheet_strength_i from it, and on ST_MISS it drops cmd_depth_sheet_i so the record digs the RATIFIED parametric disc and counts the fallback (R221). EVIDENCE: 81 checks in sheetseam_rtl_directed against the REAL zhao_surface_sheet, with all nine counters asserted silent on the clean path and then fired by stimulus, and the R221 checks themselves fired by a scratchpad mutant that ignores pg_status_i -- 12 failures across three independent cases while the happy path still passed, which is the shape of the defect. It is NOT composed because its consumer zhao_terrain_bake_v2 is not composed and bake's cmd_* record port still has no producer; job_handle_i has no producer for the same reason. Wiring it alone would connect a port to a block nothing drives. DELETE THIS ENTRY when TERRAIN.BAKE composes."
  zhao_terrain_pageio:
    disposition: pending_compose
    why: "TERRAIN.BAKE's page window, built 2026-09-21 against design/contracts/TERRAIN.PAGEIO.md and owner ruling R210. It serves the FOUR zhao_terrain_bake_v2 page ports nothing in the machine served: the layer-D reads behind vtx_nobake_i and cell_state_i (layer D at page offset 6,598 had ZERO readers anywhere under fpga/) and the layer-B and layer-D writebacks on sc_* and cs_* (no writer at all). EVIDENCE: 79 checks in pageio_rtl_directed, including layers A, C and E asserted BYTE-IDENTICAL after a bake -- the acceptance test for the read-modify-write the guard's be_ok forces -- and nb_o checked against zref::terrain::nobake_corner_shadow on all 1,089 vertices. All five fault counters are asserted silent on the clean bake and then FIRED by stimulus. The A/C/E detector was itself fired by a scratchpad mutant that skips the two layer-B edge reads: it reported exactly 2 bytes of A and 60 of C, the counts the layout predicts. It is NOT composed because its CONSUMER, zhao_terrain_bake_v2, is not composed, and bake cannot be composed by this packet: its cmd_* record port has no producer (zhao_terrain_cmd emits a patch-DIRECTORY record, not a bake record) and its sheet_texel_o/sheet_strength_i need an arbiter between SURFACE.STAMP and the bake reader on zhao_surface_sheet's single request port -- which is a POLICY DECISION, not a wire, and is refused here rather than taken quietly. Wiring this block alone would close one register entry by opening nothing. DELETE THIS ENTRY when TERRAIN.BAKE composes."
  zhao_forge_assemble:
    disposition: pending_compose
    why: "THE FORGE MESHLET'S TERMINAL STAGE -- world vertices and index triples in, SCREEN TRIANGLES at GEOM.CLIP's door out. NEW 2026-09-21 (FORGECOMP). This is the block whose absence is why a forge primitive could not be composed: zhao_forge_prim emits INDEX TRIPLES and no coordinate, zhao_forge_prim_eval and zhao_forge_ring_eval emit WORLD fx16 and no topology, and zref_forge_page.hpp names the only thing joining them -- the ring-major ORDERING CONVENTION. There was no vertex an index could be looked up in. THE ROUTE IS THE PARTICLE'S, which FINDINGS-shadowsub's follow-up established by WITHDRAWING its own arena claim: zhao_part_project takes particle results straight out on q_* as signed [20:0] with no arena on that path, so a client-A client owes a RIDER and a DEMUX ARM, not an arena, and the widths already agree with zhao_geom_clip.tri_ax_i. This block is the THIRD owner on that front mux -- OWNER_FORGE = 2, the value the encoding has RESERVED since R68 sub-build 4 -- and owner ruling R3 is untouched, because R3 withholds a third PORT on zhao_project_service and NAMES the time multiplex as the thing to keep. THE RESULT SIDE HAS NO BACKPRESSURE, so the block never offers more than it has room to land: f_valid_o is gated on in-flight plus depth-queue occupancy against INFLIGHT, with an elaboration guard requiring INFLIGHT to cover the projector's stated 36-clock latency. THE CANONICAL DEPTH is a local zhao_geom_depthquant_stream + zhao_raster_rcp24_v4 pair, wired exactly as zhao_geom_vattr wires it -- owner ruling D-4 forbids a consumer converting for itself, and a second INSTANCE of one law is not a second law. That pair is also why this block composes where zhao_part_expand cannot: the clipdoor packet's first named blocker for particles is that w is DROPPED AT zhao_part_project's LADDER QUEUE, and the forge arm has no ladder queue. THE ATTRIBUTE PACKET is six ratified slots and one authored value: slot 0 the canonical invw24 per corner; slots 1-2 zero under R197 (attrpack substitutes the zero operand for a declared-untextured primitive); slots 3-6 the PRE-LIT colour, which R234 D1 rules is exactly what an untextured primitive carries on the Gouraud lanes. The colour VALUE has no producer -- the frozen page has no colour field -- so it arrives as four NAMED, EDITABLE INPUTS, which is the R48 seam shape and the treatment owner ruling R133's D-FORGESHADOW-A already accepted for cast_strength_i. DECLARED LIMITATION: the colour is per PRIMITIVE, so a forge triangle's Gouraud plane is FLAT; the mechanism is not narrowed and a per-corner colour is three inputs instead of one. THE DOCKET THAT WAS HERE IS CLOSED by owner completion ruling 2 (2026-09-22): DrawProcedural now carries a REAL pair -- the complete handle32[material_set] in material_set and an independent u16 material_id in its own payload bytes -- and FORGE_MATERIAL_ID is removed. The pair is HANDSHAKED from zhao_forge_pagebank (a_valid_o/a_ready_i, the third half of the one acceptance) rather than presented as a level, because a level latched at this block's first vertex could be replaced by the next draw in the window before this block is busy; mat_skew_o found that, and two further carriage defects, on its first run against the composed chain. Acceptance: tests/prod/procmat_acceptance.cpp. NOT COMPOSED YET: its producers and its door are not composed either, and the chain is ONE COMMIT OR NONE. DELETE THIS ENTRY when the forge chain composes."
  zhao_forge_pagebank:
    disposition: pending_compose
    why: "THE FORGE_PROGRAM PAGE READER AND THE DrawProcedural DISPATCH, in one block. NEW 2026-09-21 (FORGECOMP), built against owner ruling R234 D2 (the page kind frozen, FORGE.PRIM / FORGE.PRIM_EVAL to be built) and R241 D-TICK-A (frame_tick is DrawProcedural's pad[11], per draw). FINDINGS-forgeprim's blocker list named TWO items here -- `zhao_cmd_exec` has no arm for 0x0302, and no bank stages a forge page -- and scoped the reader with its request side 'depend[ing] on the dispatch that does not exist'. That dependency is the argument for ONE block rather than two: the only thing that ever asks this bank a question is the draw, the only use of the answer is the draw's two evaluator jobs, and a seam between them would be a handshake with exactly one producer and one consumer carrying a record neither owns. `zhao_geom_drawjob` is the same shape for DrawForm and is what this is modelled on. ONE RESIDENT RECORD, NOT A REGISTER FILE: a forge record is 192 bytes -- THREE MEM.GUARD lines -- so `zhao_geom_ladderbank`'s whole-page-in-flops treatment would be ~15,000 flops on a device where ALMs are the binding constraint. Instead the header is read once at publication and a BOUNDED LINEAR SCAN of record line 0 finds the program index per draw, worst case count+2 reads of 64 bytes on the rarest traffic the ENGINE1 share carries (one per DRAW, against GEOM.MESHFETCH's one per MESHLET). THE ROTATION IS DISCHARGED HERE: `spec/commands.zidl` warns in capitals that forge_kind = (family + 1) mod 6 and that a straight-through assignment is silently wrong for all six values; `kind_of_family` is the one place it lives in RTL, written as a TABLE so it can be checked by eye against the zidl's own column, and an elaboration guard $fatals if it is ever an identity on FAM_RIBBON. THE PAGE'S family GOVERNS and a disagreeing command kind refuses the draw and is counted -- and the two operands are authored in DIFFERENT PLACES (page by the packer, command by the game's draw), so the comparison is real and not two operands moving together. THE LINT FOUND A SILENT BUG IN THE FIRST DRAFT: `anchor0` was read one 32-bit word low, out of `rsv0`, with every field beside it right -- no count, no handshake and no verdict could have seen it and a bolt would simply have started in the wrong place. Verilator's UNUSEDSIGNAL on the bits the record HAS and the decoder never read is what caught it, which is the argument for reading unused-bit warnings on a record decoder rather than silencing them. NOT COMPOSED YET: its consumers `zhao_forge_prim`, `zhao_forge_prim_eval` and `zhao_forge_ring_eval` are not composed either, and the chain is ONE COMMIT OR NONE. DELETE THIS ENTRY when the forge chain composes."
