    why: "v1 shell-fit instrument's audio capture bank"
  # zhao_sys_pll_simclk and zhao_sys_reset_sync were here, saying they would
  # "reach the machine when the board joins the core". They do; see the note at
  # zhao_sys_pll above. A disposition with an expiry date written into it is a
  # deferral, and nothing was watching for the date to pass -- so membership is
  # derived now instead of asserted.

# Modules the console elaborates DESPITE a newer sibling existing. Each needs a
# reason good enough to survive the owner reading it.
version_exceptions:
