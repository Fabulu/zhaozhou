# design/prod_manifest.yml — ONE implementation of every intended production
# block, and an explicit reason for every module that is left out.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
# reports/WeNeedSomeMeasurements.md, owner, 2026-09-03:
#
#   > Before adding many more blocks, it should build a production-only
#   > resource top. Not a fully functional console fit yet. Just one hierarchy
#   > that instantiates exactly one chosen implementation of every intended
#   > production block ... What does the planned console cost when counted
#   > once?
#
# The 185-DSP figure in the budget report is a SOURCE INVENTORY: it adds up
# every top-level .sv in the repository, so it counts old and new caches
# together, serial and scheduled reciprocals together, probes, leaf-fit
# wrappers and blocks that will never coexist. It is not the console's number
# and never claimed to be. This file is the list that makes a real number
# possible.
#
# ---------------------------------------------------------------------------
# THE RULE THE CHECKER ENFORCES
# ---------------------------------------------------------------------------
# EVERY module under fpga/rtl appears exactly once: as a `top` (instantiated by
# the resource top), as `inside` (already instantiated by something that is),
# or as `excluded` with a reason. A module that is in none of them is an error,
# because the failure this file exists to prevent is a block that is silently
# neither counted nor declared absent.
#
# `inside` entries are CHECKED against the real instantiation graph, not
# trusted -- see tools/quartus/check_prod_manifest.py.
#
# reason codes for `excluded`:
#   superseded   a newer implementation of the same logical block is chosen
#   frozen       an owner ruling froze it as reference/fallback, not production
#   probe        a synthesis probe or leaf-fit pair; never in the machine
#   harness      a stub/blank top used by tooling
#   unused       built, and nothing instantiates it yet

