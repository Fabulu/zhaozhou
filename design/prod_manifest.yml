  # (4,494 ALM / 3,725 reg / 5 M10K / 3 DSP at 58.99 MHz) is the only measured
  # FIELD number this repo has.
  - zhao_mem_share2: superseded  the two-requester wrapper over zhao_mem_share_n (R4); since 2026-09-19 both console sites instantiate the N core -- u_geom_mem_adapter at N=3 (MATERIAL.RESOLVE, R20) and the terrain read share -- and the wrapper stays on disk for its directed test
  - zhao_field_seq: superseded  the v1 sequencer; zhao_field_v3_engine is the composed engine, with the executor and service path under it
  - zhao_field_exec_shared: superseded  the v1 shared execution stage; zhao_field_v3_exec is the datapath now
  - zhao_field_curve: superseded  by zhao_field_v3_curve (with zhao_field_v3_spline under it)
  - zhao_field_len: superseded  by zhao_field_v3_len
