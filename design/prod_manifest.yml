  # single atomic act, not this block's.
  #
  # It is deliberately NOT declared absent or excluded. A block that is built
  # and installed nowhere is an UNCASHED CHEQUE, and `uncashed_cheques.py`
  # check 1 is written to watch exactly this -- so the note above is a
  # DEFERRAL WRITTEN DOWN ("until it is composed"), which that tool treats as
  # an open question, rather than a settled disposition that would silence it.
  # That is the C5 lesson from FIELD-REPAIR-PLAN-20260920.md applied before it
  # could bite a second time.
  #
  # A NOTE FOR WHOEVER MERGES THIS, because I got it wrong first and measured
  # it second. Adding this row regenerates `zhao_prod_top.sv` with an 8,256-line
  # diff, and the obvious mitigation -- append the row at the END of this list
  # so nothing renumbers -- DOES NOT WORK. `gen_prod_top.py` emits its census
