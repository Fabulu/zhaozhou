  - zhao_proj_arena3: superseded  a SECOND copy of a mechanism the 2026-08-24 ruling says must live once -- zhao_vertex_arena already owns it, with the committed geom_wcache_arena_bounds.sby proof (8 labelled assertions + 6 covers before the consolidation; the "58 formal assertions" once quoted here counted comment mentions, not properties). Kept as the DESIGN STUDY it is. Its dense-fill valid mechanism WAS folded into zhao_vertex_arena as VALID_MODE=1 on 2026-09-09, with the proof extended (prove_dense/cover_dense/bmc_dense tasks) and its padded-vs-mixed addressing observation repaired in the primitive (linear arena*DEPTH+index; prove_np2 holds it). See reports/ARENA-I-BUILT-A-SECOND-ONE-20260909.md and reports/VERTEX-ARENA-DENSE-SEAL-20260909.md

