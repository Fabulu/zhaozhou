  # owner, bank, queue and versioned child is therefore counted `inside` it and
  # must have no `excluded` row.
  #
  # zhao_texture_tmu_pipe and zhao_texture_material_combine_v1 were independent
  # selected roots only before this composition became authoritative. They are
  # now retained pre-Packet-B oracles under `excluded:superseded`, with retired
  # census slots preserving every surviving generated ordinal and LFSR seed.
  # Their RTL, tests, standalone fit targets and historical receipts remain.
  # This accounting correction deletes no hardware source and makes no physical
  # ALM/DSP reduction claim. The selected shell remains unchanged and does not
  # compose the V3 texture island; ownership scope below is still explicitly
  # `selected_subsystem`, not shell production.
  #
  # STALE AFTER PACKET B: the prior @g2-prod composed receipt (historically
  # 10,837 ALM / 17 DSP / 49 M10K) measured the old V3 child closure. Packet B
  # changed that closure, so those numbers are not evidence for this selection.
  # There is no current applicable ALM/DSP receipt for the Packet B hierarchy.
  #
  # zhao_texture_island_v3_top WAS A TOP HERE UNTIL 2026-09-20 and is not any
  # more. R86 swapped the shell to `zhao_shell_top_v2`, which reaches the island
  # through zhao_geom_bin_pipe_v2 -> zhao_raster_tile_pipe_v2 ->
  # zhao_raster_texture_stage_v3. It is now counted INSIDE that shell, under
  # this file's own rule that a module its parent instantiates is not a top.
  # The census total does not double; it stops being a separate standalone
  # instance beside a shell that did not contain one.
  #
  # Its two selected parameters MOVED WITH IT and are no longer a hand-kept
  # claim: `zhao_raster_tile_pipe_v2.sv:809` hardwires `.MIGRATION_SHADOWS(1'b0)`
  # and `BILERP_DSP2` defaults to 1'b0 through zhao_geom_bin_pipe_v2, so the
  # V3Param elaboration of the shell below resolves both arms from the
  # composition itself. The comment block above the sentence "The selected shell
  # remains unchanged and does not compose the V3 texture island" described the
  # tree until today; it composes it now.

  # --- the per-pixel texture path ------------------------------------------
  # TEXJOIN V2 remains in-tree as the behavioural oracle, but is excluded below:
  # V3 owns the lifecycle inside the selected texture subsystem. This is an
  # accounting correction only; neither path is connected to the shell today.
  # BOTH OF THESE NOW WIRE `zhao_raster_attrdiv_v2`. Done 2026-09-20 under owner
  # rulings R100 and R104; the paragraphs this replaces described the blocker
  # correctly and are kept in summary because the REASON is still load-bearing.
  #
  #   ROUNDING. v1 is round-half-AWAY-FROM-ZERO; v2, `spec/qformats.md` (:53
  #   and :147) and `zref::render::div_rhu_s128` are all round-half-UP. v2
  #   matched the reference on 640,000 sampled pairs; v1 differs by one LSB on
  #   100% of negative exact halves with an even divisor, at a rate ~1/(4d).
  #   OVERFLOW. v1 publishes q = 0 with `q_overflow_o`; v2 and the reference
  #   SATURATE to INT32_MAX/MIN. Different answers, not different reports.
  #   So v2 is RIGHT and v1 is wrong. ADOPTING V2 IS A BUG FIX.
  #
  # HOW THE `rem_o` BLOCKER WAS CLEARED, and the correction that mattered. The
  # earlier note said v2 "publishes no remainder at all" and R104 replied that
  # v2 already computes one, so the work was "publishing an internal signal".
  # BOTH HALVES WERE INCOMPLETE and the note below was closer:
  #
  #   * v2 does compute a residue, but it is NOT v1's. v1 divides 2|n|+A by 2A
  #     and publishes mod 2A; v2 divides M = n+floor(A/2) by A. No fixup turns
  #     one into the other, so the consumers' algebra is RE-DERIVED, as this
  #     note already said ("the proof must be re-taken, not transplanted").
  #   * the RAW residue is not publishable either: the negative branch divides
  #     |M|+A-1, so v2 now publishes the TRUE FLOOR REMAINDER after a one-line
  #     conditional fixup on the edge that already latches the quotient.
  #
  # v2 gained `rem_o [46:0]` and `rem_range_err_o`. The width is MEASURED, not
  # asserted -- widest observed 47 bits over the widest legal areas -- and the
  # guard has a committed positive control at
  # tests/mutants/zhao_raster_attrdiv_v2_remwidth_mutant.sv.
  #
  # THE REFUSAL MAPPING, which R104 called the half that can silently change
  # behaviour. `q_overflow_o` is not renamed, it is SPLIT. The service publishes
  # `q_saturated_o` and `q_error_o` both and collapses neither. ATTRSTEP refuses
  # on both, which reproduces v1's behaviour exactly on that path, because a
  # clamped quotient breaks q*A+r == M and is not a legal recurrence seed.
  #
  # WHAT MOVED IN THE CONSUMERS. ATTRSTEP lost its entire negative branch: v1's
  # law is symmetric about zero so its pair is a magnitude that BREAKS at zero,
  # while floor is continuous, so the second step decomposition, the sign bit,
  # the 96-bit shadow accumulator and the mid-row reseed are all gone. A row is
  # now one divide however often it crosses zero. Against that, v2 walks 98
  # quotient positions where v1 walked 33, so each divide is ~2.6-2.8x longer
  # (36 -> 101 clocks at radix 2, 20 -> 52 at radix 4). Both numbers are in the
  # blocks' headers. Recovering the occupancy by teaching v2 v1's window trick
  # is a named follow-on and is NOT assumed anywhere.
  #
  # NEITHER ROOT IS RECLASSIFIED AS A RETAINED ORACLE. Both are still selected
  # tops here: they are production hardware on the per-pixel path, and moving
  # them into `excluded:` to make the register green would be editing the
  # instrument to agree with the tree. v1 itself IS now a retained oracle --
  # nothing instantiates it and three committed differentials drive it -- and it
  # is declared as one under `excluded:`, which is a different act.
  - zhao_raster_attrdiv_svc
  - zhao_raster_attrinterp
  - zhao_raster_attrstep
  - zhao_raster_toon
  # RASTER.FOG, owner ruling D-5 step 5: the fog mix on the FINAL SOURCE COLOUR,
