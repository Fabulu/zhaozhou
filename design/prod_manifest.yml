# ==============================================================================
# LOGICAL OWNERSHIP ROLES -- role-aware, not merely graph containment
# ==============================================================================
# This records every implementation capable of owning the named lifecycle. The
# checker starts at `root` and requires exactly one reachable provider. Scope is
# deliberately `selected_subsystem`: V3 is NOT connected to zhao_shell_top yet,
# and this declaration must never be cited as evidence that it is.
ownership_roles:
  raster_texture_fragment_lifecycle:
    scope: selected_subsystem
    root: zhao_texture_island_v3_top
    # Semantic ownership is explicit metadata. Neither module names nor graph
    # containment are allowed to infer that a block owns this lifecycle.
    provider_identification: explicit_registry
    providers:
      - zhao_texture_v3own
      - zhao_raster_texjoin_v2
      - zhao_texture_fragrob

# Keep retired ordinals as tombstones in the generated accounting hierarchy.
# Without this, deleting one sorted top renumbers and reseeds every later private
# LFSR, producing a broad generated diff that falsely resembles a broad hardware
# change. A tombstone emits no RTL; it only preserves every survivor's identity.
retired_census_slots:
  - zhao_raster_texjoin_v2
  - zhao_texture_material_combine_v1
  - zhao_texture_tmu_pipe

# ==============================================================================
# SELECTED-PRODUCTION PARAMETER OVERRIDES -- closed, explicit generator input
# ==============================================================================
# Exact schema: one selected `top:` key at two spaces, then one or more declared
# module parameter names at four spaces. Only explicitly typed integral scalar or
# packed parameters are accepted, and the literal's numeric value must survive
# coercion to the declaration's effective width and signedness unchanged. A
# dependent width sees only defaults and validated overrides from preceding
# parameter declarations; forward or cyclic widths are rejected. Values use
# canonical sized, nonnegative SystemVerilog literals (for example 1'b0, 12'd7
# or 8'hFF); expressions, YAML booleans, quoted scalars, X/Z digits and inferred
# profile-label settings are rejected. A top or parameter not declared elsewhere
# is rejected too.
#
# This is deliberately independent of `selected_profiles`: the mapping below
# chooses generated hardware, while a profile label records measurement intent.
# After Packet B no existing @g2-prod row is an applicable receipt.
# 2026-09-20, R86: the root MOVED from zhao_texture_island_v3_top to
# zhao_shell_top_v2, because the island stopped being a top when the shell
# started composing it. This is not a relocation of the same claim -- it is a
# strictly smaller one. The island's MIGRATION_SHADOWS / BILERP_DSP2 selection
# is now made by the RTL that instantiates it (zhao_raster_tile_pipe_v2.sv:809
# hardwires MIGRATION_SHADOWS=1'b0; BILERP_DSP2 defaults to 1'b0 through
# zhao_geom_bin_pipe_v2), so elaborating the shell resolves those arms from the
# composition rather than from a line in this file.
#
# BUILD_HPS_N IS A REAL PRODUCTION SELECTION AND IT WAS NOT PRICED. The console
# instantiates the shell as `zhao_shell_top_v2 #(.BUILD_HPS_N(2))`
# (zhao_console_core.sv:10531) while the module's own default is 1, so a
# resource top taking the default would size the HPS arbiter for one client and
# report the shell's memory front too small. The default was what the v1 shell
# was fitted at.
#
# AND THE SAME DEFECT, FOUND AND REPAIRED 2026-09-20 IN THE STAMP ADAPTER.
# `zhao_prod_top.sv` instantiated `zhao_field_stamp_adapter` with NO parameter
# override, so the census measured the module's DEFAULTS -- which were 12 in /
# 4 out, neither the S profile's own arity (8/3) nor the pair the console
# actually composes (13/7, zhao_console_core.sv:16212-16213). They were EARTH's
# record, copied. So the resource top sized the client's request bus at 384
# bits while the console builds it at 416, and the census row described a
# machine nobody composes. The defaults are now 13/7, and the composed
# selection is stated here as well so that the two cannot drift apart silently
# a second time.
#
# STAMP_BINDING has NO SAFE DEFAULT (owner directive FH26: "legacy is an
# explicit mode, never the strict default"). The adapter refuses at elaboration
# if it is omitted, so this row is MANDATORY rather than a refinement -- which
# is the point: a census top can no longer take the permissive bridge by
# accident. 1 = LEGACY_STAMP_BRUSH, the binding the console composes today.
production_parameter_overrides:
  zhao_shell_top_v2:
    BUILD_HPS_N: 32'd2
  # ---- THE SHARED FIELD PORT, STATED AT EVERY INSTANCE ----------------------
  # R151 is why this section has to be complete rather than representative.
  # `zhao_prod_top.sv` is what the whole-design census and the production fit
  # MEASURE, and it is generated with no parameter overrides of its own -- so
  # every instance there takes module DEFAULTS unless a row here says otherwise.
  # A1 found the stamp adapter defaulting 12/4 while the console passed 13/7,
  # which meant the production top had been pricing a 384-bit client bus against
  # the console's 416. The top that gets measured was not the machine that gets
  # composed, and nothing compared them.
  #
  # IT HAPPENED AGAIN IN THE SAME SECTION, WHICH IS THE PART WORTH RECORDING.
  # A1's own fix wrote `IN_LANES: 32'd13` here. Packet C1 moved the shared pair
  # to 15 for the WARP record (GEOM.WARP prerequisite P1) and this row did not
  # move with it -- so for the length of one commit the override AGREED WITH THE
  # OLD VALUE, which is worse than absent: an override that is present and wrong
  # looks audited. A stale override is a stale mutant wearing a manifest row.
  #
  # THE RULE THIS SECTION NOW CARRIES: the shared FIELD port width appears in
  # FOUR places -- the host instance, both adapter instances, and here -- and
  # they move together or the fit measures a machine nobody composed.
  zhao_field_host_v2:
    CLIENTS: 32'd2
    PROGS: 32'd8
    INSTR_N: 32'd32
    REGS: 32'd32
    TABLES: 32'd2
    TBL_N: 32'd64
    IN_LANES: 32'd15
    OUT_LANES: 32'd7
    # NOT the same quantity as OUT_LANES, equal to it here by coincidence of
    # this console's profile set. OUT_LANES is the capture WINDOW; this is the
    # count of canonical declared OUTPUTS.
    OUT_ORDINALS: 32'd7
    PREP_SCALARS: 32'd64
    CREDITS: 32'd2
    # The fabric knobs the console selects. Defaulting these in the census top
    # would price a FOUR-lane vector ALU and eight distance banks that the
    # console does not compose -- roughly the +6,000 ALM / +12 DSP that C2 puts
    # in front of the owner as an open question.
    FAB_LANES: 32'd1
    FAB_OUTSTANDING: 32'd4
    FAB_LONGQ: 32'd4
    FAB_GATHERS: 32'd4
    FAB_DIST_BANKS: 32'd2
    FAB_GROUP_PTS: 32'd1
    FAB_RING_UNITS: 32'd2
    FAB_RING_DESC: 32'd2
  zhao_field_stamp_adapter:
    STAMP_BINDING: 32'd1
    IN_LANES: 32'd15
    OUT_LANES: 32'd7
  zhao_field_flow_adapter:
    IN_LANES: 32'd15
    OUT_LANES: 32'd7
  # The E profile, composed at the SAME shared pair. Its own guards are the
  # profile minimum (`IN_LANES < 12`, `OUT_LANES < 4`) rather than an equality,
  # because a client that demanded exactly its own arity could never share a
  # bus -- and a number here that differed from the host's would be a silent
  # bit-slide across all four clients on the concatenated port rather than a
  # width error on one. That is not hypothetical: the composition was written
  # at 13/7 first and the linter's WIDTHEXPAND is what separated them.
  zhao_field_earth_adapter:
    IN_LANES: 32'd15
    OUT_LANES: 32'd7
  # NOT COMPOSED IN THE CONSOLE -- it is a census top only, and the row is here
  # anyway. `zhao_field_warp_adapter`'s own defaults are already 15/7, so this
  # override changes nothing today; that is exactly why it is written down.
  # R151's lesson is that a default nobody notices is what lets the measured
  # machine drift from the composed one, and the three instances above are all
  # 15/7 for the same reason. If the shared pair ever moves again, this row
  # moves with its siblings instead of being the one the grep missed.
  zhao_field_warp_adapter:
    IN_LANES: 32'd15
    OUT_LANES: 32'd7

# ==============================================================================
