# design/prod_manifest.yml — ONE implementation of every intended production
# block, and an explicit reason for every module that is left out.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
# reports/WeNeedSomeMeasurements.md, owner, 2026-09-03:
#
#   > Before adding many more blocks, it should build a production-only
#   > resource top. Not a fully functional console fit yet. Just one hierarchy
#   > that instantiates exactly one chosen implementation of every intended
#   > production block ... What does the planned console cost when counted
#   > once?
#
# The 185-DSP figure in the budget report is a SOURCE INVENTORY: it adds up
# every top-level .sv in the repository, so it counts old and new caches
# together, serial and scheduled reciprocals together, probes, leaf-fit
# wrappers and blocks that will never coexist. It is not the console's number
# and never claimed to be. This file is the list that makes a real number
# possible.
#
# ---------------------------------------------------------------------------
# THE RULE THE CHECKER ENFORCES
# ---------------------------------------------------------------------------
# EVERY module under fpga/rtl appears exactly once: as a `top` (instantiated by
# the resource top), as `inside` (already instantiated by something that is),
# or as `excluded` with a reason. A module that is in none of them is an error,
# because the failure this file exists to prevent is a block that is silently
# neither counted nor declared absent.
#
# `inside` entries are CHECKED against the real instantiation graph, not
# trusted -- see tools/quartus/check_prod_manifest.py.
#
# reason codes for `excluded`:
#   superseded   a newer implementation of the same logical block is chosen
#   frozen       an owner ruling froze it as reference/fallback, not production
#   probe        a synthesis probe or leaf-fit pair; never in the machine
#   harness      a stub/blank top used by tooling
#   unused       built, and nothing instantiates it yet

top:
  # --- the console shell, which is already an integrated hierarchy ----------
  # This is not a block, it is the machine as far as it has been composed: the
  # command front, the reduced renderer, memory, video and the debug counters.
  # The 99.50 MHz / 13,146 ALM renderer figure lives in here.
  - zhao_shell_top
  - zhao_cmd_decoder

  # --- texture island (Packet B production accounting) ----------------------
  # Count the current texture implementation exactly once, at its composed V3
  # boundary. Packet B replaced the stages beneath this root; every reachable
  # owner, bank, queue and versioned child is therefore counted `inside` it and
  # must have no `excluded` row.
  #
  # zhao_texture_tmu_pipe and zhao_texture_material_combine_v1 were independent
  # selected roots only before this composition became authoritative. They are
  # now retained pre-Packet-B oracles under `excluded:superseded`, with retired
  # census slots preserving every surviving generated ordinal and LFSR seed.
  # Their RTL, tests, standalone fit targets and historical receipts remain.
  # This accounting correction deletes no hardware source and makes no physical
  # ALM/DSP reduction claim. The selected shell remains unchanged and does not
  # compose the V3 texture island; ownership scope below is still explicitly
  # `selected_subsystem`, not shell production.
  #
  # STALE AFTER PACKET B: the prior @g2-prod composed receipt (historically
  # 10,837 ALM / 17 DSP / 49 M10K) measured the old V3 child closure. Packet B
  # changed that closure, so those numbers are not evidence for this selection.
  # There is no current applicable ALM/DSP receipt for the Packet B hierarchy.
  - zhao_texture_island_v3_top

  # --- the per-pixel texture path ------------------------------------------
  # TEXJOIN V2 remains in-tree as the behavioural oracle, but is excluded below:
  # V3 owns the lifecycle inside the selected texture subsystem. This is an
  # accounting correction only; neither path is connected to the shell today.
  - zhao_raster_attrdiv_svc
  - zhao_raster_attrinterp
  - zhao_raster_attrstep
  - zhao_raster_toon
  # RASTER.FOG, owner ruling D-5 step 5: the fog mix on the FINAL SOURCE COLOUR,
  # after the toon quantiser and after material combination. Counted because it
  # is production hardware on the per-pixel path, not an experiment -- even
  # though no composed top instantiates it yet.
  - zhao_raster_fog

  # --- geometry -------------------------------------------------------------
  - zhao_geom_setup
  - zhao_geom_clip
  - zhao_geom_cull
  - zhao_geom_lod
  - zhao_geom_project
  # The per-vertex half of D-5: §8's frozen fog factor from the guarded w that
  # zhao_geom_project already emits on out_w_o.
  - zhao_geom_fogfactor
  - zhao_geom_skin
  - zhao_geom_pose_cache
  - zhao_geom_pose_decode
  - zhao_geom_vdecode
  - zhao_geom_wcache
  - zhao_geom_attrsetup
  - zhao_geom_parambuf
  # Both built 2026-09-03/04 from BORING_3D_FUNDAMENTALS_AUDIT. ASSEMBLE is R1,
  # the index walk that turns a meshlet into triangles -- the arrow that was
  # missing between MESHFETCH and SETUP, previously driven only by a harness.
  # DEPTHQUANT is R6, w to canonical invw24 under the selected depth profile;
  # twelve RTL files consume invw24 and nothing produced it.
  - zhao_geom_assemble
  - zhao_geom_depthquant
  # Both built 2026-09-04. MESHFETCH is position 1 of the composition order --
  # the geometry front end's entry point, which nothing downstream could be fed
  # by until it existed. It cannot pass MEM.GUARD yet and that is a PHASE
  # boundary rather than a defect (memory_rules.md 5), so it is counted: the
  # console intends to have it.
  #
  # SKIN.NORM produces the world normal GEOM.LIGHT consumes -- the last
  # unexplained input in the geometry graph, and a missing block rather than a
  # naming collision.
  - zhao_geom_meshfetch
  - zhao_geom_assetfetch
  # GEOM.MEM.ADAPTER shares the ONE permitted ENGINE1 client between the two
  # fetchers. It is production, not a harness part: D22 tread 10 established
  # that a second geometry fetcher has no client identity the guard admits and
  # the arbiter carries, so this is the only route MESHFETCH has to real memory.
  - zhao_geom_mem_adapter
  - zhao_geom_skin_norm

  # --- terrain (the 8 km island) -------------------------------------------
  # TERRAIN.ISLAND gives TERRAIN.RESIDENCY's miss its meaning: open sky rather
  # than a fault, on a grid that is 94.9% sky by design.
  - zhao_terrain_island_dir
  - zhao_terrain_patch
  - zhao_terrain_tess
  - zhao_terrain_normals
  - zhao_terrain_lod
  - zhao_terrain_project
  - zhao_terrain_velocity
  - zhao_terrain_bake
  - zhao_terrain_mipgen
  - zhao_terrain_residency_v2    # over zhao_terrain_residency

  # --- forge, particles, compositor, surface, measure -----------------------
  - zhao_forge_prim
  - zhao_forge_cliff
  - zhao_part_expand
  - zhao_part_ladder
  - zhao_part_record
  - zhao_part_soft
  - zhao_post_gather
  - zhao_twod_plane
  - zhao_twod_sprite
  - zhao_surface_sheet
  - zhao_surface_stamp
  - zhao_measure_governor
  - zhao_measure_tokens

  # --- FIELD v3, which is the production generation -------------------------
  # v1 is FROZEN by owner ruling 2026-08-25 and v2 is FROZEN as the exact
  # differential fallback (reports/Fieldv3.md Phase 1). Neither is in the
  # machine. The v3 EXECUTOR is not built yet -- see the report's hole list.
  - zhao_field_progcache
  # The long-op services are listed INDIVIDUALLY rather than through
  # zhao_field_v3_svcpath. That composition exists to test wiring: it carries a
  # deliberate RIVAL agent on the multiplier bank so refusal is reachable, and
  # it instantiates zhao_probe_curve_svc. Counting the machine through it would
  # bill the console for a probe and for a test rival.
  - zhao_field_v3_dispatch
  - zhao_field_v3_mulbank
  - zhao_field_v3_wbarb
  - zhao_field_v3_rf
  - zhao_field_v3_ring_svc     # carries zhao_field_v3_ring inside it
  - zhao_field_v3_len
  - zhao_field_v3_noise
  - zhao_field_v3_normalize
  - zhao_field_v3_rot
  - zhao_field_v3_trig
  - zhao_field_v3_spline
  - zhao_field_v3_sbank

# ==============================================================================
# LOGICAL OWNERSHIP ROLES -- role-aware, not merely graph containment
# ==============================================================================
# This records every implementation capable of owning the named lifecycle. The
# checker starts at `root` and requires exactly one reachable provider. Scope is
# deliberately `selected_subsystem`: V3 is NOT connected to zhao_shell_top yet,
# and this declaration must never be cited as evidence that it is.
ownership_roles:
  raster_texture_fragment_lifecycle:
    scope: selected_subsystem
    root: zhao_texture_island_v3_top
    # Semantic ownership is explicit metadata. Neither module names nor graph
    # containment are allowed to infer that a block owns this lifecycle.
    provider_identification: explicit_registry
    providers:
      - zhao_texture_v3own
      - zhao_raster_texjoin_v2
      - zhao_texture_fragrob

# Keep retired ordinals as tombstones in the generated accounting hierarchy.
# Without this, deleting one sorted top renumbers and reseeds every later private
# LFSR, producing a broad generated diff that falsely resembles a broad hardware
# change. A tombstone emits no RTL; it only preserves every survivor's identity.
retired_census_slots:
  - zhao_raster_texjoin_v2
  - zhao_texture_material_combine_v1
  - zhao_texture_tmu_pipe

# ==============================================================================
# SELECTED-PRODUCTION PARAMETER OVERRIDES -- closed, explicit generator input
# ==============================================================================
# Exact schema: one selected `top:` key at two spaces, then one or more declared
# module parameter names at four spaces. Only explicitly typed integral scalar or
# packed parameters are accepted, and the literal's numeric value must survive
# coercion to the declaration's effective width and signedness unchanged. A
# dependent width sees only defaults and validated overrides from preceding
# parameter declarations; forward or cyclic widths are rejected. Values use
# canonical sized, nonnegative SystemVerilog literals (for example 1'b0, 12'd7
# or 8'hFF); expressions, YAML booleans, quoted scalars, X/Z digits and inferred
# profile-label settings are rejected. A top or parameter not declared elsewhere
# is rejected too.
#
# This is deliberately independent of `selected_profiles`: the mapping below
# chooses generated hardware, while a profile label records measurement intent.
# After Packet B no existing @g2-prod row is an applicable receipt.
production_parameter_overrides:
  zhao_texture_island_v3_top:
    MIGRATION_SHADOWS: 1'b0
    BILERP_DSP2: 1'b0

# ==============================================================================
# SELECTED PROFILES -- intended measurement profile, not current evidence
# ==============================================================================
# The texture label below deliberately names the selected Packet-B production
# configuration even though no receipt has that label. The census must therefore
# report UNKNOWN instead of substituting any pre-Packet-B @g2-prod/unlabelled row.
#
# STALE AFTER PACKET B: every existing zhao_texture_island_v3_top profile receipt
# measured the pre-Packet-B child closure. There is currently no applicable
# ALM/DSP receipt for the selected Packet B hierarchy.
selected_profiles:
  - zhao_texture_island_v3_top: "@packet-b-prod" # deliberately unmeasured; MIGRATION_SHADOWS=0 above
  - zhao_geom_skin: null                     # unlabelled default; @MUL_LANES=* are alternatives

# ==============================================================================
# UNPRICED REQUIREMENTS -- specified functions with NO implementation to measure
# ==============================================================================
# Added 2026-09-09. Owner brief 2.1 defines the term: "intended functionality
# with no applicable measurement", and 1.3 names the consequence: "GEOM.LIGHT is
# still a required specified function in the inspected contract; normal-map
# detail and base terrain lighting cannot disappear from the bill just because
# they do not yet have accepted implementations."
#
# These five have a ratified contract, NO RTL file, and -- until this entry --
# no line anywhere in the bill. They were not among the census's 34 "unpriced"
# rows either, because that count walks manifest entries and these had none.
# Invisible rather than unknown, which is the worse of the two.
#
# They are NOT in `top:`: there is nothing to fit, and a zero row would be the
# substituted zero the brief forbids. They are listed so the bill can say the
# machine is incomplete by name, and so packet A0's gate -- "every required
# function has a non-silent row" -- can actually be met.
#
# Each is a real DSP/ALM cost the 192-DSP figure does not contain.
unpriced_requirements:
  - GEOM.LIGHT: zhao_geom_light  vertex lighting; one law, three normal producers; RTL not built
  - TERRAIN.SHADE: zhao_terrain_shade  terrain shading; contract maturity REFERENCE_COMPLETE, RTL not built
  - MATERIAL.RESOLVE: zhao_material_resolve  material resolve; RTL not built
  - FORGE.SHADOW: zhao_forge_shadow  forge shadow; RTL not built
  - MEM.UPLOAD: zhao_mem_upload  upload path; RTL not built
  # THE FORGE.PRIM EVALUATOR -- the block that turns a params block into vertex
  # POSITIONS. Added 2026-09-09 after reading the owner's reports/ADDLIGHTNING.md
  # (2026-09-04, never read on this lane) and TESTING its central claim.
  #
  # The claim: "FORGE.PRIM is not fully usable yet... it currently owns topology
  # only... the module literally has no position or params inputs. Its own header
  # says that positions are supposed to come from a separate evaluator."
  #
  # IT HOLDS. zhao_forge_prim.sv takes a job descriptor (family, segments, sides,
  # material, view_mask, src_id) and emits triangle INDICES (t_i0_o/t_i1_o/t_i2_o)
  # plus counters. No positions, no params port. Its header line 39 says so
  # outright: "positions come from `params` through the evaluator, and a topology
  # that depended on a position would stop being bounded." Only two forge modules
  # exist -- prim and cliff -- so the evaluator is not merely unfinished, it is
  # absent.
  #
  # WHY IT IS LISTED HERE RATHER THAN LEFT IMPLIED: this was the third class of
  # silence from the A0 accounting work -- not "counted wrong" and not "unknown",
  # but having no line at all, so it never appeared even in the unpriced count.
  # Lightning is the owner's stated want and its blocker was invisible, sitting in
  # an unread document rather than in the bill.
  #
  # Scope, from the same document, so this is a bounded ask and not a blank
  # cheque: "Draw one deterministic ribbon with at most 24 segments and at most
  # two bounded branches" -- explicitly NOT "any number of branching antialiased
  # electrical lines with arbitrary widths".
  # 2026-09-09, later the same day: FORGE.PRIM.EVAL's row LEFT this list,
  # because this list means "ratified requirement, NO RTL file" and the RTL
  # now exists — zhao_forge_prim_eval + zhao_forge_jitter_rom, unit-verified
  # against zref::forge::eval_job (967 directed checks, determinism under
  # four stall patterns, caps refused, mutant-fired overrun guard). The block
  # is accounted in `excluded` below (built, composed nowhere, deliberately)
  # and priced by fit gate F-EVAL1 in design/fit_targets.yml when it runs.
  # What is STILL missing for lightning-on-screen is the FX.LIGHTNING
  # dispatch seam composing eval with prim — a seam, not a block, so it has
  # no row here; reports/FORGE-PRIM-EVAL-IMPLEMENTATION-20260909.md carries
  # the remaining-work list so it cannot go invisible the way the evaluator
  # itself did.

