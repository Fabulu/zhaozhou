  # "not-yet-adopted" is the deferral wording uncashed_cheques.py watches for.
  - zhao_forge_prim_eval: not-yet-adopted  the ADDLIGHTNING evaluator; unit-verified against zref::forge::eval_job (967 checks, determinism under 4 stall patterns, caps refused, mutant-fired overrun guard); adopt when the FX.LIGHTNING dispatch seam composes it with zhao_forge_prim; fit gate F-EVAL1 named in design/fit_targets.yml
  - zhao_forge_jitter_rom: not-yet-adopted  JITTER_Q16 table (generated by tools/forge/gen_jitter_rom.py), instantiated by zhao_forge_prim_eval only; adopted the moment its parent is

  # --- 2026-09-09, the ALM/DSP rescue's own new blocks -----------------------
