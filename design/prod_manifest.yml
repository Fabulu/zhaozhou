  # command front, the reduced renderer, memory, video and the debug counters.
  # The 99.50 MHz / 13,146 ALM renderer figure lives in the v1 shell inside here.
  #
  # V2, NOT V1, SINCE 2026-09-20 (owner ruling R86, and the owner's capitalised
  # rule "YOU ONLY GET TO FIT THE LATEST VERSION"). `zhao_console_core.sv:10529`
  # composes `zhao_shell_top_v2`; this resource top composed `zhao_shell_top`,
  # so the production fit would have measured a shell nobody ships -- 42 modules
  # against the shipped 83, with the V3 texture island, the Packet-D raster/geom
  # V2 pipeline and the six writer-aware video organs all absent from it.
  # `design/console_inventory.yml` had recorded v1 as `superseded` since
  # 2026-09-19, citing that ruling verbatim, while every gate stayed green.
  - zhao_shell_top_v2
  - zhao_cmd_decoder
  # CMD.EXEC, composed into zhao_console_core 2026-09-19 (its section 7c).
  # A TOP here for the same reason CMD.DECODER is: the resource top does not
  # instantiate zhao_console_core, so neither block is reachable through it
  # and neither can be inside anything. Counted once, on its own.
  - zhao_cmd_exec
  # HOST.REGWIN and its two tenants, composed into zhao_console_core 2026-09-20
  # (its section 7b-iii, owner ruling R51). TOPS here for the same reason
  # CMD.EXEC is: the resource top does not instantiate zhao_console_core, so
  # they are reachable through nothing it holds and cannot be inside anything.
  #
  # COUNTED, not `not-yet-adopted`. They are composed, they are in the console
  # fit's source list, and they cost ALM and M10K in the shipping machine. The
  # aperture is small (a four-state FSM, four saturating counters and a 2:1
  # response mux); the two tenants are smaller still and add no memory -- the
  # histogram's bins and the trace ring are already priced at their own blocks,
  # and these only address them.
