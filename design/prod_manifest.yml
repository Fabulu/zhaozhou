# ==============================================================================
# UNPRICED REQUIREMENTS -- specified functions with NO implementation to measure
# ==============================================================================
# Added 2026-09-09. Owner brief 2.1 defines the term: "intended functionality
# with no applicable measurement", and 1.3 names the consequence: "GEOM.LIGHT is
# still a required specified function in the inspected contract; normal-map
# detail and base terrain lighting cannot disappear from the bill just because
# they do not yet have accepted implementations."
#
# These five have a ratified contract, NO RTL file, and -- until this entry --
# no line anywhere in the bill. They were not among the census's 34 "unpriced"
# rows either, because that count walks manifest entries and these had none.
# Invisible rather than unknown, which is the worse of the two.
#
# They are NOT in `top:`: there is nothing to fit, and a zero row would be the
# substituted zero the brief forbids. They are listed so the bill can say the
# machine is incomplete by name, and so packet A0's gate -- "every required
# function has a non-silent row" -- can actually be met.
#
# Each is a real DSP/ALM cost the 192-DSP figure does not contain.
unpriced_requirements:
  # 2026-09-19: GEOM.LIGHT's row LEFT this list, on the FORGE.PRIM.EVAL
  # precedent above -- this list means "ratified requirement, NO RTL file",
  # and the RTL now exists. zhao_geom_light.sv is built (one zhao_terrain_shade
  # turn per light term, II = 167.0 measured) and so is the streamed
  # zhao_light_stream beside it with its two arithmetic leaves and the creature
  # adapter. All five are accounted in `excluded` below as not-yet-adopted, and
  # GEOM.LIGHT REMAINS A REQUIRED SPECIFIED FUNCTION that no selected top
  # instantiates -- it has moved from "unbuilt" to "built and deferred", which
  # is a different fact and not a smaller one. Leaving the row would have made
  # tools/budget/dsp_census.py go on printing "no RTL, nothing to measure"
  # about a file that is in the tree.
  #
  # TERRAIN.SHADE's row below carries the IDENTICAL staleness -- zhao_terrain_
  # shade.sv was built 2026-09-09 and is accounted `excluded: unused` -- and is
  # deliberately left for that lane rather than corrected in passing. Flagged
  # here so the next reader inherits a known defect instead of a silent one.
  # 2026-09-23: TERRAIN.SHADE's and MEM.UPLOAD's rows LEFT this list, on the
  # GEOM.LIGHT and MATERIAL.RESOLVE precedents recorded above. This list means
  # "ratified requirement, NO RTL FILE", and both files exist -- but the
  # sharper fact is stronger than staleness: BOTH ARE IN THE zhao_console_core
  # FIT CLOSURE, and `zhao_mem_upload` is INSTANTIATED in the console. They were
  # inside the 258 sources of `@diag-incomplete-14gaps`, so they are not merely
  # built, they are MEASURED -- part of that row's 359 DSP and 381,585
  # registers.
  #
  # A row saying "RTL not built" about a module the fit just priced makes
  # `tools/budget/dsp_census.py` exclude it from the total, which is why the
  # census reports 150 DSP against a measured 359 and warns that "a row
  # declared absent is a row nobody prices". Owner ruling R80 named repairing
  # this list as a PRECONDITION for the completion fit; the fit ran without it.
  #
  # FORGE.SHADOW's row WAS DELIBERATELY KEPT HERE, and the reason has now
  # EXPIRED. The paragraph said: "`zhao_forge_shadow.sv` exists, so the row is
  # stale in the same way -- but it is ABSENT from the console's fit closure,
  # so unlike these two it genuinely is not priced by anything, and the
  # SHADOWRIDE lane is composing it right now. Correcting it from here would
  # collide with that lane and would replace one wrong row with another the
  # same day."
  #
  # SHADOWRIDE LANDED 2026-09-23 and `zhao_forge_shadow` is INSTANTIATED in
  # `fpga/rtl/prod/zhao_console_core.sv` as `u_forge_shadow`, end to end from
  # `zhao_geom_ladderbank` through the SHARED `zhao_forge_assemble` to
  # GEOM.CLIP. The completion register moved 14 -> 13 on it. So the row now
  # says "RTL not built" about a module this console COMPOSES, which is the
  # worst version of this list's documented failure mode, and the deferral that
  # justified keeping it is spent. THE ROW IS REMOVED.
  #
  # WHAT IT IS NOT: priced. FORGE.SHADOW is built and composed but NOT
  # MEASURED -- `@diag-incomplete-14gaps` ran before SHADOWRIDE, so it is not
  # among that row's 258 sources and its DSP and ALM are not inside the 359 and
  # the 138,428. It moves from "declared absent, silently excluded from the
  # total" to "present and honestly unpriced", which is a different fact and
  # the one the next measurement has to answer. Do not read its removal from
  # this list as a claim about its cost.
  #
  # A DEFERRAL WITH A CONDITION NEEDS SOMETHING THAT READS THE CONDITION BACK.
  # This row's condition ("the lane is running right now") was true for about
  # five hours and nothing in the tree would have noticed it expiring;
  # `dsp_census.py`'s own warning is what surfaced it, three commits later.
  # That is the uncashed-cheque shape in CLAUDE.md, at its smallest scale.
