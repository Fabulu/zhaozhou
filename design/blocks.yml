      directed: tests/memory/mem_hps_bridge_directed.cpp
      random: tests/memory/mem_hps_bridge_random.cpp
    counters: [hps_ddr_bytes_by_client]
    source_ids: true
    async_bridge: true
    budget_group: platform
    maturity: SPECIFIED
    maturity_log: []
    deferred: false
    cut_order: null
    superseded_by: null
    notes: The hps↔gpu data bridge; command/particle/audio/trace traffic is accounted per client (§25).

  - id: MEM.GUARD
    name: Memory guard
    kind: rtl
    subsystem: memory
    clock_domain: gpu
    purpose: "Region/ownership checker between every fabric client and VRAM: a malformed command can never write outside the region the frame slot owns. Formally proven."
    contract: design/contracts/MEM.GUARD.md
    phase: 1
    owner_issue: ZH-029
    inputs: [client_req, guard_policy]
