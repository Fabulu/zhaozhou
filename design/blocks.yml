  - id: POST.GATHER
    name: Glow/distortion gather
    kind: rtl
    subsystem: compositor
    clock_domain: gpu
    purpose: Accumulate low-resolution glow, distortion-XY and outline buffers from the resolved frame.
    contract: design/contracts/POST.GATHER.md
    phase: 11
    owner_issue: ZH-046
    inputs: [dispatch, fb_tiles]
    outputs: [lowres_buffers]
    upstream: [CMD.SCHEDULER, RASTER.RESOLVE]
    downstream: [POST.COMPOSITE, MEM.GUARD]
    backpressure: ready_valid
    latency: variable
    target_throughput: 1 gather texel per clock
    reference_model: zref::post::glow_pack565
    tests:
      directed: tests/compositor/post_gather_directed.cpp
      random: tests/compositor/post_gather_random.cpp
      # The law and the plane, 2026-09-21 (owner ruling R195). The tag bench
      # sweeps ALL 2^24 (tag, rgb565) pairs against `zref::post::gather` and
      # carries its own positive control: it also scores the RTL against the
      # FOLDED law -- `unit_mul(c, unit_mul(gain, tint))` -- and REQUIRES a
      # difference (1,221,632 channel-values), because `mismatches == 0` over
      # 16.7 million points is otherwise a broken instrument until proven
      # otherwise. The store bench fires all three of its counters.
      law_directed: tests/compositor/post_gather_tag_directed.cpp
      store_directed: tests/compositor/post_gather_store_directed.cpp
    # CORRECTED 2026-09-21. This row declared ONE counter,
    # `post_gather_vram_bytes_by_client`, and that string was in NO `.sv` file
    # in the repository. Packet POSTMEAS read it correctly and its reading is
    # now confirmed by construction: a VRAM-bytes-BY-CLIENT counter cannot
    # belong to a block whose contract says it "reads no external memory" --
    # IT DESCRIBED THE PLANE STORE, which had not been built. The store exists
    # now (`zhao_post_gather_store.sv`) and reads no external memory either, so
    # the counter it stood in for was never going to be written. Retired.
    #
    # WHAT IS DECLARED HERE IS WHAT `zhao_post_gather.sv` ITSELF EXPORTS, and
    # that is a deliberate boundary rather than an omission.
