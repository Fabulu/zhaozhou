  - id: FIELD.PROGCACHE
    name: Field program cache
    kind: rtl
    subsystem: field
    clock_domain: gpu
    purpose: Cache Field IR microprograms + constant tables with hash/version check; a program that fails validation is safely rejected (charter §19.4), never executed.
    contract: design/contracts/FIELD.PROGCACHE.md
    phase: 7
    owner_issue: ZH-032
    inputs: [program_bytes, hash_check]
    outputs: [cached_program, reject_status]
    upstream: [CMD.SCHEDULER]
