  - id: MEM.HPS.BRIDGE
    name: HPS-DDR burst bridge
    kind: rtl
    subsystem: memory
    clock_domain: gpu
    purpose: The FPGA-side client of the framework's HPS-DDR AXI/bridge port — command rings, particle state, PCM audio and the trace arena cross here.
    contract: design/contracts/MEM.HPS.BRIDGE.md
    phase: 1
