        evidence: reference/include/zref/zref_material_resolve.hpp + tests/texture/material_resolve_directed.cpp (32 checks)
      - state: UNIT_VERIFIED
        date: "2026-09-19"
        evidence: >-
          fpga/rtl/texture/zhao_material_resolve.sv, differenced against
          zref::material::Resolver by tests/texture/material_resolve_rtl_directed.cpp
          -- 91 checks, 0 failures. Every counter SEEN TO FIRE. Owner ruling
