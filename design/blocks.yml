  - id: MEM.VRAM.ARBITER
    name: VRAM arbiter
    kind: rtl
    subsystem: memory
    clock_domain: gpu
    purpose: Guaranteed-client-liveness arbiter between VRAM clients and the SDRAM controller; formally proven to grant every guaranteed client within a tight, bisected bound (spec/memory_rules.md 2.1).
