    notes: >-
      COST IS DOMINATED BY THE PATCHES IT REJECTS, which is why the measured
      figure is per EXAMINED patch and not per emitted one. On an 8 km island
      94.9% of the grid is sky, so a radius-16 window asks 1,089 questions to
      emit a handful; at 3.02 clocks each that is ~3,300 cycles, about 0.2% of
      a 100 MHz frame.

      THE WINDOW IS SQUARE, NOT CIRCULAR, and that is the reference's law
      rather than an approximation: the visible set is a conservative superset,
      and a residency policy exact about the frustum evicts patches the moment
      the camera turns. Hysteresis belongs in the view, not the draw path.

      TWO CURSORS, NOT A FIFO. Issue and retire walk the identical order, and
      because the directory answers in order the retire cursor IS the
      answering coordinate -- so there is no in-flight queue whose depth could
      be wrong when the directory is later pipelined. err_tag_o latches if a
      tag ever arrives that the retire cursor did not expect, so the claim is
      checked rather than assumed.

      COMPOSING IT FOUND A DEFECT IN TERRAIN.ISLAND that that block's own
      21-check differential could not see: the island dropped an answer under
      backpressure, and every phase of its differential drove a_ready high on
      every cycle. 911 queries issued, 854 answered, 57 lost, deadlock.

