  # APPENDED AT THE END, AND THAT IS THE WHOLE POINT. A counter id IS its
  # zero-based index in this list (spec/counters.md 2), so inserting a name
  # beside its relatives silently renumbers every counter after it. These two
  # were first written beside the other paramarena/paramwalk entries and moved
  # here on 2026-09-23 after tools/design/check_counter_ids.py measured the
  # damage: cmd_dma_commands read index 246 against the RTL constant 198,
  # where the inherited breakage alone accounts for 244. The +2 was ours.
  # paramarena_burst_unaligned / paramwalk_burst_unaligned, 2026-09-23. These
  # two are unlike every other detector in this catalog: their SILENCE IN
  # SIMULATION IS GUARANTEED WHATEVER THE DESIGN DOES. A JEDEC BL8 SEQUENTIAL
  # burst wraps inside its aligned eight-column (16-byte) block; the arbiter
  # chops to min(rem, 8, row_tail) and so aligns only to the 2048-word row;
  # and sim/models/zhao_sdram_model.sv walks the column LINEARLY. So a
  # misaligned request is served CORRECTLY in simulation and WRONGLY by the
  # part, and no functional test can fail on the consequence. These count the
  # CAUSE instead -- a request address that is not a multiple of the quantum.
  - paramarena_burst_unaligned
  - paramwalk_burst_unaligned

