# =============================================================================
# Zhaozhou Design Ledger — design/blocks.yml
# The authoritative console schematic (charter §4): every hardware and software
# block, its maturity, its contract, its owner issue and its place in the
# dataflow graph. The §5 architecture diagram and the status dashboard are
# GENERATED from this file (tools/ledger, `npm run ledger:gen`); never edit the
# generated files by hand.
#
# Counts: 88 blocks = 73 FPGA (kind: rtl) + 15 software (kind: software).
# (World-identity wave RUN-20260816-0046 added GEOM.POSE — GEOM is now 11.
# The paragraph below records the original P2 bring-up arithmetic verbatim.)
# ARITHMETIC NOTE: P2's headline said "83 = 69 FPGA + 14 SW", but P2's own
# §1 group enumeration sums to 72 FPGA (SYS3 CMD3 MEM4 FIELD6 INPUT3 AUDIO1
# VIDEO4 MEASURE3 TERRAIN7 SURFACE2 GEOM10 RASTER5 TEXTURE4 PART7 FORGE2
# TWOD2 POST3 DEBUG3) — every listed block is registered here, none trimmed
# (plan 1.D: "Accept, no trim; completeness beats minimalism"). Software is
# P2's 14 PLUS SW.TOOLS.CAPTURE ratified as its own block (plan 1.D) = 15.
# Total 87. If a count of 84 was expected, the delta is this same P2
# headline-vs-enumeration discrepancy, not a registration error.
#
# Maturity law (charter §4): SPECIFIED < REFERENCE_COMPLETE < UNIT_VERIFIED <
# RTL_VERIFIED < SYNTHESIZED < INTEGRATED < HARDWARE_PROVEN. One step at a
# time, evidence pinned in maturity_log, validated against git history (V2).
# Every block starts at SPECIFIED in this file's first commit (bootstrap).
#
# blocked_on: hardware — never advances from SPECIFIED regardless of evidence
# until the orchestrator clears the hardware lane (plan §4).
# =============================================================================

schema_version: 1

# §25 mandatory counters (snake_case) plus the declared platform extensions.
# Block `counters` must be a subset of this catalog (rule V12).
counter_catalog:
  # §25 minimum list
  - frame_cycles
  - deadline_faults
  - commands
  - meshlets_fetched
  - vertices_decoded
  - vertices_transformed
  - triangles_submitted
  - triangles_clipped
  - triangles_culled
  - lod_representation_counts
  - field_instructions_by_profile
  - progcach_hits
  - progcach_misses
  - programs_rejected
  - terrain_samples_evaluated
  - terrain_triangles_emitted
  - surface_stamps
  - surface_texels_touched
  - tile_references
  - max_tile_list_depth
  - covered_fragments
  - early_z_rejects
  - texture_samples
  - cache_hits
  - cache_misses
  - blended_fragments
  - soft_particles
  - polygon_particles
  - vram_bytes_by_client
  - hps_ddr_bytes_by_client
  - scanout_starvation_cycles
  - audio_underruns
  # declared extensions (§25 says "at minimum"; these are platform glue)
  - pll_lock_lost
  - reset_assertions
  - cdc_drops
  - input_sequence_gaps
  - rumble_frames_dropped
  - sdram_refresh_stalls
  - sdram_bank_conflicts

blocks:

  # ===========================================================================
  # SYS — platform glue (fpga/rtl/platform). Hardware-gated: sys/ vendor
  # wrappers are pinned by upstream hash post-board (ZH-000, plan 1.F).
  # ===========================================================================

  - id: SYS.PLL
    name: Vendor PLL wrappers
    kind: rtl
    subsystem: platform
    clock_domain: async
    purpose: Instantiate the Cyclone V PLL/IP wrappers producing the gpu/sdram/video/audio clock tree; nothing else may touch clock configuration.
    contract: design/contracts/SYS.PLL.md
    phase: 0
    owner_issue: ZH-000
    inputs: [ref_clk, pll_config]
    outputs: [gpu_clk, sdram_clk, video_clk, audio_clk, pll_locked]
    upstream: []
    downstream: [SYS.RESET]
    backpressure: none
    latency: fixed:1
    target_throughput: n/a (configuration wrapper)
    reference_model: zref::SysPll
    tests:
      directed: tests/platform/sys_pll_directed.cpp
      random: tests/platform/sys_pll_random.cpp
    counters: [pll_lock_lost]
    source_ids: true
    budget_group: platform
    maturity: SPECIFIED
    maturity_log: []
    blocked_on: hardware
    deferred: false
    cut_order: null
    superseded_by: null
    notes: Absolute frequencies frozen post-Phase-0 (charter §25); Verilator lane uses a single conceptual clock.

  - id: SYS.RESET
    name: Reset sequencer
    kind: rtl
    subsystem: platform
    clock_domain: async
    purpose: Sequence per-domain resets after pll_locked; formal property reset-reaches-idle (every FSM returns to its idle state on reset assertion).
    contract: design/contracts/SYS.RESET.md
    phase: 0
    owner_issue: ZH-000
    inputs: [pll_locked, hard_reset_n]
    outputs: [rst_n_gpu, rst_n_sdram, rst_n_video, rst_n_audio]
    upstream: [SYS.PLL]
    downstream: [SYS.CDC]
    backpressure: none
    latency: variable_bounded:16
    target_throughput: n/a (sequencer)
    reference_model: zref::ResetSequencer
    tests:
      directed: tests/platform/sys_reset_directed.cpp
      random: tests/platform/sys_reset_random.cpp
      formal: tests/formal/sys_reset_reset_reaches_idle.sby
    counters: [reset_assertions]
    source_ids: true
    budget_group: platform
    maturity: SPECIFIED
    maturity_log: []
    blocked_on: hardware
    deferred: false
    cut_order: null
    superseded_by: null
    notes: Fanout to every domain's reset; only the SYS.CDC edge is drawn in the schematic.

  - id: SYS.CDC
    name: Ready/valid CDC FIFO library
    kind: rtl
    subsystem: platform
    clock_domain: async
    purpose: "The ONLY general clock-domain-crossing primitive: parameterised ready/valid async FIFOs. Any edge crossing clock domains routes through this block or a block documented as its own async bridge (rule V8)."
    contract: design/contracts/SYS.CDC.md
    phase: 0
    owner_issue: ZH-000
    inputs: [w_valid, w_data, r_ready, wr_clk, rd_clk]
    outputs: [w_ready, r_valid, r_data]
    upstream: [SYS.RESET]
    downstream: []
    backpressure: ready_valid
    latency: variable_bounded:4
    target_throughput: 1 word per clock per direction
    reference_model: zref::CdcFifo
    tests:
      directed: tests/platform/sys_cdc_directed.cpp
      random: tests/platform/sys_cdc_random.cpp
      formal: tests/formal/sys_cdc_no_data_loss.sby
    counters: [cdc_drops]
    source_ids: true
    budget_group: platform
    maturity: SPECIFIED
    maturity_log: []
    blocked_on: hardware
    deferred: false
    cut_order: null
    superseded_by: null
    notes: "leaf consumer of the reset tree; instantiated by every bridge block (async_bridge: true below)."

  # ===========================================================================
  # CMD — command path (fpga/rtl/command)
  # ===========================================================================

  - id: CMD.DMA
    name: Command DMA
    kind: rtl
    subsystem: command
    clock_domain: gpu
    purpose: Fetch sealed frame packets from the HPS-DDR ring via the framework bridge; verify CRC and epoch before any byte reaches the decoder; the documented hps→gpu async bridge for the command stream.
    contract: design/contracts/CMD.DMA.md
    phase: 1
    owner_issue: ZH-007
    inputs: [hps_ddr_burst_rd, ring_descriptor, slot_epoch]
    outputs: [sealed_packet_bytes, dma_status]
    upstream: [SW.CMDBUILD, MEM.HPS.BRIDGE]
    downstream: [CMD.DECODER]
    backpressure: ready_valid
    latency: variable
    target_throughput: saturate one HPS-DDR burst slot per frame
    reference_model: zref::CmdDma
    tests:
      directed: tests/command/cmd_dma_directed.cpp
      random: tests/command/cmd_dma_directed.cpp
      formal: tests/formal/cmd_dma_crc_gate.sby
    counters: [commands, hps_ddr_bytes_by_client, deadline_faults]
    source_ids: true
    async_bridge: true
    budget_group: command_debug
    maturity: RTL_VERIFIED
    maturity_log:
      - state: REFERENCE_COMPLETE
        date: "2026-08-16"
        commit: "768ce1a"
        evidence: reference/include/zref/zref_cmd2.hpp
      - state: UNIT_VERIFIED
        date: "2026-08-15"
        commit: "b64afe2"
        evidence: tests/command/cmd_dma_directed.cpp
      - state: RTL_VERIFIED
        date: "2026-08-16"
        commit: "4f76d2e"
        evidence: demos/wound_lab/duo_markers.cpp
    deferred: false
    cut_order: null
    superseded_by: null
    notes: >-
      Fail-safe order per capture_format.md §3.3 — never emits a byte of a
      packet whose header CRC failed. REFERENCE_COMPLETE re-pinned at the
      W2.6 merge: the original 38f9b96 evidence named zref::CmdDma, which
      did not exist there (the verdict oracle was a static function inside
      the directed test); 768ce1a is the commit where the named symbol
      became real in zref_cmd2.hpp.

  - id: CMD.DECODER
    name: Command decoder
    kind: rtl
    subsystem: command
    clock_domain: gpu
    purpose: Validate and dispatch semantic commands from sealed packets (generated ABI package); any malformed record becomes a safe error code, never a partial write.
    contract: design/contracts/CMD.DECODER.md
    phase: 1
    owner_issue: ZH-008
    inputs: [sealed_packet_bytes]
    outputs: [decoded_records, decode_error]
    upstream: [CMD.DMA]
    downstream: [CMD.SCHEDULER, DEBUG.TRACE]
    backpressure: ready_valid
    latency: variable_bounded:4
    target_throughput: 1 record per clock
    reference_model: zref::cmd::validate
    tests:
      directed: tests/command/cmd_decoder_directed.cpp
      random: tests/command/cmd_decoder_directed.cpp
    counters: [commands]
    source_ids: true
    budget_group: command_debug
    maturity: UNIT_VERIFIED
    maturity_log:
      - state: REFERENCE_COMPLETE
        date: "2026-08-21"
        commit: c3f1254
        evidence: reference/include/zref/zref_cmd.hpp
      - state: UNIT_VERIFIED
        date: "2026-08-21"
        commit: d2cf80d
        evidence: tests/command/cmd_decoder_directed.cpp

    deferred: false
    cut_order: null
    superseded_by: null
