    kind: rtl
    subsystem: terrain
    clock_domain: gpu
    purpose: "Moves ONE whole 21,376-byte terrain page from the HPS staging arena into one TERRAIN.PAGE_POOL slot, CRC-checks it in flight over bytes [64, 21320), and reports success or failure plus the CRC it saw to TERRAIN.RESIDENCY. It never publishes: ruling T7's 'a half-loaded or CRC-failed page is never rendered' is the directory's to enforce and this block's to make enforceable. Closes step 3 of the world-layer build sequence and reports/Missingterrain's 'prefetching from cartridge/HPS DDR into local SDRAM'."
    contract: design/contracts/TERRAIN.PAGELOADER.md
    phase: 6
    owner_issue: ZH-126
    inputs: [page_load_jobs]
    outputs: [loader_completions]
    upstream: [MEM.HPS.BRIDGE, TERRAIN.SEQ, TERRAIN.LOADQ]
    downstream: [TERRAIN.RESIDENCY, MEM.GUARD, TERRAIN.MIPGEN]
    backpressure: ready_valid
    latency: variable
    target_throughput: "one 21,376-byte page per 12,028 gpu clocks, measured on the sim bridge profile"
    reference_model: zref::terrain::page_load
    tests:
      directed: tests/terrain/pageloader_rtl_directed.cpp
      random: tests/terrain/pageloader_rtl_directed.cpp
    counters: [pageloader_pages_loaded, pageloader_pages_faulted, pageloader_pages_refused, pageloader_crc_fails, pageloader_hdr_ident_fails, pageloader_incomplete, pageloader_guard_denied, pageloader_bridge_errs, pageloader_load_bytes]
    source_ids: true
    budget_group: geometry_mantle
    maturity: UNIT_VERIFIED
    maturity_log:
      - state: SPECIFIED
        date: "2026-09-06"
        commit: "973682f8"
        evidence: design/contracts/TERRAIN.PAGELOADER.md
      - state: UNIT_VERIFIED
        date: "2026-09-06"
        commit: "973682f8"
        evidence: tests/terrain/pageloader_rtl_directed.cpp
    deferred: false
    cut_order: null
    superseded_by: null
    notes: >-
      Its job source will be TERRAIN.SEQ, which is step 5 of the world-layer
      build sequence and does not exist yet -- so that edge is deliberately
      absent from `upstream` rather than asserted against a block nobody has
      written.

      NO LONGER UNINTEGRABLE -- merely unintegrated. All three blockers were
      enacted on 2026-09-06: zhao_client_e gained ZHAO_CLIENT_TERRAIN_BUILD = 6
      (leaving 5 a deliberate hole, which IS ruling T3's "do not spend it
      pre-emptively"); zhao_vram_arbiter went five -> seven ports, WIDENED
      rather than packed because the array index IS the client id there, with
      port 5 dead by construction and its grant forced low so a request there
      is refused rather than latched into a slot that could never be served;
      and MEM.GUARD gained a write-only TERRAIN.PAGE_POOL window at
      [0x0400_0000, 0x054E_0000), which is T2's inclusive range TO THE BYTE.

      THE FORMAL PROOF WAS RE-RUN, which ruling T3 asks for, and it is the
      evidence that matters here rather than the test counts.
      mem_guard_no_escape PASSES before and after, with the new cover statement
      REACHED so the window is not proved vacuously; and
      mem_vram_arbiter_liveness gives IDENTICAL verdicts on all four tasks with
      seven ports as with five -- including both tight-bound tasks still
      failing at 51 and 33 -- which is the proof that a background client at
      the bottom of the order does not move the guaranteed-client service law.

      The bench expectation flipped with it: the observer used to assert the
      real guard NEVER passed one of these writes, and now asserts 334 passed,
      334 forwarded, 0 refused on a clean page -- exactly, not "at least". A
      third real guard instance on bench-driven wires supplies the negative
      direction the loader cannot produce, since the loader only ever issues
      legal requests. 154 -> 179 checks.

      WHAT IS STILL WEAKER THAN THE RULING, stated rather than glossed: T2 wants
      "a loader may write only a LOADING slot", and state-aware permission is
      NOT implemented. The guard has one muxed request port and no residency
      context; the interface that would carry it is unruled. The residual is
      exact -- a faulty TERRAIN_BUILD may write a page slot other than the one
      it was told to load. It cannot reach a framebuffer, the asset pool, the
      rest of bank 2, or anything outside the map, so the no-escape theorem is
      intact; the worst case is corrupt ground for one page, caught by the CRC
      before publication.

      THE DESTINATION IS COMPUTED, NEVER ACCEPTED: REGION_BASE + slot *
      PAGE_BYTES, with the slot range-refused first, so writing outside the
      region is a state the block cannot reach. SLOTW is deliberately one bit
      wider than the pool needs: at 10 bits slot 1024 truncates to slot 0 and
      overwrites a live page, and a truncation is a clamp with no counter.

      ONE RULING REVERSED THE ARCHITECTURE SKETCH. Section 2.3 said `fin` is
      WITHHELD on a CRC mismatch. Ruling T10 and TERRAIN.RESIDENCY's actual
      fin_ok_i/fin_crc_i ports both postdate it and say the opposite, and they
      are right: withholding leaves the slot in LOADING forever, so a corrupt
      page would permanently retire one of 1,024 slots with nothing counted.
      Every job now produces exactly one completion.

      TWO FIRE TESTS EARNED THEIR KEEP AND CHANGED THE SUITE. Merging the guard
      arms originally moved ONE number -- guard_denied 3341 against 3342 -- while
      the page still loaded byte-perfect and every result assertion stayed
      green; a check for zero denials on a clean load was added because breaking
      it on purpose showed the hole. Issuing every write twice produced a
      BYTE-IDENTICAL VRAM image and was visible only in counters.

      STILL UNRULED: which CRC declaration governs when the job's
      expected_page_crc32c and the page header's own word disagree. Both are
      written; nothing says which wins. Both are checked behind
      CHECK_HEADER_CRC rather than one being picked silently.

  - id: TERRAIN.PAGEIO
    name: Bake's page window (layer D in, layers B and D out)
    kind: rtl
    subsystem: terrain
    clock_domain: gpu
    purpose: "Serves the FOUR TERRAIN.BAKE page ports that no block in the machine serves: the layer-D reads behind vtx_nobake_i and cell_state_i, and the layer-B and layer-D writebacks on sc_* and cs_*. Layer D (page offset 6,598) had ZERO readers anywhere under fpga/ and layers B and D had no writer at all, so a bake could compute a scar and a breach and had nowhere to put either -- a bake whose scar cannot be stored has not deformed anything. One block and not two because all four ports need the same residency slot, the same generation and the same MEM.GUARD socket on the terrain page pool, and zhao_terrain_bake_v2 processes one record at a time with strictly sequential phases, so one agent per bake is sufficient by construction. It is also the only block that holds the slot and generation a patch was served under while learning from bake_done_o that the bake finished, which makes it the natural -- and on present evidence the only -- writer of the directory's deformation mark terr_dm_*."
    contract: design/contracts/TERRAIN.PAGEIO.md
    phase: 6
    owner_issue: ZH-128
    inputs: [page_bake_jobs]
    outputs: [page_bake_completions, deformation_marks]
    upstream: [TERRAIN.SEQ, TERRAIN.RESIDENCY, MEM.GUARD, TERRAIN.BAKE]
    downstream: [TERRAIN.BAKE, MEM.GUARD, TERRAIN.RESIDENCY]
    backpressure: ready_valid
    latency: variable
    target_throughput: "one bake window per patch-bake record: 17 layer-D read bursts in, 35 layer-B plus 17 layer-D write bursts out, plus four read-modify-write edge words; derived from the spec section 2 layout, not observed"
    reference_model: zref::terrain::nobake_corner_shadow
    tests:
      directed: tests/terrain/pageio_rtl_directed.cpp
      random: tests/terrain/pageio_rtl_directed.cpp
    counters: [pageio_pages_read, pageio_pages_written, pageio_guard_denied, pageio_bursts_read, pageio_bursts_written, pageio_stale_gen, pageio_marks_emitted, pageio_jobs_refused]
    counter_ports:
      pageio_pages_read: pages_read_o
      pageio_pages_written: pages_written_o
      pageio_guard_denied: guard_denied_o
      pageio_bursts_read: bursts_read_o
      pageio_bursts_written: bursts_written_o
      pageio_stale_gen: stale_gen_o
      pageio_marks_emitted: marks_emitted_o
      pageio_jobs_refused: jobs_refused_o
    source_ids: true
    budget_group: geometry_mantle
    maturity: SPECIFIED
    maturity_log:
      - state: SPECIFIED
        date: "2026-09-20"
        commit: "78c644ca"
        evidence: design/contracts/TERRAIN.PAGEIO.md
    deferred: false
    cut_order: null
    superseded_by: null
    notes: >-
      THIS ROW IS THE POINT OF THE PACKET THAT WROTE IT. The contract was
      written on 2026-09-20 and deliberately left the ledger row out, on the
      reasoning that an unbuilt row is itself a gap. The consequence was the
      opposite of the one intended: tools/budget/completion_register.py walks
      this file, so a capability with NO ROW is not absent from the console,
      it is absent from the QUESTION. The register's total was never wrong --
      it was answering a smaller question than its readers assumed. A gap that
      no instrument can see is worse than a gap that every run prints, so the
      row lands FIRST, before the RTL, and the register's total RISES when it
      does. That rise is the instrument starting to work.

      RULING T4 ANSWERS THE CONTRACT'S OWNER DECISION 1, and it was already
      written down. The contract asks whether layer B is persisted through the
      HPS journal or whether a direct pool write is the whole of it.
      zhao_terrain_writeback.sv's header states T4 as "B and D are NEVER
      written back (the HPS keeps the canonical mirror current from the same
      deterministic commands)" and gives that as the reason layer F -- which
      has no canonical mirror -- must go behind an ACK barrier while B and D
      must not. So the pool write is the whole of it, there is no second
      doorbell and no second ticket space, and the contract's own recommended
      reading is the ruled one. It is recorded here rather than re-asked.

      THE CONTRACT'S SECTION 4 RECOMMENDATION OF BYTE ENABLES IS STRUCTURALLY
      UNAVAILABLE, and this is the correction that most changes the block.
      zhao_mem_guard.sv computes be_ok = (req.be == mask_of(req.len)) and
      gates every request on it, and its own header says byte_enable "must be
      the FULL contiguous mask over [addr, addr+len) (partial-word masking is
      NOT in the Phase-2 arbiter)". zhao_vram_arbiter.sv confirms it from the
      other side: it converts len to WORDS (words_of(client_req[k].len)) and
      the SDRAM controller never sees a byte mask at all. So the VRAM write
      granularity in this machine is a 64-bit WORD and a sparse be is a guard
      VIOLATION, not an optimisation. The edge handling is therefore a
      read-modify-write, and it is smaller than the contract feared: not the
      edge BURSTS but the edge WORDS, of which there are exactly two per
      plane. Layer B spans [2242, 4420) so its first word (2240) carries
      layer A's last two bytes and its last word (4416) carries layer C's
      first four; layer D spans [6598, 7622) so its first word (6592) carries
      layer C's last six bytes and its last word (7616) carries layer E's
      first two. Four shared words per bake, everything between them wholly
      owned. The directed test the contract asks for -- neighbouring layers
      byte-identical after a bake -- is the acceptance test for exactly this.

      WHAT IT DOES NOT CLOSE, stated because the attraction of this block is
      that it looks like it closes three core entries. I32 does not close on
      this block alone: bake also needs its A/B/C reads adapted from
      TERRAIN.PAGESTREAM's push to its pull, and the stamp_results to cmd_*
      record seam that entry I32 is actually about. I27 gains a writer for
      terr_dm_*, which is its first half; the terr_chk_* half is untouched.
      (I27's terr_chk_* half CLOSED 2026-09-22 (gz/terrclose), by a different
      caller entirely: zhao_terrain_lodfeed, which holds a page's residency
      handle across its ~9,700-clock deviation walk while zhao_terrain_devstore
      files that walk's records BY SLOT. Nothing about this block. The sentence
      above stands as written -- it was about TERRAIN.PAGEIO and it was right.)
      I28 is already closed (rulings R14 and R4) and merely has never seen a
      beat, because nothing in the machine can dirty a page.

