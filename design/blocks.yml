    target_throughput: "one patch read per compose-door patch: ONE 64-byte history burst plus FOUR record bursts in, plus one history burst out when the LOD pass emitted a decision; one patch write per page load: FOUR record bursts. Derived from the record shape (16 records x 16 B + one 64-byte history row per slot) and MEASURED in terrain_lodpath_directed case 8, not merely derived."
