  - id: FIELD.SEQ.CORE
    name: Field IR sequencer core
    kind: rtl
    subsystem: field
    clock_domain: gpu
    purpose: "The register file and the instruction walk shared by all five FIELD.SEQ.* profiles: zero, load the input lanes, walk instructions until OP_END, read the output lanes."
    contract: design/contracts/FIELD.SEQ.CORE.md
    phase: 7
    owner_issue: ZH-078
    inputs: [cached_program, io_lanes]
    outputs: [io_lanes, sat_ledger]
