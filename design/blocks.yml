    owner_issue: ZH-087
    inputs: [shadow_caster, terrain_height]
    outputs: [forge_primitives]
    upstream: [CMD.SCHEDULER]
    downstream: [GEOM.SETUP]
    backpressure: ready_valid
    latency: variable
    target_throughput: see contract
    # TWO LANES AUTHORED THIS REPAIR INDEPENDENTLY AND REACHED THE SAME ANSWER.
    # `gz/projadopt` and `gz/forgeconnect` both removed the key, both re-verified
    # `shadow_hull` from scratch, and neither could see the other -- because the
    # coordinator briefed the second lane from the FIRST LANE'S UNMERGED BRANCH
    # as though it were the tree (owner ruling R106). The duplication cost a
    # hand-resolved conflict and nearly cost the counter catalogue, which is
    # append-only with ids equal to positions. The agreement is worth recording:
    # two independent searches for `zref::forge::shadow_hull` both found zero.
    #
    # `reference_model: zref::forge::shadow_hull` STOOD HERE UNTIL 2026-09-20
    # (owner ruling R94) AND THAT SYMBOL HAS NEVER EXISTED -- zero occurrences
    # anywhere under `reference/`, re-verified at this commit over every .hpp
    # and .cpp there. It is not a renamed model: `reference/include/zref/`
    # holds zref_forge.hpp, zref_forge_eval.hpp and the generated jitter table,
    # and none of the three declares a hull.
    #
    # THE DAMAGE IS NOT THAT THE FIELD WAS WRONG, IT IS THAT IT WAS QUIET.
    # `tools/budget/uncashed_cheques.py` check 3 reads these strings to find two
    # blocks that have declared the SAME ratified law -- the signal that caught
    # the 66-DSP projector duplication. A name that resolves to nothing can
    # never collide with anything, so this row was silently EXEMPT from one of
    # the few defences this tree has against a second implementation of ratified
    # arithmetic. A false `reference_model` is worse than a missing one.
    #
    # THE KEY IS REMOVED RATHER THAN REPLACED, because the block genuinely has
    # no reference model and inventing one would be the same defect with a
    # better name. `zhao_forge_shadow.sv` carries no `REFERENCE:` line,
    # `tests/forge/forge_shadow_directed.cpp` links no zref, and the block holds
    # no ratified arithmetic to model: its unit-circle table is sixteen
    # hand-written fx16 constants ("written out rather than computed so the
    # values are auditable") and its depth bias is an ART value the RTL
    # deliberately keeps as an editable knob under CLAUDE.md rule 6. SYS.PLL,
    # SYS.RESET and SYS.CDC carry no `reference_model` for the same reason.
    # If a hull oracle is ever written, this key comes back naming it.
    #
    # `uncashed_cheques.py` CHECK 5 now resolves every `reference_model:` in
    # this file against the tree, so the next one cannot be quiet. (And as of
    # R105 it strips COMMENTS before resolving -- otherwise a header explaining
    # that a phantom was replaced would itself resolve the phantom.)
    #
    # DO NOT INVENT ONE. If a hull oracle is ever written, this key comes back
    # naming it, and not before.
    tests:
      # WAS "PLANNED -- NOT WRITTEN" ON BOTH ROWS UNTIL 2026-09-20 (R94), while
      # the directed suite existed and passed. The same row carried a FALSE
      # PRESENCE and a FALSE ABSENCE at once, which is the thing to notice:
      # a ledger is not documentation, it is an input to the completion number.
      directed: tests/forge/forge_shadow_directed.cpp
      random: "PLANNED -- NOT WRITTEN"
    # THE FIVE CENSUS PORTS THE RTL ACTUALLY EMITS -- R94's other half, and it
    # IS repaired here, by the gz/forgeconnect lane. (The projadopt lane left
    # this deliberately undone, correctly, because `counter_catalog` is
    # APPEND-ONLY with ids equal to positions and two lanes appending
    # concurrently produce a merge whose wrong resolution renumbers every
    # counter after the seam. Exactly one lane held it. Verified before merging:
    # projadopt's commit range touches neither counter file.)
    #
    # This row read `[shadows_emitted, shadows_skipped]`, and it was wrong in
    # BOTH directions at once. `shadows_skipped` has no producer anywhere;
    # `zhao_forge_shadow.sv:160-162` emits four ports this list never named.
    # Four of the five record a CORRECT refusal and only
    # forge_shadow_tap_protocol is a fault. All are fired by legal stimulus in
    # forge_shadow_directed (39 checks), so none is owed a mutant -- checked,
    # not assumed. Ids 276-284 appended, nothing renumbered.
    #
    # `tools/design/check_counters.py` could see exactly ONE of these ten: it
    # detects declared-without-port and is BLIND to port-without-declaration
    # (owner ruling R110). That is why this row could drift -- the tool looks
    # only one way down its own comparison, and the defect made its report
    # SHORTER.
    counters: [shadows_emitted, forge_shadow_no_ground, forge_shadow_zero_radius, forge_shadow_far_rung, forge_shadow_tap_protocol]
    counter_ports:
      shadows_emitted: shadows_emitted_o
      forge_shadow_no_ground: no_ground_o
      forge_shadow_zero_radius: zero_radius_o
      forge_shadow_far_rung: far_rung_o
      forge_shadow_tap_protocol: tap_protocol_o
    source_ids: true
    budget_group: myriad_forge
    # The row said SPECIFIED with an empty log while a registered ctest passed
    # 39 checks against the block -- the false-absence half of R94. The RTL and
    # its directed test landed together in 759b449a.
    maturity: UNIT_VERIFIED
    maturity_log:
      - state: UNIT_VERIFIED
        date: "2026-09-19"
        commit: "759b449a"
        evidence: tests/forge/forge_shadow_directed.cpp
    deferred: false
    cut_order: null
    superseded_by: null
    notes: >-
      For a game of floating islands and airborne creatures, 'is that touching
      the ground' is legibility, not refinement. The audit: very small if done as
      geometry, and can make more perceptual difference than several expensive
      material effects. Ladder by rung -- hull, blob, splat, none -- selected as a
      COARSENESS FLOOR by the governor, reusing the PART.LADDER idea.
      DEPTH BIAS IS AUTHORED, NEVER ACCIDENTAL, per the CLAUDE.md ground-contact
      law: at exactly terrain height it z-fights, biased too far it reads detached.
      A named editable constant per rung, decided BY LOOKING.
      A caster over a void emits NO shadow, and that is correct rather than a fault.
