# =============================================================================
# Zhaozhou Design Ledger — design/blocks.yml
# The authoritative console schematic (charter §4): every hardware and software
# block, its maturity, its contract, its owner issue and its place in the
# dataflow graph. The §5 architecture diagram and the status dashboard are
# GENERATED from this file (tools/ledger, `npm run ledger:gen`); never edit the
# generated files by hand.
#
# Counts: 88 blocks = 73 FPGA (kind: rtl) + 15 software (kind: software).
# (World-identity wave RUN-20260816-0046 added GEOM.POSE — GEOM is now 11.
# The paragraph below records the original P2 bring-up arithmetic verbatim.)
# ARITHMETIC NOTE: P2's headline said "83 = 69 FPGA + 14 SW", but P2's own
# §1 group enumeration sums to 72 FPGA (SYS3 CMD3 MEM4 FIELD6 INPUT3 AUDIO1
# VIDEO4 MEASURE3 TERRAIN7 SURFACE2 GEOM10 RASTER5 TEXTURE4 PART7 FORGE2
# TWOD2 POST3 DEBUG3) — every listed block is registered here, none trimmed
# (plan 1.D: "Accept, no trim; completeness beats minimalism"). Software is
# P2's 14 PLUS SW.TOOLS.CAPTURE ratified as its own block (plan 1.D) = 15.
# Total 87. If a count of 84 was expected, the delta is this same P2
# headline-vs-enumeration discrepancy, not a registration error.
#
# Maturity law (charter §4): SPECIFIED < REFERENCE_COMPLETE < UNIT_VERIFIED <
# RTL_VERIFIED < SYNTHESIZED < INTEGRATED < HARDWARE_PROVEN. One step at a
# time, evidence pinned in maturity_log, validated against git history (V2).
# Every block starts at SPECIFIED in this file's first commit (bootstrap).
#
# blocked_on: hardware — never advances from SPECIFIED regardless of evidence
# until the orchestrator clears the hardware lane (plan §4).
# =============================================================================

