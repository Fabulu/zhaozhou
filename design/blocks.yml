    notes: >-
      Amended atomicity law: no framebuffer slot becomes visible or READY before
      every byte has been written, all writes have retired, and the CRC matches.
      RTL_VERIFIED on the composed path: instantiated in zhao_shell_top and
      driven end to end by tests/shell/shell_golden.cpp, on top of the unit
      differential against zref::debug::run_blit. The atomicity law itself was
      mutation-swept 2026-08-22 -- 20 mutations attacking the law rather than
      the copy (publish before retirement, publish before issue, publish with no
      CRC, unfinalised CRC, publish on a lost lease, publish while aborting,
      release before writes retire, release a lease never owned, ownership taken
      before the checks, aborted beats folded into the CRC, either half of the
      guard verdict ignored, a bridge error forgotten) -- 20 caught, 0
      survivors, forced regeneration with a generated-model hash check.
      The slot itself is the transaction buffer, so the staging buffer collapses
      from 1,966,080 bits to 512. The two-pass DDR alternative was rejected as
      unsound - the pixel arena is a raw HPS address with no ownership state, so
      the HPS can mutate it between passes.

