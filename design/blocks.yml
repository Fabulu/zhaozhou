      its memory masters, which is the test zhao_console_core.sv already applies
      to TERRAIN.VISIBLE and GEOM.LOOM and refuses. Its `req_*` port is NOT the
      obstacle and should not be reported as one: the contract makes SW.STREAM
      the requester and SW.STREAM is HPS-side software, so a host-driven ingress
      is the design rather than a gap.
