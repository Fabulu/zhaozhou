      is therefore self-consistency plus hand-computed expectations, and both the
      test header and the module header say so rather than implying a
      differential.
      (2) counters [lod_representation_counts] IS NOT DRIVEN. The contract's own
      note gives two options -- "a reading of its own that is honestly a
      representation count, or ... record a ledger deviation instead of driving
      it" -- and the second is taken: this block counts error magnitudes, which
      is not a representation count under either existing owner's reading
      (TERRAIN.LOD's subpatch levels, MEASURE.TOKENS' charter ladder rungs). It
      exposes seven saturating counters of its own instead, six of which are
      seen to move as deltas in the directed lane, one only in the -GCW=8 build
      (bin_sat_o) and one only under a committed mutant (frozen_write_o, which is
      structurally unreachable while the snapshot drain is correct).
      (3) downstream [MEASURE.GOVERNOR] IS LEFT UNCHANGED AND IS UNBUILT. The
      contract's decisive argument against inventing a Version-2 cutoff beside a
      Version-1 governor survives the revocation, so no cutoff rule and no
      governor port were invented. The edge is named as unbuilt, exactly as
      MEASURE.GOVERNOR named this same edge from its side, and nothing in
      design/contracts/MEASURE.GOVERNOR.md needs amending.
      (4) tests.random tests/measure/measure_histogram_random.cpp STILL DOES NOT
      EXIST, and cannot be a differential lane without an oracle. The randomised
      coverage that would have lived there is lane 11 of the directed file: 400
      beats of mixed masks and magnitudes through real ready/valid backpressure,
      with all 64 bins compared. Declared here as an open gap rather than
      satisfied by pointing the entry at the directed file.
      inputs [fragment_error] is honoured as an EW-bit unsigned magnitude with no
      declared metric: RASTER.FRAGMENT's fragment_error_o is still the one-bit
      protocol flag the contract identified, and it is still NOT wired here. The
      block is metric-agnostic by construction -- the bucketing is log2, so a
      change of Q format is a constant shift of the bin index and nothing else --
      which is why spec/qformats.md needs no amendment for this block to exist.
      Never through quartus_map: lint-clean is not synthesizability.

