  # TERRAIN — Mantle (fpga/rtl/terrain)
  # ===========================================================================

  - id: TERRAIN.CMD
    name: Terrain set command executor
    kind: rtl
    subsystem: terrain
    clock_domain: gpu
    purpose: "Fetches the sealed patch list a SubmitTerrainSet names, verifies its CRC before acting on any of it, and drives TERRAIN.SEQ's frame ring with the records it contains. DOCKET D4's fourth missing piece -- the command-to-terrain pipeline -- of which the pager, the residency manager and the composed-height cache were already built. Before this block the composed bench played fr_start/fr_epoch/fr_patch_count and a rec_* stream it constructed in C++, and no command a game could issue made any of it happen."
    contract: design/contracts/TERRAIN.CMD.md
    phase: 6
    owner_issue: ZH-126
    inputs: [terrain_set_commands]
    outputs: [patch_records]
    upstream: [CMD.SCHEDULER, MEM.HPS.BRIDGE]
    downstream: [TERRAIN.SEQ]
    backpressure: ready_valid
    latency: variable
    target_throughput: "one sealed list per command; 138 gpu clocks for eight records on an unstalled fabric, 12 bursts and 92 beats against an ideal 8 and 64 -- the difference is pass two abandoning a burst to hold a record the sequencer is not ready for"
    reference_model: zref::swstream::encode_record
    tests:
      directed: tests/terrain/terrain_cmd_rtl_directed.cpp
      random: tests/terrain/terrain_cmd_rtl_directed.cpp
    counters: [terraincmd_sets_accepted, terraincmd_sets_refused, terraincmd_records, terraincmd_list_bytes, terraincmd_crc_fails, terraincmd_bridge_errs]
    counter_ports:
      terraincmd_sets_accepted: sets_accepted_o
      terraincmd_sets_refused: sets_refused_o
      terraincmd_records: records_emitted_o
      terraincmd_list_bytes: list_bytes_read_o
      terraincmd_crc_fails: crc_fails_o
      terraincmd_bridge_errs: bridge_errs_o
    source_ids: true
    budget_group: geometry_mantle
    maturity: UNIT_VERIFIED
    maturity_log:
      - state: SPECIFIED
        date: "2026-09-07"
        commit: "5cd55827"
        evidence: design/contracts/TERRAIN.CMD.md
      - state: UNIT_VERIFIED
        date: "2026-09-07"
        commit: "5cd55827"
        evidence: tests/terrain/terrain_cmd_rtl_directed.cpp
    deferred: false
    cut_order: null
    superseded_by: null
    notes: >-
      THE LIST IS CAPTURE DATA, WHICH DECIDES ALMOST EVERYTHING. T5: "the sealed
      list is capture data -- replay does not rerun the HPS visibility walk." So
      this block does not sort, merge, deduplicate, filter by view mask or
      decide what is required. It reads bytes in order. Any of those verbs here
      would be a second source of truth for the thing the determinism ledger is
      anchored on.

      TWO PASSES, NOT A BUFFER. A corrupt list must issue no loads, and finding
      that out at record 200 is not verification. Buffering 256 composed
      patches is 65,536 bits, about seven M10K held for one command; reading the
      list twice is 16 KB against T7's 684 KB of pages, 2.4% more, on a block
      that is not on the frame's critical path. Pass one folds and emits
      nothing; pass two emits and folds nothing. The suite flips a byte in the
      LAST record and requires zero records and zero frames.

      A RECORD IS EXACTLY FOUR BEATS and no field straddles one, provided the
      list starts 8-byte aligned -- checked, because an unaligned list would
      shear every field in it and still produce plausible terrain. The tail
      burst is SHORT: 224 bytes is three 64-byte bursts and one of 32, and a
      block that always asked for 64 would fold 32 bytes that are not in the
      list and fail its own CRC.

      WHAT THE TEST FOUND THAT THE CONTRACT HAD NOT: `err` on the REQUEST
      channel was ignored. The bridge's own comment is "malformed burst /
      bridge error: nothing issued", so err there is a refusal of the request
      arriving with no grant; watching for it only during the beat stream meant
      the pulse landed while the block was still waiting, was missed, and the
      next cycle granted normally. The command completed happily and the suite
      reported eight records where it wanted none.

      A CHECK INVENTED AGAINST A MISREAD PORT, AND ITS REMOVAL. The block
      briefly refused any `sequence` above 65,535, on the belief that
      TERRAIN.SEQ's frame ring carried sixteen bits. It carries thirty-two
      (zhao_terrain_seq.sv:110); the narrowing that had been seen is
      `cl_seq_o = seq_q[SEQW-1:0]`, the CLAIM sequence, a different signal
      counting a different thing. Verdict 9 is removed and left unallocated,
      `fr_sequence_o` is the full 32 bits, and the suite asserts the opposite.
      The LINT GATE caught it, not the directed suite.

      IT DOES NOT DECODE THE COMMAND, and that is deliberate: the shell's record
      framer carries SIXTEEN payload bytes and SubmitTerrainSet's payload is
      thirty-two, so patch_count -- T5's seal -- does not reach the scheduler.
      That is a command-path limit, not a terrain one (TerrainField 0x0200 is a
      112-byte record and is truncated the same way), and solving it here would
      be the terrain lane working around another lane's defect. See
      reports/TERRAIN-COMMAND-PIPELINE-20260907.md.

  - id: TERRAIN.MIPFEED
    name: Page mip sequencer
    kind: rtl
    subsystem: terrain
    clock_domain: gpu
    purpose: "Sequences TERRAIN.PAGESTREAM and TERRAIN.MIPGEN so a page whose bytes have landed acquires its mips and produces the SECOND completion TERRAIN.RESIDENCY needs before it will call the page RESIDENT. The directory publishes on two completions, not one: a claim sets mips_stale, the loader's fin parks the entry in ST_MIPGEN, and only a second fin reaches RESIDENT_CLEAN -- the only state a lookup hits on. Until this chain existed the composed world layer fetched eight CRC-verified pages and called none of them ground."
    contract: design/contracts/TERRAIN.MIPFEED.md
    phase: 6
    owner_issue: ZH-126
    inputs: [page_lattice_jobs]
    outputs: [loader_completions]
    upstream: [TERRAIN.RESIDENCY, TERRAIN.PAGESTREAM]
    downstream: [TERRAIN.MIPGEN, TERRAIN.RESIDENCY, TERRAIN.PAGESTREAM]
    backpressure: ready_valid
    latency: variable
    target_throughput: "one page's mips per two lattice passes, about 7,088 gpu clocks, against the 6,726 of the page load that precedes it"
    reference_model: zref::terrain::mipgen
    tests:
      directed: tests/terrain/world_composed_directed.cpp
      random: tests/terrain/world_composed_directed.cpp
    counters: [mipfeed_pages_mipped, mipfeed_pages_faulted, mipfeed_samples]
    counter_ports:
      mipfeed_pages_mipped: pages_mipped_o
      mipfeed_pages_faulted: pages_faulted_o
      mipfeed_samples: samples_sent_o
    source_ids: true
    budget_group: geometry_mantle
    maturity: UNIT_VERIFIED
    maturity_log:
      - state: SPECIFIED
        date: "2026-09-07"
        commit: "a96d0878"
        evidence: design/contracts/TERRAIN.MIPFEED.md
      - state: UNIT_VERIFIED
        date: "2026-09-07"
        commit: "a96d0878"
        evidence: tests/terrain/world_composed_directed.cpp
    deferred: false
    cut_order: null
    superseded_by: null
    notes: >-
      TWO PASSES, NOT A BUFFER. MIPGEN takes one 16-bit surface at a time and
      PAGESTREAM emits three planes at once, so one pass produces both surfaces'
      data and the port can take one of them. Buffering the other is 17,424 bits
      -- exactly what PAGESTREAM was arranged to avoid -- so the page is
      streamed twice at about 3,544 clocks a pass. MIPGEN is started ONCE,
      before the first pass, because its surface counter runs across both; a
      start between them would send surface 1's samples into surface 0's mip and
      count an abort, which is the shape of fault that renders as terrain.

      OPEN RULING -- WHICH PLANE IS SURFACE 0. T8 gives the mip law exactly and
      says a page becomes RESIDENT only after "resident mips complete", but does
      not say what "top" is at LOAD time. Layer A is sent, because it needs no
      arithmetic this block has any business owning; compose_top
      (max(fx(base)+fx(scar), fx(bottom))) is TERRAIN.PATCH's law, and if the
      ruling picks it the honest change is to take surface 0's samples from
      TERRAIN.PATCH's compose lane rather than to compute them here. The planes
      are named constants so the ruling has somewhere to land.

      TWO THINGS THE BENCH TAUGHT IT. MIPGEN's `done_o` pulses while this block
      is still two states away from looking at it -- the last fine sample is
      taken on the same cycle PAGESTREAM raises v_last -- so the pulse is
      LATCHED. The first version hung on page one with 578 mip writes already
      done and zero pages mipped. And TERRAIN.RESIDENCY validates the CRC on
      EVERY completion, not only the loader's, so a mip completion carrying zero
      is a CRC FAILURE: 16 lattices, 17,424 samples, 4,624 mip writes, eight CRC
      failures, zero resident, every block having done its job. The page's CRC
      now travels with the request and back out as a TOKEN rather than a claim.

  - id: TERRAIN.PAGESTREAM
    name: Page slot to height lattice
    kind: rtl
    subsystem: terrain
    clock_domain: gpu
    purpose: "Reads layers A, B and C out of one resident TERRAIN.PAGE_POOL slot and emits the patch's 33x33 height lattice, one vertex at a time, row-major, with all three planes present on the same beat. This is the stream TERRAIN.MIPGEN consumes through fine_valid_i and TERRAIN.PATCH consumes through base_i/scar_i/bottom_i, and until it existed nothing in fpga/rtl could turn a resident slot into either -- which is why the composed world layer fetched eight CRC-verified pages and called none of them ground."
    contract: design/contracts/TERRAIN.PAGESTREAM.md
    phase: 6
    owner_issue: ZH-126
    inputs: [page_lattice_jobs]
    outputs: [page_lattice_stream, page_cell_material]
    upstream: [TERRAIN.RESIDENCY, MEM.GUARD, TERRAIN.MIPFEED]
    downstream: [TERRAIN.MIPGEN, TERRAIN.PATCH, TERRAIN.MIPFEED]
    backpressure: ready_valid
    latency: variable
    target_throughput: "one 33x33 lattice per 4,181 gpu clocks measured on the played fabric at 2-cycle read latency; 154 bursts, derived from the layout rather than observed. WAS 105 bursts / 3,544 clocks before ruling R13's layer E joined the read window on 2026-09-22 -- +49 bursts and +47% of this block's read bandwidth for the page, which is what a layer nobody read costs to start reading. Recorded, not absorbed."
    reference_model: zref::terrain::page_lattice
    tests:
      directed: tests/terrain/pagestream_rtl_directed.cpp
      random: tests/terrain/pagestream_rtl_directed.cpp
    counters: [pagestream_lattices, pagestream_refused, pagestream_vertices, pagestream_bursts, pagestream_guard_denied, pagestream_incomplete, pagestream_cells]
    counter_ports:
      pagestream_lattices: lattices_streamed_o
      pagestream_refused: lattices_refused_o
      pagestream_vertices: vertices_streamed_o
      pagestream_bursts: bursts_read_o
      pagestream_guard_denied: guard_denied_o
      pagestream_incomplete: incomplete_o
      pagestream_cells: cells_streamed_o
    source_ids: true
    budget_group: geometry_mantle
    maturity: UNIT_VERIFIED
    maturity_log:
      - state: SPECIFIED
        date: "2026-09-07"
        commit: "795d4420"
        evidence: design/contracts/TERRAIN.PAGESTREAM.md
      - state: UNIT_VERIFIED
        date: "2026-09-07"
        commit: "795d4420"
        evidence: tests/terrain/pagestream_rtl_directed.cpp
    deferred: false
    cut_order: null
    superseded_by: null
    notes: >-
      THE THREE PLANES ARE READ TOGETHER, NOT ONE AFTER ANOTHER. TERRAIN.PATCH's
      compose lane takes base, scar and bottom on one beat and the planes are
      2,178 bytes apart, so three cursors advance in lockstep with a 64-byte
      staging buffer each. Reading A whole, then B, then C would need 17,424
      bits of buffering held across the other two passes; this needs 1,536.

      A SAMPLE NEVER STRADDLES ANYTHING, AND THAT IS ARITHMETIC RATHER THAN
      LUCK. All three offsets are EVEN and the element is two bytes, so sample k
      of plane P is at page byte P + 2k, also even -- which puts it entirely
      inside one 64-bit word (lane 0/2/4/6, and 6 + 2 = 8) and entirely inside
      one 64-byte burst (lane 0..62, and 62 + 2 = 64). Layer F needed a
      re-laner; these do not. Enforced at elaboration in the RTL and by
      static_assert in the reference header, because a layout revision that made
      an offset odd would silently return the two halves of two neighbouring
      vertices.

      IT DOES NOT COMPOSE. terrain_rules 3.4's
      compose_top = max(fx(base) + fx(scar), fx(bottom)) is TERRAIN.PATCH's law
      and zref::terrain::compose_vertex its oracle. A second implementation of
      that saturating clamp is a second thing to keep in step with 3.4, and its
      first divergence is ground subtly in the wrong place with every counter
      agreeing.

      vi IS THE COLUMN AND vj IS THE ROW, AND THIS BLOCK HAD THEM SWAPPED FOR A
      DAY. zhao_terrain_patch.sv:148 says "vi_i // lattice column" and
      zhao_terrain_compcache_front.sv:376 addresses vidx = vj*LAT_W + vi, so vi
      has stride 1 and vj stride 33 in both consumers. The SCAN ORDER was never
      wrong and did not change -- arrival index k is still vj*EDGE + vi -- only
      which output carried which. Heights were unaffected because COMPCACHE
      stores by arrival cursor; what was affected is anything that INTERPRETS
      the pair, and TERRAIN.PATCH's subpatch_dirty_o is a 4x4 mask at bit
      row*4 + col, so that mask was TRANSPOSED: the wrong quarter of a patch
      requested, terrain in the wrong place in the right shape, every counter
      agreeing. Found by the composed bench's PLACEMENT readback rather than by
      reading either contract -- nothing notices a swapped pair of indices until
      something downstream interprets them instead of passing them along.

      THE RECORD'S FLAGS ARE CARRIED BECAUSE NOTHING ELSE DID. T5's record has
      flags:u16 and TERRAIN.SEQ carries them out on is_flags_o, and one of them
      -- kFlagDual -- decides how a composed vertex is READ: TERRAIN.PATCH's
      dual_i picks whether bottom_o is fx(bottom) or live_top and sits inside
      both clamps. Nothing in fpga/rtl routed it from the record to the compose
      lane; the composed bench tied it to a knob and the gap was a finding. It
      now rides the stream as IDENTITY, whole and uninterpreted -- a streamer
      that decided which flags mattered would be a second place the record's
      meaning lives. 871 of 1,089 vertices read differently as legacy than as
      dual on the compose bench's fixture, so the routing test is not vacuous.

      OPEN RULING -- WHICH SURFACE MIPGEN DECIMATES AT LOAD TIME. Ruling T8
      gives the mip law exactly and says a page becomes RESIDENT only after
      "resident mips complete", but does NOT say which surface fine33 is at load
      time. Layer A alone would show unscarred ground at coarse LOD on a scarred
      patch; compose_top is correct-looking but is 3.4 arithmetic this block
      deliberately does not own. So this block emits all three planes and the
      selection sits in the adapter that feeds MIPGEN, where it is one visible
      wire. Not invented here.

  - id: TERRAIN.LOADQ
    name: Page-load job queue
    kind: rtl
    subsystem: terrain
    clock_domain: gpu
    purpose: "Takes a page-load job off TERRAIN.SEQ immediately and hands it to TERRAIN.PAGELOADER when that block is free, so the sequencer's walk is never blocked by a load's ACCEPTANCE. TERRAIN.SEQ's law that a miss is skipped rather than waited on held for load COMPLETION and was defeated by load ACCEPTANCE, because TERRAIN.PAGELOADER drives j_ready_o = (state == S_IDLE) and holds it low for the whole 21,376-byte transfer. A FIFO and nothing cleverer, because T4's writeback-before-load barrier lives in TERRAIN.SEQ and a structure here that could reorder a load relative to a writeback would break a law it cannot see."
    contract: design/contracts/TERRAIN.LOADQ.md
    phase: 6
    owner_issue: ZH-126
    inputs: [page_load_jobs]
    outputs: [page_load_jobs]
    upstream: [TERRAIN.SEQ]
    downstream: [TERRAIN.PAGELOADER]
    backpressure: ready_valid
    latency: variable
    target_throughput: "32 jobs accepted per frame with the sequencer never blocked; measured 259 clocks for a legal full 32-miss frame against 176,768 at depth 8 and 53,806 for 8 misses with no queue at all"
    reference_model: zref::terrain::LoadQueue
    tests:
      directed: tests/terrain/loadq_rtl_directed.cpp
      random: tests/terrain/loadq_rtl_directed.cpp
    counters: [loadq_accepted, loadq_issued, loadq_drained, loadq_refused, loadq_level, loadq_inflight, loadq_high_water]
    # The ports carry no `loadq_` prefix because inside the block there is
    # nothing else they could belong to. The prefix is the LEDGER's, so that
    # `accepted` is unambiguous across 114 blocks, and the mapping is where the
    # two namings meet.
    counter_ports:
      loadq_accepted: accepted_o
      loadq_issued: issued_o
      loadq_drained: drained_o
      loadq_refused: refused_o
      loadq_level: level_o
      loadq_inflight: inflight_o
      loadq_high_water: high_water_o
    source_ids: true
    budget_group: geometry_mantle
    maturity: UNIT_VERIFIED
    maturity_log:
      - state: SPECIFIED
        date: "2026-09-07"
        commit: "d613cd1a"
        evidence: design/contracts/TERRAIN.LOADQ.md
      - state: UNIT_VERIFIED
        date: "2026-09-07"
        commit: "d613cd1a"
        evidence: tests/terrain/loadq_rtl_directed.cpp
    deferred: false
    cut_order: null
    superseded_by: null
    notes: >-
      DEPTH IS 32 BECAUSE A MEASUREMENT SAID SO, and the first version of this
      block said the opposite. It was eight deep and carried a confident
      paragraph arguing that ruling T7's 32-page budget was "a budget for a
      different question". Pointing the composed bench at a LEGAL FULL FRAME
      killed the paragraph: 32 misses cost 176,768 clocks at depth 8, with the
      sequencer sitting on a full queue for 176,509 of them -- 10.6% of a
      1,666,667-clock frame -- against 259 clocks at depth 32. The depth covers
      the whole frame's miss list, not "the acceptance stall", and eight looked
      sufficient only because the frame that measured it asked for eight.

      ONE M10K, NOT 7,776 FLOPS. A job is 243 bits and 32 of them in registers
      would blow the composed island's 9,000-register redline on a FIFO alone,
      so the record is serialised into 8 words of 40 bits: 32 x 8 = 256 words =
      10,240 bits, exactly one M10K, addressed as {job[4:0], word[2:0]} with no
      adder and no modulo. The array is read with a registered address straight
      into a register per QUARTUS_GOTCHAS section 14 -- a "FIFO" that infers
      7,776 flops instead of one M10K is the same budget disaster wearing the
      fix's name.

      CAPACITY IS DEPTH + 1. One job sits deserialised at the output port after
      it has left the store, so the block holds 33 while it stores 32. Found by
      the bench rather than stated by the design: the reference model capped at
      32, the RTL took a 33rd, and every job after that compared one position
      out of step.

      `level_o` AND `inflight_o` ARE DIFFERENT NUMBERS, and anything asking "is
      this queue done?" wants the second. The composed suite's first drain
      check compared against the store's level alone and was wrong by exactly
      the two jobs that live outside it.

      THE DRAIN IS A MECHANISM WAITING ON A RULING. Whether T6's frame fault
      should abandon queued loads is not decided, so nothing in the tree asserts
      `drain_i`; the composed suite fires it directly, because a port that has
      never been pulsed is a port nobody has tested.

