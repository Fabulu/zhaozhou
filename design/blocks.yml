    upstream: [CMD.SCHEDULER, TERRAIN.PATCH, TERRAIN.VELOCITY, SURFACE.SHEET, GEOM.MESHFETCH, TEXTURE.CACHE, PART.STATE, RASTER.RESOLVE, POST.GATHER, POST.ECHO, VIDEO.SCANOUT]
    downstream: [MEM.VRAM.ARBITER]
    backpressure: ready_valid
    latency: fixed:1
    target_throughput: 1 checked request per clock
    reference_model: zref::MemoryGuard
    tests:
      directed: tests/memory/mem_guard_directed.cpp
      random: tests/memory/mem_guard_random.cpp
      formal: tests/formal/mem_guard_no_escape.sby
    counters: [vram_bytes_by_client, hps_ddr_bytes_by_client]
    source_ids: true
    budget_group: command_debug
    maturity: SPECIFIED
