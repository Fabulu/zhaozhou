  - id: CMD.SCHEDULER
    name: Frame-slot scheduler
    kind: rtl
    subsystem: command
    clock_domain: gpu
    purpose: "Own the frame-slot FSM (charter 7.4 names: FREE → ARM_WRITING → READY → FPGA_RUNNING → DONE) across 3 slots; enforce BeginFrame.deadline_cycles with deadline_faults, issue exactly one completion fence per FPGA_RUNNING→DONE, hand engine dispatch and region ownership to the engines and the memory guard. Wave 2 (plan D8): real sinks are debug-blit DMA and the counter snapshot; engine fan-out ports exist with no-op sinks."
    contract: design/contracts/CMD.SCHEDULER.md
    phase: 1
    owner_issue: ZH-009
    inputs: [decoded_records, frame_complete]
    outputs: [engine_dispatch, slot_state, guard_policy, fence]
    upstream: [CMD.DECODER, VIDEO.FRAMECTL]
    downstream: [MEM.GUARD, FIELD.PROGCACHE, DEBUG.COUNTERS, MEASURE.GOVERNOR, MEASURE.TOKENS, TERRAIN.PATCH, SURFACE.STAMP, GEOM.MESHFETCH, PART.STATE, FORGE.PRIM, TWOD.PLANE, TWOD.SPRITE, POST.GATHER, POST.COMPOSITE]
    backpressure: credit
    latency: variable
    target_throughput: 1 slot transition per clock
    reference_model: zref::CmdScheduler
    tests:
      directed: tests/command/cmd_scheduler_directed.cpp
      random: tests/command/cmd_random.cpp
      formal: tests/formal/cmd_scheduler_slot_fsm.sby
    counters: [frame_cycles, deadline_faults, commands]
    source_ids: true
    budget_group: command_debug
    maturity: RTL_VERIFIED
    maturity_log:
      - state: REFERENCE_COMPLETE
        date: "2026-08-15"
        commit: "38f9b96"
        evidence: reference/include/zref/zref_cmd2.hpp
      - state: UNIT_VERIFIED
        date: "2026-08-16"
        commit: "768ce1a"
        evidence: tests/command/cmd_scheduler_directed.cpp
      - state: RTL_VERIFIED
        date: "2026-08-16"
        commit: "4f76d2e"
        evidence: demos/wound_lab/duo_markers.cpp
    deferred: false
    cut_order: null
    superseded_by: null
    notes: >-
      Contract filled (Phase-1-active). The dispatch fan-out mirrors charter
      §5's CMD → engines edges. UNIT_VERIFIED re-pinned at the W2.6 merge:
      the b64afe2 evidence predates a genuine RTL defect that
      cmd_random_soak (100k frames — never run on the branch) exposed: the
      SetPresentationContract latch adopted out-of-range mode bytes,
      indexing ZHAO_TIMING out of bounds. Fixed (latch refuses non-members)
      and the soak observed green at 768ce1a: 13,884,383 checks, 0 failed.

