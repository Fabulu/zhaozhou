      - state: UNIT_VERIFIED
        date: "2026-08-15"
        commit: 6bcc4e9
        evidence: tests/memory/vram_arbiter_directed.cpp
      - state: RTL_VERIFIED
        date: "2026-08-15"
        commit: 6bcc4e9
        evidence: tests/memory/mem_random.cpp
      - state: RTL_VERIFIED
        date: "2026-08-16"
        commit: 9d49806
        evidence: tests/formal/mem_vram_arbiter_liveness.sby
        regression_reason: >-
          CORRECTION, not an advance. The 2026-08-15 RTL_VERIFIED entry above
          was earned on directed + random evidence, but this block's headline
          claim ("formally proven to never starve a guaranteed client") rested
          on mem_vram_arbiter_liveness citing B = 40 — a bound whose proof had
          NEVER BEEN ELABORATED and which FAILS when it is. Ratified for
          re-derivation in RATIFICATION-arbiter-liveness-bound.md (run
          RUN-20260814-2154-wave2-phase2-console-shell). B is re-derived in
          spec/memory_rules.md §2.1 (the old formula kept struck through) and
          re-proven TIGHT in both directions: the bmc task passes at the
          derived refresh-free bounds (RR 52, scanout 34) and bmc_tight_rr /
          bmc_tight_scanout FAIL at bound-1 (51 / 33); operational bounds add
          a 13-cycle refresh steal => 65 / 47. All 8 covers reached, so the
          asserts are not vacuous. The block STAYS at RTL_VERIFIED because
          the corrected bound IS proven; had it not been, this entry would
          have dropped it to UNIT_VERIFIED per the ratification.
    deferred: false
    cut_order: null
    superseded_by: null
    notes: >-
      leaf (serves MEM.GUARD requests). W2.5: the offered burst is a
      REGISTERED stable offer (a combinational selection can change between
