  - id: FORGE.SHADOW
    name: Contact shadows
    kind: rtl
    subsystem: forge
    clock_domain: gpu
    purpose: "A small terrain-conforming transparent hull under a creature or object, so it looks ATTACHED to the ground. BORING_3D_FUNDAMENTALS_AUDIT R8. No shadow map, no shadow buffer, no new raster hardware -- ordinary transparent geometry through the main renderer."
