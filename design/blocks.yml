        evidence: design/contracts/TERRAIN.DEVSTORE.md
    deferred: false
    cut_order: null
    superseded_by: null
    notes: >-
      THE ROW ARRIVES YEARS AFTER THE SILICON, and that is the thing it is
      here to fix. This block has been built since 2026-09-20 and composed in
      zhao_console_core since 2026-09-21, and it had no ledger row and no
      contract the whole time -- so tools/budget/completion_register.py, which
      walks this file, was answering a question that did not contain it. The
      register's total was never wrong; it was smaller than its readers
      assumed. R214 says a block with a contract AND silicon owes a row and
      that the register going UP for that reason is correct. It goes up here.

      WHAT OWNER RULING R242 CHANGED, AND WHAT IT DID NOT. Fabian, 2026-09-22
      "Move deviation store to SDRAM, ignore stale info." The stale info is
      ruling R24's STORAGE CLAUSE -- "stored alongside the page in M10K (the
      owner prefers M10K over ALMs)" -- and R87 is why it went stale "against
      306 of 553 already used, one block wanting 185 is not a rounding error.
      Price M10K explicitly in the fit plan; it is no longer the free
      currency." Ruling R234 D3's explicit GRANT of those 185 M10K is spent
      differently as a result and is superseded with the clause. Everything
      else R24 decided stands and is still what the block does. Only the
      medium changed.

      THE M10K DELTA IS -185, DERIVED FROM THE PARAMETERS AND NOT FROM PROSE,
      because every number in this block's own sizing section was once wrong
      in the flattering direction. dev_mem was ROWS x ROWW = (2*SLOTS) x
      (HALF*RECW) = 2,048 x 704; at 2,048 deep an M10K runs 2,048 x 5, so
      ceil(704/5) = 141. hist_mem was SLOTS x HROWW = 1,024 x 432; at 1,024
      deep an M10K runs 1,024 x 10, so ceil(432/10) = 44. 141 + 44 = 185 of
      553, 33% of the device. The block now infers NO memory at all
      (tools/design/check_array_storage.py agrees: it declares no array).

      WHAT IT COSTS INSTEAD, HAND-COUNTED AND UNFITTED. +1,552 flops, of which
      1,024 are hist_valid_q -- a REPAIR rather than the move -- 256 are the
      eight new counters, and 272 are the memory engine NET of the 896 flops
      the old M10K shape needed and this one does not. In ALMs that is +388 if
      registers pack four to an ALM and +776 IF THEY PACK TWO, and the second
      number is the one to budget against. The owner's instruction for this
      campaign is not to fit, so none of this is a Quartus number.

      THE REPAIR THE MOVE FORCED, named because it is a real defect and not a
      consequence. hist_mem had no reset and inv_valid_i cleared only the
      RECORD valid bits, so a residency slot reclaimed by a DIFFERENT page
      served the previous page's prev_level, prev_morph and hold -- the
      stranger-inherits-the-hysteresis failure ruling R24's key exists to
      prevent, one level down. M10K in Verilator is zero and hid it; SDRAM is
      whatever the device held. hist_valid_q closes it, and
      terrain_lodpath_directed case 13 proves all three directions: it fires,
      it is SILENT once a history exists, and it fires again when a stranger
      claims the slot.

      THE 67-BIT PACKING STAYS REFUSED and R242 keeps the refusal. A further
      33 M10K was available while these records were in block RAM, because
      every lattice height reaching zhao_terrain_loddev today is height16 << 8
      so every deviation's low seven bits are provably zero. The invariant is
      upstream, unenforced and invisible: the moment a composed height carries
      a FIELD delta (core entry I34's lane) the low bits stop being zero and
      every deviation silently quantises to 128ths with no counter able to see
      it. A packing that is exact only while somebody else keeps a promise
      they never made is the broken-instrument shape. The SDRAM record is
      padded UP, 88 bits to 128, which cannot fail that way and buys 896 flops
      of staging by making a 64-byte burst exactly four records.

