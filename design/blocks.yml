      would turn into a read-modify-write loop. Payload lives in banks keyed by
      SAMPLE INDEX per S6.4, so a three-sample fragment writes all three
      descriptors on one clock without a three-write-port memory. Every bank is
      written and read only inside a clock-only process through registered
      addresses -- the difference between an M10K and a flip-flop array, and
      the entire reason the block exists. The price is one pipeline stage on
      issue and one on retire.
