  - id: GEOM.CLIPDOOR
    name: The clip-input door
    kind: rtl
    subsystem: geometry
    clock_domain: gpu
    purpose: The N-producer arbiter at GEOM.CLIP's INPUT -- owner ruling R187's "honest door" -- carrying the material half and the triangle half of one beat together.
    contract: design/contracts/GEOM.CLIPDOOR.md
    phase: 5
    owner_issue: ZH-056
    inputs: [clipped_triangles]
    outputs: [clipped_triangles]
    # WHY THE DOOR IS HERE AND NOT AT GEOM.SETUP'S ARM. Owner ruling R187,
    # taking SETUPDOOR's measurement: "the honest door is at GEOM.CLIP's INPUT,
    # not GEOM.SETUP's -- it yields winding normalisation, 2A, bbox, zero-area
    # reject and three-tine lockstep for free". Entering at GEOM.SETUP's arm
    # deadlocks combinationally because that arm is one tine of a three-way
    # ordered join; entering HERE feeds all three tines through the existing
    # fork and no tine is bypassed.
    #
    # THE ARBITRATION LAW IS RUN-LENGTH FAIR, NOT BEAT FAIR, and it is forced by
    # `zhao_material_window`, which DRAINS the whole GEOM.CLIP..door span before
    # it changes what it publishes. A beat-fair round robin between two
    # producers of different materials issues a drain and a resolve between
    # every pair of triangles -- a throughput collapse with every counter in the
    # console reading healthy. The block's header carries the argument.
    # `upstream:` HERE IS DESIGN INTENT AND NOT A WIRING CLAIM (owner ruling
    # R180), labelled because that ledger-edge-read-as-a-port confusion is what
    # sent five passes at GEOM.SETUP's arm. Exactly ONE of the four is a wired
    # producer today -- GEOM.REPLAY, through `u_material_window` -- and it is
    # wired to GEOM.CLIP DIRECTLY, not through this block. The other three are
    # the customers the door exists for.
    upstream: [GEOM.REPLAY, PART.EXPAND, FORGE.PRIM, FORGE.SHADOW]
    downstream: [GEOM.CLIP]
    backpressure: ready_valid
    latency: 0 (combinational select on a registered grant)
    target_throughput: 1 beat per clock
    reference_model: null
    tests:
      directed: tests/geometry/geom_clipdoor_directed.cpp
      random: null
    counters: [granted, switches, idle_offered, err_hold_broken]
    source_ids: true
    budget_group: geometry_mantle
    maturity: UNIT_VERIFIED
    maturity_log:
      - state: UNIT_VERIFIED
        date: "2026-09-21"
        evidence: tests/geometry/geom_clipdoor_directed.cpp
    deferred: false
    cut_order: null
    superseded_by: null
    # COMPOSED 2026-09-21 (FORGECOMP, clients 0 and 1) and 2026-09-22
    # (PARTMAT, client 2). Both of the two named, measured remainders the
    # CLIPDOOR packet docked here are DISCHARGED, and neither was the attribute
    # packet five passes believed was the wall:
    #   1. THE PARTICLE DEPTH LANE. `w` and its depth profile now survive
    #      zhao_part_project's slot store and ladder queue (PROJ_W 99 -> 132)
    #      and zhao_part_expand, and PART.CLIPFEED converts them with a second
    #      INSTANCE of ruling D-4's law -- zhao_geom_depthquant_stream beside
    #      zhao_raster_rcp24_v4, the pair GEOM.VATTR and FORGE.ASSEMBLE also
    #      hold.
    #   2. THE NON-MESH MATERIAL LAW. Ruled by the owner on 2026-09-22,
    #      ruling 1: NO_MATERIAL is a LAWFUL MODE, declared by the producer and
    #      never inferred. It is a third field of this door's MATERIAL half, so
    #      it is selected by the same grant on the same beat as the {set, id}
    #      it qualifies.
    # The RUN-LENGTH-FAIR law is what makes three producers affordable: the
    # composed acceptance run costs TWO resolves for THREE spans, measured, not
    # argued (tests/prod/partmat_acceptance.cpp section 1).
    notes: composed -- three clients (GEOM.REPLAY 0, FORGE.ASSEMBLE 1, PART.CLIPFEED 2); err_hold_broken_o has a committed mutant control that FIRES.

  - id: PART.CLIPFEED
    name: The particle clip-door feed
    kind: rtl
    subsystem: particles
    clock_domain: gpu
    purpose: Turns PART.EXPAND's polygon-particle fan into a GEOM.CLIPDOOR client -- the canonical invw24 and the seven-slot attribute packet, in offer order.
    contract: design/contracts/PART.CLIPFEED.md
    phase: 5
    owner_issue: ZH-056
    inputs: [screen_triangles]
    outputs: [clipped_triangles]
    # WHY IT EXISTS. Owner ruling 1 of 2026-09-22 authorises "the complete
    # particle-to-raster connection, including the canonical depth conversion
    # and any carrier still required by the current producer", and says it "is
    # not permission to close the task after changing only the material gate".
    # GEOM.CLIPDOOR.md had already MEASURED the two things owed; this block is
    # exactly those two and nothing else.
    #
    # IT CONTAINS NO ARITHMETIC. No shift, no product, no rounding, no
    # saturation. The depth conversion is zhao_geom_depthquant_stream beside
    # zhao_raster_rcp24_v4, wired as zhao_geom_vattr and zhao_forge_assemble
    # wire them -- a second INSTANCE of ruling D-4's law, which the
    # zhao_field_isqrt precedent settles is not a second law.
    #
    # THE RING IS AN IN-ORDER QUEUE IN FRONT OF AN OUT-OF-ORDER ENGINE. The
    # converter answers in the reciprocal's COMPLETION order with the caller's
    # tag; particles are depth-TESTED and never depth-WRITTEN, so two that
    # overlap are resolved by DRAW ORDER alone. The tag IS the ring slot, one
    # record at one index written by one enable -- NOT the "independently
    # advancing metadata queue" ruling 1 forbids, and the material half does
    # not travel through it at all.
    #
    # COST, HAND-COUNTED AND NOT FITTED (R236 -- cost is recorded, never a
    # veto), deliberately in the UNFLATTERING direction because four lanes
    # under-reported theirs:
    #   * THE CONVERTER PAIR DOMINATES and is the honest headline. One
    #     zhao_geom_depthquant_stream at NSLOT 16 plus one zhao_raster_rcp24_v4
    #     at NCTX 8 -- a SECOND COPY of what zhao_geom_vattr's row prices, and a
    #     THIRD in the console counting zhao_forge_assemble's. Expect it to be
    #     the same order as those, not a rounding error beside them; the rcp24
    #     carries a table ROM and a multiplier whose implementation style the
    #     fit decides. THIS IS THE NUMBER TO CHECK FIRST in the next fit, and
    #     the question is whether the console can afford three instances of one
    #     reciprocal or wants a shared service.
    #   * THE BLOCK'S OWN STATE: a 16 x 166-bit triangle ring (2,656 bits), a
    #     16 x 24-bit depth store (384 bits), 16 landed bits, two 5-bit
    #     pointers and six 32-bit counters -- about 3,300 flops.
    #
    #     CORRECTED BY REVIEW BEFORE THIS ROW SHIPPED. The first draft said the
    #     ring "MAY infer as M10K"; it will NOT. Both arrays are read
    #     ASYNCHRONOUSLY at the head pointer (`tri_q[head_c]`, `inv_q[head_c]`
    #     feed the output combinationally), and an async read is the one thing
    #     that rules an M10K out. So it is 3,040 bits of FLOPS plus a 16-way
    #     166-bit mux, and the mux is the part to look at -- roughly 2,656 LUT
    #     inputs of selection on the binding constraint.
    #
    #     THE OBVIOUS TRADE IS NAMED HERE RATHER THAN TAKEN: making the ring a
    #     SYNCHRONOUS read would let it infer as M10K, which is the standing
    #     owner direction (ALMs are the constraint, memory is the slack). It
    #     costs a pipeline stage between the head select and the door beat, and
    #     the door must never gain a skid between the material half and the
    #     triangle half -- so the stage would have to sit BEFORE the door's
    #     input, not inside it. That is a real design question and it belongs
    #     in a packet that can test it, not in this one's last hour.
    #   * Combinational: one 7-slot attribute pack replicated three times (pure
    #     field placement from one depth and three colour bytes), a six-way
    #     21-bit select and a twelve-term range comparison. No DSP.
    upstream: [PART.EXPAND]
    downstream: [GEOM.CLIPDOOR]
    backpressure: ready_valid
    latency: the depth converter's, plus head-of-line in the ring
    target_throughput: 1 beat per clock out; in, the converter's rate
    reference_model: null
    tests:
      directed: tests/particles/part_clipfeed_directed.cpp
      random: null
    counters: [particles, triangles, range_refused, stall_full, dq_refused, dq_stray]
    source_ids: true
    budget_group: geometry_mantle
    maturity: COMPOSED
    maturity_log:
      - state: UNIT_VERIFIED
        date: "2026-09-22"
        evidence: tests/particles/part_clipfeed_directed.cpp
      - state: COMPOSED
        date: "2026-09-22"
        evidence: tests/prod/partmat_acceptance.cpp
    deferred: false
    cut_order: null
    superseded_by: null
    # `range_refused_o` is reachable with LEGAL STIMULUS AT THIS BLOCK'S OWN
    # PORTS -- the vertex ports are 22 bits and a bench drives them -- so it is
    # the `t_ack_i` shape and owes no committed mutant. It is FIRED in section 4
    # of the directed test, with the negative control (the largest vertex the
    # clamp permits, 528368) beside it.
    notes: composed -- client 2 of GEOM.CLIPDOOR; carries no per-primitive depth mode, declared as zhao_console_core entry I51.

  - id: GEOM.SETUP
    name: Triangle setup
    kind: rtl
    subsystem: geometry
    clock_domain: gpu
    purpose: Screen-space triangle setup (edge coefficients, gradients) for the tile renderer; accepts geometry, Forge and polygon-particle packets alike.
    contract: design/contracts/GEOM.SETUP.md
    phase: 5
    owner_issue: ZH-057
    inputs: [clipped_triangles, forge_primitives, expanded_particles]
    outputs: [setup_triangles]
    # THIS `upstream:` NAMES SIX PRODUCERS AND EXACTLY ONE OF THEM IS A PORT.
    # Measured 2026-09-20 by the forge4 packet, and recorded HERE rather than in
    # a refusal, because this row is where the misleading claim lives.
    #
    # `zhao_geom_setup` IS COMPOSED in `zhao_console_core.sv` and has exactly ONE
    # triangle input arm -- tri_valid_i / tri_ready_o / tri_ax_i..tri_cy_i /
    # tri_area2_i / tri_min_x_i.. -- and that arm is FULLY OCCUPIED by GEOM.CLIP
    # through the declared fork with GEOM.ATTRPACK
    # (`.tri_valid_i (cl_o_valid && ap_tri_ready_w)`, and
    # `cl_o_ready = st_tri_ready_w && ap_tri_ready_w`). There is no arbiter and
    # no second arm, so the other five have nowhere to arrive.
    #
    # AND THE ARM IS SCREEN SPACE, which is the half a port count would miss:
    # `tri_ax_i` is signed [20:0] and `tri_area2_i` is signed [47:0] -- a
    # CLIPPED, PROJECTED triangle. `zhao_forge_prim` emits INDEX TRIPLES
    # (t_i0_o/t_i1_o/t_i2_o, 16-bit) and no coordinate at all;
    # `zhao_forge_prim_eval` emits WORLD fx16 (v_x_o/v_y_o/v_z_o, signed
    # [31:0]); `zhao_forge_cliff` emits a RIM EDGE. Not one of the three is the
    # shape this port takes, so even a forge page, a forge_kind and a dispatch
    # would deliver to nowhere -- what sits between them and this door is a
    # projection and a clip.
    #
    # THE EVIDENCE THAT MAKES THIS MEASURABLE RATHER THAN ARGUABLE: PART.EXPAND
    # is ALREADY COMPOSED and already queued at this door. It emits screen
    # triangles at signed [21:0] -- the closest thing in the tree to what this
    # block takes -- and its packet LEAVES `zhao_console_core` as a BOUNDARY
    # under that file's entry I24: "the triangle's customer is the same absent
    # GEOM replay/setup path I11, I12 and I13 name". A block that already
    # produces the right SHAPE cannot get in either.
    #
    # THIS IS THE THIRD LEDGER-EDGE-READ-AS-A-PORT FOUND IN ONE REFUSAL ENTRY:
    # GEOM.MESHFETCH's `upstream: MEASURE.GOVERNOR` and FORGE.CLIFF's
    # `upstream: TERRAIN.TESS` are the other two, both already recorded in
    # `zhao_console_core.sv`. Three in one entry is not a coincidence, so it is
    # worth stating once and generally: IN THIS LEDGER `upstream:` IS A DESIGN
    # INTENT, NOT A WIRING CLAIM. A packet that reads it as one concludes a
    # composition is nearly done when its consumer has no door.
    #
    # -----------------------------------------------------------------------
    # THE FAR END, MEASURED AGAIN 2026-09-20 (setupdoor), COMMISSIONED TO BUILD
    # THE ARBITER THE NOTE ABOVE ASKS FOR. IT IS REFUSED, AND THE REASON IS NOT
    # THE ARBITER.
    # -----------------------------------------------------------------------
    # The note above says PART.EXPAND "already produces the right SHAPE" and is
    # held out only for want of a door. The shape half is CONFIRMED and the
    # conclusion is not: an arbiter on `tri_*_i` is the SMALLEST of four
    # blockers and closes none of the other three.
    #
    # 1. THE ARM IS NOT A STREAM ENDPOINT. IT IS ONE TINE OF A THREE-WAY
    #    ORDERED JOIN, and the join pairs by ARRIVAL ORDER with no tag:
    #      * GEOM.SETUP  -- the edge functions
    #      * GEOM.ATTRPACK -- three 240-bit interpolation planes
    #      * `u_material_window` -- the resolved material, AND an occupancy
    #        accounting over the whole span
    #    A producer entering at one tine and not the other two breaks the
    #    pairing, and `zhao_console_core.sv` states the invariant it would
    #    break in as many words: "There is no fourth outcome for a triangle in
    #    that span". A particle reaching the door is that fourth outcome.
    #
    # 2. IT DEADLOCKS, COMBINATIONALLY, AND THE PROOF IS THREE ASSIGNS IN THE
    #    CORE:
    #      cl_o_ready       = st_tri_ready_w && ap_tri_ready_w
    #      st_o_ready       = door_tri_ready_w && ap_o_valid_w
    #      door_tri_valid_w = st_o_valid && ap_o_valid_w
    #    Put a particle in SETUP alone. ATTRPACK never saw it, so
    #    `ap_o_valid_w` is low; `st_o_ready` is therefore low; SETUP cannot
    #    drain; `st_tri_ready_w` falls; `cl_o_ready` falls; GEOM.CLIP stalls --
    #    and ATTRPACK can only become valid through GEOM.CLIP. The cycle is
    #    closed and permanent. If a mesh triangle HAPPENS to be in ATTRPACK the
    #    particle's edge functions are instead joined to THAT triangle's planes
    #    and THAT triangle's material: a record swap, permanently skewed by one
    #    for the rest of the frame. Both outcomes, and no arbiter on this arm
    #    changes either. This is owner ruling R133's warning arriving at a
    #    different block: "composing it wrong costs a deadlock".
    #
    # 3. TWO COMMITTED ERROR COUNTERS WOULD FIRE ON EVERY PARTICLE, which is
    #    the tree saying this out loud already. `zhao_material_window` carries
    #    `err_occupancy_underflow_o` (a `d_leave_i` with no matching
    #    `d_enter_i` -- exactly a particle at the door) and `err_unpublished_o`,
    #    whose comment is "a triangle is being shaded with a material nobody
    #    resolved". They are not hypothetical detectors; they are the interlock
    #    this composition would violate.
    #
    # 4. AND THE BINDING BLOCKER IS THE SEVEN-SLOT ATTRIBUTE PACKET, the SAME
    #    one `zhao_console_core.sv`'s entry (b) already records for TERRAIN.
    #    `GEOM_CLIP_ATTRS = 7` -- invw24, u/w, v/w, lit r, g, b, alpha -- per
    #    CORNER. A polygon particle has a flat colour, ONE shared 1/w, and
    #    **no texture coordinates by LAW, not by omission**: the reference's
    #    `draw_population` tris branch calls `raster_tri` with a flat colour
    #    and a TriMode carrying only depth_test/depth_write. So u/w and v/w
    #    have no value a particle could honestly supply, and zeroing them to
    #    make the composition fit would sample texel (0,0) on every particle --
    #    closing a gap by narrowing function, which rule 1 forbids.
    #
    # TERRAIN AND PARTICLES HIT THE IDENTICAL WALL INDEPENDENTLY, and that is
    # the general finding: GEOM.SETUP's arm is not short of an ARBITER, it is
    # short of an ATTRIBUTE LAW FOR EVERY NON-MESH PRODUCER. The arbiter is
    # real work and it is the last step, not the first.
    #
    # BLOCKER 4 IS SPENT, 2026-09-21 (packet CLIPDOOR). The attribute law the
    # paragraph above asks for WAS RULED -- owner ruling R197, on the same day
    # blocker 4 was written -- and it is SILICON at this commit, not a plan:
    # `zhao_geom_clip.tri_untex_i`/`out_untex_o`, `zhao_geom_attrpack
    # .tri_untex_i` (the only reader of the u/w and v/w slots in the tree, and
    # it branches on the bit), `zhao_console_core`'s `cl_in_refuse_c` /
    # `geom_untex_refused_o` refuse-and-count gate, and the committed control
    # `tests/mutants/zhao_console_core_untex_decl_mutant.sv`. R197 names
    # particles in its own text: option B "invents u/v for shadow hulls and
    # particles that have none by law". So a particle enters with `untex = 1`,
    # its u/w and v/w slots are DON'T-CARE BY RULING, and `GEOM_CLIP_ATTRS`
    # does not move for particles. The text above is kept rather than deleted
    # because it is the record of what was believed for five passes, and the
    # correction is worth more beside it than instead of it.
    #
    # WHAT ACTUALLY REMAINS is measured and named in
    # `design/contracts/GEOM.CLIPDOOR.md`: (1) a canonical DEPTH -- PART.EXPAND
    # emits Q16.16 1/w and slot 0 is invw24, owner ruling D-4 forbids a consumer
    # converting, and `w` is dropped at `zhao_part_project`'s ladder queue; and
    # (2) a MATERIAL law for non-mesh producers, which is R197's unruled
    # sibling. Neither is an attribute count. The DOOR ITSELF IS BUILT --
    # `fpga/rtl/geometry/zhao_geom_clipdoor.sv`, GEOM.CLIPDOOR above -- and it
    # is at GEOM.CLIP's input, not this arm, per owner ruling R187.
    #
    # THE WIDTH QUESTION IS ANSWERED AND IT IS THE EASY ONE. PART.EXPAND emits
    # signed [21:0] against this arm's signed [20:0], and the extra bit is
    # HEADROOM, NEVER RANGE. `zhao_project_core::to_screen_xy` CLAMPS to
    # +-524288 ("the clamp is the law; it is not a clip and it is not
    # optional") and is the only producer of the particle centre, so
    # max |vertex| = 524288 + 4080 = 528368 < 2^20. Proved exhaustively over
    # all 256 size bytes at all four rail corners in
    # `tests/particles/part_expand_directed.cpp` section 7, asserted on every
    # vector of the directed AND random lanes, and the invariant was seen to
    # FIRE when the clamp premise is removed. A future door may narrow 22 -> 21
    # losslessly; it must NOT widen the arm, which would ripple through the
    # shell door (`render_ax_i` signed [20:0]), both shell tops and the raster
    # for a bit that cannot be set.
    #
    # ONE MORE MEASURED FACT A FUTURE DOOR NEEDS: THE PARTICLE FAN IS WOUND THE
    # WRONG WAY. GEOM.SETUP's header states its precondition as "a triangle
    # arriving here has 2A > 0" (GEOM.CLIP normalised it). The fan's
    # 2A = -2 * half_w * (half_drop + side_sub) is NEGATIVE for every size, and
    # size 0 gives 2A = 0 -- the zero-area case GEOM.CLIP rejects and
    # GEOM.SETUP explicitly does not. Both are pinned by committed checks in
    # section 8 of that same test, so the packet that builds the door inherits
    # the measurement instead of the bug.
    upstream: [GEOM.CLIP, FORGE.PRIM, FORGE.PRIM.EVAL, FORGE.CLIFF, PART.EXPAND, FORGE.SHADOW]
    downstream: [GEOM.BINNER]
    backpressure: ready_valid
    latency: variable
    target_throughput: 1 setup triangle per clock
    reference_model: zref::Setup
    tests:
      directed: tests/geometry/geom_setup_directed.cpp
      random: tests/geometry/geom_setup_random.cpp
    counters: [triangles_submitted]
    source_ids: true
