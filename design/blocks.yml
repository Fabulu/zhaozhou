      it in integration glue. Registered separately because adding an unbuilt
      responsibility to a built, verified block hides unbuilt work inside a green
      row. Saturation is REPORTED, not silently clamped. A negative reciprocal is
      refused rather than wrapped into a large unsigned depth that would read as
      very close and win every depth test.

      BUILT 2026-09-04. It calls the existing rcp_u24 service rather than
      carrying a second reciprocal ROM, because a second ROM would be a second
      law. SCALE is a power of two for all three shipped profiles, so SCALE * r
      collapses to a shift and the oracle's 128-bit intermediate is never
      materialised -- the directed test ASSERTS that property rather than
      assuming it, so a fourth profile whose SCALE is not a power of two fails
      loudly instead of shifting wrongly.

      REQUIRES A CHANGE TO GEOM.PROJECT: zhao_project_core has w -- "the three
      quotients share the divisor clip.w" -- and does not expose it. Until that
      port exists this block has no producer in the shell.

      COMPOSED 2026-09-19 (geom packet): the w port landed (out_w_o) and the
      block is instantiated three times inside GEOM.REPLAY, one lane per
      triangle corner, sharing one zhao_raster_rcp24_v4 by its token. Each lane's
      reply is LATCHED at its own handshake by the replay, because this block
      reads rcp_r_i/rcp_k_i in S_COMB, one clock after accepting it -- correct
      against a service that holds its answer, wrong against a shared one.

      The directed test is 7/7 against zref::depth_of_raw across all three
      profiles -- 32 vertices, 1 near-clamped, 1 far-clamped, 0 refused. It
      found three faults that lint had passed: a DESCENDING normalisation loop
      taking the lowest set bit above 23 rather than the highest, which made
      depth at wmax exactly 2^5 too large; a shift of ZERO refused as out of
      range when zero IS the near pin, which returned depth 0 -- the value
      meaning "far" -- for the CLOSEST geometry in the scene; and a reciprocal
      handshake that asserted valid and awaited the answer without ever
      consulting rcp_ready_i, which deadlocks against a busy service.
