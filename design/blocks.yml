      third client, MEM.GUARD gains generation rejection and an appended
      region, CMD.SCHEDULER gains a resource-pin table, and
      zhao_geom_pose_cache gains `sub` in its tag -- the last is a live defect
      today, since a key and its 60 Hz midpoint alias and the cache returns the
      wrong palette.
      BUILT 2026-09-19 (fpga/rtl/mem/zhao_mem_upload.sv, 89 directed checks) AND
      NOT COMPOSED, and the reason is the FIRST of those four changes rather
      than the request port. SEARCHED 2026-09-19 and named: zhao_hps_arbiter has
      exactly TWO client ports -- c0 "high priority: CMD.DMA" and c1 "low
      priority: DEBUG.FRAMEBLIT" -- and this block's `hps_req_o`/`hps_rsp_i` is
      a third HPS burst master with nowhere to attach. Its `guard_req_o` is a
      second MEM.GUARD question: the guard's client case is what
      spec/memory_rules.md 5f's own "Why it was the blocker" section is about,
      and RENDER.ASSET_POOL is admitted READ-ONLY (`!req.write`) while this
