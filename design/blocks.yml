    downstream: [FIELD.SEQ.EARTH, FIELD.SEQ.WARP, FIELD.SEQ.FLOW, FIELD.SEQ.FORMATION, FIELD.SEQ.STAMP]
    backpressure: none
    latency: variable
    target_throughput: "six clocks for an op that finishes in Q_EXEC; 15-67 for the ops that walk the shared multiplier (measured table in the contract)"
    reference_model: zfield::interpret
    tests:
      directed: tests/differential/field_seq_directed.cpp
      formal: tests/formal/field_seq_bound.sby
      random: tests/differential/field_seq_directed.cpp
    counters: [field_instructions_by_profile]
    source_ids: true
    budget_group: field
    maturity: RTL_VERIFIED
    maturity_log:
      - state: REFERENCE_COMPLETE
        date: "2026-08-21"
        commit: "0b8e43a"
        evidence: reference/src/zfield/zfield_interpret.cpp
      - state: UNIT_VERIFIED
        date: "2026-08-21"
        commit: "0b8e43a"
        evidence: tests/differential/field_seq_directed.cpp
      - state: RTL_VERIFIED
        date: "2026-08-22"
        commit: "3fe40ed"
        evidence: tests/formal/field_seq_bound.sby
    deferred: false
    cut_order: null
    superseded_by: null
    notes: "ONE ARITHMETIC ENGINE, NOT TEN IDLE CALCULATORS (2026-08-23). All thirty-one opcodes dispatch into zhao_field_exec_shared, which owns ONE zhao_field_mul (signed 33x33, input- and output-registered), ONE zhao_field_isqrt shared by LEN and NORMALIZE, ONE zhao_field_sin shared by OP_SIN/OP_COS and ROT, ONE zhao_field_rcp shared by OP_RCP and RING, and the two DIFFERENT reciprocal seed ROMs. No production op unit keeps a private nonconstant multiplier. MEASURED: 79 DSP blocks of 112 before, 4 after, on Quartus 17.0.2 against 5CSEBA6U23I7. There is NO ARBITER because the walk retires one instruction at a time; that fact is the safety argument and is tested by an alone-versus-interleaved section rather than asserted. The three register-read cycles are the multiplier'''s issue slots, so MUL/MAD/DOT2/DOT3 still retire in six clocks. An op outside the engine is REFUSED with a status rather than skipped or zeroed. This block does not validate: the decoder proves every register in range, no use-before-def, no dst overlapping an input or its own sources, and exactly one OP_END last -- re-checking here would be a second implementation of those rules."

