      - state: UNIT_VERIFIED
        date: "2026-09-06"
        commit: "78ecbb4b"
        evidence: tests/terrain/seq_rtl_directed.cpp
    deferred: false
    cut_order: null
    superseded_by: null
    notes: >-
      SW.STREAM IS NOT AN UPSTREAM EDGE, and rule V8 is why that is worth
      stating. SW.STREAM is hps-clocked and this block is gpu-clocked, so a
      direct edge asserts a clock crossing that nothing implements. The sealed
      list reaches the GPU through the frame ring and CMD.SCHEDULER, which is
      itself gpu -- so the edge was simply WRONG, and `async_bridge: true`
      would have quieted the rule by claiming a bridge nobody built.

      T6 AND T7 ARE KEPT APART BY CONSTRUCTION, which is the thing most likely
      to be got wrong here: composed-slot exhaustion on a REQUIRED DYNAMIC patch
      faults the frame and drains, while load-budget exhaustion defers and
      continues with frame_fault asserted LOW. Conflating them would fault
      frames the rulings say to render. A directed case checks exactly that.

      THE DIFFERENTIAL FOUND A DEFECT ON ITS FIRST RUN: the compose-slot index
      was held under a low valid bit, so a static issue's slot number was a
      function of WHICH PATCH COMPOSED EARLIER -- history reaching a
      frame-scoped allocator, and a frame replayed after a different previous
      frame would drive different bits. 16 divergences, now mutation M14.

      THE MODEL TAKES THE DIRECTORY'S ANSWER AS AN ARGUMENT rather than
      modelling a directory, the same boundary TERRAIN.COMPCACHE draws. A model
      owning its own set-associative cache would have to agree with
      zhao_terrain_residency_v2 about victims, generations and pins before it
      could say anything about SEQUENCING, and its first disagreement would be
      reported as a sequencing defect.

      A `stale_abandoned` counter was drafted and DELETED rather than shipped
      reading zero -- a counter nothing can increment is exactly the decoration
      the tripwire rule forbids.

