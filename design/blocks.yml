      terrain3). R6 says "widen the RTL to 50 bits; T10 stands as written",
      against this block's 32-bit `res_ans_handle_i` / `a_handle_o`. SEARCHED
      `fpga/rtl` for every carrier of an island page handle: the only two are
      this block and `zhao_terrain_visible`, and BOTH are superseded by T5 (R16
      and R23). Nothing in the composed console carries a packed island handle
      at any width -- the live path carries T10's CONTENT as separate fields
      ({epoch:32, slot, generation} through TERRAIN.RESIDENCY, TERRAIN.SEQ and
      the compose door), which is what T5's sealed record hands it. So there is
      no 32-bit port left to widen, and widening a superseded block's port would
      be work on a machine nobody ships. If an island handle is ever packed into
      one word in RTL, T10's 50 bits is the width it takes.

      IT COMPOSES THE STORE RATHER THAN DUPLICATING IT, and the arithmetic is
      why. A dense handle table for a 125 x 125 grid would be 16,384 x 32 bits
      = 524,288 bits = FIFTY-TWO M10Ks on a 553-block device, to hold a
      structure whose occupancy peaks near 800. The sparse store already exists
      as TERRAIN.RESIDENCY's 256-set, 4-way directory over the canonical key;
      this block adds the extent and pitch gates and the mapping from its
      hit/miss to the island's four outcomes.

      THE OUTCOME ORDER IS THE REFERENCE'S: bad pitch, then out of extent, then
      the store. It is load-bearing -- a coordinate outside the extent of an
      island whose pitch is illegal must report BAD PITCH, because a malformed
      descriptor cannot be trusted to say what the extent is.

      The reference model has existed since 2026-09-06 and was NOT NAMED BY ANY
      BLOCK until this entry, which is how a reference goes missing in practice:
      not by being absent, but by having nothing point at it.

