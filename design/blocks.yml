  - id: MEM.GUARD
    name: Memory guard
    kind: rtl
    subsystem: memory
    clock_domain: gpu
    purpose: "Region/ownership checker between every fabric client and VRAM: a malformed command can never write outside the region the frame slot owns."
    contract: design/contracts/MEM.GUARD.md
    phase: 1
    owner_issue: ZH-029
    inputs: [client_req, guard_policy]
    outputs: [arb_req, guard_violation]
    upstream: [CMD.SCHEDULER, TERRAIN.PATCH, TERRAIN.VELOCITY, SURFACE.SHEET, GEOM.MESHFETCH, GEOM.POSE, TEXTURE.CACHE, PART.STATE, RASTER.RESOLVE, POST.GATHER, POST.ECHO, VIDEO.SCANOUT]
    downstream: [MEM.VRAM.ARBITER]
