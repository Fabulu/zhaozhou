      major clients only. Phase-2 region map (spec/memory_rules.md 5): FB
      slot 0 @ 0x0000_0000 (bank 0) and slot 1 @ 0x0200_0000 (bank 1, W2.7 bank split), each 0x3C000 B
      (largest canvas); everything else is a violation by construction.
      W2.5: verified through the full chain (nothing-written proven against
      the model's memory).
      2026-08-15 correction: the purpose field claimed "Formally proven."
      while mem_guard_no_escape had never been elaborated even once — the
      lane SKIPped on a "syntax error" match, and underneath that the
      harness's headline no-escape assertions were VACUOUS (arb_req.valid was
