  # ===========================================================================
  # SYS — platform glue (fpga/rtl/platform). Hardware-gated: sys/ vendor
  # wrappers are pinned by upstream hash post-board (ZH-000, plan 1.F).
  # ===========================================================================

  - id: SYS.PLL
    name: Vendor PLL wrappers
    kind: rtl
    evidence_kind: formal_timing
    subsystem: platform
    clock_domain: async
    purpose: Instantiate the Cyclone V PLL/IP wrappers producing the gpu/sdram/video/audio clock tree; nothing else may touch clock configuration.
    contract: design/contracts/SYS.PLL.md
    phase: 0
    owner_issue: ZH-000
    inputs: [ref_clk, pll_config]
    outputs: [gpu_clk, sdram_clk, video_clk, audio_clk, pll_locked]
    upstream: []
    downstream: [SYS.RESET]
    backpressure: none
