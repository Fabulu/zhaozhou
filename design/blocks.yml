      MATURITY STAYS AT `SPECIFIED` AND THAT IS DELIBERATE. The RTL is written,
      linted 0/0, and covered by 536 passing directed checks across three
      executables -- but the ledger ladder is not a description of test coverage,
      it is a claim about evidence against a ratified oracle, and V2/V17 say so:
      every advance past SPECIFIED needs a resolvable `reference_model`, and a
      SPECIFIED block "may cite a not-yet-written oracle" while an advanced one
      may not. `zref::MeasureHistogram` is the tenth phantom. Advancing this row
      would have meant writing an oracle in the same increment, by the same
      author, from the same freshly-invented laws -- a second statement of one
      intent dressed as independent evidence, which is the failure this ledger
      rule exists to catch. The block ships SPECIFIED with its evidence named,
      and what would unblock the advance is exactly one thing: a `zref::measure`
      oracle written by someone who did not write the RTL, against the laws in
      the module header.
