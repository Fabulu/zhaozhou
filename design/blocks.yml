    phase: 2
    owner_issue: ZH-026
    inputs: [client_req]
    outputs: [client_rsp, sdram_req]
    upstream: [MEM.SDRAM, MEM.GUARD]
    downstream: []
    backpressure: credit
    latency: variable
    target_throughput: 1 accepted request per clock
    reference_model: zref::VramArbiter
