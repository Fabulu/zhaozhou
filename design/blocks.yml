      block implements NO arithmetic. Every field it emits is CARRIED: the
      handle is the ABI's own `handle32[patch]` (SURFACE.SHEET choice C4, and
      entry I32 names synthesising it from `cmd_patch_id_i` as the cheap
      mistake to avoid), the envelope is `zhao_surface_dispatch`'s ruling-R45
      world->patch law computed once and read here, and the page identity is
      TERRAIN.HDRREAD's forwarded job. Declaring a reference model here would
      be a second claim on `zref::terrain::stamp_depth_at_vertex`, which is
      exactly what `tools/budget/uncashed_cheques.py` check 3 catches.

      `cmd_patch_id_o` IS A TRACE KEY AND NOT AN IDENTITY. It is the low byte
      of each of the patch's ix and iz, and `zhao_terrain_bake_v2` reads it
      for `trace_patch_id_o` and nothing else. Said here because a 16-bit
