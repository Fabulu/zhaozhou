      COMPOSITION rather than about this block. `CELLS_PRESENT` says layer D
      is served, which is true because TERRAIN.PAGEIO is composed beside it;
      `FALLBACK_DEPTH_FROM`/`FALLBACK_DEPTH_TO` say an R221 fallback digs
      nothing, which is a decision the owner may reverse in one edit and
      therefore may not be a literal.

      THE QUEUE IS TWO DEEP AND THE THIRD PATCH IS A COUNTER, NOT A STALL.
      `overflow_o` fires and the stamp's scar is LOST -- which is loud on
      purpose. Stamps coalesce by patch, so reaching it needs three DIFFERENT
      patches stamped inside one bake window; if that turns out to be a real
      workload the parameter is the lever and the counter is how anyone would
      know.

