  # PACKET H: THE COMPOSED SIBLING SHELL.
  #
  # The question this target exists to answer, named in advance as CLAUDE.md
  # requires: WHAT DOES THE COMPOSED SIBLING SHELL COST IN ALMs, DSPs AND RAM
  # BLOCKS, AND AT WHAT FMAX? Every gate Packet H has passed so far is a
  # Verilator or source-level one; its area is an unmeasured claim, and ALMs are
  # the binding constraint on this device.
  #
  # VIRTUAL PINS, DELIBERATELY, and the reasoning is the point. 209 top-level
  # ports is far past the device's user I/O, so there is no physical-pin fit of
  # this shell without a ten-pin characterization instrument like the historical
  # shell's -- and that instrument needs six new protocol-aware stimulus drivers
  # before it would say anything true.
  #
  # Virtual pins INFLATE area and distort boundary timing. That is a known
  # limitation here (the island fit's standalone rows carried 889 of them), and
  # it points the error in the SAFE direction for the question being asked: a
  # virtual-pin composed shell that comes in UNDER budget is strong evidence,
  # because the real one is smaller. A result OVER budget is inconclusive and
  # is the case that would justify building the ten-pin instrument.
  #
  # So this row must never be read as an Fmax receipt, and it is not the
  # post-adoption composed fit R0 asks for. It is the cheap measurement that
  # decides whether the expensive one is needed.
  #
  # The source list is CMake's own, extracted from the resolved
  # `lint_shell_top_v2` command rather than re-derived -- it is built there from
  # Packet D's lease-path closure and the historical shell list minus the two
  # blocks the sibling replaces, plus the six V2 organs, and a third hand copy
  # of that derivation is how generated tops go stale.
  - top: zhao_shell_top_v2
