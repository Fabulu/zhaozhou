# fit_targets.yml — the explicit source closure for every per-block fit.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
# `tools/quartus/run_block_fit.ps1` builds its QSF from the SHELL project's
# source list. A block outside that cone -- every raster, texture, geometry and
# terrain leaf -- is not in it, so `-Module zhao_texture_tmu_plan` on its own
# elaborates a top that has no source file, and the row comes back:
#
#     zhao_texture_tmu_plan   failed:quartus_map   -   ALM -
#
# which in the report reads as "this block does not fit". It fits perfectly
# well; nobody told the fitter where it was. The closure lived in whoever
# happened to be typing `-ExtraSources` from memory, and a forgotten submodule
# produced the same row as a genuine failure.
#
# Ruling: Phase 0 of reports/OWNER-RULINGS-BUILDABILITY-20260902.md --
# "repair the fit apparatus: design/fit_targets.yml; explicit source closure;
# preflight top-module existence".
#
# ---------------------------------------------------------------------------
# FORMAT -- deliberately a strict subset
# ---------------------------------------------------------------------------
# Windows PowerShell 5.1 has no YAML parser, and adding a dependency to run a
# fit is worse than constraining the file. So: two-space indent, one target per
# `- top:` entry, sources as a flat `- path` list, comments with `#`. No
# anchors, no nesting beyond this, no flow sequences.
#
# Paths are repo-relative and forward-slashed. Order matters to Quartus for
# packages; list a package before what imports it.
#
# ---------------------------------------------------------------------------
# `rules:` -- THE STRUCTURAL GATE (added 2026-09-03)
# ---------------------------------------------------------------------------
# reports/islandrearchitecture5.md S3.4 sets numeric tripwires per block and
# says, in plain words:
#
#     A fit that meets Fmax while violating its memory/DSP structure is not a
#     pass.
#
# Those tripwires existed only as prose. Nothing enforced them, so a cache
# rebuild that put 9,728 bits of array into flip-flops -- 2 M10K where its own
# predecessor had 4 -- was reported as a PASS on the strength of 98.66 MHz,
# because Fmax was the only number the tooling produced. This section is that
# gap closed.
#
#   rules:
#     min_m10k: 8          require at least; the MINIMUM is the important half
#     max_registers: 2000  reject above
#     max_alms: 1500
#     max_dsp: 4
#
# A maximum catches a block that grew. A MINIMUM catches a block whose storage
# quietly stopped being storage -- the failure that looks like success.
#
# Only S3.4's explicit TRIPWIRES are encoded here. S3.3's per-component budgets
# are architecture targets ("not predicted fit results", says the brief) and are
# recorded as comments beside the rule so they are visible without failing a fit
# that is legitimately mid-recovery.

targets:

  # --- texture island -------------------------------------------------------

  - top: zhao_texture_tmu_plan
    sources:
      - fpga/rtl/texture/zhao_texture_tmu_plan.sv

  - top: zhao_texture_cache_pipe
    sources:
      - fpga/rtl/texture/zhao_texture_cache_pipe.sv
    # NO RESOURCE GATES, AND THAT IS A CORRECTION (2026-09-04).
    #
    # This target used to carry min_m10k: 8, min_memory_bits: 8192,
    # max_registers: 2000 and max_alms: 1500, attributed to the brief. Every
    # one of them belongs to a DIFFERENT BLOCK:
    #
    #   islandrearchitecture5.md 3.3 names the row "synchronous texture cache
    #   v2" -- and prefaces the whole table with "These are architecture
    #   budgets, not predicted fit results";
    #
    #   10.1 is explicit: "Replace, do not patch. Create
    #   zhao_texture_cache_v2. Keep zhao_texture_cache and
    #   zhao_texture_cache_pipe as BEHAVIORAL ORACLES."
    #
    # So cache_pipe is the oracle, not the shipping block, and 10.11's gate is
    # zhao_texture_cache_v2's -- a block that does not exist yet. min_m10k: 8
    # "failed" three times against a block that was never going to meet it, and
    # min_memory_bits: 8192 was added to interrogate that failure rather than
    # to check whether the gate belonged here at all.
    #
    # AND THE 8 WAS NEVER A BIT BUDGET. C3: "CACHE V2 STORAGE: four static data
    # banks + four static tag banks" -- four plus four is EIGHT MEMORIES. The
    # brief counts RAMs, not capacity. reports/TEXTURE-ISLAND-STORAGE-GAP.
    #
    # The fit stays: what the oracle costs is worth knowing. The gates move to
    # zhao_texture_cache_v2 when it is written.

  - top: zhao_texture_aux_pipe
    sources:
      - fpga/rtl/texture/zhao_texture_aux_div6.sv
      - fpga/rtl/texture/zhao_texture_aux_pipe.sv

  - top: zhao_texture_aux_div6
    sources:
      - fpga/rtl/texture/zhao_texture_aux_div6.sv

  # TEXTURE.TMU v2, the production sampler. Added 2026-09-04: it was NOT a fit
  # target, which is worse than it sounds -- run_block_fit's preflight THROWS on
  # an unknown module, and that throw is caught by the loop's outer try, so it
  # ends the whole queue. A run asked for nine blocks would have fitted six and
  # silently skipped fragrob and cache_pipe behind it.
  #
  # The closure is the sampler plus zhao_texture_bilerp, which it instantiates.
  - top: zhao_texture_tmu_pipe
    sources:
      - fpga/rtl/texture/zhao_texture_bilerp.sv
      - fpga/rtl/texture/zhao_texture_tmu_pipe.sv
    rules:
      # D19m, added 2026-09-04. This target had NO rules at all, and the block
      # measured 72,824 registers against 256 block-memory bits -- a 16 x 256
      # x 16 palette cache (65,536 bits) sitting in flip-flops, which as memory
      # is 7 M10K of 553. Nothing caught it because nothing was watching: a
      # gate absent is not a gate passing.
      #
      # 12,000 is chosen to FAIL TODAY ON PURPOSE, the way fragrob's gate did.
      # The block's legitimate state is the ROB, the pipeline, and the 4,608
      # bits of tag/valid that are correctly flops -- roughly 7,300. Anything
      # near 12,000 means the palette is back in registers.
      max_registers: 12000
      #
      # NOT a min_m10k rule. The fix is not "put the arrays in memory": two of
      # the three MUST stay in flops. `pal_val_r` is read on all sixteen ways in
      # one cycle as the associative half of the lookup and cleared sixteen at
      # once; a memory can do neither. Only `pal_dat_r` moves, and it moves by
      # registering the read so Quartus can absorb the flop into the M10K's
      # output register (QUARTUS_GOTCHAS 14) -- `decode16()` in that path is
      # what blocks inference today, not the array's shape.

  - top: zhao_texture_palette_res
    sources:
      - fpga/rtl/texture/zhao_texture_palette_res.sv
    rules:
      # Added 2026-09-04 with the port move. `mem_r` is 16,384 bits, so at
      # 10,240 bits per M10K it cannot be memory in fewer than 2 blocks.
      # The block's own comment claimed the array was deliberately unreset and
      # therefore inferrable; that was true of the ARRAY and false of the
      # PROCESS, and nothing was measuring the difference.
      min_m10k: 2

  - top: zhao_texture_rsp_dispatch
    sources:
      - fpga/rtl/texture/zhao_texture_rsp_dispatch.sv

  - top: zhao_texture_bilerp_lane
    sources:
      - fpga/rtl/texture/zhao_texture_bilerp_lane.sv

  - top: zhao_texture_combine
    sources:
      - fpga/rtl/texture/zhao_texture_combine.sv
    rules:
      # islandrearchitecture5.md 3.3's own line for the material combiner:
      # 650 ALM / 500 registers / 1-4 M10K / 0-2 DSP, with the 3.4 tripwire
      # "reject DSP > 2".
      #
      # The DSP rule is the interesting one. This implementation takes the
      # CONTRACT's II=1 and spends four parallel byte products; the architecture
      # instead describes two product lanes with queued continuations. If this
      # fires, that IS the evidence for moving to the two-lane scheduled form --
      # a decision made against a number rather than ahead of one.
      max_alms: 650
      max_registers: 500
      max_dsp: 2

  # MATERIAL.COMBINE.V1 -- the two-lane scheduled replacement. Same three rules
  # as the block above, UNCHANGED, because they are the architecture's (S3.3 /
  # S3.4) and the II=1 form was refuted against them (docket D19q). If this one
  # also breaches DSP, the LOGIC2 attribute is not doing what S15.5 variant A
  # says it does and that is the finding.
  # RCP24 V3 -- the exact-multiplier tile, section 10 of the V3 architecture.
  # Its own target rather than -ExtraSources, so the row is reproducible and the
  # closure is declared where the provenance guard can hash it.
  #
  # RULES ARE SET AT WHAT IS MEASURED, AND ONLY THAT. max_dsp: 3 is the measured
  # figure, not svc's 4 and not section 10.7's target of 2 -- the target was
  # MISSED and is reported as a miss rather than written into the gate as though
  # it had been met. min_memory_bits keeps the payload and scratch in RAM
  # (section 21.2); it is deliberately NOT min_m10k, because a small plane may
  # legitimately land in MLAB while a plane collapsing into fabric cannot hide
  # behind a bit count.
  #
  # max_alms / max_registers / max_m10k are ABSENT ON PURPOSE until a full fit
  # produces them. Do NOT inherit svc's max_alms: 650 / max_registers: 600:
  # svc itself already violates both at 1,041 and 1,101, so copying them down
  # would install a gate that fails on arrival and gets ignored.
  # V3's completion-bank experiment -- section 26.1's FIRST implementation task.
  # Fitted alone and deliberately not composed: 26.1 says "do not merge those
  # changes into the composition until the shared record and credit contracts
  # are fixed", so this measures the structure, not the island.
  #
  # THE RULES ARE FLOORS, NOT CEILINGS, WHICH IS UNUSUAL AND DELIBERATE. The
  # claim under test is that payload lives in MEMORY rather than in fabric, so
  # the failure to catch is a bank COLLAPSING into flip-flops -- which shows up
  # as memory bits going DOWN, not up. min_memory_bits is the nine declared
  # banks alone (3*2560 + 2560 + 2560 + 4096 + 3*896 = 19,584), so the six
  # LUTRAM queues may legitimately move without failing while a bank quietly
  # becoming registers cannot hide.
  #
  # Section 21.6 budgets 1,800 ALMs for this machinery and the map-only run
  # showed 6,532 ALUTs, so max_alms is set at the BUDGET and is expected to
  # fail. That is the point: a gate that reports a real breach is worth more
  # than one set at whatever the design happens to be.
  - top: zhao_texture_v3own
    sources:
      - fpga/rtl/texture/zhao_texture_v3bank.sv
      - fpga/rtl/texture/zhao_texture_v3rq.sv
      - fpga/rtl/texture/zhao_texture_v3own.sv
    rules:
      min_m10k: 9
      min_memory_bits: 19584
      max_dsp: 0
      max_alms: 1800

  - top: zhao_raster_rcp24_v3
    sources:
      - fpga/rtl/field/zhao_field_rcp24_rom.sv
      - fpga/rtl/raster/zhao_raster_ticketq.sv
      - fpga/rtl/raster/zhao_raster_rcp24_mul.sv
      - fpga/rtl/raster/zhao_raster_rcp24_v3.sv
    rules:
      max_dsp: 3
      min_memory_bits: 1800
      # MEASURED 2026-09-06 by the full fit (digest 6553c5cef196), set at the
      # measurement with a little headroom rather than at an aspiration. svc's
      # max_alms: 650 / max_registers: 600 are deliberately NOT inherited: svc
      # itself already violates both at 1,041 and 1,101, so copying them down
      # would install a gate that fails on arrival and is then ignored.
      max_alms: 1400
      max_registers: 2100
      max_m10k: 8

  - top: zhao_texture_material_combine_v1
    sources:
      - fpga/rtl/texture/zhao_texture_material_combine_v1.sv
    rules:
      max_alms: 800        # S15.5 variant A's own bound: "<= 800 ALMs"
      max_registers: 500   # S3.3
      max_dsp: 2           # S3.4 tripwire, unchanged

  # GEOM.MEM.ADAPTER -- two logical geometry requesters over the one permitted
  # ENGINE1 client (owner recovery brief section 12). Characterised on its own
  # because the two-bank ASSETFETCH plan rests on it, and because a block whose
  # whole job is ownership bookkeeping should be cheap: if sharing one client
  # costs more than a second guard would, that is a finding and not a detail.
  #
  # NO RULES YET, deliberately. The brief gives this block no budget, and a
  # threshold invented beside the first fit that governs it is the exact failure
  # CLAUDE.md records. Measure first, gate second.
  - top: zhao_geom_mem_adapter
    sources:
      - fpga/rtl/geometry/zhao_geom_mem_adapter.sv

  - top: zhao_texture_mosaic
    sources:
      - fpga/rtl/texture/zhao_texture_mod255.sv
      - fpga/rtl/texture/zhao_texture_mosaic.sv

  # --- raster leaves the texture island depends on --------------------------
    rules:
      # S3.4: require DSP == 0 for the CSD variant. Measured 4 today, so
      # this rule FAILS on purpose until C21 lands -- an inferred multiplier
      # is on the brief's REWRITE list.
      max_dsp: 0
      # THE OWNER'S NUMBERS, not mine. islandrearchitecture5.md 14.5 gates
      # MOSAIC at "<= 500 ALMs / <= 350 registers / 0 M10K / 0 DSP / II = 1 /
      # >= 125 MHz". The DSP ceiling was already here; the other two were not,
      # so the block could have doubled in area and still reported ok.
      max_alms: 500
      max_registers: 350

  - top: zhao_raster_perspuv_svc
    sources:
      - fpga/rtl/raster/zhao_raster_perspuv_svc.sv
    rules:
      # THE BRIEF'S OWN NUMBERS, islandrearchitecture5.md 8.8: "<= 900 ALMs /
      # <= 700 registers / <= 1 M10K / 6 DSP hard initial budget / II = 1
      # pair/clock / >= 125 MHz across three seeds".
      #
      # This block had NO RULES, so it reported `ok` while measuring 2,204 ALM
      # and 3,293 registers -- 145% and 370% over. A green row that cannot go
      # red is not evidence of anything, and this is the clearest example of it
      # in the file.
      max_alms: 900
      max_registers: 700
      max_m10k: 1
      max_dsp: 6

  - top: zhao_raster_texjoin_v2
    sources:
      - fpga/rtl/raster/zhao_raster_texjoin_v2.sv

  # zhao_field_rcp24_rom is the submodule that was forgotten from an
  # -ExtraSources line once. It is why this file exists in its present form.
    rules:
      # S3.4 FRAGROB: reject registers > 2,500, and require the payload
      # banks to infer as RAM. S3.3 budget: 900 ALM / 1,200 reg / 14-20 M10K.
      # min_m10k is deliberately NOT set yet -- the banking rework (C6-C8)
      # decides the count, and a guessed minimum would fail the very step
      # that fixes it.
      max_registers: 2500

  # RASTER.TILESTORE -- two 64-bit x 256 banks, the tile colour store.
  - top: zhao_raster_tilestore
    sources:
      - fpga/rtl/raster/zhao_raster_tilestore.sv
    rules:
      # Added 2026-09-04 with the port move. ram0 and ram1 are 16,384 bits
      # each; 32,768 bits cannot be memory in fewer than 4 M10K. Both banks
      # have to infer -- 2 would mean one of them did not, and a half-inferred
      # tile store is the shape that reads as a fit that nearly worked.
      min_m10k: 4

  - top: zhao_raster_rcp24_svc
    sources:
      - fpga/rtl/field/zhao_field_rcp24_rom.sv
      - fpga/rtl/raster/zhao_raster_rcp24_svc.sv

  # --- terrain --------------------------------------------------------------
    rules:
      # S3.4: reject DSP > 4 after the 32x32 width proof. Measured 6.
      max_dsp: 4
      # THE BRIEF'S OWN NUMBERS, islandrearchitecture5.md 7.7: "<= 650 ALMs /
      # <= 600 registers / <= 1 M10K / 3 DSP preferred, 4 DSP hard ceiling".
      # Only the DSP ceiling was gated, and the block VIOLATES it at 6.
      # Measured 1041 ALM / 1101 reg -- 60% and 84% over. These gates make the
      # report say so instead of leaving two of the three numbers unwatched.
      max_alms: 650
      max_registers: 600
      max_m10k: 1

  - top: zhao_terrain_residency
    sources:
      - fpga/rtl/terrain/zhao_terrain_residency.sv

  # TERRAIN.LOADQ's whole design decision is that 32 jobs of 243 bits live in
  # ONE M10K rather than in 7,776 flip-flops, which would blow the composed
  # island's 9,000-register redline on a FIFO alone. Nothing in simulation can
  # tell those two apart -- a Verilator run is identical either way -- so the
  # claim is UNVERIFIED until a fitter says so, and it is exactly the sort of
  # plausible argument this file exists to stop being taken on trust.
  - top: zhao_terrain_loadq
    sources:
      - fpga/rtl/terrain/zhao_terrain_loadq.sv
    rules:
      # THE ACCEPTANCE QUESTION, BOTH DIRECTIONS, AND IN THE RIGHT UNIT.
      #
      # min_memory_bits, not min_m10k: this file's own record says a COUNT of
      # M10K is not a sound floor, because bits can land in MLAB and a wide
      # array packs in shapes a capacity argument does not predict. That
      # mistake cost two false failures on 2026-09-04 and is not repeated here.
      # The store is 32 x 320 = 10,240 bits and the question is whether those
      # bits became memory at all.
      min_memory_bits: 10240
      max_m10k: 2
      # AND THE OTHER DIRECTION, which is the gate that actually matters: a fit
      # that inferred the memory and ALSO kept a shadow copy in registers would
      # satisfy min_memory_bits and still be the 7,776-flop disaster the design
      # exists to avoid. Genuine flops here are the 243-bit capture register,
      # the 243-bit output register (320 as declared), pointers, counters and
      # the four 32-bit counter outputs -- roughly 750. 900 leaves room for
      # retiming without leaving room for the store.
      max_registers: 900
      max_alms: 800
      max_dsp: 0

  # TERRAIN.MIPGEN is streaming decimation with NO storage -- if a fit reports
  # RAM blocks for it, the block grew a buffer somebody did not intend.
  - top: zhao_terrain_mipgen
    sources:
      - fpga/rtl/terrain/zhao_terrain_mipgen.sv

  # The v2 residency table is 256 sets x 4 ways. Its acceptance question is the
  # same shape as the texture cache's: the tag and data arrays must infer M10K,
  # because 1,024 entries in flops is a different block wearing this one's name.
  - top: zhao_terrain_residency_v2
    sources:
      - fpga/rtl/terrain/zhao_terrain_residency_v2.sv
    rules:
      # Added 2026-09-04 with the storage rework. Without a min_m10k a fit that
      # put all 167,936 bits back into flip-flops would report `ok`, which is
      # the exact false-pass this gate exists to remove -- and this block was
      # 60% of the console's whole overage.
      #
      # THE THRESHOLD IS A CAPACITY FLOOR, not an estimate. keyram and statram
      # are 167,936 bits; an M10K holds 10,240, so if they are memory at all
      # they cannot occupy fewer than 17 blocks. Width padding only ever costs
      # MORE blocks (107 and 57 bits both exceed the 40-bit maximum port
      # width), never fewer, so 17 cannot produce a false failure. A partial
      # inference -- keyram memory, statram flops -- lands around 12 and fails,
      # which is correct: half the fix is not the fix.
      # min_m10k 17 WAS WRONG AND IS KEPT AS THE RECORD OF WHY. It was derived
      # as 167,936 bits / 10,240 per M10K and asserted to be a floor that
      # "cannot produce a false failure". It produced one: the fit came back at
      # 16 and reported failed:structure on a block whose storage had inferred.
      #
      # A COUNT OF M10K IS NOT BOUNDED BELOW BY CAPACITY. Quartus has a second
      # memory primitive -- bits can land in MLAB -- and a wide array can be
      # packed in shapes a capacity argument does not predict. The floor
      # ignored that the device has more than one kind of memory.
      min_m10k: 16
      # The sound form of the same question, derived from the declared arrays:
      # keyram 107 x 256 x 4 = 109,568 and statram 57 x 256 x 4 = 58,368.
      min_memory_bits: 167936
      # Control state only: rr_q (512), the four-way read registers (656), the
      # s0 capture and the counters. Generous, and still four ORDERS below the
      # ~168,000 that "the arrays stayed in flops" would show.
      max_registers: 3000

  # TEX.FRAGROB -- the transaction centre that replaces the TEXJOIN monolith.
  # Built beside v2 per S6.1, with v2 kept as the behavioural oracle.
  - top: zhao_texture_fragrob
    sources:
      - fpga/rtl/texture/zhao_texture_fragrob.sv
    rules:
      # S3.4 FRAGROB: "reject registers > 2,500" and "require its declared
      # payload banks to infer as RAM". S3.3 budget: 900 ALM / 1,200 reg /
      # 14-20 M10K / 0 DSP. The min_m10k is the whole point of the rewrite --
      # v2 measured 4 M10K against 7,151 registers, which is the entry table
      # in flip-flops. A pass here REQUIRES the banks to be memory.
      min_m10k: 6
      # min_m10k: 6 IS A REAL GATE, and the note that used to sit here saying
      # otherwise was wrong (corrected 2026-09-04).
      #
      # It read: "six M10K is 61,440 bits of capacity against 5,184 bits of
      # payload, so the 28x gap is a scope question, not a tripwire question."
      # That converted an M10K COUNT into a bit budget and then argued with its
      # own arithmetic. The brief counts MEMORIES:
      #
      #   6.1   "The production FRAGROB owns: sixteen fragment slots"
      #         -- so DEPTH=16 is the brief's own number, not a placeholder;
      #   3.3   14-20 M10K, against the block's payload arrays:
      #         desc_u_m/desc_v_m/desc_met_m/res_rgb_m/res_a_m each [3][16],
      #         plus ctx_m/auxrgb_m/auxa_m [16] -- FIFTEEN TO EIGHTEEN
      #         memories, which is the gate, near enough exactly;
      #   6.13  hard rejection: "any sample/context payload array IN FLOPS
      #         above the explicit control bits".
      #
      # The brief REQUIRES those arrays to be RAM and expects fifteen-odd small
      # mostly-empty M10Ks. So a low count here is evidence of the defect 6.13
      # names -- and there is a known cause: desc_u_m[3][DEPTH] is
      # MULTIDIMENSIONAL, and Quartus reports "cannot regroup multidimensional
      # array", the same blocker measured on the texture cache this session.
      #
      # AND THE GATE THAT ACTUALLY ENFORCES 6.13 IS max_registers, NOT THIS ONE.
      # A 16-deep array is shallow enough that Quartus will reasonably choose
      # MLAB over M10K, and neither recorded metric can tell MLAB from flops:
      # `ramBlocks` counts M10K, and `blockMemoryBits` is Quartus's "Total
      # block memory bits", which is also M10K. A correct implementation using
      # MLAB therefore reports 0 and 0 -- identical to the defect.
      #
      # What payload-in-flops actually shows up as is a REGISTER EXPLOSION:
      # texjoin v2 measured 4 M10K against 7,151 registers, and 7,151 is the
      # entry table in flip-flops saying so out loud. 5,184 bits of payload
      # cannot hide under a 2,500 ceiling.
      #
      # So: max_registers below is the enforcer. min_m10k stays as the BRIEF'S
      # RECORDED EXPECTATION, and a failure is read together with the register
      # count -- low M10K with low registers is MLAB and satisfies 6.13's
      # intent; low M10K with high registers is the defect. If it is the
      # defect, the fix is to give each payload array a shape Quartus can
      # infer, not to lower the number.
      #
      # min_memory_bits stays unset: bits are the wrong unit for this gate, and
      # a floor low enough to pass by construction would be theatre.
      max_registers: 2500
      max_dsp: 0

# --- production resource top (GENERATED by tools/gen_prod_top.py) ---------
# One instance of every production block, per design/prod_manifest.yml. This is
# the fit that answers reports/WeNeedSomeMeasurements.md: what does the planned
# console cost when counted ONCE? It is NOT a functional design -- blocks are
# not wired to each other -- so no timing number from it means anything.
  # ==========================================================================
  # THE COMPOSED TEXTURE ISLAND (G1-D). The number this whole gate is about.
  # ==========================================================================
  # Every island figure quoted so far is a SUM OF STANDALONE PER-BLOCK FITS,
  # and that sum is not the island's size: each standalone row carries virtual
  # pins and their registers, and nothing is shared across a block boundary.
  # The tell is already in the census -- totalled by row it comes to 342 DSP
  # against the device's 112, which cannot be true.
  #
  # This top wires the eleven approved components TO EACH OTHER. It is not
  # zhao_prod_top, which drives every block from a separate LFSR and whose own
  # header says its number has no functional meaning.
  #
  # NO RULES YET, DELIBERATELY. There has never been a composed measurement, so
  # any threshold here would be a guess dressed as a gate -- and a rule written
  # beside the first fit it governs is the exact failure CLAUDE.md records. The
  # architecture's nominal is 6,600 ALM and the redline 7,500; the sum of
  # standalone rows is 7,913. Which side the composed number lands on is the
  # question, and it gets answered before it gets gated.
  - top: zhao_texture_island_top
    sources:
      - fpga/rtl/texture/zhao_texture_island_top.sv
      - fpga/rtl/texture/zhao_texture_fragrob.sv
      - fpga/rtl/raster/zhao_raster_rcp24_svc.sv
      - fpga/rtl/raster/zhao_raster_perspuv_svc.sv
      - fpga/rtl/texture/zhao_texture_tmu_plan.sv
      - fpga/rtl/texture/zhao_texture_cache_pipe.sv
      - fpga/rtl/texture/zhao_texture_rsp_dispatch.sv
      - fpga/rtl/texture/zhao_texture_palette_res.sv
