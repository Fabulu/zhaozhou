# fit_targets.yml — the explicit source closure for every per-block fit.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
# `tools/quartus/run_block_fit.ps1` builds its QSF from the SHELL project's
# source list. A block outside that cone -- every raster, texture, geometry and
# terrain leaf -- is not in it, so `-Module zhao_texture_tmu_plan` on its own
# elaborates a top that has no source file, and the row comes back:
#
#     zhao_texture_tmu_plan   failed:quartus_map   -   ALM -
#
# which in the report reads as "this block does not fit". It fits perfectly
# well; nobody told the fitter where it was. The closure lived in whoever
# happened to be typing `-ExtraSources` from memory, and a forgotten submodule
# produced the same row as a genuine failure.
#
# Ruling: Phase 0 of reports/OWNER-RULINGS-BUILDABILITY-20260902.md --
# "repair the fit apparatus: design/fit_targets.yml; explicit source closure;
# preflight top-module existence".
#
# ---------------------------------------------------------------------------
# FORMAT -- deliberately a strict subset
# ---------------------------------------------------------------------------
# Windows PowerShell 5.1 has no YAML parser, and adding a dependency to run a
# fit is worse than constraining the file. So: two-space indent, one target per
# `- top:` entry, sources as a flat `- path` list, comments with `#`. No
# anchors, no nesting beyond this, no flow sequences.
#
# Paths are repo-relative and forward-slashed. Order matters to Quartus for
# packages; list a package before what imports it.
#
# ---------------------------------------------------------------------------
# `rules:` -- THE STRUCTURAL GATE (added 2026-09-03)
# ---------------------------------------------------------------------------
# reports/islandrearchitecture5.md S3.4 sets numeric tripwires per block and
# says, in plain words:
#
#     A fit that meets Fmax while violating its memory/DSP structure is not a
#     pass.
#
# Those tripwires existed only as prose. Nothing enforced them, so a cache
# rebuild that put 9,728 bits of array into flip-flops -- 2 M10K where its own
# predecessor had 4 -- was reported as a PASS on the strength of 98.66 MHz,
# because Fmax was the only number the tooling produced. This section is that
# gap closed.
#
#   rules:
#     min_m10k: 8          require at least; the MINIMUM is the important half
#     max_registers: 2000  reject above
#     max_alms: 1500
#     max_dsp: 4
#
# A maximum catches a block that grew. A MINIMUM catches a block whose storage
# quietly stopped being storage -- the failure that looks like success.
#
# Only S3.4's explicit TRIPWIRES are encoded here. S3.3's per-component budgets
# are architecture targets ("not predicted fit results", says the brief) and are
# recorded as comments beside the rule so they are visible without failing a fit
# that is legitimately mid-recovery.

targets:

  # --- texture island -------------------------------------------------------

  - top: zhao_texture_tmu_plan
    sources:
      - fpga/rtl/texture/zhao_texture_tmu_plan.sv

  - top: zhao_texture_cache_pipe
    sources:
      - fpga/rtl/texture/zhao_texture_cache_pipe.sv
    rules:
      # S3.4 verbatim: require M10K >= 8, reject registers > 2,000,
      # reject ALMs > 1,500. S10 calls this block THE ALM RECOVERY CENTRE.
      # Measured 2026-09-03 BEFORE the storage fix: 2 / 11,328 / 5,903 --
      # all three violated, and it reported `ok` at 98.66 MHz.
      min_m10k: 8
      # ADDED 2026-09-04 ALONGSIDE min_m10k, not instead of it. S3.4's "8" is
      # the owner's number and stays; D19 records that it is unreachable
      # because tag_r is 16 deep x 24 wide and no M10K will hold an array that
      # shallow. This is the same question asked in a unit that does not depend
      # on how Quartus packed it.
      #
      # DERIVED, NOT TUNED: data_r is 4 lanes x 128 entries x 16 bits = 8,192
      # bits, and those are the bits that must be memory. tag_r's 1,536 are
      # deliberately excluded -- they are correctly in flip-flops. The fit
      # measured 128 bits before the rework and 8,320 after.
      min_memory_bits: 8192
      max_registers: 2000
      max_alms: 1500

  - top: zhao_texture_aux_pipe
    sources:
      - fpga/rtl/texture/zhao_texture_aux_div6.sv
      - fpga/rtl/texture/zhao_texture_aux_pipe.sv

  - top: zhao_texture_aux_div6
    sources:
      - fpga/rtl/texture/zhao_texture_aux_div6.sv

  # TEXTURE.TMU v2, the production sampler. Added 2026-09-04: it was NOT a fit
  # target, which is worse than it sounds -- run_block_fit's preflight THROWS on
  # an unknown module, and that throw is caught by the loop's outer try, so it
  # ends the whole queue. A run asked for nine blocks would have fitted six and
  # silently skipped fragrob and cache_pipe behind it.
  #
  # The closure is the sampler plus zhao_texture_bilerp, which it instantiates.
  - top: zhao_texture_tmu_pipe
    sources:
      - fpga/rtl/texture/zhao_texture_bilerp.sv
      - fpga/rtl/texture/zhao_texture_tmu_pipe.sv

  - top: zhao_texture_palette_res
    sources:
      - fpga/rtl/texture/zhao_texture_palette_res.sv
    rules:
      # Added 2026-09-04 with the port move. `mem_r` is 16,384 bits, so at
      # 10,240 bits per M10K it cannot be memory in fewer than 2 blocks.
      # The block's own comment claimed the array was deliberately unreset and
      # therefore inferrable; that was true of the ARRAY and false of the
      # PROCESS, and nothing was measuring the difference.
      min_m10k: 2

  - top: zhao_texture_rsp_dispatch
    sources:
      - fpga/rtl/texture/zhao_texture_rsp_dispatch.sv

  - top: zhao_texture_bilerp_lane
    sources:
      - fpga/rtl/texture/zhao_texture_bilerp_lane.sv

  - top: zhao_texture_mosaic
    sources:
      - fpga/rtl/texture/zhao_texture_mod255.sv
      - fpga/rtl/texture/zhao_texture_mosaic.sv

  # --- raster leaves the texture island depends on --------------------------
    rules:
      # S3.4: require DSP == 0 for the CSD variant. Measured 4 today, so
      # this rule FAILS on purpose until C21 lands -- an inferred multiplier
      # is on the brief's REWRITE list.
      max_dsp: 0
      # THE OWNER'S NUMBERS, not mine. islandrearchitecture5.md 14.5 gates
      # MOSAIC at "<= 500 ALMs / <= 350 registers / 0 M10K / 0 DSP / II = 1 /
      # >= 125 MHz". The DSP ceiling was already here; the other two were not,
      # so the block could have doubled in area and still reported ok.
      max_alms: 500
      max_registers: 350

  - top: zhao_raster_perspuv_svc
    sources:
      - fpga/rtl/raster/zhao_raster_perspuv_svc.sv
    rules:
      # THE BRIEF'S OWN NUMBERS, islandrearchitecture5.md 8.8: "<= 900 ALMs /
      # <= 700 registers / <= 1 M10K / 6 DSP hard initial budget / II = 1
      # pair/clock / >= 125 MHz across three seeds".
      #
      # This block had NO RULES, so it reported `ok` while measuring 2,204 ALM
      # and 3,293 registers -- 145% and 370% over. A green row that cannot go
      # red is not evidence of anything, and this is the clearest example of it
      # in the file.
      max_alms: 900
      max_registers: 700
      max_m10k: 1
      max_dsp: 6

  - top: zhao_raster_texjoin_v2
    sources:
      - fpga/rtl/raster/zhao_raster_texjoin_v2.sv

  # zhao_field_rcp24_rom is the submodule that was forgotten from an
  # -ExtraSources line once. It is why this file exists in its present form.
    rules:
      # S3.4 FRAGROB: reject registers > 2,500, and require the payload
      # banks to infer as RAM. S3.3 budget: 900 ALM / 1,200 reg / 14-20 M10K.
      # min_m10k is deliberately NOT set yet -- the banking rework (C6-C8)
      # decides the count, and a guessed minimum would fail the very step
      # that fixes it.
      max_registers: 2500

  # RASTER.TILESTORE -- two 64-bit x 256 banks, the tile colour store.
  - top: zhao_raster_tilestore
    sources:
      - fpga/rtl/raster/zhao_raster_tilestore.sv
    rules:
      # Added 2026-09-04 with the port move. ram0 and ram1 are 16,384 bits
      # each; 32,768 bits cannot be memory in fewer than 4 M10K. Both banks
      # have to infer -- 2 would mean one of them did not, and a half-inferred
      # tile store is the shape that reads as a fit that nearly worked.
      min_m10k: 4

  - top: zhao_raster_rcp24_svc
    sources:
      - fpga/rtl/field/zhao_field_rcp24_rom.sv
      - fpga/rtl/raster/zhao_raster_rcp24_svc.sv

  # --- terrain --------------------------------------------------------------
    rules:
      # S3.4: reject DSP > 4 after the 32x32 width proof. Measured 6.
      max_dsp: 4
      # THE BRIEF'S OWN NUMBERS, islandrearchitecture5.md 7.7: "<= 650 ALMs /
      # <= 600 registers / <= 1 M10K / 3 DSP preferred, 4 DSP hard ceiling".
      # Only the DSP ceiling was gated, and the block VIOLATES it at 6.
      # Measured 1041 ALM / 1101 reg -- 60% and 84% over. These gates make the
      # report say so instead of leaving two of the three numbers unwatched.
      max_alms: 650
      max_registers: 600
      max_m10k: 1

  - top: zhao_terrain_residency
    sources:
      - fpga/rtl/terrain/zhao_terrain_residency.sv

  # TERRAIN.MIPGEN is streaming decimation with NO storage -- if a fit reports
  # RAM blocks for it, the block grew a buffer somebody did not intend.
  - top: zhao_terrain_mipgen
    sources:
      - fpga/rtl/terrain/zhao_terrain_mipgen.sv

  # The v2 residency table is 256 sets x 4 ways. Its acceptance question is the
  # same shape as the texture cache's: the tag and data arrays must infer M10K,
  # because 1,024 entries in flops is a different block wearing this one's name.
  - top: zhao_terrain_residency_v2
    sources:
      - fpga/rtl/terrain/zhao_terrain_residency_v2.sv
    rules:
      # Added 2026-09-04 with the storage rework. Without a min_m10k a fit that
      # put all 167,936 bits back into flip-flops would report `ok`, which is
      # the exact false-pass this gate exists to remove -- and this block was
      # 60% of the console's whole overage.
      #
      # THE THRESHOLD IS A CAPACITY FLOOR, not an estimate. keyram and statram
      # are 167,936 bits; an M10K holds 10,240, so if they are memory at all
      # they cannot occupy fewer than 17 blocks. Width padding only ever costs
      # MORE blocks (107 and 57 bits both exceed the 40-bit maximum port
      # width), never fewer, so 17 cannot produce a false failure. A partial
      # inference -- keyram memory, statram flops -- lands around 12 and fails,
      # which is correct: half the fix is not the fix.
      # min_m10k 17 WAS WRONG AND IS KEPT AS THE RECORD OF WHY. It was derived
      # as 167,936 bits / 10,240 per M10K and asserted to be a floor that
      # "cannot produce a false failure". It produced one: the fit came back at
      # 16 and reported failed:structure on a block whose storage had inferred.
      #
      # A COUNT OF M10K IS NOT BOUNDED BELOW BY CAPACITY. Quartus has a second
      # memory primitive -- bits can land in MLAB -- and a wide array can be
      # packed in shapes a capacity argument does not predict. The floor
      # ignored that the device has more than one kind of memory.
      min_m10k: 16
      # The sound form of the same question, derived from the declared arrays:
      # keyram 107 x 256 x 4 = 109,568 and statram 57 x 256 x 4 = 58,368.
      min_memory_bits: 167936
      # Control state only: rr_q (512), the four-way read registers (656), the
      # s0 capture and the counters. Generous, and still four ORDERS below the
      # ~168,000 that "the arrays stayed in flops" would show.
      max_registers: 3000

  # TEX.FRAGROB -- the transaction centre that replaces the TEXJOIN monolith.
  # Built beside v2 per S6.1, with v2 kept as the behavioural oracle.
  - top: zhao_texture_fragrob
    sources:
      - fpga/rtl/texture/zhao_texture_fragrob.sv
    rules:
      # S3.4 FRAGROB: "reject registers > 2,500" and "require its declared
      # payload banks to infer as RAM". S3.3 budget: 900 ALM / 1,200 reg /
      # 14-20 M10K / 0 DSP. The min_m10k is the whole point of the rewrite --
      # v2 measured 4 M10K against 7,151 registers, which is the entry table
      # in flip-flops. A pass here REQUIRES the banks to be memory.
      min_m10k: 6
      # KEPT as the record of what S3.3 expected, and it is impossible: the
      # block declares 5,184 bits of payload at DEPTH=16 and six M10K is 61,440
      # bits of capacity. See the contract -- the 28x gap between the budget's
      # 14-20 M10K and the storage that exists is a scope question, not a
      # tripwire question.
      #
      # DERIVED floor for the block as built: every payload array is 16 DEEP,
      # which Quartus will not put in block RAM, so the honest expectation is
      # ZERO block memory bits and the useful gates are the register and DSP
      # ceilings. min_memory_bits is deliberately NOT set rather than set to a
      # number that would pass by construction.
      max_registers: 2500
      max_dsp: 0

