  # --- PAGESTREAM + PATCH, the fifth wrapper and the seam the timing pointed at
  # THE ACCEPTANCE QUESTION IS THE CLOCK. PAGESTREAM standalone reported 93.91
  # MHz with all 23 negative paths ending at a virtual pin and its worst
  # core-to-core path at 107.38; PATCH's row never recorded an Fmax at all.
  # Wired together with both ends registered, the pins are gone and the two
  # halves of the real path finally meet: PAGESTREAM's 4.30 ns combinational
  # buffer read into PATCH's 33-bit saturating add and two 32-bit clamps.
  #
  # THE PREDICTION, WRITTEN BEFORE THE FIT, from the two standalone rows:
  #   ALM       1,649 + 1,584 = 3,233 for the pair, plus the wrapper's own
  #             stimulus, hash sink and beat memory. G1-D measured its composed
  #             island 2.4% UNDER its standalone sum. Gate 4,000 -- loose,
  #             because the question is the clock, not the area.
  #   REGISTERS 2,043 + 2,483 = 4,526 plus the wrapper. Gate 5,400.
  #   M10K      the pair is 0 + 0; the wrapper's 64x64 beat memory is one more.
  #             Gate 2, which is a real bound and not a shrug: a THIRD would
  #             mean PAGESTREAM's staging buffers went to memory, and that is
  #             the thing its own `max_m10k: 0` exists to forbid.
  #   DSP       BOTH BLOCKS ARE ZERO AND THIS TARGET IS NOT, because the
  #             wrapper's placement glue multiplies. Nothing in fpga/rtl places
  #             a vertex, so that multiply lives only in a bench today; a
  #             non-zero count here is the price of that gap, and if it is
  #             large the answer is an accumulator. Gate 8.
  - top: zhao_pair_pagestream_patch
    sources:
      - fpga/rtl/terrain/zhao_terrain_patch_law_pkg.sv
      - fpga/rtl/synth/zhao_pair_pagestream_patch.sv
      - fpga/rtl/terrain/zhao_terrain_pagestream.sv
      - fpga/rtl/terrain/zhao_terrain_patch.sv
    rules:
      min_fmax_mhz: 100
      max_alms: 4000
      max_registers: 5400
      max_m10k: 2
      max_dsp: 8

  - top: zhao_texture_island_top
    sources:
      - fpga/rtl/texture/zhao_texture_island_top.sv
      - fpga/rtl/texture/zhao_texture_fragrob.sv
      - fpga/rtl/raster/zhao_raster_rcp24_svc.sv
      - fpga/rtl/raster/zhao_raster_perspuv_svc.sv
      - fpga/rtl/texture/zhao_texture_tmu_plan.sv
