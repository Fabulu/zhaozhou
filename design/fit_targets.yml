  # ===========================================================================
  # zhao_console_core -- THE CONNECTED MACHINE.  Added 2026-09-18.
  #
  # This is NOT another census row. `zhao_prod_top` stays the census
  # (RESOURCE_CENSUS_DISCONNECTED: blocks side by side under independent
  # stimulus) and this is the other top the completion plan asks for --
  # Zhaozhou_True_Console_Completion_Plan_2026-09-18.txt S1.3, "the connected
  # machine, with platform transaction interfaces". S13.3 is explicit that
  # re-labelling the census would not have counted.
  #
  # WHAT IT ADDS OVER `zhao_shell_top_v2`, and why the number must move:
  # seventeen files, seven of them blocks that were BUILT AND ADOPTED NOWHERE
  # and therefore contributed 0 ALM to every measurement so far --
  #   the four particle blocks, wired as one ring;
  #   zhao_geom_group_seq, closed onto the shared projector (which is why
  #     zhao_proj_subsystem / zhao_project_core / zhao_geom_proj_lane and their
  #     arenas appear here: the manifest's own note says the projector "is not
  #     yet adoptable" precisely because its producer was absent, and this is
  #     the composition in which it is not);
  #   zhao_post_composite and zhao_measure_histogram.
  #
  # READ THE FILE HEADER BEFORE READING THE NUMBER. `fpga/rtl/prod/
  # zhao_console_core.sv` carries an "INCOMPLETE -- TIED OFF, AND WHY" table
  # with twenty entries. Two of them change what the ALM figure means:
  #   * the species/curve descriptor tables have NO OWNER IN THE TREE, so they
  #     are boundary ports here -- the logic behind them is present, but the
  #     table itself is not built and costs nothing in this row;
  #   * PART.UPDATE's step-6 collision input is TIED TO ZERO because
  #     PART.COLLIDE emits no velocity triple, so synthesis folds that datapath
  #     away and this row UNDER-COUNTS PART.UPDATE.
  #
  # CORRECTED 2026-09-19 -- the paragraph immediately above is STALE and is left
  # in place only so this correction has something to point at. Owner ruling
  # `reports/RULING-I4-COLLISION-SPAWN-20260919.md` RETIRED PART.UPDATE's four
  # `col_*_i` ports; there is no step-6 datapath in that block to fold away and
  # no tie-off on it. So this row no longer under-counts PART.UPDATE -- it
  # measures the smaller, correct block, and any number taken here after
  # 2026-09-19 is expected to be LOWER for PART.UPDATE than one taken before it.
  # PART.COLLIDE gains an event vector, a spawn-record port and one counter;
  # zhao_console_core's fork moved from PART.UPDATE's output to PART.COLLIDE's.
  # Header entry I4 is DELETED from `zhao_console_core.sv` because it is closed.
  # And it contains NO LIGHTING AT ALL -- `zhao_geom_light` and every
  # `zhao_light_*` file are excluded on purpose while that service is being
  # refactored, so nothing here should be read as "lighting fits in what is
  # left".
  #
  # NO `rules:` BLOCK. The S3.4 tripwires are per-block numbers and nobody has
  # set any for a connected top; inventing a maximum before the first honest
  # measurement is how a guess becomes a gate. Add them once this row exists.
  #
  # The closure is `zhao_shell_top_v2`'s list (unchanged, so the two rows are
  # comparable) plus exactly the seventeen additions.
  - top: zhao_console_core
