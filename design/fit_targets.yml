  # ==========================================================================
  # GEOMETRY: three more blocks with no target, two of them already MEASURED
  # ==========================================================================
  # 2026-09-09. These three have no `- top:` entry, and two of them have ledger
  # rows anyway -- fitted before targets existed, or via -ExtraSources. A block
  # with a number but no target is worse than one with neither: the number cannot
  # be reproduced, so it ages silently and nobody can tell when it stopped being
  # true.

  - top: zhao_geom_lod
    sources:
      - fpga/rtl/geometry/zhao_geom_lod.sv
    rules:
      # THESE ARE REGRESSION BOUNDS, NOT A VALIDATION, and the difference matters.
      # CLAUDE.md warns that a rule written after the fit it governs reports a
      # pass. That is about inventing a rule so the current number squeaks under
      # and then citing the pass as evidence. This is the other thing: the block
      # ACHIEVED these numbers and its header records how, so the bound exists to
      # catch a future increase, and it claims nothing about the present fit.
      #
      # zhao_geom_lod.sv:93-98 records the whole progression, and it is the best
      # worked example of operand narrowing in this repository:
      #
      #   first synthesis   1,436 ALM  28 DSP   72-bit operands
      #   after narrowing   1,303 ALM  18 DSP   64-bit, two products shared
      #   after SEQUENCING  1,183 ALM   6 DSP   one multiplier, 5 cycles
      #
      # "a 72-bit operand asks Quartus for a 72x72 multiplier when the honest need
      # is 32x32" (:230). Narrowing alone took 28 to 18; sequencing took 18 to 6.
      max_alms: 1183
      max_dsp: 6

  - top: zhao_geom_skin
    sources:
      - fpga/rtl/geometry/zhao_geom_skin.sv
    rules:
      # Regression bounds at the measured default, same reasoning as above.
      #
      # AND THIS BLOCK IS A PARAMETERISED DSP LEVER NOBODY HAS LISTED. Three rows
      # exist and they are one knob apart:
      #
      #   MUL_LANES=1   1,530 ALM   3 DSP   56.11 MHz
      #   default       2,225 ALM   9 DSP   89.65 MHz
      #   MUL_LANES=6   2,595 ALM  18 DSP   84.61 MHz
      #
      # So -6 DSP is available for -33 MHz, already measured, no new work. Whether
      # 56 MHz is survivable here is a rate question the header says was left open
      # deliberately: the first implementation issued all eighteen 32x32 products
      # in one clock and cost 72 DSP -- "64% of the chip for one stage" -- and was
      # left that way pending a stated vertex rate. The bound below is the
      # DEFAULT, so a change of default trips it rather than passing quietly.
      max_alms: 2225
      max_dsp: 9

  # GEOM.LOOM -- the Transform Loom. FIT GATE G-LOOM1, and the question it
  # answers is stated in advance as design/fit_targets.yml's own discipline
  # requires: HOW MUCH M10K DOES THE PARENT STORE ACTUALLY INFER, and does the
  # 412-bit x 1,024 array come back as block RAM at all rather than as 421,888
  # flops? That is the ONE question here that Verilator cannot answer, and it
  # is the one the contract's NO M10K for the parent store line is being
  # argued against. DSP is predicted at 3 (one zhao_geom_mat3x4_mul at
  # MUL_LANES=1) and ALMs are unpredicted.
  #
  # NO RULES, deliberately, and for zhao_geom_skin_norm's stated reason: this
  # block has never been fitted, so every bound I could write here would be one
  # I invented, which is the rule-written-after-the-fit that reports a pass.
  # The contract's ceiling (1,500 ALM / 12 DSP / no M10K) is the CONTRACT's
  # number and is quoted in the block header; it is not a measurement and does
  # not become one by being copied into a gate.
  - top: zhao_geom_loom
    sources:
      - fpga/rtl/geometry/zhao_geom_loom.sv
      - fpga/rtl/geometry/zhao_geom_mat3x4_mul.sv
