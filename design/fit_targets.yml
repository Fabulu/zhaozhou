# fit_targets.yml — the explicit source closure for every per-block fit.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
# `tools/quartus/run_block_fit.ps1` builds its QSF from the SHELL project's
# source list. A block outside that cone -- every raster, texture, geometry and
# terrain leaf -- is not in it, so `-Module zhao_texture_tmu_plan` on its own
# elaborates a top that has no source file, and the row comes back:
#
#     zhao_texture_tmu_plan   failed:quartus_map   -   ALM -
#
# which in the report reads as "this block does not fit". It fits perfectly
# well; nobody told the fitter where it was. The closure lived in whoever
# happened to be typing `-ExtraSources` from memory, and a forgotten submodule
# produced the same row as a genuine failure.
#
# Ruling: Phase 0 of reports/OWNER-RULINGS-BUILDABILITY-20260902.md --
# "repair the fit apparatus: design/fit_targets.yml; explicit source closure;
# preflight top-module existence".
#
# ---------------------------------------------------------------------------
# FORMAT -- deliberately a strict subset
# ---------------------------------------------------------------------------
# Windows PowerShell 5.1 has no YAML parser, and adding a dependency to run a
# fit is worse than constraining the file. So: two-space indent, one target per
# `- top:` entry, sources as a flat `- path` list, comments with `#`. No
# anchors, no nesting beyond this, no flow sequences.
#
# Paths are repo-relative and forward-slashed. Order matters to Quartus for
# packages; list a package before what imports it.
#
# ---------------------------------------------------------------------------
# `rules:` -- THE STRUCTURAL GATE (added 2026-09-03)
# ---------------------------------------------------------------------------
# reports/islandrearchitecture5.md S3.4 sets numeric tripwires per block and
# says, in plain words:
#
#     A fit that meets Fmax while violating its memory/DSP structure is not a
#     pass.
#
# Those tripwires existed only as prose. Nothing enforced them, so a cache
# rebuild that put 9,728 bits of array into flip-flops -- 2 M10K where its own
# predecessor had 4 -- was reported as a PASS on the strength of 98.66 MHz,
# because Fmax was the only number the tooling produced. This section is that
# gap closed.
#
#   rules:
#     min_m10k: 8          require at least; the MINIMUM is the important half
#     max_registers: 2000  reject above
#     max_alms: 1500
#     max_dsp: 4
#
# A maximum catches a block that grew. A MINIMUM catches a block whose storage
# quietly stopped being storage -- the failure that looks like success.
#
# Only S3.4's explicit TRIPWIRES are encoded here. S3.3's per-component budgets
# are architecture targets ("not predicted fit results", says the brief) and are
# recorded as comments beside the rule so they are visible without failing a fit
# that is legitimately mid-recovery.

targets:

  # --- texture island -------------------------------------------------------

  - top: zhao_texture_tmu_plan
    sources:
      - fpga/rtl/texture/zhao_texture_tmu_plan.sv

  - top: zhao_texture_cache_pipe
    sources:
      - fpga/rtl/texture/zhao_texture_cache_pipe.sv
    rules:
      # S3.4 verbatim: require M10K >= 8, reject registers > 2,000,
      # reject ALMs > 1,500. S10 calls this block THE ALM RECOVERY CENTRE.
      # Measured 2026-09-03 BEFORE the storage fix: 2 / 11,328 / 5,903 --
      # all three violated, and it reported `ok` at 98.66 MHz.
      min_m10k: 8
      max_registers: 2000
      max_alms: 1500

  - top: zhao_texture_aux_pipe
    sources:
      - fpga/rtl/texture/zhao_texture_aux_div6.sv
      - fpga/rtl/texture/zhao_texture_aux_pipe.sv

  - top: zhao_texture_aux_div6
    sources:
      - fpga/rtl/texture/zhao_texture_aux_div6.sv

  - top: zhao_texture_palette_res
    sources:
      - fpga/rtl/texture/zhao_texture_palette_res.sv

  - top: zhao_texture_rsp_dispatch
    sources:
      - fpga/rtl/texture/zhao_texture_rsp_dispatch.sv

  - top: zhao_texture_bilerp_lane
    sources:
      - fpga/rtl/texture/zhao_texture_bilerp_lane.sv

  - top: zhao_texture_mosaic
    sources:
      - fpga/rtl/texture/zhao_texture_mod255.sv
      - fpga/rtl/texture/zhao_texture_mosaic.sv

  # --- raster leaves the texture island depends on --------------------------
    rules:
      # S3.4: require DSP == 0 for the CSD variant. Measured 4 today, so
      # this rule FAILS on purpose until C21 lands -- an inferred multiplier
      # is on the brief's REWRITE list.
      max_dsp: 0

  - top: zhao_raster_perspuv_svc
    sources:
      - fpga/rtl/raster/zhao_raster_perspuv_svc.sv

  - top: zhao_raster_texjoin_v2
    sources:
      - fpga/rtl/raster/zhao_raster_texjoin_v2.sv

  # zhao_field_rcp24_rom is the submodule that was forgotten from an
  # -ExtraSources line once. It is why this file exists in its present form.
    rules:
      # S3.4 FRAGROB: reject registers > 2,500, and require the payload
      # banks to infer as RAM. S3.3 budget: 900 ALM / 1,200 reg / 14-20 M10K.
      # min_m10k is deliberately NOT set yet -- the banking rework (C6-C8)
      # decides the count, and a guessed minimum would fail the very step
      # that fixes it.
      max_registers: 2500

  - top: zhao_raster_rcp24_svc
    sources:
      - fpga/rtl/field/zhao_field_rcp24_rom.sv
      - fpga/rtl/raster/zhao_raster_rcp24_svc.sv

  # --- terrain --------------------------------------------------------------
    rules:
      # S3.4: reject DSP > 4 after the 32x32 width proof. Measured 6.
      max_dsp: 4

  - top: zhao_terrain_residency
    sources:
      - fpga/rtl/terrain/zhao_terrain_residency.sv

  # TERRAIN.MIPGEN is streaming decimation with NO storage -- if a fit reports
  # RAM blocks for it, the block grew a buffer somebody did not intend.
  - top: zhao_terrain_mipgen
    sources:
      - fpga/rtl/terrain/zhao_terrain_mipgen.sv

  # The v2 residency table is 256 sets x 4 ways. Its acceptance question is the
  # same shape as the texture cache's: the tag and data arrays must infer M10K,
  # because 1,024 entries in flops is a different block wearing this one's name.
  - top: zhao_terrain_residency_v2
    sources:
      - fpga/rtl/terrain/zhao_terrain_residency_v2.sv

  # TEX.FRAGROB -- the transaction centre that replaces the TEXJOIN monolith.
  # Built beside v2 per S6.1, with v2 kept as the behavioural oracle.
  - top: zhao_texture_fragrob
    sources:
      - fpga/rtl/texture/zhao_texture_fragrob.sv
    rules:
      # S3.4 FRAGROB: "reject registers > 2,500" and "require its declared
      # payload banks to infer as RAM". S3.3 budget: 900 ALM / 1,200 reg /
      # 14-20 M10K / 0 DSP. The min_m10k is the whole point of the rewrite --
      # v2 measured 4 M10K against 7,151 registers, which is the entry table
      # in flip-flops. A pass here REQUIRES the banks to be memory.
      min_m10k: 6
      max_registers: 2500
      max_dsp: 0

