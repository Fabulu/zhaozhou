# fit_targets.yml — the explicit source closure for every per-block fit.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
# `tools/quartus/run_block_fit.ps1` builds its QSF from the SHELL project's
# source list. A block outside that cone -- every raster, texture, geometry and
# terrain leaf -- is not in it, so `-Module zhao_texture_tmu_plan` on its own
# elaborates a top that has no source file, and the row comes back:
#
#     zhao_texture_tmu_plan   failed:quartus_map   -   ALM -
#
# which in the report reads as "this block does not fit". It fits perfectly
# well; nobody told the fitter where it was. The closure lived in whoever
# happened to be typing `-ExtraSources` from memory, and a forgotten submodule
# produced the same row as a genuine failure.
#
# Ruling: Phase 0 of reports/OWNER-RULINGS-BUILDABILITY-20260902.md --
# "repair the fit apparatus: design/fit_targets.yml; explicit source closure;
# preflight top-module existence".
#
# ---------------------------------------------------------------------------
# FORMAT -- deliberately a strict subset
# ---------------------------------------------------------------------------
# Windows PowerShell 5.1 has no YAML parser, and adding a dependency to run a
# fit is worse than constraining the file. So: two-space indent, one target per
# `- top:` entry, sources as a flat `- path` list, comments with `#`. No
# anchors, no nesting beyond this, no flow sequences.
#
# Paths are repo-relative and forward-slashed. Order matters to Quartus for
# packages; list a package before what imports it.
#
# ---------------------------------------------------------------------------
# `rules:` -- THE STRUCTURAL GATE (added 2026-09-03)
# ---------------------------------------------------------------------------
# reports/islandrearchitecture5.md S3.4 sets numeric tripwires per block and
# says, in plain words:
#
#     A fit that meets Fmax while violating its memory/DSP structure is not a
#     pass.
#
# Those tripwires existed only as prose. Nothing enforced them, so a cache
# rebuild that put 9,728 bits of array into flip-flops -- 2 M10K where its own
# predecessor had 4 -- was reported as a PASS on the strength of 98.66 MHz,
# because Fmax was the only number the tooling produced. This section is that
# gap closed.
#
#   rules:
#     min_m10k: 8          require at least; the MINIMUM is the important half
#     max_registers: 2000  reject above
#     max_alms: 1500
#     max_dsp: 4
#
# A maximum catches a block that grew. A MINIMUM catches a block whose storage
# quietly stopped being storage -- the failure that looks like success.
#
# Only S3.4's explicit TRIPWIRES are encoded here. S3.3's per-component budgets
# are architecture targets ("not predicted fit results", says the brief) and are
# recorded as comments beside the rule so they are visible without failing a fit
# that is legitimately mid-recovery.

targets:

  # --- texture island -------------------------------------------------------

  # Added 2026-09-19, packet MATRES. MATERIAL.RESOLVE, the lookup that turns
  # {material_set, material_id, quality_tier} into a 32-byte MaterialRecord.
  # A STANDALONE target and deliberately NOT in the zhao_console_core closure:
  # the core does not instantiate it, because its residency directory has no
  # producer until spec/memory_rules.md 5f rules slot -> extent, and a file in
  # a source list that nothing elaborates is how a filename becomes "progress"
  # (completion_register.py's own words).
  #
  # THE QUESTION THIS FIT ANSWERS, named in advance as the fit rule requires:
  # does the record cache infer M10K or burn flops? LINES*RECW = 16 x 256 =
  # 4,096 bits, which is one M10K if Quartus infers it and ~4,100 registers if
  # it does not -- and the owner has ruled that spending M10K to save ALMs is
  # the trade to make. Nothing else here needs a fit: correctness, the D-3 tag,
  # the refusals and the handshake are all Verilator and answer in seconds.
  - top: zhao_material_resolve
    sources:
      - fpga/rtl/texture/zhao_material_resolve.sv

  - top: zhao_texture_tmu_plan
    sources:
      - fpga/rtl/texture/zhao_texture_tmu_plan.sv

  - top: zhao_texture_cache_pipe
    sources:
      - fpga/rtl/texture/zhao_texture_cache_pipe.sv
    # NO RESOURCE GATES, AND THAT IS A CORRECTION (2026-09-04).
    #
    # This target used to carry min_m10k: 8, min_memory_bits: 8192,
    # max_registers: 2000 and max_alms: 1500, attributed to the brief. Every
    # one of them belongs to a DIFFERENT BLOCK:
    #
    #   islandrearchitecture5.md 3.3 names the row "synchronous texture cache
    #   v2" -- and prefaces the whole table with "These are architecture
    #   budgets, not predicted fit results";
    #
    #   10.1 is explicit: "Replace, do not patch. Create
    #   zhao_texture_cache_v2. Keep zhao_texture_cache and
    #   zhao_texture_cache_pipe as BEHAVIORAL ORACLES."
    #
    # So cache_pipe is the oracle, not the shipping block, and 10.11's gate is
    # zhao_texture_cache_v2's -- a block that does not exist yet. min_m10k: 8
    # "failed" three times against a block that was never going to meet it, and
    # min_memory_bits: 8192 was added to interrogate that failure rather than
    # to check whether the gate belonged here at all.
    #
    # AND THE 8 WAS NEVER A BIT BUDGET. C3: "CACHE V2 STORAGE: four static data
    # banks + four static tag banks" -- four plus four is EIGHT MEMORIES. The
    # brief counts RAMs, not capacity. reports/TEXTURE-ISLAND-STORAGE-GAP.
    #
    # The fit stays: what the oracle costs is worth knowing. The gates move to
    # zhao_texture_cache_v2 when it is written.

  - top: zhao_texture_aux_pipe
    sources:
      - fpga/rtl/texture/zhao_texture_aux_div6.sv
      - fpga/rtl/texture/zhao_texture_aux_pipe.sv

  - top: zhao_texture_aux_div6
    sources:
      - fpga/rtl/texture/zhao_texture_aux_div6.sv

  # TEXTURE.TMU v2, the production sampler. Added 2026-09-04: it was NOT a fit
  # target, which is worse than it sounds -- run_block_fit's preflight THROWS on
  # an unknown module, and that throw is caught by the loop's outer try, so it
  # ends the whole queue. A run asked for nine blocks would have fitted six and
  # silently skipped fragrob and cache_pipe behind it.
  #
  # The closure is the sampler plus zhao_texture_bilerp, which it instantiates.
  - top: zhao_texture_tmu_pipe
    sources:
      - fpga/rtl/texture/zhao_texture_bilerp.sv
      - fpga/rtl/texture/zhao_texture_tmu_pipe.sv
    rules:
      # D19m, added 2026-09-04. This target had NO rules at all, and the block
      # measured 72,824 registers against 256 block-memory bits -- a 16 x 256
      # x 16 palette cache (65,536 bits) sitting in flip-flops, which as memory
      # is 7 M10K of 553. Nothing caught it because nothing was watching: a
      # gate absent is not a gate passing.
      #
      # 12,000 is chosen to FAIL TODAY ON PURPOSE, the way fragrob's gate did.
      # The block's legitimate state is the ROB, the pipeline, and the 4,608
      # bits of tag/valid that are correctly flops -- roughly 7,300. Anything
      # near 12,000 means the palette is back in registers.
      max_registers: 12000
      #
      # NOT a min_m10k rule. The fix is not "put the arrays in memory": two of
      # the three MUST stay in flops. `pal_val_r` is read on all sixteen ways in
      # one cycle as the associative half of the lookup and cleared sixteen at
      # once; a memory can do neither. Only `pal_dat_r` moves, and it moves by
      # registering the read so Quartus can absorb the flop into the M10K's
      # output register (QUARTUS_GOTCHAS 14) -- `decode16()` in that path is
      # what blocks inference today, not the array's shape.

  - top: zhao_texture_palette_res
    sources:
      - fpga/rtl/texture/zhao_texture_palette_res.sv
    rules:
      # Added 2026-09-04 with the port move. `mem_r` is 16,384 bits, so at
      # 10,240 bits per M10K it cannot be memory in fewer than 2 blocks.
      # The block's own comment claimed the array was deliberately unreset and
      # therefore inferrable; that was true of the ARRAY and false of the
      # PROCESS, and nothing was measuring the difference.
      min_m10k: 2

  - top: zhao_texture_rsp_dispatch
    sources:
      - fpga/rtl/texture/zhao_texture_rsp_dispatch.sv

  - top: zhao_texture_bilerp_lane
    sources:
      - fpga/rtl/texture/zhao_texture_bilerp_lane.sv

  - top: zhao_texture_combine
    sources:
      - fpga/rtl/texture/zhao_texture_combine.sv
    rules:
      # islandrearchitecture5.md 3.3's own line for the material combiner:
      # 650 ALM / 500 registers / 1-4 M10K / 0-2 DSP, with the 3.4 tripwire
      # "reject DSP > 2".
      #
      # The DSP rule is the interesting one. This implementation takes the
      # CONTRACT's II=1 and spends four parallel byte products; the architecture
      # instead describes two product lanes with queued continuations. If this
      # fires, that IS the evidence for moving to the two-lane scheduled form --
      # a decision made against a number rather than ahead of one.
      max_alms: 650
      max_registers: 500
      max_dsp: 2

  # MATERIAL.COMBINE.V1 -- the two-lane scheduled replacement. Same three rules
  # as the block above, UNCHANGED, because they are the architecture's (S3.3 /
  # S3.4) and the II=1 form was refuted against them (docket D19q). If this one
  # also breaches DSP, the LOGIC2 attribute is not doing what S15.5 variant A
  # says it does and that is the finding.
  # RCP24 V3 -- the exact-multiplier tile, section 10 of the V3 architecture.
  # Its own target rather than -ExtraSources, so the row is reproducible and the
  # closure is declared where the provenance guard can hash it.
  #
  # RULES ARE SET AT WHAT IS MEASURED, AND ONLY THAT. max_dsp: 3 is the measured
  # figure, not svc's 4 and not section 10.7's target of 2 -- the target was
  # MISSED and is reported as a miss rather than written into the gate as though
  # it had been met. min_memory_bits keeps the payload and scratch in RAM
  # (section 21.2); it is deliberately NOT min_m10k, because a small plane may
  # legitimately land in MLAB while a plane collapsing into fabric cannot hide
  # behind a bit count.
  #
  # max_alms / max_registers / max_m10k are ABSENT ON PURPOSE until a full fit
  # produces them. Do NOT inherit svc's max_alms: 650 / max_registers: 600:
  # svc itself already violates both at 1,041 and 1,101, so copying them down
  # would install a gate that fails on arrival and gets ignored.
  # V3's completion-bank experiment -- section 26.1's FIRST implementation task.
  # Fitted alone and deliberately not composed: 26.1 says "do not merge those
  # changes into the composition until the shared record and credit contracts
  # are fixed", so this measures the structure, not the island.
  #
  # THE RULES ARE FLOORS, NOT CEILINGS, WHICH IS UNUSUAL AND DELIBERATE. The
  # claim under test is that payload lives in MEMORY rather than in fabric, so
  # the failure to catch is a bank COLLAPSING into flip-flops -- which shows up
  # as memory bits going DOWN, not up. min_memory_bits is the nine declared
  # banks alone (3*2560 + 2560 + 2560 + 4096 + 3*896 = 19,584), so the six
  # LUTRAM queues may legitimately move without failing while a bank quietly
  # becoming registers cannot hide.
  #
  # Section 21.6 budgets 1,800 ALMs for this machinery and the map-only run
  # showed 6,532 ALUTs, so max_alms is set at the BUDGET and is expected to
  # fail. That is the point: a gate that reports a real breach is worth more
  # than one set at whatever the design happens to be.
  # V3.1 §5.7 "Local queue fit gate", which asks for this BEFORE the owner demo
  # is rebuilt: "fit one production-shaped ready queue with the actual depth,
  # width, head structure, and status outputs ... and setup/hold at the intended
  # product constraint."
  #
  # A registered wrapper, not the raw leaf, because occ_o/full_o/valid_o/
  # owned_empty_o ARE the status contract under investigation and a raw fit
  # would terminate all four at virtual pins -- corrupting exactly the paths
  # being measured. Same reasoning as the four pair wrappers.
  #
  # §5.7 states its own limit and the gate must not outgrow it: "This experiment
  # is diagnostic. It does not replace the owner-composed fit."
  - top: zhao_probe_v3rq_queue
    sources:
      - fpga/rtl/texture/zhao_texture_v3bank.sv
      - fpga/rtl/texture/zhao_texture_v3rq.sv
      - fpga/rtl/synth/zhao_probe_v3rq_queue.sv
    rules:
      min_fmax_mhz: 100    # §5.7's "intended product constraint", a stated
                           # requirement rather than a number invented here
      min_m10k: 1          # one v3bank body, 14 x 64; from the instance walk
      max_m10k: 1          # in reports/V31-M10K-ALLOCATION-RECONCILE-20260907.md
      max_dsp: 0           # a queue that infers a multiplier is a defect

  # A PROBE THAT ANSWERS "WHY DOES e_tag INFER AND e_num_u NOT?"
  #
  # Added 2026-09-09. perspuv_svc is the island's largest register consumer
  # (3,240, 4.63x its S3.3 budget line) and 85% of that is a 16-entry token
  # table. Exactly ONE of its arrays became an M10K -- e_tag, 16x14 -- while
  # e_num_u did not, despite having one write address and one read address after
  # the 2026-09-06 per-axis split. So read-address count is not the
  # discriminator, and check_ram_inference.py's async-reset signal fires on
  # e_tag too, so it cannot discriminate either.
  #
  # Five variants at ONE geometry, one factor changed at a time: width, read
  # style, and whether the array is cleared by the async reset. See the file
  # header for the pre-registered interpretation of each outcome.
  #
  # REGISTERED HERE BECAUSE AN UNTARGETED BLOCK IS AN UNMEASURABLE ONE. The
  # 44-to-99 target pass took production blocks with no target from 43 to zero;
  # a new file under fpga/rtl/ with no entry reopens that gap by one.
  #
  # min_m10k: 1 IS THE POSITIVE CONTROL, AS A RULE. Variant A reproduces the one
  # array known to infer, so at least one M10K must appear. If none does, the
  # probe does not reproduce the island's conditions and none of its other rows
  # mean anything -- which is a broken instrument, not a finding, and this rule
  # is what refuses to let it read as the latter.
  #
  # No max_m10k: how many of the five infer is the QUESTION. A ceiling here
  # would be a rule written to constrain its own experiment.
  # No min_fmax_mhz: this is a diagnostic probe and its clock means nothing.
  - top: zhao_probe_ram_infer
    sources:
      - fpga/rtl/synth/zhao_probe_ram_infer.sv
    rules:
      min_m10k: 1          # the positive control must fire; see above
      max_dsp: 0           # five register files; a multiplier here is a defect

  - top: zhao_texture_v3own
    sources:
      - fpga/rtl/texture/zhao_texture_v3bank.sv
      - fpga/rtl/texture/zhao_texture_v3rq.sv
      - fpga/rtl/texture/zhao_texture_v3own.sv
    rules:
      min_m10k: 9
      min_memory_bits: 19584
      max_dsp: 0
      max_alms: 1800

  - top: zhao_raster_rcp24_v3
    sources:
      - fpga/rtl/field/zhao_field_rcp24_rom.sv
      - fpga/rtl/raster/zhao_raster_ticketq.sv
      - fpga/rtl/raster/zhao_raster_ticketq_rh.sv
      - fpga/rtl/raster/zhao_raster_rcp24_mul.sv
      - fpga/rtl/raster/zhao_raster_rcp24_v3.sv
    rules:
      max_dsp: 3
      min_memory_bits: 1800
      # MEASURED 2026-09-06 by the full fit (digest 6553c5cef196), set at the
      # measurement with a little headroom rather than at an aspiration. svc's
      # max_alms: 650 / max_registers: 600 are deliberately NOT inherited: svc
      # itself already violates both at 1,041 and 1,101, so copying them down
      # would install a gate that fails on arrival and is then ignored.
      max_alms: 1400
      max_registers: 2100
      max_m10k: 8

  - top: zhao_texture_material_combine_v1
    sources:
      - fpga/rtl/texture/zhao_texture_material_combine_v1.sv
    rules:
      max_alms: 800        # S15.5 variant A's own bound: "<= 800 ALMs"
      max_registers: 500   # S3.3
      max_dsp: 2           # S3.4 tripwire, unchanged

  # V2 is the block the ISLAND ACTUALLY INSTANTIATES (island top line 1956,
  # `.NCTX(8)`), and until now it had no fit target of its own -- it appeared
  # only as a SOURCE inside zhao_texture_island_top and the production list, so
  # its standalone cost has never been measured. That is what blocked the
  # whole-island reconciliation the recovery handoff makes a precondition in
  # S12.4: the ledger's only combiner rows are v1 and the refuted
  # zhao_texture_combine, and using v1's 1,475 ALMs as v2's would be exactly
  # the "never compare a current file to an old measurement" error.
  #
  # Resolved closure, not guessed from the name: v2 is a LEAF -- the only
  # `zhao_` token outside its comments is its own module declaration.
  #
  # NO ALM OR REGISTER RULE, deliberately, same reasoning as GEOM.MEM.ADAPTER
  # below. Inventing a bound before the first measurement is how a manufactured
  # number becomes a redline; S12.4's own warning runs the other way too. The
  # DSP tripwire DOES carry, because S3.4 constrains the combiner ROLE and v2
  # holds that role -- and it is the tripwire zhao_texture_combine broke with 8.
  - top: zhao_texture_material_combine_v2
    sources:
      - fpga/rtl/texture/zhao_texture_material_combine_v2.sv
    rules:
      max_dsp: 2           # S3.4 tripwire; v1 measured 2, zhao_texture_combine 8

  # GEOM.MEM.ADAPTER -- two logical geometry requesters over the one permitted
  # ENGINE1 client (owner recovery brief section 12). Characterised on its own
  # because the two-bank ASSETFETCH plan rests on it, and because a block whose
  # whole job is ownership bookkeeping should be cheap: if sharing one client
  # costs more than a second guard would, that is a finding and not a detail.
  #
  # NO RULES YET, deliberately. The brief gives this block no budget, and a
  # threshold invented beside the first fit that governs it is the exact failure
  # CLAUDE.md records. Measure first, gate second.
  # GEOM.PROJECT -- and the acceptance question is a CLAIM ITS OWN HEADER MAKES.
  #
  # It has never been measured. Sixteen of the twenty-four geometry blocks have
  # no fit row at all, and this is the one DOCKET D22 names, carrying
  # UNIT_VERIFIED on simulation evidence alone.
  #
  # THE CLAIM: "THE DUPLICATION IS GONE. THIS BLOCK IS NOW A THIN SHELL." The
  # file used to hold a complete copy of `project_vertex` -- the same helpers,
  # the same 31-stage restoring recurrence, the same viewport fx_mad -- that
  # zhao_terrain_project also held, and its own header called that "A COST, NOT
  # A FEATURE". The shared core is now zhao_project_core, and this block is
  # meant to be "a ready/valid handshake, the accepted-vertex counter, and
  # nothing else".
  #
  # A fit is the only thing that can check that. The merge was verified on a
  # DIFFERENTIAL -- 12,300 vertices, three ways, zero mismatches -- which proves
  # the two compute the same values and says nothing about whether the silicon
  # is shared or duplicated.
  #
  # THE PREDICTION, WRITTEN BEFORE THE FIT AND DERIVED FROM THE STRUCTURE.
  # zhao_terrain_project instantiates exactly ONE zhao_project_core and measured
  # 6,068 ALM / 6,685 registers / 33 DSP / 23 M10K / 3,822 memory bits. This
  # block instantiates exactly one too, and adds no framing. So:
  #
  #   * DSP should be ABOUT THE SAME as terrain's, because the core owns every
  #     multiply. Much LOWER would mean terrain's 33 includes framing
  #     multiplies; much HIGHER would mean the core is not shared after all,
  #     which is the claim under test.
  #   * MEMORY SHOULD BE ZERO. Terrain's 23 M10K are its triangle framing. A
  #     shell that owns no storage cannot have any, and this is the sharpest
  #     line in the whole entry.
  #   * ALM and registers should be BELOW terrain's, since this is the same core
  #     minus the framing.
  - top: zhao_geom_project
    sources:
      - fpga/rtl/common/zhao_project_core.sv
      - fpga/rtl/geometry/zhao_geom_project.sv
    rules:
      # max_m10k: 0 WAS WRONG AND IS KEPT AS THE RECORD OF WHY. Written as
      # "ZERO, and it is the acceptance question -- the shell owns a handshake
      # and a counter; anything that infers as memory here is storage nobody
      # declared." It measured 27.
      #
      # THE ERROR WAS MINE, NOT THE DESIGN'S. I attributed
      # zhao_terrain_project's 23 M10K to "its triangle framing" and they are
      # nothing of the kind: the storage belongs to the CORE -- 3,095 bits,
      # 27 M10K, every one of them inside zhao_project_core:u_core. The shell
      # owns none, exactly as its header claims: 41 ALUTs and 32 registers,
      # 0% and 1% of the block.
      #
      # So the rule was a statement about the SHELL applied to a fit that
      # necessarily contains the CORE, and it could not have passed however
      # thin the shell became. That is the THIRD unsatisfiable rule recorded in
      # this file, after min_m10k 17's capacity argument that ignored MLAB and
      # min_memory_bits counting one of the device's two memory kinds.
      #
      # A PER-BLOCK FIT MEASURES A CLOSURE. A claim about one entity inside it
      # belongs to tools/quartus/entity_census.py, which reads the map report's
      # per-entity SELF figures, not to a rule on the fit total. Checked there,
      # the shell claim is CONFIRMED.
      #
      # What the fit total can honestly bound is the closure -- one shell plus
      # one core -- against zhao_terrain_project's row for that same core.
      max_m10k: 30
      # Terrain's 33 with headroom. A second core would roughly double it, which
      # is the failure this catches -- the header's "the duplication is gone"
      # made checkable.
      max_dsp: 40
      # Both BELOW terrain's measured 6,685 / 6,068, because this is the same
      # core without the triangle framing. Set from that measurement rather than
      # from a guess, and deliberately not tight: the question here is "one core
      # or two", not "how many ALMs exactly".
      max_registers: 7000
      max_alms: 6500
      # NO min_fmax_mhz. That rule is opt-in and this is not my block -- a clock
      # a block was never designed against is a surprise, not a gate. Its owner
      # adds it when they have a target.
      #
      # AND THE MEASURED CLOCK IS 61.09 MHz, core-to-core inside u_core with no
      # boundary to blame (tools/quartus/split_setup_paths.py). 39% short. It
      # is deliberately still not gated HERE, because zhao_project_core is
      # instantiated by the terrain projector as well: the clock is a property
      # of the SHARED core, and gating it on this block would put the alarm on
      # whichever of the two happened to be refitted first. Recorded in
      # reports/D22-GEOM-PROJECT-FIT-20260907.md instead, where it belongs --
      # one block's clock problem sitting on two lanes at once.

  - top: zhao_geom_mem_adapter
    sources:
      - fpga/rtl/memory/zhao_mem_share2.sv
      - fpga/rtl/geometry/zhao_geom_mem_adapter.sv

  - top: zhao_texture_mosaic
    sources:
      - fpga/rtl/texture/zhao_texture_mod255.sv
      - fpga/rtl/texture/zhao_texture_mosaic.sv

  # --- raster leaves the texture island depends on --------------------------
    rules:
      # S3.4: require DSP == 0 for the CSD variant.
      #
      # UPDATED 2026-09-09. This comment used to read "Measured 4 today, so
      # this rule FAILS on purpose until C21 lands". C21 LANDED, at commit
      # cce01f31 ("MOSAIC's two multipliers become CSD shift-add"), and the
      # rule now PASSES: zhao_texture_mosaic measures DSP 0 / 310 ALM / 200
      # registers on a CLEAN tree, status ok. The RTL is explicit shift-add
      # (`mul_cx` at zhao_texture_mosaic.sv:264) with an elaboration $fatal
      # proving mul_cx(1) == MOSAIC_CX.
      #
      # The stale wording mattered: a fails-on-purpose comment beside a rule
      # that now passes reads as 4 DSP still available to save. It is already
      # banked. That is the geom_skin error pointed the other way -- there a
      # disqualified configuration was read as an available lever; here a
      # cashed one was left looking uncashed. Both inflate the remaining
      # saving, which is the flattering direction.
      #
      # Only Fmax now misses the owner's 14.5 gates: 79.22 against >= 125.
      max_dsp: 0
      # THE OWNER'S NUMBERS, not mine. islandrearchitecture5.md 14.5 gates
      # MOSAIC at "<= 500 ALMs / <= 350 registers / 0 M10K / 0 DSP / II = 1 /
      # >= 125 MHz". The DSP ceiling was already here; the other two were not,
      # so the block could have doubled in area and still reported ok.
      max_alms: 500
      max_registers: 350

  - top: zhao_raster_perspuv_svc
    sources:
      - fpga/rtl/raster/zhao_raster_perspuv_svc.sv
    rules:
      # THE BRIEF'S OWN NUMBERS, islandrearchitecture5.md 8.8: "<= 900 ALMs /
      # <= 700 registers / <= 1 M10K / 6 DSP hard initial budget / II = 1
      # pair/clock / >= 125 MHz across three seeds".
      #
      # This block had NO RULES, so it reported `ok` while measuring 2,204 ALM
      # and 3,293 registers -- 145% and 370% over. A green row that cannot go
      # red is not evidence of anything, and this is the clearest example of it
      # in the file.
      max_alms: 900
      max_registers: 700
      max_m10k: 1
      max_dsp: 6

  # THE PAIRED PERSPUV CANDIDATE (roadmap packet 4 / Decrufter D5).
  #
  # One scheduler, two arithmetic lanes, one paired record. Registered so FIT
  # GATE 3 can measure it against a FRESH svc row from the same commit -- the
  # standing svc row above predates today's tree, and comparing against a stale
  # measurement is the error this file already documents twice.
  #
  # SAME RULES AS svc DELIBERATELY. The candidate exists to be smaller, so
  # inheriting the budget it is trying to beat is the honest gate; a looser one
  # would let it pass by being merely different. Note svc itself measured 2,204
  # ALM against these -- both rows are expected to violate, and the comparison
  # is between them, not against the budget.
  # THE SHARED PROJECTOR. One core instead of two.
  #
  # zhao_geom_project (6,199 ALM / 33 DSP) and zhao_terrain_project (6,068 / 33)
  # both instantiate zhao_project_core, differing only in a PAYLOAD rider width.
  # 66 of the machine's 192 DSP are the same nine mul32 call sites, twice.
  #
  # max_dsp: 33 IS THE LOAD-BEARING RULE and the whole point of the block. One
  # core is 33; if this row returns 66 the sharing did not happen and the result
  # must not be read as a saving. It is deliberately EQUAL to one core rather
  # than lower: this change removes a duplicate provider, it does not claim to
  # make projection arithmetic cheaper.
  #
  # max_alms 6,300 is one wrapper's measured 6,199 plus a small arbitration
  # allowance. The service should be THINNER than either wrapper, since it adds
  # a round-robin grant and a demux and deletes nothing else.
  #
  # No min_fmax_mhz. That rule is opt-in and the clock contract belongs to the
  # core, which carries its own stage-5b repair after measuring 61.09 MHz.
  # THE ONE FIT GATE FOR dsp.md LEVER 1 (row multiplexing), named in advance
  # per the batching law. Question it answers, exactly: "at ROWS_PER_PASS=1,
  # does DSP land at 15 (5 sites x 3) and does Fmax hold the core's post-cut
  # 73.62 MHz baseline (i.e. is the shifting hold bank genuinely off the
  # multiplier cone)?" Correctness, latency (+3), II (=3), stall semantics and
  # cfg-tear behaviour are already settled in Verilator by
  # proj_rowmux_directed + proj_service_rowmux_smoke and need no fit. Command:
  #
  #   tools/quartus/run_block_fit.ps1 -Module zhao_project_service `
  #     -Params ROWS_PER_PASS=1 -RowLabel '@ROWS_PER_PASS=1'
  #
  # The rules below stay bound to the DEFAULT (spatial, 33 DSP) row; labelled
  # rows are not rule-checked, so read the @row's numbers directly.
  - top: zhao_project_service
    sources:
      - fpga/rtl/common/zhao_project_core.sv
      - fpga/rtl/common/zhao_project_service.sv
    rules:
      max_dsp: 33
      max_alms: 6300

  # ==========================================================================
  # THE SHARED-PROJECTOR LEAF (updated 2026-09-12) -- NOT RUN
  # ==========================================================================
  # This target is retained as a diagnostic boundary: one service (one core)
  # plus the terrain arena shell behind GENERIC reference ports. The old
  # zhao_terrain_topo walker is deliberately absent; it is now only a retained
  # legacy/test source. The actual adoption-sized gate is zhao_terrain_pipe
  # immediately below.
  #
  # max_dsp 33 is the structural one-default-core ceiling. No ALM or memory rule
  # is invented before the first fit; RAM inference must be read per arena
  # replica rather than inferred from a closure-wide total that includes the
  # core's storage.
  # ==========================================================================
  # GEOMETRY'S HALF OF THE SHARED PROJECTOR (2026-09-18) -- NOT RUN
  # ==========================================================================
  # zhao_geom_proj_lane is the client-A composition zhao_proj_subsystem's header
  # has been asking for since it was written, and R3 lists as its open item:
  # "Real geometry client ... remain open". It is WIRING -- client A's result
  # port packed into zhao_geom_wcache, the {arena,index} rider as the fill
  # address -- so the question this fit answers is narrow and worth stating:
  #
  #   what does the geometry side of the shared arrangement cost, so that
  #   "one service instead of two wrappers" can be priced with its BOTH halves
  #   present rather than one?
  #
  # Correctness is already Verilator's: geom_proj_lane_directed fills every slot
  # of a small arena with a vertex distinct in every field, reads them all back,
  # and its control (fill_arena_c forced to zero) fails the first slot.
  #
  # No max_alms and no min_fmax_mhz: nothing has measured this shape before and
  # inventing a ceiling ahead of the first receipt is what the project's own
  # rule about guessed rules warns against.
  - top: zhao_geom_proj_lane
    sources:
      - fpga/rtl/geometry/zhao_vertex_arena.sv
      - fpga/rtl/geometry/zhao_geom_wcache.sv
      - fpga/rtl/geometry/zhao_geom_proj_lane.sv

  - top: zhao_proj_subsystem
    sources:
      - fpga/rtl/common/zhao_proj_subsystem.sv
      - fpga/rtl/common/zhao_project_service.sv
      - fpga/rtl/common/zhao_project_core.sv
      - fpga/rtl/terrain/zhao_terrain_wcache.sv
      - fpga/rtl/geometry/zhao_vertex_arena.sv
    rules:
      max_dsp: 33

  # ==========================================================================
  # TERRAIN PIPELINE COMPOSITION GATE (2026-09-12) -- NOT RUN
  # ==========================================================================
  # This is the subsystem boundary the adoption question now belongs to: real
  # ModeVtx/ModeRef tessellation, per-view/group/arena sequencing, one shared
  # projection service, and all three arena read replicas. Run at the legal
  # density-preserving ROWS_PER_PASS=3. ROWS_PER_PASS=1 is correctness evidence
  # only and is NOT a legal dense two-view throughput/resource headline.
  #
  # Exact future fit questions, named before any result exists:
  #   * does the hierarchy contain exactly one zhao_project_core;
  #   * do all three zhao_vertex_arena replicas infer RAM;
  #   * what are the total ALM, DSP and M10K costs;
  #   * do the arena-read and projection cones hold the 100 MHz product clock?
  # The default MATW=32 closure has a 33-DSP structural ceiling. The separately
  # accepted MATW=18/RPP=3 candidate is structurally 24 DSP for one core, not a
  # fit result and not a resource-saving claim. No ALM/M10K ceiling is guessed
  # before a clean composed fit.
  - top: zhao_terrain_pipe
    sources:
      - fpga/rtl/terrain/zhao_terrain_patch_law_pkg.sv
      - fpga/rtl/terrain/zhao_terrain_pipe.sv
      - fpga/rtl/terrain/zhao_terrain_group_seq.sv
      - fpga/rtl/terrain/zhao_terrain_tess.sv
      - fpga/rtl/common/zhao_proj_subsystem.sv
      - fpga/rtl/common/zhao_project_service.sv
      - fpga/rtl/common/zhao_project_core.sv
      - fpga/rtl/terrain/zhao_terrain_wcache.sv
      - fpga/rtl/geometry/zhao_vertex_arena.sv
    rules:
      max_dsp: 33
      min_fmax_mhz: 100

  # The terrain shell alone, so the arena-copy M10K question can be read
  # without the core in the picture. No rules: no baseline for any shape.
  - top: zhao_terrain_wcache
    sources:
      - fpga/rtl/terrain/zhao_terrain_wcache.sv
      - fpga/rtl/geometry/zhao_vertex_arena.sv

  - top: zhao_raster_perspuv_pairpipe
    sources:
      - fpga/rtl/raster/zhao_raster_perspuv_pairpipe.sv
    rules:
      max_alms: 900
      max_registers: 700
      max_m10k: 1
      max_dsp: 6

  - top: zhao_raster_texjoin_v2
    sources:
      - fpga/rtl/raster/zhao_raster_texjoin_v2.sv

  # zhao_field_rcp24_rom is the submodule that was forgotten from an
  # -ExtraSources line once. It is why this file exists in its present form.
    rules:
      # S3.4 FRAGROB: reject registers > 2,500, and require the payload
      # banks to infer as RAM. S3.3 budget: 900 ALM / 1,200 reg / 14-20 M10K.
      # min_m10k is deliberately NOT set yet -- the banking rework (C6-C8)
      # decides the count, and a guessed minimum would fail the very step
      # that fixes it.
      max_registers: 2500

  # RASTER.TILESTORE -- two 64-bit x 256 banks, the tile colour store.
  - top: zhao_raster_tilestore
    sources:
      - fpga/rtl/raster/zhao_raster_tilestore.sv
    rules:
      # Added 2026-09-04 with the port move. ram0 and ram1 are 16,384 bits
      # each; 32,768 bits cannot be memory in fewer than 4 M10K. Both banks
      # have to infer -- 2 would mean one of them did not, and a half-inferred
      # tile store is the shape that reads as a fit that nearly worked.
      min_m10k: 4

  # RASTER.FOG and GEOM.FOGFACTOR, owner ruling D-5. Both new and UNMEASURED.
  #
  # NO max_alms ON THE FIRST FIT, deliberately. This file's practice is to set a
  # gate "at the measurement with a little headroom rather than at an
  # aspiration", and a rule written after the fit it governs reports a pass. The
  # DSP rules below are different: they are laws, not guesses.
  # P0-C Stage B's FIT step: the expander priced as a leaf. The architecture is
  # explicit that this price is PROVISIONAL -- docket M4 measured one register
  # at +159 ALM standalone and +14 composed, an eleven-fold difference on
  # identical RTL. This number is for STRUCTURE (what the netlist contains) and
  # a first order of magnitude, not for the deletion ledger's arithmetic.
  #
  # NO max_alms: the block has never been fitted and the architecture's own
  # estimate is a range (200-600). A gate written from that would be an
  # aspiration, which is exactly the M7 error.
  - top: zhao_texture_frag_expand
    sources:
      - fpga/rtl/texture/zhao_texture_frag_expand.sv
    rules:
      # It holds no results, no ordering and no lifetime -- and no arithmetic
      # beyond a 2-bit counter. A DSP here would mean something is very wrong.
      max_dsp: 0

  - top: zhao_raster_fog
    sources:
      - fpga/rtl/raster/zhao_raster_fog.sv
    rules:
      # MEASURED 2026-09-08: 3 DSP, one per channel. ALM 247, 93.63 MHz.
      #
      # THE FIRST VERSION OF THIS RULE WAS max_dsp: 0 AND IT WAS WRONG. It was
      # written before any fit with the reasoning "a unit8 weighting is three
      # 8x8 products; inferring a DSP means the block is written wrong" -- and
      # that was an ASPIRATION asserted as a law. The house precedent settles
      # it: `zhao_raster_blend` performs the SAME unit8 weighting on the same
      # colour8 lanes and uses **2 DSP**. Three 8x8 products are three
      # multiplies; the fitter putting them in DSP blocks is the fitter doing
      # its job, and the device has 112.
      #
      # Set AT the measurement with no headroom, so a FOURTH multiply appearing
      # is a rule violation rather than a shrug -- that is what this gate is
      # actually good for.
      max_dsp: 3

  - top: zhao_geom_fogfactor
    sources:
      - fpga/rtl/geometry/zhao_geom_fogfactor.sv
    rules:
      # MEASURED 2026-09-08: 3 DSP, ALM 341, 68.63 MHz.
      #
      # THE FIRST VERSION SAID max_dsp: 1 AND IT WAS WRONG FOR AN INSTRUCTIVE
      # REASON. The intent was "ONE fx_mul against the per-frame k; more than one
      # means the reciprocal leaked into the per-vertex path". That intent is
      # correct and the block satisfies it -- there is exactly ONE multiply,
      # `prod_c = dist_c * 66'(cfg_k_i)` at zhao_geom_fogfactor.sv:105.
      #
      # But it is a 34x32 SIGNED multiply, and a Cyclone V DSP slice is 18x18.
      # One wide product needs several slices. **DSP COUNT IS NOT A PROXY FOR
      # MULTIPLY COUNT** -- it measures width x count, and a rule that conflates
      # them fails a correct block.
      #
      # The invariant this gate was reaching for is not expressible as a DSP
      # budget at all. If it needs enforcing, it belongs in the source (one
      # multiply site) or in an assertion, not here.
      max_dsp: 3

  - top: zhao_raster_rcp24_svc
    sources:
      - fpga/rtl/field/zhao_field_rcp24_rom.sv
      - fpga/rtl/raster/zhao_raster_rcp24_svc.sv

  # --- terrain --------------------------------------------------------------
    rules:
      # S3.4: reject DSP > 4 after the 32x32 width proof. Measured 6.
      max_dsp: 4
      # THE BRIEF'S OWN NUMBERS, islandrearchitecture5.md 7.7: "<= 650 ALMs /
      # <= 600 registers / <= 1 M10K / 3 DSP preferred, 4 DSP hard ceiling".
      # Only the DSP ceiling was gated, and the block VIOLATES it at 6.
      # Measured 1041 ALM / 1101 reg -- 60% and 84% over. These gates make the
      # report say so instead of leaving two of the three numbers unwatched.
      max_alms: 650
      max_registers: 600
      max_m10k: 1

  - top: zhao_terrain_residency
    sources:
      - fpga/rtl/terrain/zhao_terrain_residency.sv

  # TERRAIN.LOADQ's whole design decision is that 32 jobs of 243 bits live in
  # ONE M10K rather than in 7,776 flip-flops, which would blow the composed
  # island's 9,000-register redline on a FIFO alone. Nothing in simulation can
  # tell those two apart -- a Verilator run is identical either way -- so the
  # claim is UNVERIFIED until a fitter says so, and it is exactly the sort of
  # plausible argument this file exists to stop being taken on trust.
  # TERRAIN.PAGESTREAM holds THREE 64-byte staging buffers -- 1,536 bits of
  # flops, deliberately, because the alternative was 17,424 bits of buffering
  # for a plane held across two other passes. That is a claim about what the
  # fitter will do with a 512-bit register indexed by a byte lane, and a
  # 512-bit register that got turned into a memory would be worse, not better:
  # the extraction is a combinational part-select on the SAME cycle, so an
  # inferred M10K there would add a cycle to every vertex.
  # F-PAGEIO1 -- TERRAIN.PAGEIO, and the question is the SHADOW PLANE.
  #
  # `nb_o` must answer any (vi,vj) COMBINATIONALLY, because in contract form (b)
  # the page server delivers base/scar/bottom/nobake on one beat or the vertex
  # is not ready, and this block does not own that valid. A RAM cannot do that,
  # so `nbv_q` is 1,089 FLOPS plus one variable bit-select. That is the block's
  # one flop-heavy structure and this fit is what prices it. The cheaper
  # alternative is written into the module header -- a two-row register window,
  # 66 flops -- and it is only correct for a cursor that scans z-then-x, so it
  # buys area with a coupling to TERRAIN.BAKE's traversal order. Do not take it
  # on an argument; take it on this number, if this number says to.
  - top: zhao_terrain_pageio
    sources:
      - fpga/rtl/generated/zhao_abi_pkg.sv
      - fpga/rtl/common/zhao_pkg.sv
      - fpga/rtl/terrain/zhao_terrain_pageio.sv
    rules:
      # THE PAGE BUFFERS MUST BE MEMORIES, which is the opposite of
      # zhao_terrain_pagestream's rule above and for the opposite reason: those
      # are read combinationally by a byte lane on the emit cycle, these are
      # read one word per guard beat with a cycle to spare. 280 x 64 for layer
      # B's write window and 136 x 64 for layer D's shared window is 26,624
      # bits; at 10,240 bits per M10K that is 3 if the aspect cooperates and
      # more if it does not. min_m10k is the interesting half -- a fit that
      # reports ZERO has put 26,624 bits in flops, which is the failure this
      # rule exists to catch.
      min_m10k: 2
      max_m10k: 6
      # slot_scaled() is the shift-and-add copied from
      # zhao_terrain_pagestream.sv; vj*33 is one shift and one adder. There is
      # no multiply anywhere in this block and a DSP here means one appeared.
      max_dsp: 0
      # 1,089 shadow-plane flops, 11 counters at 32, two 3-bit lane latches, the
      # job record, the cursors and the bake-face holding registers. Set from
      # that arithmetic BEFORE the fit, so the number it reports is a
      # measurement and not a target.
      max_registers: 1800
      min_fmax_mhz: 100
      # NOT YET MEASURED. This row is written before the fit deliberately, so
      # that the first receipt is a measurement against a number chosen without
      # sight of it.

  - top: zhao_terrain_pagestream
    sources:
      - fpga/rtl/generated/zhao_abi_pkg.sv
      - fpga/rtl/common/zhao_pkg.sv
      - fpga/rtl/terrain/zhao_terrain_pagestream.sv
    rules:
      # THE BUFFERS MUST STAY FLOPS. max_m10k 0 is the acceptance question: the
      # three staging buffers are read combinationally by a byte lane on the
      # cycle the vertex is emitted, so a memory here would cost a cycle per
      # vertex and 1,089 per lattice.
      max_m10k: 0
      max_dsp: 0
      # 1,536 buffer bits plus three cursors, a vertex index, six counters and
      # the job record. Set from that arithmetic BEFORE the fit, so the number
      # it reports is a measurement and not a target.
      max_registers: 2400
      min_fmax_mhz: 100
      # MEASURED 2026-09-07 after the gotcha-4b repair, 2,240 s:
      #   ALM 1,629  registers 2,014  M10K 0  memory bits 0  DSP 0
      #   Fmax 97.11 MHz on `clk`
      #
      # STALE SINCE 2026-09-07 EVENING: the block gained a 16-bit
      # `j_flags_i` -> `v_flags_o` identity passthrough (T5's record flags, for
      # TERRAIN.PATCH's `dual_i`, which nothing routed). Sixteen more captured
      # bits and sixteen more output wires; the numbers above are from before
      # it and are LEFT AS THEY ARE with this note rather than quietly reused,
      # because a measurement labelled with the wrong source is worse than no
      # measurement. Refit queued.
      #
      # THE STRUCTURE HELD. Zero memory bits is the acceptance question and it
      # passed: the three 64-byte staging buffers stayed flops, which is what
      # the combinational byte-lane extraction needs -- an inferred M10K there
      # would have cost a cycle per vertex, 1,089 per lattice.
      #
      # THE ALM CEILING WAS A NEAR MISS AND IS RAISED WITH ITS REASON. 1,600 was
      # an estimate written before the fit; 1,629 is 1.8% over it, and the
      # register count came in at 2,014 against an estimate of about 1,850. That
      # is an estimate that was right, not a block that grew. 1,800 leaves the
      # gate able to catch a real regression -- a fourth buffer, a second job in
      # flight, a lattice-sized accumulator -- while not failing a block for
      # being 29 ALMs different from a guess.
      max_alms: 1800
      # AND THE CLOCK, WHICH THIS BLOCK CURRENTLY MISSES. 97.11 MHz against the
      # 100 MHz product clock. The rule did not exist when that was measured --
      # `fit_rules.ps1` gained `min_fmax_mhz` on 2026-09-07 precisely because
      # this block and zhao_terrain_cmd both came back `ok` while short. It is
      # set to the product clock rather than to what was measured, so the row
      # reads FAIL until the block meets it, which is the truth. The suspect is the sample extraction: a
      # 64-to-1 byte-lane mux over a 512-bit register, three of them, feeding
      # the emit path combinationally. Registering the extraction would cost one
      # cycle per vertex and is the obvious first move if a board fit agrees
      # with this one.

  # TERRAIN.CMD's whole storage argument is that it holds NO list: it reads the
  # patch list twice rather than buffering 256 records, so a fit that reports
  # block memory here has found a buffer somebody did not intend. The only
  # storage is one job record, one record in assembly, and six counters.
  - top: zhao_terrain_cmd
    sources:
      - fpga/rtl/generated/zhao_abi_pkg.sv
      - fpga/rtl/common/zhao_pkg.sv
      - fpga/rtl/common/zhao_crc32c_fold.sv
      - fpga/rtl/terrain/zhao_terrain_cmd.sv
    rules:
      # NO MEMORY, and that is the acceptance question. Buffering the list was
      # the alternative this block rejected at about seven M10K; if one appears,
      # the rejection did not hold.
      max_m10k: 0
      max_dsp: 0
      # Derived in the right unit this time, after max_alms 200 failed
      # TERRAIN.MIPFEED for being a register count applied to an ALM budget.
      # Registers: a ~200-bit job record, three 64-bit assembly beats, six
      # 32-bit counters, the byte and CRC cursors -- about 640. ALMs: that
      # floor plus the CRC-32C fold's combinational tree, which is 32 bits of
      # XOR reduction over 64 inputs and is the largest thing in the block.
      max_registers: 900
      max_alms: 1200
      # MEASURED 2026-09-07, 2,551 s: ALM 1,069  registers 869  M10K 0
      # memory bits 0  DSP 0  Fmax 90.87 MHz.
      #
      # THE STORAGE CLAIM HELD: zero memory bits is what "reads the list twice
      # rather than buffering 256 records" has to look like, and it does.
      # Registers came in at 869 against an estimate of about 640 -- 36% over,
      # which is the CRC fold's pipeline and the beat assembler costing more
      # than the field-by-field count suggested, and is within the ceiling.
      #
      # THE CLOCK IS 9% SHORT and this is where the block fails. The suspect is
      # the CRC-32C fold: 32 bits of XOR reduction over 64 input bits, the
      # largest combinational thing in the block, sitting directly in the beat
      # path. Folding four bytes per cycle instead of eight, or registering the
      # fold's output, are both one-cycle-per-beat trades against a block that
      # reads 512 bytes per command -- but neither is done on a per-block fit's
      # number alone, because every port here is on a virtual pin and that
      # distorts timing in ways a composed fit does not.
      min_fmax_mhz: 100

  # TERRAIN.MIPFEED is a seven-state machine with one job record and three
  # counters. If it needs memory or a DSP, something is in it that should not be.
  - top: zhao_terrain_mipfeed
    sources:
      - fpga/rtl/terrain/zhao_terrain_mipfeed.sv
    rules:
      max_m10k: 0
      max_dsp: 0
      # MEASURED 2026-09-07: ALM 343, registers 244, M10K 0, DSP 0,
      # Fmax 121.08 MHz. The structure is exactly right -- no memory, no DSP --
      # and the first version of this gate FAILED IT ANYWAY at max_alms 200.
      #
      # THE GATE WAS WRONG IN ITS UNITS, NOT ITS SPIRIT. 200 was derived by
      # counting the block's flip-flops -- a 115-bit job record, three 32-bit
      # counters, an FSM -- which came to about 217, and then applied to an ALM
      # budget. Registers and ALMs are not the same thing: an ALM holds up to
      # four registers but a per-block fit also pays for the combinational
      # select and for every port on a virtual pin. 244 registers cannot fit in
      # fewer than 61 ALMs and will not fit in anything like that few once the
      # muxing is counted.
      #
      # So the ceiling is re-derived rather than retuned to 343: registers are
      # capped at 400 (the record and counters plus headroom), and ALMs at 500,
      # which is the register floor plus a generous allowance for the FSM and
      # the selects. A block that grew a buffer or a second job in flight would
      # still trip it.
      max_registers: 400
      max_alms: 500

  - top: zhao_terrain_loadq
    sources:
      - fpga/rtl/terrain/zhao_terrain_loadq.sv
    rules:
      # THE ACCEPTANCE QUESTION, BOTH DIRECTIONS, AND IN THE RIGHT UNIT.
      #
      # min_memory_bits, not min_m10k: this file's own record says a COUNT of
      # M10K is not a sound floor, because bits can land in MLAB and a wide
      # array packs in shapes a capacity argument does not predict. That
      # mistake cost two false failures on 2026-09-04 and is not repeated here.
      # The store is 32 x 320 = 10,240 bits and the question is whether those
      # bits became memory at all.
      min_memory_bits: 10240
      max_m10k: 2
      # AND THE OTHER DIRECTION, which is the gate that actually matters: a fit
      # that inferred the memory and ALSO kept a shadow copy in registers would
      # satisfy min_memory_bits and still be the 7,776-flop disaster the design
      # exists to avoid. Genuine flops here are the 243-bit capture register,
      # the 243-bit output register (320 as declared), pointers, counters and
      # the four 32-bit counter outputs -- roughly 750. 900 leaves room for
      # retiming without leaving room for the store.
      max_registers: 900
      max_alms: 800
      max_dsp: 0
      # MEASURED 2026-09-07, Quartus 17.0.2, 5CSEBA6U23I7, 2,018 s:
      #   ALM 734  registers 692  M10K 1  memory bits 10,240  DSP 0
      #   Fmax 107.33 MHz on `clk`, against the 100 MHz product clock.
      # The store inferred as memory to the BIT -- 10,240 is one M10K exactly,
      # which is what the 40-bit x 8-word x 32-job packing was arranged for --
      # and the 692 registers are the serialiser, the pointers and the counters
      # rather than the 7,776 the flop version would have cost. The gates above
      # were set BEFORE this ran; they are left where they are, because a gate
      # retuned to the number it just measured is not a gate.

  # TERRAIN.MIPGEN is streaming decimation with NO storage -- if a fit reports
  # RAM blocks for it, the block grew a buffer somebody did not intend.
  - top: zhao_terrain_mipgen
    sources:
      - fpga/rtl/terrain/zhao_terrain_mipgen.sv

  # The v2 residency table is 256 sets x 4 ways. Its acceptance question is the
  # same shape as the texture cache's: the tag and data arrays must infer M10K,
  # because 1,024 entries in flops is a different block wearing this one's name.
  - top: zhao_terrain_residency_v2
    sources:
      - fpga/rtl/terrain/zhao_terrain_residency_v2.sv
    rules:
      # Added 2026-09-04 with the storage rework. Without a min_m10k a fit that
      # put all 167,936 bits back into flip-flops would report `ok`, which is
      # the exact false-pass this gate exists to remove -- and this block was
      # 60% of the console's whole overage.
      #
      # THE THRESHOLD IS A CAPACITY FLOOR, not an estimate. keyram and statram
      # are 167,936 bits; an M10K holds 10,240, so if they are memory at all
      # they cannot occupy fewer than 17 blocks. Width padding only ever costs
      # MORE blocks (107 and 57 bits both exceed the 40-bit maximum port
      # width), never fewer, so 17 cannot produce a false failure. A partial
      # inference -- keyram memory, statram flops -- lands around 12 and fails,
      # which is correct: half the fix is not the fix.
      # min_m10k 17 WAS WRONG AND IS KEPT AS THE RECORD OF WHY. It was derived
      # as 167,936 bits / 10,240 per M10K and asserted to be a floor that
      # "cannot produce a false failure". It produced one: the fit came back at
      # 16 and reported failed:structure on a block whose storage had inferred.
      #
      # A COUNT OF M10K IS NOT BOUNDED BELOW BY CAPACITY. Quartus has a second
      # memory primitive -- bits can land in MLAB -- and a wide array can be
      # packed in shapes a capacity argument does not predict. The floor
      # ignored that the device has more than one kind of memory.
      min_m10k: 16
      # The sound form of the same question, derived from the declared arrays:
      # keyram 107 x 256 x 4 = 109,568 and statram 57 x 256 x 4 = 58,368.
      #
      # AND IT FAILS TOO, BY THE SAME MECHANISM AS min_m10k -- read this before
      # changing anything. The recorded row says 150,528 bits and 16 M10K, and
      # 150,528 / (256 x 4) = 147 EXACTLY, against 164 bits per entry. The
      # missing 17 are the top of statram: 107 + 40 = 147, and 40 is the M10K's
      # maximum port width. So keyram's 107 bits and statram's LOW 40 landed in
      # block RAM and statram's top 17 did not -- almost certainly MLAB, at
      # 17/40 utilisation being cheaper than another M10K.
      #
      # THEY DID NOT LAND IN FLIP-FLOPS, which is the only thing this gate is
      # for: the same row reports 1,243 registers, and 17 bits x 1,024 entries
      # is 17,408. Four orders of magnitude apart. So `max_registers` below is
      # the sound test and this floor is a proxy that counts one of the device's
      # two memory kinds -- exactly the error recorded above for min_m10k, made
      # a second time in a different unit.
      #
      # REFITTED 2026-09-07, AND THE MLAB HYPOTHESIS ABOVE IS REFUTED.
      # THIS GATE STAYS EXACTLY WHERE IT IS.
      #
      # The prediction held: 150,528 bits again, bit-identical, 147 per entry.
      # But `fit.rpt` -- added to the harvest that same morning BECAUSE this
      # gate could not be judged without it -- answers the question the note
      # above guessed at:
      #
      #     [d] ALMs used for memory (up to half of total ALMs) ; 0
      #         -- Memory LABs (up to half of total LABs)       ; 0
      #
      # THE MISSING BITS ARE NOT IN MLAB. They are not in flip-flops either
      # (1,226 registers against 17,408 bits), not removed ("Registers Removed
      # During Synthesis" lists three, all `s0_ev~n`, "Lost fanout"), and not in
      # a ninth memory (the eight altsyncram rows total 150,528, matching the
      # fitter's own figure exactly).
      #
      # Every benign explanation was checked and eliminated: the fields are
      # written from `s0_crc`, which is input-derived; `s_pack` is
      # {pin,bd,f,mips,crc,seq} = 6+1+1+1+32+16 = 57 bits with no padding; and
      # all six accessors have call sites, two of them COMPARISONS
      # (`s0_crc != s_crc(s)`, `s_pin(s) != {PINW{1'b1}}`).
      #
      # Quartus inferred WIDTH_A = 40 for a 57-bit array and said nothing:
      #     Info (276029) ... "g_bank[0].statram[0][56]__2"
      #       Info (286033): Parameter WIDTH_A set to 40
      #
      # The 17 absent bits are pin(6) + bd + f + mips + crc[31:24] -- EIGHT
      # BITS OF THE PAGE CRC, on the block whose job is validating residency.
      # The split does not land on a field boundary, which is what makes it
      # look like a width truncation rather than a decision.
      #
      # SO THE GATE IS RIGHT AND THE DESIGN IS NOT. It was derived correctly
      # from the declarations and it is failing correctly. Relaxing it here
      # would have been the third instance in this file of a gate moved on a
      # diagnosis its own evidence refutes, after min_m10k 17's capacity
      # argument that ignored MLAB and max_m10k 0's scope error on
      # GEOM.PROJECT -- and the first two were caught after the fact.
      #
      # AND THE SHARPEST FACT NEEDED NO EXTRA RUN: keyram is declared 107 bits
      # wide and inferred at 107, in the SAME fit by the SAME tool. So 40 is
      # not a device or tool cap. Two arrays in one generate block, same depth:
      # one gets its full width, the other loses 17 bits.
      #
      # The experiment first proposed here -- fit a 40-bit-wide variant -- does
      # NOT discriminate, and that correction is kept rather than quietly
      # dropped: a 40-bit declaration infers a 40-bit memory under BOTH
      # hypotheses, and the competing one is already refuted by resource
      # accounting. An experiment whose outcomes are predicted to look
      # identical is not an experiment.
      #
      # What discriminates is whether the inferred width TRACKS the declared
      # one, using the runner's own override so the RTL is not edited between
      # fits:
      #     run_block_fit.ps1 -Module zhao_terrain_residency_v2       #         -TopParameters SEQW=20 -RowLabel statw61      (STATW = 61)
      # Still 40 means the width is pinned regardless of declaration; 61 or a
      # two-M10K split means the 57-bit case is a specific anomaly. The keyram
      # observation predicts the second, which makes it a test that can fail.
      #
      # The FUNCTIONAL question needs a post-fit netlist simulation, and no
      # flow for that exists in this tree -- everything simulates the RTL
      # source, where all 57 bits exist by construction. That gap is why a
      # synthesis-side defect of this shape survives every suite here.
      # reports/RESIDENCY-V2-MISSING-BITS-20260907.md.
      min_memory_bits: 167936
      # Control state only: rr_q (512), the four-way read registers (656), the
      # s0 capture and the counters. Generous, and still four ORDERS below the
      # ~168,000 that "the arrays stayed in flops" would show.
      max_registers: 3000

  # TEX.FRAGROB -- the transaction centre that replaces the TEXJOIN monolith.
  # Built beside v2 per S6.1, with v2 kept as the behavioural oracle.
  - top: zhao_texture_fragrob
    sources:
      - fpga/rtl/texture/zhao_texture_fragrob.sv
    rules:
      # S3.4 FRAGROB: "reject registers > 2,500" and "require its declared
      # payload banks to infer as RAM". S3.3 budget: 900 ALM / 1,200 reg /
      # 14-20 M10K / 0 DSP. The min_m10k is the whole point of the rewrite --
      # v2 measured 4 M10K against 7,151 registers, which is the entry table
      # in flip-flops. A pass here REQUIRES the banks to be memory.
      min_m10k: 6
      # min_m10k: 6 IS A REAL GATE, and the note that used to sit here saying
      # otherwise was wrong (corrected 2026-09-04).
      #
      # It read: "six M10K is 61,440 bits of capacity against 5,184 bits of
      # payload, so the 28x gap is a scope question, not a tripwire question."
      # That converted an M10K COUNT into a bit budget and then argued with its
      # own arithmetic. The brief counts MEMORIES:
      #
      #   6.1   "The production FRAGROB owns: sixteen fragment slots"
      #         -- so DEPTH=16 is the brief's own number, not a placeholder;
      #   3.3   14-20 M10K, against the block's payload arrays:
      #         desc_u_m/desc_v_m/desc_met_m/res_rgb_m/res_a_m each [3][16],
      #         plus ctx_m/auxrgb_m/auxa_m [16] -- FIFTEEN TO EIGHTEEN
      #         memories, which is the gate, near enough exactly;
      #   6.13  hard rejection: "any sample/context payload array IN FLOPS
      #         above the explicit control bits".
      #
      # The brief REQUIRES those arrays to be RAM and expects fifteen-odd small
      # mostly-empty M10Ks. So a low count here is evidence of the defect 6.13
      # names -- and there is a known cause: desc_u_m[3][DEPTH] is
      # MULTIDIMENSIONAL, and Quartus reports "cannot regroup multidimensional
      # array", the same blocker measured on the texture cache this session.
      #
      # AND THE GATE THAT ACTUALLY ENFORCES 6.13 IS max_registers, NOT THIS ONE.
      # A 16-deep array is shallow enough that Quartus will reasonably choose
      # MLAB over M10K, and neither recorded metric can tell MLAB from flops:
      # `ramBlocks` counts M10K, and `blockMemoryBits` is Quartus's "Total
      # block memory bits", which is also M10K. A correct implementation using
      # MLAB therefore reports 0 and 0 -- identical to the defect.
      #
      # What payload-in-flops actually shows up as is a REGISTER EXPLOSION:
      # texjoin v2 measured 4 M10K against 7,151 registers, and 7,151 is the
      # entry table in flip-flops saying so out loud. 5,184 bits of payload
      # cannot hide under a 2,500 ceiling.
      #
      # So: max_registers below is the enforcer. min_m10k stays as the BRIEF'S
      # RECORDED EXPECTATION, and a failure is read together with the register
      # count -- low M10K with low registers is MLAB and satisfies 6.13's
      # intent; low M10K with high registers is the defect. If it is the
      # defect, the fix is to give each payload array a shape Quartus can
      # infer, not to lower the number.
      #
      # min_memory_bits stays unset: bits are the wrong unit for this gate, and
      # a floor low enough to pass by construction would be theatre.
      max_registers: 2500
      max_dsp: 0

# --- production resource top (GENERATED by tools/gen_prod_top.py) ---------
# One instance of every production block, per design/prod_manifest.yml. This is
# the fit that answers reports/WeNeedSomeMeasurements.md: what does the planned
# console cost when counted ONCE? It is NOT a functional design -- blocks are
# not wired to each other -- so no timing number from it means anything.
  # ==========================================================================
  # THE COMPOSED TEXTURE ISLAND (G1-D). The number this whole gate is about.
  # ==========================================================================
  # Every island figure quoted so far is a SUM OF STANDALONE PER-BLOCK FITS,
  # and that sum is not the island's size: each standalone row carries virtual
  # pins and their registers, and nothing is shared across a block boundary.
  # The tell is already in the census -- totalled by row it comes to 342 DSP
  # against the device's 112, which cannot be true.
  #
  # This top wires the eleven approved components TO EACH OTHER. It is not
  # zhao_prod_top, which drives every block from a separate LFSR and whose own
  # header says its number has no functional meaning.
  #
  # NO RULES YET, DELIBERATELY. There has never been a composed measurement, so
  # any threshold here would be a guess dressed as a gate -- and a rule written
  # beside the first fit it governs is the exact failure CLAUDE.md records. The
  # architecture's nominal is 6,600 ALM and the redline 7,500; the sum of
  # standalone rows is 7,913. Which side the composed number lands on is the
  # question, and it gets answered before it gets gated.
  # --- the characterisation-wrapper pairs -----------------------------------
  # FOUR OF THESE HAVE EXISTED SINCE 2026-08-23 AND NONE HAD A FIT TARGET, so
  # every number they produced was ungated. `zhao_pair_tess_normals` has been
  # sitting at 31.10 MHz -- the worst recorded number in the tree, on the
  # terrain geometry path -- and nothing said a word, because saying a word
  # requires a rule and there was none. That is the same shape as the six gates
  # repaired this morning that were not reading their own fields.
  #
  # AND THE SOURCE LISTS WERE WRONG WHEN FIRST COMMITTED, in three of the four.
  # I named them from the WRAPPER'S OWN NAME instead of reading what it
  # instantiates: "TMU+CACHE" is `zhao_texture_tmu` + `zhao_texture_cache` and
  # not the `_plan`/`_pipe` blocks that sound like them; "FRAGMENT+TILESTORE"
  # is `zhao_raster_fragment`, not `zhao_texture_fragrob`; SETUP+BINNER pulls
  # in `zhao_geom_arena` and `zhao_raster_fill` besides. The tell was in the
  # numbers before it was in the source: two of these pairs report DSP blocks
  # that NEITHER of the leaves I had named contains, which cannot happen and
  # meant I had named the wrong leaves. Each list is now resolved from the
  # wrapper's actual instantiations and VERIFIED BY LINT, not guessed.
  #
  # THE RULE IS THE PRODUCT CLOCK AND NOTHING ELSE. These wrappers exist
  # precisely so that a clock number MEANS something: registered stimulus, DUT,
  # registered hash sink, no result reaching a pin. That is the one measurement
  # they are built to make, so it is the one thing gated. No resource lines --
  # inventing budgets for four blocks I have not studied would be numbers
  # chosen to pass, which is worse than no gate.
  #
  # ALL FOUR FAIL IMMEDIATELY: 31.10, 37.25, 55.52 and 88.79 MHz. I predicted
  # three and was wrong about SETUP+BINNER, which is exactly why the gate is
  # worth having -- 88.79 reads as "nearly fine" to a person skimming and is
  #11% short to a rule. That is the point: a gate that only ever passes has
  # not been shown to fire, and one that only fires where a reader already
  # expected it has not been shown to be needed.
  - top: zhao_pair_tess_normals
    sources:
      - fpga/rtl/terrain/zhao_terrain_patch_law_pkg.sv
      - fpga/rtl/synth/zhao_pair_tess_normals.sv
      - fpga/rtl/terrain/zhao_terrain_tess.sv
      - fpga/rtl/terrain/zhao_terrain_normals.sv
