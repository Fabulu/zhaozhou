  # FORGE.CLIFF IN ITS COMPOSED CONTEXT -- owner vacation directive 2026-09-23
  # section 6: "Recheck its real timing in the applicable composed context; a
  # past leaf resource saving is not a current console saving." This is that
  # recheck, and it is ONE fit answering TWO questions, both named here and in
  # the wrapper's own header before it ran.
  #
  # (a) TIMING. Does the adopted evaluator still show a HOLD violation when its
  #     vdist read master is left as the composed console leaves it -- vd_addr_o
  #     with NO LOAD and vd_data_i a constant, because CLIFF_VDIST_EN is 0? The
  #     -4.140 ns hold on `zhao_forge_cliff_ram@first-measurement` has been read
  #     as the one real cost of the R142 swap, against the golden's +0.263 ns.
  #     Three facts, all read off the committed receipts before this gate was
  #     written: NO HOLD REPORT EXISTS ON DISK for either row, so neither number
  #     has a path endpoint behind it; BOTH blocks' worst SETUP path is the same
  #     path and it ENDS ON `vd_addr_o` (-15.259 golden against -15.174
  #     candidate -- the candidate is 0.085 ns BETTER on the path they share);
  #     and the two summaries are not like for like, because 228 of the
  #     candidate's 314 reported paths touch the vdist port (72.6%) against 32
  #     of the golden's 2,000 (1.6%). A leaf fit makes every port a virtual pin
  #     with a full I/O budget, so it cannot see a port the console does not
  #     use. This wrapper removes that boundary and nothing else.
  #     WHAT WOULD FALSIFY IT: a hold violation that survives here on a path
  #     whose endpoint is an INTERNAL register. That would make the sign change
  #     real and would earn the follow-up the evaluator's header already names
  #     -- making its four bare-`assign` RAM reads explicitly synchronous.
  #
  # (b) AREA. What does the WHOLE capability cost on 5CSEBA6U23I7? The
  #     campaign's 976 ALM prices the EVALUATOR ALONE; closing FORGE.CLIFF took
  #     three more blocks whose cost is hand-counted and unfitted, on a device
  #     already at 97% of its ALM budget. Keep the five categories APART --
  #     ALUTs, registers, estimated ALMs, placed ALMs, block memory bits are
  #     five numbers and never a sum.
  #
  # Correctness, throughput, handshake behaviour and field routing are already
  # answered by Verilator (tests/forge/forge_cliff_chain.cpp) and do not need
  # Quartus, per the 2026-09-08 batching law.
  # ANSWERED 2026-09-25, sourceCommit f8d1f121, rtlCleanAtHead TRUE, digest
  # fbb87047b3bf, 745.6 s, 5CSEBA6U23I7. Both questions. The receipt is
  # blockpaths/zhao_forge_cliff_chain_fit_top.hold.summary.rpt -- the full
  # .hold.rpt is gitignored by the size rule, so it is distilled and kept.
  #
  # (a) TIMING -- THE HOLD VIOLATION IS NOT AN INTERNAL PATH. 138 violated
  #     paths, and ALL 138 LAUNCH FROM AN INPUT PIN: lat_rsp_i (55),
  #     cs_substance_i (45), serve_src_id_i (38). ZERO register-to-register.
  #     All three are internal nets in zhao_console_core -- the compose
  #     cache's registered lattice and cell-state outputs, and a telemetry
  #     tap the core drives itself. A virtual pin models almost no input
  #     delay, so data arrives too early and hold fails; driven by a real
  #     registered source with real clock-to-out, these paths do not exist.
  #
  #     SETUP MOVED THE OTHER WAY, AND MOVED A LOT: -0.534 ns / 94.93 MHz
  #     here, against -15.174 / 39.72 for the candidate leaf and -15.259 /
  #     39.59 for the golden leaf. Both leaf numbers were the vdist port's
  #     virtual pins, and that port carries nothing in the console.
  #
  #     SO THE PREMISE IS NOT SUPPORTED. The -4.140 ns hold on
  #     `zhao_forge_cliff_ram@first-measurement` was a boundary measurement
  #     of a port the console does not use, and the sign change against the
  #     golden is not a cost of the R142 swap. That makes THREE -- the
  #     inferred latch, the four RAM warnings, and now the hold slack --
  #     read as the price of the candidate and found not to be.
  #
  #     CAVEAT, and it bounds the claim: 448 virtual pins remain, and
  #     Quartus reports Critical Warning (15725), the clock fed by a virtual
  #     pin and analysed as a RIPPLE CLOCK. This is NOT a console timing
  #     number and must not be quoted as one. It is better bounded than the
  #     leaf rows and taken on the SAME footing, which is what makes it like
  #     for like -- and like for like was the whole problem with the pair it
  #     replaces.
  #
  # (b) AREA -- and a saving nobody had measured. The whole capability:
  #     1,350 ALM, 1,749 registers, 0 DSP, 8 RAM blocks, 55,428 memory bits.
  #     The five categories are kept apart and never summed.
  #
  #     AGAINST THE EVALUATOR ALONE (976 ALM / 2 DSP / 15 blocks / 120,964
  #     bits) the ALM figure is NOT a clean delta -- different boundary,
  #     different constant folding, and it is quoted as a measurement of the
  #     chain rather than as a difference. But two differences ARE exact and
  #     explicable, and both are budget relevant:
  #
  #       * 120,964 - 55,428 = 65,536 = 2048 x 32 = `prio_mem_r` EXACTLY.
  #         The priority table is pruned because vdist is off; the map's own
  #         inference table lists FOUR memories rather than five, and
  #         `prio_mem` appears ZERO times in the whole report. About 7 M10K
  #         returned.
  #       * DSP 2 -> 0: the vdist address arithmetic's two multipliers.
  #
  #     And the four `Warning (276020)` RAM pass-throughs are now THREE,
  #     because prio_mem_r was one of the four and went with it.
  #
  #     So CLIFF_VDIST_EN = 0 is not merely free: it RETURNS 2 DSP and about
  #     7 M10K on a device already at 97% of its ALM budget. Turning vdist on
  #     later buys those back, and that price is now known in advance rather
  #     than discovered by a fit after the fact.

  - top: zhao_forge_cliff_chain_fit_top
    sources:
      - fpga/rtl/generated/zhao_forge_cliff_chain_fit_top.sv
