      - fpga/rtl/texture/zhao_texture_aux_div6.sv
      - fpga/rtl/texture/zhao_texture_mod255.sv
      - fpga/rtl/field/zhao_field_rcp24_rom.sv
    rules:
      # THE BRIEF'S OWN NUMBERS, islandrearchitecture5.md line 2923:
      #   "hard resources <= 7,500 ALMs, <= 9,000 regs, <= 64 M10Ks, <= 14 DSP".
      # The HARD redline and not the 6,600 target, because the target is
      # aspirational and the redline is the thing a gate is for.
      #
      # The M10K key is max_m10k and NOT max_ram_blocks: fit_rules.ps1 matches
      # rule names against a fixed list, so an invented key is SILENTLY
      # DROPPED and the budget it was meant to enforce simply is not.
      #
      # This target carried NO rules at all until now, so the redline was
      # enforced by prose in a report and by whoever remembered to compare.
      # G1-D measured 7,720 ALMs -- 2.9% over -- and nothing failed; it was
      # caught by a human reading a table. A number that only a reader
      # enforces is not a budget.
      max_alms: 7500
      max_registers: 9000
      max_m10k: 64
      max_dsp: 14

  # P0-C STAGE C: the V3 composition, priced against the ORACLE's OWN REDLINE.
  #
  # Identical rules to `zhao_texture_island_top` deliberately. The whole point
  # of the restructure is whether replacing fragrob with v3own fits the budget
  # the island already had, and a target with softer rules would answer a
  # different question while producing a number that looks comparable.
  #
  # All three gates pass before this is worth running:
  #   1. v3own's 541-check suite on the UNMODIFIED file
  #   2. island_v3_composed_directed 119/119 (same source as the oracle's)
  #   3. island_v3_paired -- 392 retired records byte-identical, order included
  # Fitting a composition that dropped fragments would have produced resource
  # numbers describing a machine that does not do the work.
  # ---- the three new texture blocks, as LEAVES ------------------------------
  # None of these had a target of its own, so `metajoin` has NO FIT ROW AT ALL
  # while being instantiated by the island -- instantiated, uncounted AND
  # unmeasured (see reports/DSP-BUDGET-CENSUS-20260908.md).
  #
  # These also answer the Decrufter brief's own open question, §D: "The metadata
  # bank's 256 x 40 shape is compatible with one block; that still needs
  # confirmation in the actual fit." The rules below ENCODE that claim, so a row
  # that infers more memory than the geometry argument allows comes back
  # `failed:structure` and says so, rather than passing quietly.
  #
  # CORRECTION 2026-09-09, before the first row arrived: THAT IS TRUE OF A FULL
  # FIT AND NOT OF A -MapOnly RUN, and I had claimed it of both.
  #
  # `max_m10k` is checked against `ramBlocks` and `max_alms` against `alms`
  # (tools/quartus/fit_rules.ps1:65,96). A map_only row carries NEITHER -- it has
  # `blockMemoryBits`, `registers`, `dspBlocks`, `virtualPins` and, in the map
  # receipt, `estimatedAlms`/`inferredMemoryCount`. The rule engine guards every
  # comparison on `$null -ne`, so both rules SILENTLY DO NOT FIRE on a MapOnly
  # row. Verified against the six existing map_only rows in the ledger.
  #
  # So on a MapOnly row only `max_registers` and `max_dsp` can bite. The memory
  # geometry must be READ, from `inferredMemoryCount` / `inferredMemories` in
  # reports/synthesis/zhao_block_map.json -- not inferred from a clean `status`.
  #
  # A `map_only` row that says nothing about memory is exactly the shape of
  # evidence this repository keeps mistaking for a pass: the gate could not reach
  # the state, so its silence is not a verdict. Recorded here rather than
  # discovered while reading the result and calling it confirmation.
  - top: zhao_texture_metajoin
    sources:
      - fpga/rtl/texture/zhao_texture_metajoin.sv
    rules:
      # 256 x 40 = 10,240 bits = exactly one M10K, IF it infers as memory at all.
      max_m10k: 1
      max_dsp: 0
      max_alms: 200

  - top: zhao_texture_early_desc
    sources:
      - fpga/rtl/texture/zhao_texture_early_desc.sv
    rules:
      # 64 rows x 119 bits across three 40-bit-wide slices. §D again: capacity is
      # not the constraint, WIDTH is, and three is the geometric lower bound for a
      # same-width simple-dual-port realisation. A row reporting four means the
      # slicing did not survive; a row reporting one means it did something else
      # entirely and the comment in the source is wrong.
      max_m10k: 3
      max_dsp: 0
      max_alms: 300

